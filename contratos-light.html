<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Contratos · Patagónica</title>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --surf:#ffffff; --bdr:#e2e5ea; --tx:#1a1d24; --txm:#4a5063; --txd:#8890a0;
    --acc:#5b4cdb; --green:#0f9d68; --gbg:#e8f8f0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
  header{position:sticky;top:0;z-index:5;background:var(--surf);border-bottom:1px solid var(--bdr);padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  header h1{font-size:14px;margin:0 0 10px;color:var(--txd);letter-spacing:.03em;font-weight:700;text-transform:uppercase;}
  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tab{flex:1;padding:9px 8px;font-size:12.5px;font-weight:700;border-radius:9px;border:1px solid var(--bdr);background:var(--bg);color:var(--txm);cursor:pointer;}
  .tab.active{background:var(--acc);color:#fff;border-color:var(--acc);}
  select{width:100%;font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid var(--bdr);background:var(--surf);color:var(--tx);}
  main{padding:14px;max-width:640px;margin:0 auto;}
  .msg{padding:40px 16px;text-align:center;color:var(--txd);font-size:14px;}
  .card{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;margin-top:2px;}
  .card .nombre{padding:16px 18px 4px;font-size:19px;font-weight:800;}
  .card .rut{padding:0 18px 14px;color:var(--txd);font-family:'DM Mono',monospace;font-size:13px;border-bottom:1px solid var(--bdr);}
  .fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--bdr);font-size:14px;}
  .fila:last-child{border-bottom:none;}
  .fila .lbl{color:var(--txm);flex-shrink:0;}
  .fila .val{font-weight:700;text-align:right;font-family:'DM Mono',monospace;font-size:13.5px;}
  .fila .val.vacio{color:var(--txd);font-weight:400;}
  .grupo-titulo{padding:10px 18px 2px;font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;}
  .doc-row{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--bdr);font-size:13px;}
  .doc-row .fecha{color:var(--txm);font-family:'DM Mono',monospace;flex:0 0 78px;}
  .doc-row .folio{color:var(--acc);font-weight:700;font-family:'DM Mono',monospace;flex:1;}
  .doc-row .monto{font-weight:800;font-family:'DM Mono',monospace;text-align:right;}
  .doc-total{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;background:var(--gbg);font-weight:800;color:var(--green);}
  .doc-total .n{font-size:12px;}
  .doc-total .v{font-family:'DM Mono',monospace;font-size:15px;}
</style>
</head>
<body>
<header>
  <h1>Patagónica — vista móvil</h1>
  <div class="tabs">
    <button class="tab active" data-tab="contratos">📄 Contratos</button>
    <button class="tab" data-tab="fxc">💰 Facturas x Cobrar</button>
  </div>
  <select id="sel">
    <option value="">Cargando clientes…</option>
  </select>
</header>
<main id="main"><div class="msg">Cargando…</div></main>

<script>
const main=document.getElementById("main");
const sel=document.getElementById("sel");
function msg(t){main.innerHTML='<div class="msg">'+t+'</div>';}

/* ═══════════════ helpers comunes ═══════════════ */
function fmtCLP(v){return v==null||isNaN(v)?"—":"$"+Math.round(v).toLocaleString("es-CL");}
function fmtUF(v){return v==null||isNaN(v)?"—":v.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2});}
function el(tag,cls,txt){const d=document.createElement(tag);if(cls)d.className=cls;if(txt!=null)d.textContent=txt;return d;}

/* fetch con timeout — evita que una API externa lenta/caída (ej. mindicador.cl)
   deje la página colgada para siempre en "Cargando...". */
function fetchTimeout(url,opts,ms){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms||12000);
  return fetch(url,{...(opts||{}),signal:ctrl.signal}).finally(()=>clearTimeout(t));
}

const ufCache={};
async function getUFHoy(){
  const now=new Date();
  const key="hoy-"+now.toISOString().slice(0,10);
  if(ufCache[key])return ufCache[key];
  /* Se pide vía nuestro propio /api/uf (proxy server-side a mindicador.cl) en
     vez de llamar a mindicador.cl directo desde el navegador — algunas redes
     móviles/DNS bloquean ese dominio de terceros aunque el resto del sitio
     cargue bien. */
  try{
    const r=await fetchTimeout("/api/uf",null,10000);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(d.valor){ufCache[key]=d.valor;return d.valor;}
  }catch(e){console.warn("UF hoy no disponible:",e.message);}
  return null;
}

/* ═══════════════════════════════════════════════════════════
   TAB 1: CONTRATOS  (misma lógica que parsePlanillaParaDashboard()
   en index.html — hoja "Flujo", filas desde la 5, columnas F→BJ)
═══════════════════════════════════════════════════════════ */
function serialToDate(v){
  if(!v||typeof v!=="number")return"";
  try{
    const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);
    return`${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}/${d.getUTCFullYear()}`;
  }catch(e){return"";}
}
function parseDateSlash(v){
  if(!v||v==="—"||v==="-"||v==="")return null;
  if(typeof v==="string"&&v.includes("/")){
    const[d,mm,y]=v.split("/").map(Number);
    if(!d||!mm||!y)return null;
    return new Date(y,mm-1,d);
  }
  return null;
}
function renovacionTexto(termTermino){
  const d=parseDateSlash(termTermino);
  if(!d)return"—";
  const d2=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  return`${String(d2.getDate()).padStart(2,"0")}/${String(d2.getMonth()+1).padStart(2,"0")}/${d2.getFullYear()}`;
}
async function parsePlanilla(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla");
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  const SKIP=/^(Total|Area|Arrendado|En negociación|Para confirmar|#|\d+$)/;
  const clients=[];
  for(let ri=4;ri<raw.length;ri++){
    const row=raw[ri];
    if(!row)continue;
    const rut=row[9];
    const nombre=row[11]||row[10];
    if(!nombre)continue;
    const name=String(nombre).trim();
    if(/^(VACANTE|Vacante)/.test(name))continue;
    if(!rut||typeof rut!=="string")continue;
    if(!rut.match(/\d+\.\d+/))continue;
    if(SKIP.test(name)||name.includes("Total")||name.startsWith("#")||name==="")continue;
    const ufArr=typeof row[47]==="number"?row[47]:0;
    const pctAdm=row[51];
    let ufSrv=0;
    if(typeof pctAdm==="number"&&pctAdm>0&&pctAdm<1)ufSrv=ufArr*pctAdm;
    else if(typeof pctAdm==="number"&&pctAdm>=1&&pctAdm<=10)ufSrv=pctAdm;
    clients.push({
      nombre:name,rut:String(rut).trim(),
      sitio:String(row[7]||"").replace(/\s+/g," ").trim(),
      edificio:String(row[8]||"").trim(),
      dir:String(row[10]||"").trim(),
      termContrato:serialToDate(row[14]),
      termTermino:serialToDate(row[15]),
      renovacion:row[16]!=null?String(row[16]).trim():"",
      aviso:row[17]!=null?String(row[17]).trim():"",
      pctReaj:row[53]!=null?String(row[53]):"",
      m2:row[42]!=null&&row[42]!==""?Number(row[42]):null,
      ufInicio:typeof row[61]==="number"?Math.round(row[61]*100)/100:0,
      ufArr:Math.round(ufArr*100)/100,
      ufSrv:Math.round(ufSrv*100)/100,
    });
  }
  return clients;
}
function fila(lbl,val,vacio){
  const d=el("div","fila");
  d.append(el("span","lbl",lbl),el("span","val"+(vacio?" vacio":""),val));
  return d;
}
function grupoTitulo(txt){return el("div","grupo-titulo",txt);}
function renderContrato(c,ufHoy){
  main.innerHTML="";
  const card=el("div","card");
  card.append(el("div","nombre",c.nombre));
  card.append(el("div","rut","RUT: "+(c.rut||"—")));

  card.append(grupoTitulo("Ubicación"));
  card.append(fila("Sitio",c.sitio||"—",!c.sitio));
  card.append(fila("Edificio",c.edificio||"—",!c.edificio));
  card.append(fila("Dirección",c.dir||"—",!c.dir));

  const arriendoCLP=ufHoy&&c.ufArr>0?c.ufArr*ufHoy:null;
  const servAdmCLP=ufHoy&&c.ufSrv>0?c.ufSrv*ufHoy:null;
  const tieneSA=c.ufSrv>0;
  const inicioSA=(cache.ajustes[ajusteKey(c.rut,c.sitio)]||{}).inicioSA||"";
  card.append(grupoTitulo("Arriendo"));
  card.append(fila("Arriendo actual UF",c.ufArr>0?fmtUF(c.ufArr):"—",!(c.ufArr>0)));
  card.append(fila("Arriendo actual",fmtCLP(arriendoCLP),arriendoCLP==null));
  card.append(fila("Serv.Adm. UF",c.ufSrv>0?fmtUF(c.ufSrv):"—",!(c.ufSrv>0)));
  card.append(fila("Serv.Adm.",fmtCLP(servAdmCLP),servAdmCLP==null));
  card.append(fila("Inicio Serv.Adm.",tieneSA?(inicioSA||"—"):"NO",!tieneSA||!inicioSA));

  card.append(grupoTitulo("Contrato"));
  card.append(fila("Inicio",c.termContrato||"—",!c.termContrato));
  card.append(fila("UF Inicio",c.ufInicio>0?fmtUF(c.ufInicio):"—",!(c.ufInicio>0)));
  card.append(fila("Periodo",c.renovacion||"—",!c.renovacion));
  card.append(fila("% Reaj.",c.pctReaj&&c.pctReaj!=="-"?c.pctReaj+"%":"—",!(c.pctReaj&&c.pctReaj!=="-")));
  card.append(fila("Aviso",c.aviso||"—",!c.aviso));
  card.append(fila("Renovación",renovacionTexto(c.termTermino),renovacionTexto(c.termTermino)==="—"));

  card.append(grupoTitulo("Superficie"));
  card.append(fila("m2",c.m2!=null?c.m2:"—",c.m2==null));
  card.append(fila("UF x m2",(c.ufArr>0&&c.m2>0)?fmtUF(c.ufArr/c.m2):"—",!(c.ufArr>0&&c.m2>0)));

  main.append(card);
}

/* ═══════════════════════════════════════════════════════════
   TAB 2: FACTURAS X COBRAR  (misma fuente que FactxCobrarView en
   index.html — carpeta "Facturas x Cobrar PISA" en Drive, hoja "Base")
═══════════════════════════════════════════════════════════ */
const DRIVE_FACTURACION_FOLDER_ID="1O1nBsti_reAKnAXXKdL2opNWz1ocZu8u";

function parseFxCSheetValues(values){
  if(!values||values.length<2)throw new Error("Sin datos");
  const hdr=values[0].map(h=>String(h||"").toLowerCase().replace(/[\r\n\s_]/g,""));
  function fi(tests){for(let i=0;i<hdr.length;i++)for(const t of tests)if(hdr[i].includes(t))return i;return -1;}
  let iFecha=fi(["fecha"]); if(iFecha<0)iFecha=1;
  let iCod=fi(["cod"]); if(iCod<0)iCod=3;
  let iCliente=fi(["cliente"]); if(iCliente<0)iCliente=4;
  let iFolio=fi(["folio"]); if(iFolio<0)iFolio=8;
  let iDiasDoc=fi(["diasdoc","ddoc","diaspag"]); if(iDiasDoc<0)iDiasDoc=11;
  let iMonto=fi(["monto","c/d(ml)","c/d(m"]); if(iMonto<0)iMonto=13;
  let iSdo=fi(["sdo","vencido"]); if(iSdo<0)iSdo=14;
  function n(v){return parseFloat(String(v||"0").replace(/[^0-9.\-]/g,""))||0;}
  function fmtFecha(v){
    const s=String(v||"").trim();
    const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m)return m[3]+"-"+m[2]+"-"+m[1];
    return s.replace(/\//g,"-");
  }
  return values.slice(1).filter(r=>r.length>4&&String(r[iCliente]||"").trim()!==""&&String(r[iCliente]||"").trim()!=="Cliente")
    .map(r=>({fecha:fmtFecha(r[iFecha]),rut:String(r[iCod]||"").trim(),cliente:String(r[iCliente]||"").trim(),
      folio:String(r[iFolio]||"").trim(),diasDoc:n(r[iDiasDoc]),monto:n(r[iMonto]),sdoVencido:n(r[iSdo])}))
    .filter(r=>r.monto>0||r.sdoVencido>0);
}
function xlsxFromBuf(buf){
  const wb=XLSX.read(new Uint8Array(buf),{type:"array",cellDates:true});
  const ws=wb.Sheets["Base"]||wb.Sheets["base"]||wb.Sheets["BASE"]||wb.Sheets[wb.SheetNames[0]];
  if(!ws)throw new Error("No se encontró hoja de datos");
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  return parseFxCSheetValues(raw);
}
async function cargarFacturasXCobrar(){
  const ls=await fetchTimeout("/api/historial?ls="+DRIVE_FACTURACION_FOLDER_ID,null,20000).then(r=>r.json());
  const sub=(ls.files||[]).find(f=>f.name.toLowerCase().includes("cobrar")&&(f.mimeType||"").includes("folder"));
  if(!sub)throw new Error('No se encontró la carpeta "Facturas x Cobrar PISA" en Drive');
  const ls2=await fetchTimeout("/api/historial?ls="+sub.id,null,20000).then(r=>r.json());
  function dateKey(name){const m=name.match(/(\d{2})-(\d{2})-(\d{4})/);return m?m[3]+m[2]+m[1]:name;}
  const xl=(ls2.files||[]).filter(f=>f.name.toLowerCase().endsWith(".xlsx")).sort((a,b)=>dateKey(a.name).localeCompare(dateKey(b.name)));
  if(!xl.length)throw new Error("No hay archivos de Facturas x Cobrar en Drive");
  const last=xl[xl.length-1];
  const buf=await fetchTimeout("/api/historial?fileId="+last.id,null,20000).then(r=>{if(!r.ok)throw new Error("Drive "+r.status);return r.arrayBuffer();});
  const rows=xlsxFromBuf(buf);
  const clientMap={};
  rows.forEach(r=>{
    const k=r.rut||r.cliente;
    if(!clientMap[k])clientMap[k]={rut:r.rut,nombre:r.cliente,docs:[],total:0};
    clientMap[k].docs.push(r);
    clientMap[k].total+=r.monto;
  });
  return Object.values(clientMap);
}
function renderFxCCliente(cli){
  main.innerHTML="";
  const card=el("div","card");
  card.append(el("div","nombre",cli.nombre));
  card.append(el("div","rut","RUT: "+(cli.rut||"—")));
  const docsSorted=cli.docs.slice().sort((a,b)=>b.diasDoc-a.diasDoc);
  docsSorted.forEach(r=>{
    const row=el("div","doc-row");
    row.append(el("span","fecha",r.fecha||"—"));
    row.append(el("span","folio",r.folio&&r.folio!=="0"?r.folio:"—"));
    row.append(el("span","monto",fmtCLP(r.monto)));
    card.append(row);
  });
  const tot=el("div","doc-total");
  tot.append(el("span","n","Total — "+cli.docs.length+" documento"+(cli.docs.length!==1?"s":"")));
  tot.append(el("span","v",fmtCLP(cli.total)));
  card.append(tot);
  main.append(card);
}

/* ═══════════════════════════════════════════════════════════
   Estado / navegación entre pestañas
═══════════════════════════════════════════════════════════ */
let ufHoy=null;
const cache={contratos:null,fxc:null,ajustes:{}};
function ajusteKey(rut,sitio){return `${String(rut||"").trim()}|${String(sitio||"").trim()}`;}

function poblarSelect(items,placeholder){
  sel.innerHTML="";
  const opt0=el("option",null,placeholder);
  opt0.value="";
  sel.append(opt0);
  items.forEach((it,i)=>{
    const o=el("option",null,it.nombre+(it.sitio?" ("+it.sitio+")":""));
    o.value=i;
    sel.append(o);
  });
}

let currentTab="contratos";
let currentClientIdx=null;

async function activarTab(tab){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  sel.onchange=null;
  if(tab==="contratos"){
    if(!cache.contratos){
      sel.innerHTML='<option value="">Cargando clientes…</option>';
      msg("Cargando planilla…");
      /* La UF del día (mindicador.cl) no debe frenar la carga de clientes —
         si esa API externa está lenta o caída, igual queremos mostrar la
         lista; los montos en CLP simplemente muestran "—" hasta que llegue,
         y en cuanto la UF llegue se vuelve a pintar la ficha abierta. */
      if(ufHoy==null)getUFHoy().then(uf=>{
        ufHoy=uf;
        if(ufHoy!=null&&currentTab==="contratos"&&currentClientIdx!=null)
          renderContrato(cache.contratos[currentClientIdx],ufHoy);
      });
      /* ajustes-contratos.json (Inicio Serv.Adm., pasos de renta pactados) es
         complementario — si falla o tarda, igual mostramos Contratos con lo
         que sí viene de la planilla. */
      fetchTimeout("/ajustes-contratos.json",null,10000).then(r=>r.ok?r.json():null).then(d=>{
        if(d&&d.items){
          cache.ajustes=d.items;
          if(currentTab==="contratos"&&currentClientIdx!=null)
            renderContrato(cache.contratos[currentClientIdx],ufHoy);
        }
      }).catch(()=>{});
      try{
        const buf=await fetchTimeout("/api/planilla",null,20000).then(r=>{if(!r.ok)throw new Error("No se pudo cargar la planilla (HTTP "+r.status+")");return r.arrayBuffer();});
        const clients=await parsePlanilla(buf);
        /* Dedupe por rut+sitio, no solo por rut — un mismo cliente puede tener
           más de un sitio arrendado (ej. 2R Spa: bodega 5-A y local A-2), cada
           uno con su propio contrato/UF/Serv.Adm. */
        cache.contratos=[...new Map(clients.map(c=>[c.rut+"|"+c.sitio,c])).values()].sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")||a.sitio.localeCompare(b.sitio,"es"));
      }catch(e){
        console.error(e);
        sel.innerHTML='<option value="">Error al cargar</option>';
        msg(e.message||"Error al cargar la planilla");
        return;
      }
    }
    poblarSelect(cache.contratos,"— Seleccionar cliente —");
    msg("Selecciona un cliente arriba para ver su ficha.");
    sel.onchange=()=>{
      if(sel.value===""){currentClientIdx=null;msg("Selecciona un cliente arriba para ver su ficha.");}
      else{currentClientIdx=Number(sel.value);renderContrato(cache.contratos[currentClientIdx],ufHoy);}
    };
  }else{
    if(!cache.fxc){
      sel.innerHTML='<option value="">Cargando clientes…</option>';
      msg("Cargando Facturas x Cobrar…");
      try{
        const clients=await cargarFacturasXCobrar();
        cache.fxc=clients.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
      }catch(e){
        console.error(e);
        sel.innerHTML='<option value="">Error al cargar</option>';
        msg(e.message||"Error al cargar Facturas x Cobrar");
        return;
      }
    }
    poblarSelect(cache.fxc,"— Seleccionar cliente —");
    msg("Selecciona un cliente arriba para ver sus documentos.");
    sel.onchange=()=>{
      if(sel.value==="")msg("Selecciona un cliente arriba para ver sus documentos.");
      else renderFxCCliente(cache.fxc[Number(sel.value)]);
    };
  }
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>activarTab(btn.dataset.tab));
});
activarTab("contratos");
</script>
</body>
</html>
