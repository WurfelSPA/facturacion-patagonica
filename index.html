function formatRUT(rut){
  if(!rut)return"";
  const clean=rut.replace(/\./g,"").toUpperCase();
  const dash=clean.indexOf("-");
  if(dash<0)return rut;
  const cuerpo=clean.slice(0,dash),dv=clean.slice(dash);
  let result="";
  for(let i=0;i<cuerpo.length;i++){if(i>0&&(cuerpo.length-i)%3===0)result+=".";result+=cuerpo[i];}
  return result+dv;
}
function getEstado(r){
  if(r.sitio==="B"&&r.concepto==="Arriendo")return"sanchez";
  if(!r.factura)return"missing";
  // Facturas grandes (>500 UF): solo verificar que tengan PDF asignado
  if(r.ufPlan>5000)return r.factura?"ok":"missing";
  // Facturas CLP fijo (ufPdf===null): si hay factura asignada es ok
  if(r.ufPdf===null||r.ufPdf===undefined)return r.factura?"ok":"missing";
  // Match por fallback de único candidato — marcar como "diff" para revisión
  if(r.matchScore===1)return"diff";
  // Comparar UF: PDF vs Planilla, y Planilla vs SII
  const diffPdf=Math.abs(r.ufPdf-r.ufPlan)>0.5;
  const diffSII=r.ufSII!=null&&Math.abs(r.ufPlan-r.ufSII)>0.5;
  if(diffPdf||diffSII)return"diff";
  return"ok";

    wp("SEGUNDO: ARRENDAMIENTO.",{bold:true,sb:120,sa:80}),

async function generarAnexo(c, promptUsuario){
  function xe(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function pd(v){if(!v||v==="—"||v==="-"||v==="")return null;if(typeof v==="string"&&v.includes("/")){const[d,mm,y]=v.split("/").map(Number);if(!d||!mm||!y)return null;return new Date(y,mm-1,d);}return null;}
  const MES_ES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  function fmtL(d){return`${String(d.getDate()).padStart(2,"0")} de ${MES_ES[d.getMonth()]} de ${d.getFullYear()}`;}
  function fmtC(d){return`${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;}
  const hoy=new Date();
  const termInicio=pd(c.termContrato);
  const termFin=pd(c.termTermino);

  const contexto=[
    `Arrendataria: ${c.nombre||"[NOMBRE]"}`,
    `RUT Arrendataria: ${c.rut||"[RUT]"}`,
    `Local/Sitio: ${c.sitio||"[LOCAL]"}`,
    `Edificio/Ubicación: ${c.edificio||"[EDIFICIO]"}`,
    `Superficie: ${c.m2?c.m2+" m2":"[SUPERFICIE]"}`,
    `Renta de arrendamiento actual: ${c.ufArr>0?c.ufArr.toFixed(2)+" UF":"[RENTA]"}`,
    `Servicios de administración actuales: ${c.ufSrv>0?c.ufSrv.toFixed(2)+" UF":"[SERV. ADMIN]"}`,
    `Inicio del contrato original: ${termInicio?fmtL(termInicio):"[FECHA INICIO]"}`,
    `Término del contrato original: ${termFin?fmtL(termFin):"[FECHA TÉRMINO]"}`,
    `Reajuste pactado: ${c.pctReaj&&c.pctReaj!=="-"?c.pctReaj+"% cada "+(c.cadaAnios||1)+" año(s)":"[REAJUSTE]"}`,
    `Arrendadora: PATAGONICA INMOBILIARIA SpA, RUT 96.673.250-4`,
  ].join("\n");

  const prompt=`Eres un abogado chileno redactando un ANEXO a un contrato de arrendamiento comercial vigente, para uso interno (borrador a revisar antes de enviar al cliente).

DATOS DEL CONTRATO ORIGINAL VIGENTE:
${contexto}

INSTRUCCIÓN DEL USUARIO SOBRE LO QUE DEBE CONTENER ESTE ANEXO:
"""
${promptUsuario}
"""

Redacta el texto completo del Anexo en español, con lenguaje legal chileno formal, en Santiago de Chile a la fecha de hoy (${fmtL(hoy)}). El anexo debe:
- Identificar a las partes (Arrendadora y Arrendataria) y referenciar que modifica/complementa el contrato de arrendamiento original vigente entre ellas.
- Desarrollar en cláusulas numeradas (PRIMERO, SEGUNDO, etc.) los cambios/adiciones solicitados por el usuario, usando los datos del contrato original como base cuando corresponda.
- Dejar constancia de que, en todo lo no modificado por este anexo, el contrato original mantiene su plena vigencia.
- Terminar con un párrafo de cierre y líneas para firma de ambas partes.
- Usar cifras en UF cuando corresponda a montos, dejando placeholders entre corchetes [ASI] solo si un dato específico no fue proporcionado ni se puede inferir.

FORMATO DE SALIDA (obligatorio, no agregues explicaciones fuera de este formato):
- Devuelve solo el texto del anexo, sin comentarios ni markdown de bloques de código.
- La primera línea debe iniciar con "# " seguido del título del anexo en mayúsculas (ej: "# ANEXO N.1 AL CONTRATO DE ARRENDAMIENTO").
- Cada encabezado de cláusula debe ir en su propia línea iniciando con "## " (ej: "## PRIMERO: ANTECEDENTES").
- El resto de los párrafos van como líneas de texto normal, sin ningún prefijo.
- Separa cada línea/párrafo con un salto de línea simple.`;

  const textoIA=await callClaude(prompt);

  function wp(text,opts){
    opts=opts||{};
    const sz=opts.sz||22;const bold=opts.bold||false;const center=opts.center||false;
    const sb=opts.sb||0;const sa=opts.sa!==undefined?opts.sa:120;
    const jc=center?'<w:jc w:val="center"/>':"";
    const b=bold?"<w:b/>":"";
    return`<w:p><w:pPr>${jc}<w:spacing w:before="${sb}" w:after="${sa}"/><w:rPr>${b}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr></w:pPr><w:r><w:rPr>${b}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${xe(text)}</w:t></w:r></w:p>`;
  }

  const lineas=textoIA.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  const cuerpo=lineas.map(linea=>{
    if(linea.startsWith("# "))return wp(linea.slice(2).trim(),{bold:true,center:true,sz:26,sb:0,sa:160});
    if(linea.startsWith("## "))return wp(linea.slice(3).trim(),{bold:true,sb:160,sa:80});
    return wp(linea,{sa:120});
  }).join("");

  const body=[
    wp("BORRADOR — ANEXO DE CONTRATO — DOCUMENTO DE USO INTERNO",{center:true,sz:18,sa:200}),
    cuerpo,
  ].join("");
  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`;

  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const drels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/></Relationships>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>`;
  const sets=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="708"/></w:settings>`;
  const zip=new JSZip();
  zip.file("[Content_Types].xml",ct);zip.file("_rels/.rels",rels);

/* ═══════════════════════════════════
   ESTADO DE PAGOS — dashboard mensual (solo PISA)
   Cruza la Planilla (pagado/no pagado por período) con la mora en vivo
   de "Facturas x Cobrar PISA" (días de atraso por cliente).
═══════════════════════════════════ */
function BarraEstado({segments,fmt}){
  const total=segments.reduce((s,x)=>s+x.count,0)||1;
  const sig=segments.map(s=>s.count).join(",");
  const [grown,setGrown]=useState(false);
  useEffect(()=>{
    setGrown(false);
    const r1=requestAnimationFrame(()=>{const r2=requestAnimationFrame(()=>setGrown(true));return()=>cancelAnimationFrame(r2);});
    return()=>cancelAnimationFrame(r1);
  },[sig]);
  return h("div",{className:"epv2-bar-track",style:{height:22}},
    segments.map((s,i)=>s.count>0&&h("div",{key:s.label,className:"epv2-bar-fill",title:`${s.label}: ${fmt?fmt(s.count):s.count} (${Math.round(s.count/total*100)}%)`,
      style:{width:grown?(s.count/total*100)+"%":"0%","--glow":s.color,background:s.color,display:"flex",alignItems:"center",justifyContent:"center",
        borderRight:i<segments.length-1?"2px solid var(--surf)":"none",minWidth:grown&&s.count>0?22:0}},
      grown&&(s.count/total)>0.16&&h("span",{style:{fontSize:10,fontWeight:700,color:"#fff",whiteSpace:"nowrap",overflow:"hidden"}},fmt?fmt(s.count):s.count)
    ))
  );
}
function LeyendaEstado(){
  return h("div",{style:{display:"flex",gap:14,alignItems:"center",fontSize:10,color:"var(--txm)"}},
    h("span",{style:{display:"flex",alignItems:"center",gap:5}},h("span",{style:{width:9,height:9,borderRadius:"50%",background:"var(--green)",display:"inline-block"}}),"Pagado"),
    h("span",{style:{display:"flex",alignItems:"center",gap:5}},h("span",{style:{width:9,height:9,borderRadius:"50%",background:"var(--red)",display:"inline-block"}}),"Pendiente")
  );
}
function BarraAntiguedad({buckets}){
  const labels={"<=30":"Al día (≤30)","31-60":"31-60 días","61-90":"61-90 días","91-365":"91-365 días","+365":"+365 días"};
  const colors={"<=30":"#34D399","31-60":"#FBBF24","61-90":"#f97316","91-365":"#FB7185","+365":"#8B5CF6"};
  const max=Math.max(1,...buckets.map(b=>b.count));
  const sig=buckets.map(b=>b.count).join(",");
  const [grown,setGrown]=useState(false);
  useEffect(()=>{
    setGrown(false);
    const r1=requestAnimationFrame(()=>{const r2=requestAnimationFrame(()=>setGrown(true));return()=>cancelAnimationFrame(r2);});
    return()=>cancelAnimationFrame(r1);
  },[sig]);
  return h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
    buckets.map(b=>h("div",{key:b.key,style:{display:"flex",alignItems:"center",gap:8}},
      h("div",{style:{width:104,fontSize:10,color:"var(--txm)",fontWeight:600,flexShrink:0}},labels[b.key]),
      h("div",{className:"epv2-bar-track",style:{flex:1,height:14}},
        h("div",{className:"epv2-bar-fill",title:`${labels[b.key]}: ${b.count} clientes`,
          style:{height:"100%",width:grown?(b.count/max*100)+"%":"0%","--glow":colors[b.key],background:colors[b.key],minWidth:grown&&b.count>0?6:0}})
      ),
      h("div",{style:{width:26,textAlign:"right",fontSize:11,fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}},b.count)
    ))
  );
}
/* KPIs que alternan solos cada 3s dentro de un mismo cuadro, tipo ticker bursátil.
   Se pausa mientras el mouse está encima para no molestar al leer. */
function RotatingKpi({items}){
  const [i,setI]=useState(0);
  const [paused,setPaused]=useState(false);
  useEffect(()=>{
    if(paused||items.length<2)return;
    const id=setInterval(()=>setI(v=>(v+1)%items.length),3000);
    return()=>clearInterval(id);
  },[paused,items.length]);
  const cur=items[Math.min(i,items.length-1)];
  return h("div",{className:"dash-card epv2-ticker",
      style:{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",padding:"20px 20px 18px",...(cur.accent?{borderLeft:"3px solid "+cur.accent}:null)},
      onMouseEnter:()=>setPaused(true),onMouseLeave:()=>setPaused(false)},
    h("div",{className:"dash-card-lbl",style:{fontSize:11}},cur.lbl),
    h("div",{key:i,className:"dash-card-val epv2-ticker-val",style:{color:cur.color,fontSize:26,marginTop:4}},cur.val),
    h("div",{className:"dash-card-sub",style:{fontSize:12,marginTop:6}},cur.sub),
    h("div",{style:{display:"flex",gap:5,marginTop:10,justifyContent:"center"}},
      items.map((_,idx)=>h("span",{key:idx,className:"epv2-ticker-dot"+(idx===i?" active":""),onClick:()=>setI(idx)}))
    )
  );
}
function EstadoPagosView({notify}){

    const list=i>=0?PERIODOS.slice(i):PERIODOS;

  const [error,setError]=useState(null);

      /* Igual criterio que en Facturación: valores >500 ya están en CLP fijo (no UF) — no multiplicar por UF del día.
         Clientes Exentos no llevan el 19% de IVA. */
      const iva=r.afecto==="Exento"?1:1.19;
      const montoClp=r.uf>500?Math.round(r.uf*iva):(ufDia5?Math.round(r.uf*ufDia5*iva):null);
      return{...r,dias,moroso:dias>30,montoClp};

    return Object.values(map);

  const stats=React.useMemo(()=>{
    const pagados=enriched.filter(r=>r.yaPagado);

    const bucketOf=d=>d<=30?"<=30":d<=60?"31-60":d<=90?"61-90":d<=365?"91-365":"+365";
    const buckets=["<=30","31-60","61-90","91-365","+365"].map(k=>({key:k,count:clientesUnicos.filter(c=>bucketOf(c.dias)===k).length}));
    return{
      totalFacturado,pct,nPagados:pagados.length,nPend:enriched.length-pagados.length,
      nAlDia:clientesUnicos.filter(c=>!c.moroso).length,
      nMoroso:clientesUnicos.filter(c=>c.moroso).length,
      nMoroso90:clientesUnicos.filter(c=>c.dias>90).length,
      arriendo:porConcepto("arriendo"),servAdm:porConcepto("serv_adm"),buckets
    };
  },[enriched,clientesUnicos]);

  const normQ=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

      !mora&&!loading&&h("span",{style:{fontSize:10,color:"var(--amber)"}},"⚠ No se pudo leer Facturas x Cobrar — mostrando solo pagado/pendiente"),
      loading&&h("span",{className:"fv2-loader",style:{width:14,height:14,fontSize:14,marginLeft:2}})
    ),

  function toggleSort(col){if(sortCol===col)setSortDir(d=>d==="asc"?"desc":"asc");else{setSortCol(col);setSortDir("asc");}}
  function sortArrow(col){if(sortCol!==col)return" ↕";return sortDir==="asc"?" ↑":" ↓";}
  useEffect(()=>{

    fetch("/ajustes-contratos.json").then(r=>r.ok?r.json():null).then(d=>{if(d&&d.items)setAjustes(d.items);}).catch(()=>{});
  },[]);
  function fmtCLP(v){return v==null||isNaN(v)?"—":"$"+Math.round(v).toLocaleString("es-CL");}
  function ajusteKey(rut,sitio){return `${String(rut||"").trim()}|${String(sitio||"").trim()}`;}
  function pasosOrdenadosDe(item){
    return((item&&item.pasos)||[]).filter(p=>p.fecha).slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  }
  /* La Renovación (columna "RENOVACIÓN") es el día siguiente al término del
     contrato vigente (c.termTermino), no el propio vencimiento — así, si un
     paso pactado (ver pasoParaColumna) cae justo ese día, es la MISMA
     renovación y no debe repetirse en Ajuste Intermedio. */
  function renovacionISO(c){
    const d=parseDate(c.termTermino);
    if(!d)return null;
    const d2=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    return`${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,"0")}-${String(d2.getDate()).padStart(2,"0")}`;
  }
  /* Devuelve el paso a mostrar en la columna "Ajuste Intermedio N" (idx 0 o 1)
     de un cliente: 1) el N-ésimo paso pactado con fecha fija (ej. Trane 1era y
     2da renovación); 2) si ese índice quedó vacío y justo a continuación de
     los pasos conocidos hay una regla recurrente (ej. +5% cada 3 años), se
     proyecta ahí la próxima fecha calculada, para no tener que abrir el
     detalle de cada contrato para ver si viene un ajuste. */
  function pasoParaColumna(item,idx){
    if(!item)return null;
    const pasos=pasosOrdenadosDe(item);
    if(pasos[idx])return{...pasos[idx],ord:idx,recurrente:false};
    if(idx===pasos.length&&item.recurrente&&item.recurrente.cadaAnios){
      /* "desde" es la fecha del primer ciclo recurrente tal como se pactó en
         el contrato (puede NO ser paso.fecha + cadaAnios exactos — ej. Caja 18
         de Septiembre: último paso 2018, pero el primer ciclo recurrente de
         5% cada 5 años parte recién en 2021) — siempre tiene prioridad;
         "último paso" es solo el resguardo si no se registró "desde". */
      const base0=item.recurrente.desde||(pasos.length?pasos[pasos.length-1].fecha:null);
      if(base0){
        const hoy0=new Date();const hoy=new Date(hoy0.getFullYear(),hoy0.getMonth(),hoy0.getDate());
        let base=new Date(base0+"T00:00:00");
        const cada=Number(item.recurrente.cadaAnios)||3;
        let guard=0;
        while(base<hoy&&guard<100){base=new Date(base.getFullYear()+cada,base.getMonth(),base.getDate());guard++;}
        return{fecha:base.toISOString().slice(0,10),pct:item.recurrente.pct,ord:idx,recurrente:true};
      }
    }
    return null;
  }
  /* UF base contra la que se calcula el % del paso idx: para el primer paso es
     la UF inicial pactada en el contrato (c.ufInicio); para los siguientes, el
     valor UF del paso anterior — así "1era Renov" en Trane compara contra los
     385,93 UF originales y "2da Renov" contra los 404,43 UF resultantes. */
  function baseUFParaColumna(c,idx){
    if(idx===0)return c.ufInicio>0?c.ufInicio:null;
    const prev=pasoParaColumna(c._ajusteItem,idx-1);
    return prev&&prev.uf!=null?prev.uf:null;
  }
  /* Para las 2 columnas visibles priorizamos lo próximo/vigente por sobre lo
     histórico: si un contrato ya tiene 2+ pasos pactados en el pasado (ej.
     Caja 18 de Septiembre: pasos de 2017 y 2018) y una regla recurrente que
     recién proyecta a futuro, mostrar los 2 pasos vencidos "tapaba" la
     próxima fecha relevante. Se ordenan los eventos futuros/de hoy primero
     (el más próximo primero) y solo se rellena con pasados (el más reciente
     primero) si no alcanzan 2 eventos futuros. El "ord" cronológico de cada
     evento se conserva para las etiquetas y el cálculo de UF base. */
  function eventosPriorizados(item){
    if(!item)return[];
    const eventos=[];
    for(let i=0;;i++){const e=pasoParaColumna(item,i);if(!e)break;eventos.push(e);}
    const hoy0=new Date();const hoy=new Date(hoy0.getFullYear(),hoy0.getMonth(),hoy0.getDate());
    const futuros=eventos.filter(e=>new Date(e.fecha+"T00:00:00")>=hoy).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
    const pasados=eventos.filter(e=>new Date(e.fecha+"T00:00:00")<hoy).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    return[...futuros,...pasados];
  }
  /* Bloque visual compartido entre las columnas de Ajuste Intermedio y, cuando
     corresponde, la columna Renovación (ver renderRenovacionCol). */
  function renderPasoDetalle(c,p){
    const d=new Date(p.fecha+"T00:00:00");
    const fechaTxt=`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
    const ordTxt=p.recurrente?"Recurrente":(["1era","2da","3era","4ta","5ta"][p.ord]||`${p.ord+1}ª`)+" Renov";
    const fmtUF=v=>v.toFixed(2).replace(".",",");
    const base=baseUFParaColumna(c,p.ord);
    let valorTxt="",pctTxt=null;
    if(p.uf!=null){
      if(base>0){
        const pct=((p.uf-base)/base)*100;
        valorTxt=`${fmtUF(base)} → ${fmtUF(p.uf)} UF`;
        pctTxt=(pct>=0?"+":"")+fmtUF(pct)+"%";
      }else{
        valorTxt=fmtUF(p.uf)+" UF";
      }
    }else if(p.pct!=null){
      valorTxt="+"+p.pct+"%";
    }
    const hoy=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const dias=Math.ceil((d-hoy)/86400000);
    const{bg,col,bdr}=urgBg(dias,true);
    return h("div",{onClick:e=>{e.stopPropagation();abrirAjusteModal(c);},style:{cursor:"pointer",display:"inline-flex",flexDirection:"column",gap:0,padding:"3px 8px",borderRadius:8,background:bg,border:"1px solid "+bdr}},
      h("span",{style:{fontSize:8,fontWeight:700,color:col,opacity:.85}},ordTxt),
      h("span",{style:{fontSize:10,fontWeight:700,color:col,fontFamily:"'DM Mono',monospace"}},fechaTxt),
      valorTxt&&h("span",{style:{fontSize:9,color:col,fontFamily:"'DM Mono',monospace"}},valorTxt),
      pctTxt&&h("span",{style:{fontSize:9,fontWeight:800,color:col}},"("+pctTxt+")")
    );
  }
  function renderAjusteCol(c,idx){
    const p=eventosPriorizados(c._ajusteItem)[idx];
    const renovIso=renovacionISO(c);
    if(p&&renovIso&&p.fecha===renovIso)return h("span",{style:{color:"var(--txd)",fontSize:10}},"—");
    if(!p){
      if(idx===0)return h("button",{onClick:e=>{e.stopPropagation();abrirAjusteModal(c);},style:{fontSize:10,padding:"3px 8px",borderRadius:8,border:"1px dashed var(--bdr)",background:"none",color:"var(--txd)",cursor:"pointer"}},"+ Agregar");
      return h("span",{style:{color:"var(--txd)",fontSize:10}},"—");

  }
  /* Columna Renovación: muestra el día siguiente al término del contrato
     vigente. Si ese día coincide con un paso pactado de Ajuste Intermedio
     (ej. Trane 2da renovación), se muestra el detalle completo ahí mismo en
     vez de repetirlo también en una columna de Ajuste Intermedio. */
  function renderRenovacionCol(c){
    const d=parseDate(c.termTermino);
    if(!d)return h("span",{style:{color:"var(--txd)",fontSize:10}},"—");
    const d2=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    const fechaTxt=`${String(d2.getDate()).padStart(2,"0")}/${String(d2.getMonth()+1).padStart(2,"0")}/${d2.getFullYear()}`;
    const renovIso=renovacionISO(c);
    const pasoMatch=pasosOrdenadosDe(c._ajusteItem).map((p,i)=>({...p,ord:i})).find(p=>p.fecha===renovIso);
    if(!pasoMatch)return h("span",{style:{fontFamily:"'DM Mono',monospace",fontSize:10,color:"var(--txm)"}},fechaTxt);
    return renderPasoDetalle(c,pasoMatch);
  }
  async function guardarAjuste(){
    if(!ajusteModal||!ajusteDraft)return;
    setAjusteSaving(true);
    try{
      const pasosLimpios=(ajusteDraft.pasos||[]).filter(p=>p.fecha).map(p=>{
        const o={fecha:p.fecha};
        if(p.uf!==""&&p.uf!=null&&!isNaN(Number(p.uf)))o.uf=Number(p.uf);
        if(p.pct!==""&&p.pct!=null&&!isNaN(Number(p.pct)))o.pct=Number(p.pct);
        return o;
      });
      const rec=ajusteDraft.recurrente;
      const recurrente=(rec&&rec.pct!==""&&rec.pct!=null&&rec.cadaAnios!==""&&rec.cadaAnios!=null)?{pct:Number(rec.pct),cadaAnios:Number(rec.cadaAnios),...(rec.desde?{desde:rec.desde}:{})}:null;
      const body={rut:ajusteModal.rut,sitio:ajusteModal.sitio,pasos:pasosLimpios,recurrente,notas:ajusteDraft.notas};
      const r=await fetch("/api/ajuste-intermedio",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const j=await r.json();
      if(j.ok){
        setAjustes(p=>{const n={...p};const k=ajusteKey(ajusteModal.rut,ajusteModal.sitio);if(j.item)n[k]=j.item;else delete n[k];return n;});
        setAjusteModal(null);setAjusteDraft(null);
      }
    }catch(e){console.error(e);}
    setAjusteSaving(false);
  }
  function abrirAjusteModal(c){
    const key=ajusteKey(c.rut,c.sitio);
    const existing=ajustes[key];
    setAjusteModal({rut:c.rut,sitio:c.sitio,nombre:c.nombre});
    setAjusteDraft({
      pasos:existing&&existing.pasos?existing.pasos.map(p=>({fecha:p.fecha||"",uf:p.uf!=null?p.uf:"",pct:p.pct!=null?p.pct:""})):[],
      recurrente:existing&&existing.recurrente?{pct:existing.recurrente.pct,cadaAnios:existing.recurrente.cadaAnios,desde:existing.recurrente.desde||""}:{pct:"",cadaAnios:"",desde:""},
      notas:existing&&existing.notas?existing.notas:""
    });
  }
  const now=new Date();
  const currentYear=now.getFullYear();
  function avisoDias(str){if(!str||str==="-"||str==="")return null;const s=str.toLowerCase();const m=s.match(/(\d+)/);if(!m)return null;const n=parseInt(m[1]);if(s.includes("año")||s.includes("ano"))return n*365;if(s.includes("mes"))return n*30;return n;}
  function parseDate(v){if(!v||v==="—"||v==="-"||v==="")return null;if(typeof v==="string"&&v.includes("/")){const[d,mm,y]=v.split("/").map(Number);if(!d||!mm||!y)return null;return new Date(y,mm-1,d);}return null;}
  function diasDesde(str){const d=parseDate(str);if(!d)return null;return Math.ceil((d-now)/86400000);}
  function urgBg(dias,isReaj){if(dias===null)return{bg:"var(--surf2)",col:"var(--txd)",bdr:"var(--bdr)"};const t1=isReaj?30:90,t2=isReaj?90:180;if(dias<0||dias<=t1)return{bg:"var(--rbg)",col:"var(--red)",bdr:"var(--rdim)"};if(dias<=t2)return{bg:"var(--abg)",col:"var(--amber)",bdr:"var(--adim)"};return{bg:"var(--gbg)",col:"var(--green)",bdr:"var(--gdim)"};}
  function fechaNotif(termStr,avisoStr){const d=parseDate(termStr);const dias=avisoDias(avisoStr);if(!d||!dias)return null;const n=new Date(d);n.setDate(n.getDate()-dias);return`${String(n.getDate()).padStart(2,"0")}/${String(n.getMonth()+1).padStart(2,"0")}/${n.getFullYear()}`;}
  /* ¿Sigue facturando en los últimos N meses (incl. el actual)? Si un contrato
     ya venció en papel pero el cliente sigue siendo facturado, es la mejor

  function facturaReciente(c,meses){
    meses=meses||2;
    const _n=new Date();
    for(let _i=0;_i<meses;_i++){const _d=new Date(_n.getFullYear(),_n.getMonth()-_i,1);const _k=`${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,"0")}`;if((c.monthly[_k]||0)>0)return true;}
    return false;
  }
  const clients=dashData?dashData.clients:[];
  const contratosList=clients.filter(c=>!search||c.nombre.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>{
    const _ajusteItem=ajustes[ajusteKey(c.rut,c.sitio)];

  });
  function getSortValContrato(r,col){
    switch(col){
      case"sitio":return r.sitio||"";

      case"edificio":return r.edificio||"";

  const [search,setSearch]=useState("");

  function fmtUF(v){return v==null||isNaN(v)?"—":v.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2})+" UF";}
  function fmtUFm2(v){return v==null||isNaN(v)?"—":v.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2})+" UF/m²";}
  function ufPorM2(v){return(v.arriendoActual!=null&&v.m2!=null&&v.m2>0)?v.arriendoActual/v.m2:null;}
  if(!dashData)return h("main",{style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,overflow:"hidden",minHeight:0},className:"fade-up epv2"},
    driveLoading
      ?h("div",{style:{display:"flex",alignItems:"center",gap:10,color:"var(--txm)",fontSize:13}},h("span",{className:"fv2-loader",style:{width:18,height:18,fontSize:18}}),"Cargando planilla desde Drive...")
      :h("div",{style:{fontSize:13,color:"var(--txd)"}},"Sin datos — carga la planilla de facturación")
  );
  const normQ=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
  /* Catastro completo: todos los sitios/locales registrados en la Planilla,
     ocupados y vacantes, sin nombre de cliente — igual criterio de
     deduplicación (sitio+edificio) que usa Cuentas de Servicios. */
  const sitios=(()=>{
    const seen=new Set();
    return [...(dashData.clients||[]),...(dashData.vacantes||[])]
      .filter(c=>{const k=c.sitio+"|"+c.edificio;if(seen.has(k))return false;seen.add(k);return true;})
      .sort((a,b)=>a.ri-b.ri);
  })();
  const q=normQ(search);
  const filtered=!q?sitios:sitios.filter(v=>
    normQ(v.sitio).includes(q)||normQ(v.edificio).includes(q)||normQ(v.dir).includes(q)||
    (v.isVacante&&normQ("vacante").includes(q))
  );
  function getSortVal(v,col){
    switch(col){
      case "Sitio":return(v.sitio||"").toLowerCase();
      case "Estado":return v.isVacante?"vacante":"ocupado";
      case "Edificio":return(v.edificio||"").toLowerCase();
      case "Dirección":return(v.dir||"").toLowerCase();
      case "m² Total":return v.m2!=null?v.m2:-Infinity;
      case "UF/m²":{const r=ufPorM2(v);return r!=null?r:-Infinity;}
      case "UF Arriendo":return v.arriendoActual!=null?v.arriendoActual:-Infinity;
      case "UF Serv Admin":return v.servAdminActual!=null?v.servAdminActual:-Infinity;
      case "% Arriendo":return v.pctAdm!=null?v.pctAdm:-Infinity;
      default:return"";
    }
  }
  const sorted=sortCol?[...filtered].sort((a,b)=>{const va=getSortVal(a,sortCol),vb=getSortVal(b,sortCol);const cmp=typeof va==="number"?va-vb:va.localeCompare(vb,"es");return sortDir==="asc"?cmp:-cmp;}):filtered;
  const COLS=["Sitio","Estado","Edificio","Dirección","m² Total","UF/m²","UF Arriendo","UF Serv Admin","% Arriendo"];
  const totalM2=sitios.reduce((s,v)=>s+(v.m2||0),0);
  const totalArriendoUF=sitios.reduce((s,v)=>s+(v.arriendoActual||0),0);
  return h("main",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minHeight:0},className:"fade-up epv2"},
    h("div",{style:{padding:"14px 24px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,flexShrink:0,borderBottom:"1px solid var(--bdr)"}},

        h("span",{style:{fontSize:11,fontWeight:700,color:"var(--txd)",letterSpacing:".06em"}},"🗺️ CATASTRO DE SITIOS"),
        h("span",{style:{fontSize:11,color:"var(--txd)",fontFamily:"'DM Mono',monospace",background:"var(--surf2)",padding:"2px 8px",borderRadius:6}},filtered.length+" / "+sitios.length),
        h("span",{style:{width:1,height:16,background:"var(--bdr)",display:"inline-block",margin:"0 4px"}}),
        h("span",{title:"Suma de m² Total de todos los sitios",style:{fontSize:10,color:"var(--amber)",background:"var(--abg)",border:"1px solid var(--adim)",padding:"2px 8px",borderRadius:10,fontFamily:"'DM Mono',monospace",cursor:"default"}},totalM2.toLocaleString("es-CL")+" m² totales"),
        h("span",{title:"Suma de UF Arriendo (tarifa real vigente, último mes facturado) de todos los sitios",style:{fontSize:12,fontWeight:700,color:"var(--green)",background:"var(--gbg)",border:"1px solid var(--gdim)",padding:"3px 10px",borderRadius:10,fontFamily:"'DM Mono',monospace",cursor:"default"}},fmtUF(totalArriendoUF)+(ufHoy?" ("+fmtCLP(totalArriendoUF*ufHoy)+")":"")),
        h("span",{style:{fontSize:14,fontWeight:700,color:"var(--tx)",marginLeft:6}},ufHoy?"UF hoy: "+ufHoy.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2}):"UF hoy: cargando…")
      ),

        h("button",{
          title:"Exportar a Excel",
          onClick:()=>{
            const wb=XLSX.utils.book_new();
            const rows=filtered.map(v=>({
              "Sitio":v.sitio||"","Estado":v.isVacante?"VACANTE":"","Edificio":v.edificio||"","Dirección":v.dir||"",
              "m² Total":v.m2!=null?v.m2:"",
              "UF/m²":ufPorM2(v)!=null?Number(ufPorM2(v).toFixed(2)):"",
              "UF Arriendo":v.arriendoActual!=null?v.arriendoActual:"",
              "UF Serv Admin":v.servAdminActual!=null?v.servAdminActual:"",
              "% Arriendo":v.pctAdm!=null?(v.pctAdm>0&&v.pctAdm<1?(v.pctAdm*100).toFixed(0)+"%":v.pctAdm):"",

        },"📊 Excel"),

      filtered.length===0&&!search
        ?h("div",{style:{padding:"40px",textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin sitios registrados en la planilla")
        :filtered.length===0
          ?h("div",{style:{padding:"32px",textAlign:"center",color:"var(--txd)",fontSize:12}},"Sin resultados para \""+search+"\"")
          :h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:11}},
              h("thead",null,
                h("tr",{style:{background:"var(--surf2)",position:"sticky",top:0,zIndex:2}},
                  COLS.map(col=>{

                    return h("th",{key:col,onClick:()=>toggleSort(col),style:{

            );

    )
  );
}

function ElCortijoView({dashData,driveLoading}){
  const [zoomUnidad,setZoomUnidad]=useState(null);
  const [search,setSearch]=useState("");
  const [verPdf,setVerPdf]=useState(false);
  const [ufHoy,setUfHoy]=useState(null);
  useEffect(()=>{getUFHoy().then(setUfHoy);},[]);

  /* estado del fallback PDF: "loading" buscando en Drive | "fetching" descargando | "ready" | "error" */
  const [phase,setPhase]=useState("loading");
  const [blobUrl,setBlobUrl]=useState(null);
  const [fileName,setFileName]=useState(null);
  const [error,setError]=useState(null);
  useEffect(function(){
    if(!verPdf||blobUrl)return;
    let alive=true;
    let _url=null;
    fetch("/api/historial?ls="+DRIVE_FACTURACION_FOLDER_ID)
      .then(function(r){return r.json();})
      .then(function(d){
        if(!alive)return;
        const f=(d.files||[]).find(function(f){
          return /cortijo/i.test(f.name)&&/arriendos/i.test(f.name)&&/\.pdf$/i.test(f.name);
        });
        if(!f){setError("No se encontró 'El Cortijo 2026_Arriendos.pdf' en Drive");setPhase("error");return null;}
        setFileName(f.name);setPhase("fetching");
        return fetch("/api/historial?fileId="+f.id);
      })
      .then(function(r){
        if(!r||!alive)return;
        if(!r.ok)throw new Error("Error "+r.status+" al descargar el PDF");
        return r.arrayBuffer();
      })
      .then(function(buf){
        if(!buf||!alive)return;
        const blob=new Blob([buf],{type:"application/pdf"});
        _url=URL.createObjectURL(blob);
        setBlobUrl(_url);setPhase("ready");
      })
      .catch(function(e){if(alive){setError(e.message);setPhase("error");}});
    return function(){alive=false;if(_url)URL.revokeObjectURL(_url);};
  },[verPdf]);

  const normQ=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
  const todos=dashData?[...(dashData.clients||[]),...(dashData.vacantes||[])]:[];
  function matchPlanilla(edif){return edif?(todos.find(c=>c.edificio===edif)||null):null;}
  function fmtCLP(v){return v==null||isNaN(v)?"—":"$"+Math.round(v).toLocaleString("es-CL");}
  function fmtUF(v){return v==null||isNaN(v)?"—":v.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2})+" UF";}
  function fmtUFm2(v){return v==null||isNaN(v)?"—":v.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2})+" UF/m²";}
  function ufPorM2(v){return(v.arriendoActual!=null&&v.m2!=null&&v.m2>0)?v.arriendoActual/v.m2:null;}
  function fmtPct(v){return v==null||isNaN(v)?"—":(v>0&&v<1?(v*100).toFixed(0)+"%":String(v));}

  const q=normQ(search);
  const buscando=q.length>0;
  const unidadesFiltradas=buscando
    ?CORTIJO_UNIDADES.filter(u=>{
        const pl=matchPlanilla(u.edif);
        return normQ(u.edif).includes(q)||normQ(pl?.nombre).includes(q);
      })
    :[];

  const zoomData=zoomUnidad?CORTIJO_UNIDADES.find(u=>u.edif===zoomUnidad):null;
  const zoomPl=zoomData?matchPlanilla(zoomData.edif):null;
  const cx=zoomData?zoomData.x+zoomData.w/2:50, cy=zoomData?zoomData.y+zoomData.h/2:50;
  const esVacanteZ=zoomPl?.isVacante;
  const m2PlanillaZ=zoomPl?.m2;

      !verPdf&&h("input",{value:search,onChange:e=>{setSearch(e.target.value);setZoomUnidad(null);},placeholder:"Buscar edificio, cliente...",style:{width:220,marginLeft:"auto"}}),
      h("button",{onClick:()=>{setVerPdf(v=>!v);setZoomUnidad(null);},style:{
        marginLeft:verPdf?"auto":0,padding:"6px 14px",borderRadius:8,border:"1px solid var(--bdr)",
        background:"var(--surf2)",color:"var(--tx)",fontSize:12,fontWeight:700,cursor:"pointer"
      }},verPdf?"🗺️ Ver plano interactivo":"📄 Ver PDF original")
    ),
    verPdf
      ?h("div",{style:{flex:1,position:"relative",overflow:"hidden",background:"#404040"}},
          phase==="loading"&&h("div",{style:{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#ccc",fontSize:13}},"Buscando plano en Drive..."),
          phase==="fetching"&&h("div",{style:{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,color:"#ccc"}},
            h("div",{className:"spin",style:{fontSize:28,display:"inline-block"}},"⧭"),
            h("div",{style:{fontSize:13}},"Cargando plano..."),
            fileName&&h("div",{style:{fontSize:11,opacity:.6}},fileName)

          phase==="ready"&&h("iframe",{src:blobUrl,title:"Plano El Cortijo 2026",style:{width:"100%",height:"100%",border:"none",display:"block"}})
        )
      :buscando
        ?h("div",{style:{flex:1,overflowY:"auto",padding:"18px 24px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14,alignContent:"start"}},
            unidadesFiltradas.length===0
              ?h("div",{style:{gridColumn:"1/-1",padding:40,textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin resultados para \""+search+"\"")
              :unidadesFiltradas.map((u,i)=>{
                  const pl=matchPlanilla(u.edif);

                  const m2Planilla=pl?.m2;
                  const hayDiscrepancia=u.m2!=null&&m2Planilla!=null&&Math.abs(u.m2-m2Planilla)>1;
                  return h("div",{key:u.edif+"-"+i,style:{
                    border:"1px solid var(--bdr)",borderRadius:10,padding:14,background:"var(--surf)",
                    borderLeft:hayDiscrepancia?"4px solid var(--red)":esVacante?"4px solid var(--amber)":"4px solid var(--green)"
                  }},
                    h("div",{style:{fontSize:14,fontWeight:700,color:"var(--tx)",marginBottom:8}},u.edif),
                    h("div",{style:{fontSize:12,fontWeight:600,color:esVacante?"var(--amber)":"var(--tx)",marginBottom:6}},

                    h("div",{style:{display:"flex",gap:10,fontSize:11,color:"var(--txm)",marginBottom:6,flexWrap:"wrap"}},

                      pl.idEnel&&h("span",{style:{color:"#34D399",background:"rgba(52,211,153,.1)",padding:"2px 7px",borderRadius:6}},"⚡ Enel "+pl.idEnel),
                    ),
                    hayDiscrepancia&&h("div",{style:{fontSize:10,color:"var(--red)",fontWeight:600,marginTop:4}},"⚠ Diferencia de "+Math.abs(u.m2-m2Planilla).toFixed(2)+" m² vs. la Planilla"),
                    u.nota&&h("div",{style:{fontSize:10,color:"var(--txd)",marginTop:6,fontStyle:"italic",borderTop:"1px solid var(--bdr)",paddingTop:6}},u.nota)
                  );
                })
          )
        :h("div",{style:{flex:1,display:"flex",overflow:"hidden",position:"relative",background:"var(--bg)"}},
            h("div",{style:{flex:1,overflow:"hidden",position:"relative",display:"flex",alignItems:"center",justifyContent:"center",padding:24}},
              !dashData
                ?h("div",{style:{display:"flex",alignItems:"center",gap:10,color:"var(--txm)",fontSize:13}},
                    driveLoading?h(React.Fragment,null,h("span",{className:"fv2-loader",style:{width:18,height:18,fontSize:18}}),"Cargando planilla desde Drive..."):"Sin datos — carga la planilla de facturación")

                    h("img",{src:"/cortijo-emplazamiento.png",style:{width:"100%",display:"block",borderRadius:8,boxShadow:"0 4px 24px rgba(0,0,0,.15)"}}),
                    CORTIJO_UNIDADES.map(u=>{
                      const pl=matchPlanilla(u.edif);
                      const vac=pl?.isVacante;
                      const disc=u.m2!=null&&pl?.m2!=null&&Math.abs(u.m2-pl.m2)>1;
                      const activo=zoomUnidad===u.edif;
                      return h("div",{

                h("div",{style:{fontSize:14,fontWeight:600,color:esVacanteZ?"var(--amber)":"var(--tx)"}},zoomPl?(esVacanteZ?"VACANTE":zoomPl.nombre):"Sin datos de Planilla"),

          onClick:()=>{
            const wb=XLSX.utils.book_new();
            const rows=filtered.map(c=>{
              const d=aaData[c.idAgua]||{};
              return{
                "Sitio":c.sitio||"","Edificio":c.edificio||"","RUT":c.rut||"",
                "Cliente":c.isVacante?"VACANTE":(c.nombre||""),
                "Dirección":c.dir||"",
                "ID Aguas Andinas":c.idAgua||"","N° Medidor AA":c.medAgua||"",
                "Deuda AA":d.deuda||"","Nombre Factura AA":d.nombre||"","Vencimiento AA":d.vencimiento||"",
                "ID Enel":c.idEnel||"","N° Medidor Enel":c.medEnel||"",
                "Deuda Enel":(enelData[c.idEnel]?.deuda)||""

              };
            });
            const ws=XLSX.utils.json_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb,ws,"Cuentas Servicios");
            XLSX.writeFile(wb,"CuentasServicios_"+new Date().toISOString().slice(0,10)+".xlsx");
          },
          style:{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",borderRadius:6,border:"1px solid var(--bdr)",background:"var(--surf2)",color:"var(--tx)",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}
        },"📊 Excel"),
        h("button",{onClick:()=>window.print(),title:"Imprimir tabla completa",style:{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",borderRadius:6,border:"1px solid var(--bdr)",background:"var(--surf2)",color:"var(--tx)",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}},"🖨️ Imprimir")
      )
    ),
    h("div",{style:{flex:1,overflowY:"auto",overflowX:"auto",minHeight:0}},
      filtered.length===0&&!search
        ?h("div",{style:{padding:"40px",textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin clientes en la planilla")
        :filtered.length===0
          ?h("div",{style:{padding:"32px",textAlign:"center",color:"var(--txd)",fontSize:12}},"Sin resultados para \""+search+"\"")
          :h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:11}},
              h("thead",null,
                h("tr",{style:{background:"var(--surf2)",position:"sticky",top:0,zIndex:2}},
                  COLS.map(col=>{
                    const isAA=AA_COLS.includes(col),isEnel=ENEL_COLS.includes(col),active=sortCol===col;
                    const svcColor=isAA?AA_BLUE:isEnel?ENEL_GRN:null;
                    const isFirstAA=col==="ID Aguas Andinas",isFirstEnel=col==="ID Enel";
                    return h("th",{key:col,onClick:()=>toggleSort(col),style:{
                      padding:"8px 12px",textAlign:"left",fontSize:9,fontWeight:700,
                      color:active?"var(--acc)":svcColor||"var(--txd)",
                      letterSpacing:".06em",
                      borderBottom:`2px solid ${svcColor||"var(--bdr)"}`,
                      borderLeft:(isFirstAA||isFirstEnel)?`2px solid ${svcColor}40`:"none",
                      whiteSpace:"nowrap",
                      background:isAA?`${AA_BLUE}0d`:isEnel?`${ENEL_GRN}0d`:"var(--surf2)",
                      cursor:"pointer",userSelect:"none"
                    }},col.toUpperCase(),h("span",{style:{opacity:active?1:.4,fontSize:9,marginLeft:3}},active?(sortDir==='asc'?'▲':'▼'):'↕'));
                  })
                )
              ),
              h("tbody",null,
                (()=>{
                  /* IDs Enel ya registrados en la planilla */
                  const enelIdsEnPlanilla=new Set(clientes.map(c=>c.idEnel).filter(Boolean));
                  /* Cuentas del cache sin match en planilla */
                  const huerfanas=Object.keys(enelData).filter(id=>!enelIdsEnPlanilla.has(id));
                  const filaHuerfana=(id,idx)=>{
                    const d=enelData[id];
                    const tieneDeuda=d?.deuda&&d.deuda!=="$0";
                    return h("tr",{key:"hrf-"+id,style:{borderBottom:"1px solid var(--bdr)",background:`${ENEL_GRN}08`,opacity:0.85}},
                      h("td",{style:{padding:"9px 12px"}},h("span",{style:{padding:"2px 6px",borderRadius:5,fontSize:9,fontWeight:700,background:`${ENEL_GRN}18`,color:ENEL_GRN,border:`1px solid ${ENEL_GRN}40`}},"⚡ Sin asignar")),
                      h("td",{style:{padding:"9px 12px",fontSize:10,color:"var(--txd)",fontStyle:"italic"}},"—"),
                      h("td",{style:{padding:"9px 12px",fontFamily:"'DM Mono',monospace",fontSize:10,color:"var(--bdr)"}},"—"),
                      h("td",{style:{padding:"9px 12px",fontSize:11,color:"var(--txm)",fontStyle:"italic"}},"Sin cliente asignado"),
                      h("td",{style:{padding:"9px 12px",fontSize:10,color:"var(--bdr)"}},"—"),
                      h("td",{style:{padding:"9px 12px",fontFamily:"'DM Mono',monospace",fontSize:10,color:"var(--bdr)",borderLeft:`2px solid ${AA_BLUE}25`}},"—"),
                      h("td",{style:{padding:"9px 12px",fontFamily:"'DM Mono',monospace",fontSize:10,color:"var(--bdr)"}},"—"),
                      h("td",{style:{padding:"9px 12px",fontSize:10,color:"var(--bdr)"}},"—"),
                      h("td",{style:{padding:"9px 12px",fontSize:10,color:"var(--bdr)"}},"—"),
                      h("td",{style:{padding:"9px 12px",fontFamily:"'DM Mono',monospace",fontSize:10,color:ENEL_GRN,fontWeight:600,borderLeft:`2px solid ${ENEL_GRN}40`,background:`${ENEL_GRN}0d`}},id),
                      h("td",{style:{padding:"9px 12px",fontFamily:"'DM Mono',monospace",fontSize:10,color:"var(--bdr)",background:`${ENEL_GRN}06`}},"—"),
                      h("td",{style:{padding:"9px 12px",fontSize:10,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap",background:`${ENEL_GRN}06`}},
                        d?h("span",{style:{color:tieneDeuda?"var(--red)":ENEL_GRN,fontWeight:tieneDeuda?700:400}},d.deuda||"$0")
                         :h("span",{style:{color:"var(--bdr)"}},"—")
                      )
                    );
                  };
                  return [
                    ...sorted.map((c,i)=>{
                  const sCol=SITIO_C[c.sitio]||"#888";
                  return h("tr",{key:c.rut+"|"+c.sitio+"|"+c.edificio+i,style:{borderBottom:"1px solid var(--bdr)",background:i%2===0?"var(--surf)":"var(--surf2)"}},
                    h("td",{style:{padding:"9px 12px"}},h("span",{style:{padding:"2px 6px",borderRadius:5,fontSize:9,fontWeight:700,background:`${sCol}18`,color:sCol,border:`1px solid ${sCol}40`}},c.sitio||"\u2014")),
                    h("td",{style:{padding:"9px 12px",fontSize:10,color:"var(--txm)"}},c.edificio||"\u2014"),
                    h("td",{style:{padding:"9px 12px",fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"var(--txm)"}},c.rut||"\u2014"),
                    h("td",{style:{padding:"9px 12px",fontWeight:600,fontSize:11,maxWidth:200}},
                      c.isVacante
                        ?h("span",{style:{padding:"2px 8px",borderRadius:6,fontSize:10,fontWeight:700,background:"var(--abg)",color:"var(--amber)",border:"1px solid var(--adim)"}},"VACANTE")
                        :c.nombre
                    ),
                    h("td",{style:{padding:"9px 12px",fontSize:10,color:"var(--txm)",maxWidth:220}},c.dir||"\u2014"),
                    h("td",{style:{padding:"9px 12px",fontFamily:"'DM Mono',monospace",fontSize:10,color:c.idAgua?AA_BLUE:"var(--bdr)",borderLeft:`2px solid ${AA_BLUE}25`,background:c.idAgua?`${AA_BLUE}06`:"transparent"}},c.idAgua||"\u2014"),
                    h("td",{style:{padding:"9px 12px",fontFamily:"'DM Mono',monospace",fontSize:10,color:c.medAgua?AA_BLUE:"var(--bdr)",background:c.medAgua?`${AA_BLUE}06`:"transparent"}},c.medAgua||"\u2014"),
                    h("td",{style:{padding:"9px 12px",fontSize:10,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap",background:c.idAgua?`${AA_BLUE}06`:"transparent"}},
                      !c.idAgua
                        ?h("span",{style:{color:"var(--bdr)"}},"\u2014")
                        :(()=>{
                          const d=aaData[c.idAgua];
                          if(aaLoading) return h("span",{style:{color:"var(--bdr)",fontSize:9}},"\u00b7\u00b7\u00b7");
                          if(!d&&aaError) return h("span",{style:{color:"var(--red)",fontSize:9}},"\u26a0");
                          if(d) return h("span",{style:{color:d.deuda&&d.deuda!=="$0"?"var(--red)":AA_BLUE,fontWeight:d.deuda&&d.deuda!=="$0"?700:400}},d.deuda||"$0");
                          return h("span",{style:{color:"var(--bdr)"}},"\u2014");
                        })()
                    ),
                    h("td",{style:{padding:"9px 12px",fontSize:10,color:"var(--tx)",background:c.idAgua?`${AA_BLUE}06`:"transparent",maxWidth:200}},
                      !c.idAgua
                        ?h("span",{style:{color:"var(--bdr)"}},"\u2014")
                        :c.idAgua==="Administraci\u00f3n"
                          /* Medidor de \u00e1reas comunes/administraci\u00f3n \u2014 se factura a nombre de
                             Patag\u00f3nica por dise\u00f1o, no es un cliente individual: no comparar
                             ni permitir editar, mostrar siempre como "coincide" (gris). */
                          ?h("span",{title:"Cuenta de administraci\u00f3n \u2014 se factura a Patag\u00f3nica"},"PATAGONICA INMOBILIARIA SPA")
                        :editingAA===i
                          ?h("input",{
                              autoFocus:true,
                              value:editVal,
                              disabled:savingAA,
                              onChange:e=>setEditVal(e.target.value),
                              onKeyDown:e=>{
                                if(e.key==="Enter")guardarNombreAA(c.idAgua,editVal);
                                else if(e.key==="Escape")setEditingAA(null);
                              },
                              onBlur:()=>guardarNombreAA(c.idAgua,editVal),
                              style:{width:"100%",fontSize:10,padding:"2px 5px",border:`1px solid ${AA_BLUE}`,borderRadius:4,fontFamily:"'DM Sans',sans-serif"}
                            })
                          :(()=>{
                          const d=aaData[c.idAgua];
                          if(aaLoading) return h("span",{style:{color:"var(--bdr)",fontSize:9}},"\u00b7\u00b7\u00b7");
                          if(d?.nombre){
                            const mismo=normQ(d.nombre)===normQ(c.nombre);
                            return h("span",{
                              title:(mismo?"Coincide con cliente planilla":"\u26a0 Difiere del cliente en planilla")+" \u2014 clic para editar",
                              onClick:()=>{setEditingAA(i);setEditVal(d.nombre||"");},
                              style:{color:mismo?"var(--txm)":"var(--red)",fontWeight:mismo?400:700,cursor:"pointer"}
                            },d.nombre);
                          }
                          return h("span",{
                            title:"Clic para escribir el nombre real de la cuenta AA",
                            onClick:()=>{setEditingAA(i);setEditVal("");},
                            style:{color:"var(--bdr)",cursor:"pointer",borderBottom:"1px dashed var(--bdr)"}
                          },"+ agregar");
                        })()
                    ),
                    h("td",{style:{padding:"9px 12px",fontFamily:"'DM Mono',monospace",fontSize:10,color:c.idEnel?ENEL_GRN:"var(--bdr)",borderLeft:`2px solid ${ENEL_GRN}25`,background:c.idEnel?`${ENEL_GRN}06`:"transparent"}},c.idEnel||"\u2014"),
                    h("td",{style:{padding:"9px 12px",fontFamily:"'DM Mono',monospace",fontSize:10,color:c.medEnel?ENEL_GRN:"var(--bdr)",background:c.medEnel?`${ENEL_GRN}06`:"transparent"}},c.medEnel||"\u2014"),
                    h("td",{style:{padding:"9px 12px",fontSize:10,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap",background:c.idEnel?`${ENEL_GRN}06`:"transparent"}},
                      !c.idEnel
                        ?h("span",{style:{color:"var(--bdr)"}},"\u2014")
                        :(()=>{
                          const d=enelData[c.idEnel];
                          if(enelLoading) return h("span",{style:{color:"var(--bdr)",fontSize:9}},"\u00b7\u00b7\u00b7");
                          if(!d&&enelError) return h("span",{style:{color:"var(--red)",fontSize:9}},"\u26a0");
                          if(d) return h("span",{style:{color:d.deuda&&d.deuda!=="$0"?"var(--red)":ENEL_GRN,fontWeight:d.deuda&&d.deuda!=="$0"?700:400}},d.deuda||"$0");
                          return h("span",{style:{color:"var(--bdr)"}},"\u2014");
                        })()
                    )
                  );
                }),
                    ...huerfanas.map((id,idx)=>filaHuerfana(id,idx))
                  ];
                })()
              )
            )
    )
  );
}

/* ══════════════════════════════════════════════════════════
   HISTORIAL FACTURACIÓN
══════════════════════════════════════════════════════════ */
function HistorialFactView({dashData,driveLoading,notify,planillaFile,marcarPagadoSheet}){
  const [selGroup,setSelGroup]=useState([]);           /* array de sitios del cliente seleccionado */
  const selClient=selGroup[0]||null;                   /* primer sitio → usado para fetch (comparten rut+nombre) */
  const [periodsAvail,setPeriodsAvail]=useState([]); /* períodos con ZIP en Drive */
  const [invoicesMap,setInvoicesMap]=useState({});   /* {periodo:{arriendo,servAdm,habilitacion}} */
  const [loadingSet,setLoadingSet]=useState(new Set());
  const [zipCache,setZipCache]=useState({});
  const [pdfPrev,setPdfPrev]=useState(null);
  const [pdfLoading,setPdfLoading]=useState(false);
  const [search,setSearch]=useState("");
  const [refreshTrigger,setRefreshTrigger]=useState(0);
  const refreshFlag=React.useRef(false);
  const [resumenData,setResumenData]=useState(null);   /* [{nombre, meses:{}, total}] desde /api/historial?resumen=1 */
  const [nuboxUpdatedAt,setNuboxUpdatedAt]=useState(null);
  const [nuboxRefreshing,setNuboxRefreshing]=useState(false);
  const [rutMapDTE,setRutMapDTE]=useState({});          /* {RazonSocial→RUT} desde /api/historial?rutMap=1 */
  const [seguimiento,setSeguimiento]=useState({});      /* {rut: {nombre,tipo,notas,facturas[]}} desde /clientes-seguimiento.json — clientes sin fila en Planilla (ej. facturación por orden de compra) */
  const [sortCol,setSortCol]=useState("total");         /* columna activa: "rut"|"nombre"|"total" */
  const [sortDir,setSortDir]=useState("desc");          /* "asc"|"desc" */

  /* Invalidar caché localStorage si la versión cambió (evita datos stale de deploys anteriores) */
  const HIST_CACHE_VER = "fuente0-v6";
  React.useEffect(()=>{
    try{
      if(localStorage.getItem("histBatch_ver")!==HIST_CACHE_VER){
        Object.keys(localStorage).filter(k=>k.startsWith("histBatch:")).forEach(k=>localStorage.removeItem(k));
        localStorage.setItem("histBatch_ver",HIST_CACHE_VER);
      }
    }catch(_){}
  },[]);

  /* Carga resumen de ventas — fuente primaria: caché estático. API solo como fallback. */
  React.useEffect(()=>{
    let cancelled=false;
    // 1. Caché estático (nubox-resumen-cache.json) — fuente de verdad
    fetch("/nubox-resumen-cache.json")
      .then(r=>r.json())
      .then(d=>{
        if(!cancelled&&d.clientes&&d.clientes.length>0){
          setResumenData(d.clientes);
          if(d.updatedAt)setNuboxUpdatedAt(d.updatedAt);
        }
      })
      .catch(()=>{
        // 2. API solo si el caché estático falla
        fetch("/api/historial?resumen=1")
          .then(r=>r.json())
          .then(d=>{if(!cancelled&&d.clientes&&d.clientes.length>0){setResumenData(d.clientes);if(d.updatedAt)setNuboxUpdatedAt(d.updatedAt);}})
          .catch(()=>{});
      });
    // Mapa RazonSocial→RUT (siempre)
    fetch("/api/historial?rutMap=1")
      .then(r=>r.json())
      .then(d=>{if(!cancelled)setRutMapDTE(d.ruts||{});})
      .catch(()=>{});
    // Clientes en seguimiento manual (sin fila en Planilla, ej. facturación por orden de compra)
    fetch("/clientes-seguimiento.json")
      .then(r=>r.ok?r.json():null)
      .then(d=>{if(!cancelled&&d&&d.items)setSeguimiento(d.items);})
      .catch(()=>{});
    return ()=>{cancelled=true;};
  },[]);

  /* Clave única por fila de planilla: sitio + edificio (ej: 'A-2|T. Of. 44') */
  const siteKey=sc=>`${sc.sitio}${sc.edificio?'|'+sc.edificio:''}`;
  const MES_NOMBRE_ARR=Object.keys(MES_NUM);
  const rutNorm2=r=>(r||"").replace(/\./g,"").replace(/-/g,"").toLowerCase();

  /* ── Marcar Pagado directo desde Histórico (sin recorrer mes a mes en Facturación) ──
     pagoMap: {periodo: {siteKey: {arriendo:{sheetRow,colLetter,yaPagado}, servAdm:{...}}}}
     planillaPeriodoCache: evita re-parsear la misma hoja/período si ya se consultó antes. */
  const [pagoMap,setPagoMap]=useState({});
  const planillaPeriodoCache=React.useRef({});
  async function cargarPagoPeriodo(periodo){
    if(planillaPeriodoCache.current[periodo])return planillaPeriodoCache.current[periodo];
    if(!planillaFile)return null;
    try{
      const clientes=await procesarPlanillaFacturacion(planillaFile,periodo);
      planillaPeriodoCache.current[periodo]=clientes;
      return clientes;
    }catch(e){return null;}
  }
  /* Al seleccionar cliente (o cuando llegan más períodos): traer sheetRow + columna
     "Pago Arriendo"/"Pago GC" de la Planilla real para cada período mostrado */
  useEffect(()=>{
    if(!selClient||!planillaFile||periodsAvail.length===0)return;
    let cancelled=false;
    const periodosAConsultar=periodsAvail.slice(0,10);
    Promise.all(periodosAConsultar.map(p=>cargarPagoPeriodo(p).then(clientes=>[p,clientes])))
      .then(results=>{
        if(cancelled)return;
        setPagoMap(prev=>{
          const next={...prev};
          results.forEach(([p,clientes])=>{
            if(!clientes)return;
            const byPeriod={...(next[p]||{})};
            selGroup.forEach(sc=>{
              const match=tipo=>clientes.find(c=>c.tipo===tipo&&rutNorm2(c.rut)===rutNorm2(sc.rut)&&(c.sitio||"")===(sc.sitio||"")&&(c.edificio||"")===(sc.edificio||""));
              const arr=match("arriendo"),srv=match("serv_adm");
              byPeriod[siteKey(sc)]={
                arriendo:arr?{sheetRow:arr.sheetRow,colLetter:arr.pagadoColLetter,yaPagado:arr.yaPagado}:null,
                servAdm:srv?{sheetRow:srv.sheetRow,colLetter:srv.pagadoColLetter,yaPagado:srv.yaPagado}:null,
              };
            });
            next[p]=byPeriod;
          });
          return next;
        });
      });
    return ()=>{cancelled=true;};
  },[selClient,periodsAvail,planillaFile]);

  const togglePagoHistorico=async(periodo,skey,conc,info)=>{
    if(!info||!info.sheetRow||!info.colLetter||!marcarPagadoSheet)return;
    const nuevo=!info.yaPagado;
    setPagoMap(prev=>({...prev,[periodo]:{...prev[periodo],[skey]:{...prev[periodo]?.[skey],[conc]:{...info,yaPagado:nuevo}}}}));
    try{
      await marcarPagadoSheet(info.sheetRow,info.colLetter,nuevo);
    }catch(e){
      notify("Error al marcar pagado: "+e.message,"err");
      setPagoMap(prev=>({...prev,[periodo]:{...prev[periodo],[skey]:{...prev[periodo]?.[skey],[conc]:info}}}));
    }
  };

  /* Al seleccionar cliente: descubrir períodos y cargar en paralelo por sitio */
  useEffect(()=>{
    if(!selClient){setPeriodsAvail([]);setInvoicesMap({});setLoadingSet(new Set([]));return;}
    setPeriodsAvail([]);setInvoicesMap({});
    const doRefresh=refreshFlag.current;  // capturar antes de reset
    refreshFlag.current=false;
    let cancelled=false; // evita que fetches de cliente anterior contaminen el nuevo
    fetch("/api/historial?listPeriodos=1")
      .then(r=>r.json())
      .then(({periodos=[]})=>{
        if(cancelled) return;

        /* Facturas registradas a mano en clientes-seguimiento.json (clientes sin
           contrato/ZIP aún sincronizado, ej. facturación por orden de compra) —
           se agregan como período/columna extra, sin pisar un período que ya
           venga real desde el ZIP de Drive. */
        const manualInv={};   // {siteKey: {periodo: {arriendo:{nro,total,uf}}}}
        const manualPeriodos=[];
        selGroup.forEach(sc=>{
          const entry=Object.entries(seguimiento).find(([rut])=>rutNorm2(rut)===rutNorm2(sc.rut));
          if(!entry)return;
          (entry[1].facturas||[]).forEach(f=>{
            const d=f.fecha?new Date(f.fecha+"T00:00:00"):null;
            if(!d||isNaN(d))return;
            const mesLabel=`${MES_NOMBRE_ARR[d.getMonth()]} ${d.getFullYear()}`;
            if(periodos.includes(mesLabel))return; // ya viene real del ZIP, no pisar
            if(!manualPeriodos.includes(mesLabel))manualPeriodos.push(mesLabel);
            const numPart=(f.folio||"").replace(/^FAC-EL-?/i,"").replace(/^F(?:EE)?-/i,"");
            const key=siteKey(sc);
            manualInv[key]=manualInv[key]||{};
            manualInv[key][mesLabel]={arriendo:{nro:numPart?`F-${numPart}`:null,total:Number(f.monto)||0,uf:null}};
          });
        });
        setPeriodsAvail([...manualPeriodos,...periodos]);
        if(Object.keys(manualInv).length>0){
          setInvoicesMap(prev=>{
            const next={...prev};
            Object.entries(manualInv).forEach(([key,byPeriodo])=>{next[key]={...(next[key]||{}),...byPeriodo};});
            return next;
          });
        }
        /* loadingSet: "sitio|periodo" para rastrear cada fetch independiente */
        const ls=new Set();
        selGroup.forEach(sc=>periodos.slice(0,10).forEach(p=>ls.add(siteKey(sc)+'|'+p)));
        setLoadingSet(ls);
        /* Fetch paralelo por sitio × período — pasa ufArr, ufSrv y siteIdx para que la API elija la factura correcta.
           siteIdx permite desempatar cuando varios sitios del mismo cliente tienen igual UF (ej: NCH Chile enero). */
        selGroup.forEach((sc,siteIdx)=>{
          periodos.slice(0,10).forEach(p=>{
            const [pMes,pAnio]=p.split(" ");
            const pNum=MES_NUM[pMes];
            const pKey2=pAnio&&pNum?`${pAnio}-${String(pNum).padStart(2,"0")}`:null;
            /* Verificar localStorage batch antes de llamar al API */
            if(!doRefresh&&pKey2){
              try{
                const stored=localStorage.getItem(`histBatch:${pKey2}`);
                if(stored){
                  const batch=JSON.parse(stored);
                  const nr=r=>((r||"").replace(/\./g,"").replace(/-/g,"").toLowerCase());
                  const entry=batch.sitios?.find(s=>nr(s.rut)===nr(sc.rut||"")&&s.sitio===(sc.sitio||"")&&(s.edificio||"")===(sc.edificio||""));
                  if(entry&&entry.estado!=="pendiente"&&Object.keys(entry.facturas||{}).length>0){
                    if(!cancelled){
                      setInvoicesMap(prev=>({...prev,[siteKey(sc)]:{...(prev[siteKey(sc)]||{}),[p]:entry.facturas}}));
                      setLoadingSet(prev=>{const s=new Set(prev);s.delete(siteKey(sc)+'|'+p);return s;});
                    }
                    return;
                  }
                }
              }catch(_){}
            }
            const histE2=pKey2?sc.hist?.find(h=>h.key===pKey2):null;
            /* El bloque histórico (col 65+, 4 por mes) puede desalinearse cuando la planilla
               agrega columnas nuevas a algún mes intermedio (ej. "Pagado") — en ese caso termina
               leyendo un Nro de Factura en vez de una UF. Filtro de cordura: una UF de arriendo
               real nunca supera ~2000; si lo supera, es una lectura corrupta, se ignora. */
            const histUfValida=histE2?.uf>0&&histE2.uf<2000;
            const pufArr2=histUfValida?histE2.uf:sc.ufArr;
            /* Preferir el GC mensual real (columna "GC" de ESE mes) sobre el %
               Administración fijo de la planilla — este último puede quedar en
               blanco aunque el cliente sí tenga un cobro de Serv. Admin. vigente
               ese mes específico (ej. Olympus 4-A: %Adm sin configurar, pero GC
               de julio = 8.69 UF, factura FEE-14936 real). */
            const gcMes=pKey2?sc.monthlyGC?.[pKey2]:null;
            const pufSrv2=gcMes>0?gcMes:(histUfValida&&sc.ufArr>0&&sc.ufSrv>0
              ?Math.round(sc.ufSrv*(histE2.uf/sc.ufArr)*10000)/10000:sc.ufSrv);
            const url=`/api/historial?cliente=${encodeURIComponent(sc.nombre)}&rut=${encodeURIComponent(sc.rut||"")}`
              +`&ufArr=${encodeURIComponent(pufArr2||"")}&ufSrv=${encodeURIComponent(pufSrv2||"")}`
              +`&siteIdx=${siteIdx}&sitio=${encodeURIComponent(sc.sitio||"")}`
              +`&periodo=${encodeURIComponent(p)}`
              +(doRefresh?"&refresh=1":"");

              .then(r=>r.json())
              .then(({facturas,source})=>{

                if(facturas){

                     "atascado" para siempre, aunque después aparezca la factura real. */
                  const completo=!(pufArr2>0&&!facturas.arriendo)&&!(pufSrv2>0&&!facturas.servAdm);
                  if(source==="excel"&&pKey2&&completo){
                    try{
                      const stored=localStorage.getItem(`histBatch:${pKey2}`);
                      const batch=stored?JSON.parse(stored):{sitios:[]};
                      const nr=r=>((r||"").replace(/\./g,"").replace(/-/g,"").toLowerCase());
                      const idx=batch.sitios?.findIndex(s=>nr(s.rut)===nr(sc.rut||"")&&s.sitio===(sc.sitio||"")&&(s.edificio||"")===(sc.edificio||""));
                      const entry={rut:sc.rut,sitio:sc.sitio||"",edificio:sc.edificio||"",estado:"ok",facturas};
                      if(idx>=0) batch.sitios[idx]=entry; else batch.sitios=(batch.sitios||[]).concat(entry);
                      localStorage.setItem(`histBatch:${pKey2}`,JSON.stringify(batch));
                    }catch(_){}
                  }
                }
                setLoadingSet(prev=>{const s=new Set(prev);s.delete(siteKey(sc)+'|'+p);return s;});
              })
              .catch(()=>{if(!cancelled)setLoadingSet(prev=>{const s=new Set(prev);s.delete(siteKey(sc)+'|'+p);return s;});});
          });
        });
      })
      .catch(()=>{if(!cancelled){setPeriodsAvail([]);setLoadingSet(new Set());}});
    return ()=>{cancelled=true;};
  },[selClient,refreshTrigger,seguimiento]);

  const clients=dashData

  /* Columnas de meses para tabla resumen (más reciente primero) */
  const MESES_RESUMEN=["Enero 2026","Febrero 2026","Marzo 2026","Abril 2026","Mayo 2026","Junio 2026","Julio 2026"];
  const MESES_LABELS=["Ene","Feb","Mar","Abr","May","Jun","Jul"];

  /* Mapa stripNombre→RUT: prioridad 1=DTE directo, prioridad 2=planilla */
  const rutMap=React.useMemo(()=>{
    const stripN=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
    const m={};
    // Fuente 2: planilla (nombres pueden diferir del DTE)
    if(dashData){
      dashData.clients.forEach(c=>{if(c.rut&&!m[stripN(c.nombre)])m[stripN(c.nombre)]=c.rut;});
    }
    // Fuente 1: mapa exacto RazonSocial→RUT desde ZIPs DTE (sobreescribe planilla si coincide)
    Object.entries(rutMapDTE).forEach(([nombre,rut])=>{if(rut)m[stripN(nombre)]=rut;});
    return m;

  /* Función strip para matching de nombres */
  const stripNombre=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");

  /* Fusiona clientes-seguimiento.json con la tabla resumen (que viene de Nubox y no
     "sabe" de clientes que ya no tienen fila en la Planilla). Si el cliente ya aparece
     en resumenData (match por RUT) solo se rellenan los meses que Nubox aún no tiene
     (ej. una factura recién emitida, antes del próximo refresh del caché); si no
     aparece, se agrega como fila sintética para no perder visibilidad. */
  const resumenConSeguimiento=React.useMemo(()=>{
    const base=(resumenData||[]).map(c=>({...c}));
    const rutIdx={};
    base.forEach((c,i)=>{const rut=rutMap[stripNombre(c.nombre)];if(rut)rutIdx[rut.replace(/\./g,"")]=i;});
    Object.entries(seguimiento).forEach(([rut,info])=>{
      const rutNorm=rut.replace(/\./g,"");
      const manualMeses={};
      (info.facturas||[]).forEach(f=>{
        const d=f.fecha?new Date(f.fecha+"T00:00:00"):null;
        if(!d||isNaN(d))return;
        const mesLabel=`${MES_NOMBRE_ARR[d.getMonth()]} ${d.getFullYear()}`;
        manualMeses[mesLabel]=(manualMeses[mesLabel]||0)+(Number(f.monto)||0);
      });
      const idx=rutIdx[rutNorm];
      if(idx!=null){
        const existing=base[idx];
        const meses={...existing.meses};
        let total=existing.total;
        Object.entries(manualMeses).forEach(([mes,val])=>{
          if(!meses[mes]){meses[mes]=val;total+=val;}
        });
        base[idx]={...existing,meses,total,_seguimiento:info};
      }else{
        const total=Object.values(manualMeses).reduce((s,v)=>s+v,0);
        base.push({nombre:info.nombre||rut,meses:manualMeses,total,_seguimiento:info,_rutManual:rut});
      }
    });
    return base;
  },[resumenData,seguimiento,rutMap]);

  /* RUT de una fila de la tabla resumen: prioriza el RUT manual (clientes-seguimiento.json,
     sin match en Nubox) sobre el cruce por nombre vía rutMap */
  const rutOf=c=>c._rutManual||rutMap[stripNombre(c.nombre)]||"";

  /* Filtrado y ordenamiento tabla resumen */
  const filteredResumen=React.useMemo(()=>{
    const arr=(resumenConSeguimiento||[]).filter(c=>{
      if(!search)return true;
      const q=search.toLowerCase();
      const rut=rutOf(c).replace(/\./g,"").toLowerCase();
      return c.nombre.toLowerCase().includes(q)||rut.includes(q.replace(/\./g,""));
    });
    arr.sort((a,b)=>{
      let va,vb;
      if(sortCol==="rut"){
        va=(rutOf(a)||"zzz").replace(/\./g,"");
        vb=(rutOf(b)||"zzz").replace(/\./g,"");
        // Ordenar numéricamente por la parte antes del guión
        const na=parseInt((va.split("-")[0]||"0").replace(/\D/g,""))||0;
        const nb=parseInt((vb.split("-")[0]||"0").replace(/\D/g,""))||0;
        va=na; vb=nb;
      } else if(sortCol==="nombre"){
        va=a.nombre.toLowerCase(); vb=b.nombre.toLowerCase();
      } else {
        va=a.total; vb=b.total;
      }
      if(va<vb)return sortDir==="asc"?-1:1;
      if(va>vb)return sortDir==="asc"?1:-1;
      return 0;
    });
    return arr;
  },[resumenConSeguimiento,search,rutMap,sortCol,sortDir]);

          " = ",

          )
        ),
        ...MESES_RESUMEN.map(mes=>h("div",{key:mes,style:{textAlign:"right",color:"var(--accl)"}},
          "$"+Math.round(totalesResumen.meses[mes]||0).toLocaleString("es-CL")
        )),
        h("div",{style:{textAlign:"right",color:"var(--accl)"}},
          "$"+Math.round(totalesResumen.total).toLocaleString("es-CL"))
      ),
      resumenData===null
        ?h("div",{style:{padding:"32px",textAlign:"center",color:"var(--txm)",fontSize:13}},
            h("span",{className:"spin",style:{fontSize:18,marginRight:8}},"⟳"),"Cargando...")
        :filteredResumen.length===0
        ?h("div",{style:{padding:"32px",textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin resultados")
        :h("div",{style:{maxHeight:"calc(100vh - 260px)",overflowY:"auto"}},
          filteredResumen.map(c=>{
            const rut=rutOf(c)||"—";
            const canClick=true;
            return h("div",{key:rut+"|"+c.nombre,
              onClick:()=>{
                const cStrip=stripNombre(c.nombre);

                padding:"10px 14px",borderBottom:"1px solid var(--bdr)",minWidth:1100,

            },
              h("div",{style:{fontFamily:"'DM Mono',monospace",fontSize:10,color:"var(--txd)",alignSelf:"center",whiteSpace:"nowrap"}},rut),
              h("div",{style:{alignSelf:"center",display:"flex",alignItems:"center",gap:6}},
                h("div",{style:{fontWeight:600,fontSize:12,lineHeight:1.4}},c.nombre),
                c._seguimiento&&h("span",{
                  title:c._seguimiento.notas||"",

    ),

      /* Restar NCs del cliente (sólo en el primer sitio del grupo para no duplicar) */

      const _ncEntry=window._NC_STATIC&&Object.entries(window._NC_STATIC).find(([n])=>_stripNx(n)===_stripNx(sc.nombre));
      const _ncClientTotal=_ncEntry?Object.values(_ncEntry[1]).flat().reduce((s,nc)=>s+nc.total,0):0;
      const granTotalNet=granTotal+(selGroup.indexOf(sc)===0?_ncClientTotal:0);

      return h("div",{key:siteKey(sc),style:{background:"var(--surf)",border:"1px solid var(--bdr)",borderRadius:12,overflow:"hidden",flexShrink:0}},

function HistorialPanel(){return null;}
function _HistorialPanel_REMOVED({files,data,pdfMap,filesZip,periodo,getToken,notify,clientId}){
  const MESES_N=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const anio=new Date().getFullYear();
  const[loading,setLoading]=useState(false);
  const[historial,setHistorial]=useState(null);      /* {historial,mesesOrden} */
  const[mapping,setMapping]=useState({});            /* periodo→{cliente→{arriendo,servAdm}} */
  const[cliente,setCliente]=useState("");
  const[zipList,setZipList]=useState(null);          /* archivos en DRIVE_PDF_FACTURAS_ID */
  const[habList,setHabList]=useState(null);          /* archivos en carpeta habilitaciones */
  const[loadingMes,setLoadingMes]=useState(null);
  const[loadedZips,setLoadedZips]=useState({});      /* mes→JSZip object */
  const[preview,setPreview]=useState(null);          /* {url,nombre} */
  const[pdfLoading,setPdfLoading]=useState(false);   /* cargando PDF desde Drive */
  const[sending,setSending]=useState(null);

  const HAB_FOLDER="1O1nBsti_reAKnAXXKdL2opNWz1ocZu8u";

  /* Cargar planilla y mapping al montar / cambiar planilla */
  useEffect(()=>{
    if(!files?.planilla)return;
    setLoading(true);
    Promise.all([
      leerHistorialAnio(files.planilla,anio),
      fetch(`/api/historial?anio=${anio}`).then(r=>r.json()).catch(()=>({})),
    ]).then(([hist,map])=>{setHistorial(hist);setMapping(map);setLoading(false);})
    .catch(e=>{notify("Error cargando historial: "+e.message,"err");setLoading(false);});
  },[files?.planilla]);

  /* Listar ZIPs de Drive y habilitaciones */
  useEffect(()=>{
    fetch(`/api/historial?ls=${DRIVE_PDF_FACTURAS_ID}`).then(r=>r.json()).then(d=>setZipList(d.files||[])).catch(()=>setZipList([]));
    fetch(`/api/historial?ls=${HAB_FOLDER}`).then(r=>r.json()).then(d=>setHabList(d.files||[])).catch(()=>setHabList([]));
  },[]);

  /* Descargar ZIP de un mes y cachearlo */
  const cargarZipMes=useCallback(async(mes)=>{
    if(loadedZips[mes])return loadedZips[mes];
    if(!zipList)return null;
    const zipFile=zipList.find(f=>f.name.toLowerCase().includes(mes.toLowerCase())&&f.name.includes(String(anio)));
    if(!zipFile){notify(`No se encontró ZIP para ${mes} ${anio}`,"warn");return null;}
    setLoadingMes(mes);
    try{
      const r=await fetch(`/api/historial?fileId=${zipFile.id}`);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const buf=await r.arrayBuffer();
      const zip=await JSZip.loadAsync(buf);
      setLoadedZips(p=>({...p,[mes]:zip}));
      setLoadingMes(null);
      return zip;
    }catch(e){notify("Error descargando ZIP: "+e.message,"err");setLoadingMes(null);return null;}
  },[zipList,loadedZips,anio]);

  /* Abrir preview de un PDF */
  const verPdf=useCallback(async(facturaNum,mes,blob)=>{
    setPdfLoading(true);
    try{
      if(blob){/* habilitacion: ya tiene blob */
        const url=URL.createObjectURL(blob);
        setPreview({url,nombre:blob.name||facturaNum});return;
      }
      /* Primero buscar en sesión actual */
      if(pdfMap[facturaNum]&&filesZip){
        try{
          const z=await JSZip.loadAsync(await filesZip.arrayBuffer());
          const _re1=new RegExp("(?<![0-9])"+facturaNum.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![0-9])");const entry=Object.values(z.files).find(f=>_re1.test(f.name)&&!f.dir);
          if(entry){const d=await entry.async("uint8array");const b=new Blob([d],{type:"application/pdf"});setPreview({url:URL.createObjectURL(b),nombre:`${facturaNum}.pdf`});return;}
        }catch(e){}
      }
      /* Cargar desde Drive */
      const zip=await cargarZipMes(mes);if(!zip)return;
      const _re2=new RegExp("(?<![0-9])"+facturaNum.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![0-9])");const entry=Object.values(zip.files).find(f=>_re2.test(f.name)&&f.name.endsWith(".pdf")&&!f.dir);
      if(!entry){notify(`PDF ${facturaNum} no encontrado en ZIP de ${mes}`,"warn");return;}
      const d=await entry.async("uint8array");
      setPreview({url:URL.createObjectURL(new Blob([d],{type:"application/pdf"})),nombre:`${facturaNum}.pdf`});
    }finally{setPdfLoading(false);}
  },[pdfMap,filesZip,cargarZipMes]);

  /* Reenviar email de un mes */
  const reenviar=useCallback(async(mes)=>{
    if(!historial||!cliente)return;
    const mesData=historial.historial[cliente]?.meses[mes];if(!mesData)return;
    const correo=historial.historial[cliente].correo;if(!correo){notify("Sin correo para este cliente","warn");return;}
    setSending(mes);
    try{
      const token=await getToken();
      const mesMapping=mapping[`${mes} ${anio}`]?.[cliente]||{};
      const concepto=mesData.ufArriendo?"Arriendo":"Serv. Administrativo";
      const subject=`Reenvío Factura(s) ${mes} ${anio} — ${cliente} — Patagónica Inmobiliaria SpA`;
      const htmlBody=buildEmailHtml(cliente,concepto,`${mes} ${anio}`,mesData.ufArriendo||mesData.ufServAdm,mesMapping.arriendo||mesMapping.servAdm,null);
      /* Intentar adjuntar PDF si hay número de factura */
      let pdfB64=null,pdfNombre=null;
      const facNum=mesMapping.arriendo||mesMapping.servAdm;
      if(facNum){

function SplitTimer({loading}){
  const [elapsed,setElapsed]=React.useState(0);
  React.useEffect(()=>{
    if(!loading){setElapsed(0);return;}
    setElapsed(0);
    const t=setInterval(()=>setElapsed(s=>s+1),1000);
    return()=>clearInterval(t);
  },[loading]);
  if(!loading||elapsed===0)return null;
  return h("span",{style:{fontSize:10,color:"var(--txd)",fontFamily:"'DM Mono',monospace"}},
    `⏱ ${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,"0")} transcurridos`
  );
}

/* Enriquece filas con datos del XML real del DTE (más confiable que extracción de
   texto de PDF): corrige ufPdf/montoTotal cuando hay match por N° de factura.
   Compartida entre "Procesar" y la carga automática desde planilla (sin Procesar),
   para que el Monto+IVA mostrado sea siempre el real, no la estimación UF×1.19. */
async function enriquecerConHistorialXML(filas,clientes,periodo){
  try{
    const _histGrp={};
    for(const c of clientes){
      /* Incluir edificio en la clave: dos sitios pueden compartir el mismo código
         de sitio (ej. dos oficinas "A-2") y no deben pisarse entre sí. */
      const k=(c.rut||"")+"|"+(c.sitio||"")+"|"+(c.edificio||"");
      if(!_histGrp[k])_histGrp[k]={nombre:c.cliente,rut:c.rut||"",sitio:c.sitio||"",ufArr:0,ufSrv:0};
      if(c.tipo==="arriendo")_histGrp[k].ufArr=c.uf;
      else _histGrp[k].ufSrv=c.uf;
    }
    const _histMap={};
    const _normNro=n=>String(n||"").replace(/^F(?:EE)?-0*/i,"F-");
    /* Lotes de a 8 en paralelo — con muchos clientes (ej. tras incluir todas las
       facturas de Nubox) disparar todos los fetch a la vez saturaba /api/historial
       y el navegador (cola de conexiones), dejando "Procesando..." pegado. */
    const _grupos=Object.values(_histGrp);
    const _LOTE=8;
    for(let _i=0;_i<_grupos.length;_i+=_LOTE){
      await Promise.allSettled(_grupos.slice(_i,_i+_LOTE).map(async g=>{
        try{
          const _url=`/api/historial?cliente=${encodeURIComponent(g.nombre)}&rut=${encodeURIComponent(g.rut)}&ufArr=${encodeURIComponent(g.ufArr||"")}&ufSrv=${encodeURIComponent(g.ufSrv||"")}&siteIdx=0&sitio=${encodeURIComponent(g.sitio)}&periodo=${encodeURIComponent(periodo)}`;
          const _r=await fetch(_url);
          if(!_r.ok)return;
          const {facturas}=await _r.json();
          if(!facturas)return;
          for(const t of Object.values(facturas)){
            if(t&&t.nro)_histMap[_normNro(t.nro)]={uf:t.uf,total:t.total};
          }
        }catch(_e){}
      }));
    }
    let enriched=0;
    for(const f of filas){
      if(!f.factura)continue;
      const _h=_histMap[_normNro(f.factura)];
      if(!_h)continue;
      if(_h.uf!=null&&_h.uf>0)f.ufPdf=_h.uf;
      if(_h.total!=null&&_h.total>0)f.montoTotal=_h.total;
      enriched++;
    }
    return enriched;
  }catch(_e){return 0;}
}

  /* No auto-generar — usuario decide cuándo generar */

  const autoProcesado=React.useRef(false);

  const getToken=useCallback(async(forceConsent)=>{if(!forceConsent&&gmailToken)return gmailToken;const token=await getGoogleToken(clientId,forceConsent);setGmailToken(token);return token;},[gmailToken,clientId,setGmailToken]);
  const todosSubidos=files.zip&&zipStatus==="ready"; /* planilla es opcional */

        if(ufRes.ok){
          const ufData=await ufRes.json();

            // pdftext puede guardar "F-14768" aunque sea FEE- → buscar ambas claves
