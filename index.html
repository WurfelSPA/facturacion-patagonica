const DRIVE_PDF_FACTURAS_ID="1Pl7s4FNyjVQOMcEBtgCcvCGD4FlzRg2W"; /* PDF Facturas del mes — actualizar cada mes */
const GOOGLE_SCOPES="https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/drive.file";

/* ═══════════════════════════════════
   CAMBIO 1: CACHÉ UF HISTÓRICA
   Fuente: mindicador.cl API pública
═══════════════════════════════════ */
const ufCache={};

async function getUFDia5(year,month){
  const key=`uf5-${year}-${String(month).padStart(2,"0")}`;
  if(ufCache[key])return ufCache[key];
  try{
    const url=`https://mindicador.cl/api/uf/${String(year)}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const serie=data.serie||[];
    // Buscar exactamente el día 05 del mes
    const dia5=serie.find(e=>{
      const d=new Date(e.fecha);
      return d.getUTCFullYear()===year&&(d.getUTCMonth()+1)===month&&d.getUTCDate()===5;
    });
    if(dia5){ufCache[key]=dia5.valor;return dia5.valor;}
    // Fallback: día más cercano al 05 por debajo
    const delMes=serie.filter(e=>{
      const d=new Date(e.fecha);
      return d.getUTCFullYear()===year&&(d.getUTCMonth()+1)===month&&d.getUTCDate()<=5;
    }).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    if(delMes.length>0){ufCache[key]=delMes[0].valor;return delMes[0].valor;}
    return null;
  }catch(e){console.warn("Error UF día 5",e.message);return null;}
}
async function getUFForMonth(year,month){
  const key=`${year}-${String(month).padStart(2,"0")}`;
  if(ufCache[key])return ufCache[key];
  try{
    // Usamos mindicador.cl — API pública sin auth, retorna UF histórica
    // Pedimos el día 1 del mes siguiente y tomamos el último valor disponible del mes
    const url=`https://mindicador.cl/api/uf/${String(year)}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    // data.serie = [{fecha:"2025-01-01T...", valor:xxxxx}, ...]
    const serie=data.serie||[];
    // Buscar el último valor del mes solicitado
    const entries=serie.filter(e=>{
      const d=new Date(e.fecha);
      return d.getUTCFullYear()===year&&(d.getUTCMonth()+1)===month;
    });
    if(entries.length===0){
      // Fallback: primer valor del mes siguiente
      const next=serie.filter(e=>{
        const d=new Date(e.fecha);
        const nm=month===12?1:month+1;
        const ny=month===12?year+1:year;
        return d.getUTCFullYear()===ny&&(d.getUTCMonth()+1)===nm;
      });
      if(next.length>0){ufCache[key]=next[0].valor;return next[0].valor;}
      return null;
    }
    // Tomar el valor más reciente del mes (último día disponible)
    entries.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    ufCache[key]=entries[0].valor;
    return entries[0].valor;
  }catch(e){
    console.warn("Error obteniendo UF para",key,e.message);
    return null;
  }
}

function formatCLP(pesos){
  if(pesos===null||pesos===undefined||isNaN(pesos))return"—";
  return"$"+Math.round(pesos).toLocaleString("es-CL");
}

function formatCLPCompact(pesos){
  if(pesos===null||pesos===undefined||isNaN(pesos))return"—";
  const n=Math.round(pesos);
  if(n>=1000000)return"$"+(n/1000000).toFixed(1).replace(".",",")+"M";
  if(n>=1000)return"$"+(n/1000).toFixed(0)+"K";
  return"$"+n.toLocaleString("es-CL");
}

/* ── Google OAuth (Gmail + Drive) ── */
function loadGisScript(){return new Promise(res=>{if(window.google?.accounts){res();return;}const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;document.head.appendChild(s);});}
let _gToken=null,_gTokenExp=0;
async function getGoogleToken(clientId){
  await loadGisScript();
  if(_gToken&&Date.now()<_gTokenExp-60000)return _gToken;
  return new Promise((res,rej)=>{
    const client=google.accounts.oauth2.initTokenClient({
      client_id:clientId,scope:GOOGLE_SCOPES,
      hint:"amelendez@patagonica.cl",
      callback:(resp)=>{
        if(resp.error)rej(new Error(resp.error));
        else{_gToken=resp.access_token;_gTokenExp=Date.now()+(resp.expires_in||3600)*1000;res(_gToken);}
      }
    });
    client.requestAccessToken({prompt:""});
  });
}
async function descargarPlanillaDrive(token){
  const url=`https://www.googleapis.com/drive/v3/files/${DRIVE_PLANILLA_ID}?alt=media`;
  const res=await fetch(url,{headers:{Authorization:"Bearer "+token}});
  if(!res.ok){const txt=await res.text();throw new Error(`Drive ${res.status}: ${txt.slice(0,120)}`);}
  const blob=await res.blob();
  return new File([blob],"Planilla Facturación.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function makeEmail(to,cco,from,subject,body,attachBase64,attachName,attachMime){
  attachMime=attachMime||"application/pdf";
  const boundary="PAT_BOUNDARY_"+Date.now();
  const fromHeader=`=?UTF-8?B?${btoa(unescape(encodeURIComponent("Patagónica Inmobiliaria")))}?= <${from}>`;
  let msg;
  const ccLine=cco?`Cc: ${cco}`:"";
  if(attachBase64&&attachName){
    const headers=[`From: ${fromHeader}`,`To: ${to}`];
    if(ccLine)headers.push(ccLine);
    headers.push(`Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,`MIME-Version: 1.0`,`Content-Type: multipart/mixed; boundary="${boundary}"`,``,`--${boundary}`,`Content-Type: text/html; charset=UTF-8`,`Content-Transfer-Encoding: base64`,``,btoa(unescape(encodeURIComponent(body))),``,`--${boundary}`,`Content-Type: ${attachMime}; name="${attachName}"`,`Content-Disposition: attachment; filename="${attachName}"`,`Content-Transfer-Encoding: base64`,``,attachBase64,``,`--${boundary}--`);
    msg=headers.join("\r\n");
  }else{
    const headers=[`From: ${fromHeader}`,`To: ${to}`];
    if(ccLine)headers.push(ccLine);
    headers.push(`Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,`MIME-Version: 1.0`,`Content-Type: text/html; charset=UTF-8`,`Content-Transfer-Encoding: base64`,``,btoa(unescape(encodeURIComponent(body))));
    msg=headers.join("\r\n");
  }
  return btoa(unescape(encodeURIComponent(msg))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

/* ── Extraer comentarios de la planilla para el mes indicado ── */
async function extraerComentariosMes(xlsxFile, periodo){
  const MESES={Enero:0,Febrero:1,Marzo:2,Abril:3,Mayo:4,Junio:5,Julio:6,Agosto:7,Septiembre:8,Octubre:9,Noviembre:10,Diciembre:11};
  const[mesNombre,anio]=periodo.split(" ");
  const targetYear=parseInt(anio),targetMonth=MESES[mesNombre];
  const buf=await readFileAsBuffer(xlsxFile);
  const wb=XLSX.read(buf,{type:"buffer",cellDates:true});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("Hoja 'Flujo' no encontrada en la planilla");
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const headerRow=rows[2]||[];  /* fila 3 de Excel = índice 2 en XLSX.js */
  // Debug: mostrar valores alrededor de la columna 207
  console.log("[planilla] headerRow cols 200-215:", headerRow.slice(200,215).map((v,i)=>`${200+i}:${JSON.stringify(v)}`).join(" | "));
  // Buscar columna de fecha del mes target (robusto: Date UTC, Date local, serial numérico)
  // Excel serial: días desde 1900-01-01; Jun 2026 = ~46000
  function excelSerialToDate(serial){
    const d=new Date(Math.round((serial-25569)*86400*1000));return d;
  }
  let monthCol=-1;
  for(let c=0;c<headerRow.length;c++){
    const v=headerRow[c];
    let match=false;
    if(v instanceof Date){
      match=(v.getUTCFullYear()===targetYear&&v.getUTCMonth()===targetMonth)
        ||(v.getFullYear()===targetYear&&v.getMonth()===targetMonth);
    } else if(typeof v==="number"&&v>40000&&v<60000){
      const d=excelSerialToDate(v);
      match=(d.getUTCFullYear()===targetYear&&d.getUTCMonth()===targetMonth)
        ||(d.getFullYear()===targetYear&&d.getMonth()===targetMonth);
    }
    if(match){monthCol=c;break;}
  }
  if(monthCol===-1)throw new Error(`Columna del mes ${periodo} no encontrada en la planilla`);
  const comentariosCol=monthCol+2; // fecha → GC → Comentarios
  const SITIO_ORDER=["5-A","4-A","A-1","A-2","B","D-2","D-3"];
  const grupos={};
  for(let r=4;r<rows.length;r++){
    const row=rows[r];if(!row)continue;
    const sitio=row[7],edif=row[8],cliente=row[11];
    const comentario=row[comentariosCol];
    if(!sitio||!cliente)continue;
    const comStr=comentario!=null?String(comentario).trim():"";
    if(!comStr)continue;
    if(!grupos[sitio])grupos[sitio]=[];
    grupos[sitio].push({edif:edif?String(edif).trim():"",cliente:String(cliente).trim(),comentario:comStr});
  }
  // Ordenar sitios
  const ordenados={};
  SITIO_ORDER.forEach(s=>{if(grupos[s])ordenados[s]=grupos[s];});
  Object.keys(grupos).forEach(s=>{if(!ordenados[s])ordenados[s]=grupos[s];});
  return ordenados;
}

async function parsePlanillaParaDashboard(file){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla");
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  const row3=raw[2]||[];
  const MES_L=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  function serialToYM(serial){
    const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(serial)*86400000);
    return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1};
  }
  const monthCols=[];
  for(let ci=64;ci<Math.min(row3.length,220);ci++){
    const v=row3[ci];
    if(typeof v==="number"&&v>40000&&v<50000){
      const{y,m}=serialToYM(v);
      if(y>=2024&&y<=2026){
        monthCols.push({key:`${y}-${String(m).padStart(2,"0")}`,label:`${MES_L[m-1]} ${y}`,col:ci,year:y,month:m});
      }
    }
  }
  const SKIP=/^(Total|VACANTE|Vacante|Area|Arrendado|En negociación|Para confirmar|#|\d+$)/;
  const clients=[];
  for(let ri=4;ri<raw.length;ri++){
    const row=raw[ri];
    if(!row)continue;
    const rut=row[9];
    const nombre=row[11]||row[10]; /* Col L o K según la fila */
    if(!rut||!nombre||typeof rut!=="string")continue;
    if(!rut.match(/\d+\.\d+/))continue;
    const name=String(nombre).trim();
    if(SKIP.test(name)||name.includes("Total")||name.startsWith("#")||name==="")continue;
    const ufArr=typeof row[47]==="number"?row[47]:0;
    const pctAdm=row[51];
    let ufSrv=0;
    if(typeof pctAdm==="number"&&pctAdm>0&&pctAdm<1) ufSrv=ufArr*pctAdm;
    else if(typeof pctAdm==="number"&&pctAdm>=1&&pctAdm<=10) ufSrv=pctAdm;
    const monthly={};
    for(const mc of monthCols){
      const v=row[mc.col];
      if(typeof v==="number"&&v>0&&v<15000) monthly[mc.key]=Math.round(v*100)/100;
    }
    /* Conversión serial Excel → fecha legible */
    function serialToDate(v){if(!v||typeof v!=="number")return"";try{const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(v)*86400000);return`${d.getUTCDate().toString().padStart(2,"0")}/${(d.getUTCMonth()+1).toString().padStart(2,"0")}/${d.getUTCFullYear()}`;}catch(e){return"";}}
    clients.push({
      ri,nombre:name,rut:String(rut).trim(),
      arrendadora:String(row[5]||"").trim(),
      sitio:String(row[7]||"").replace(/\s+/g," ").trim(),
      edificio:String(row[8]||"").trim(),
      email:String(row[12]||"").trim(),
      termContrato:serialToDate(row[14]),   /* Col O: Fecha Inicio Contrato */
      termTermino:serialToDate(row[15]),    /* Col P: Fecha Término Contrato */
      renovacion:row[16]!=null?String(row[16]).trim():"",  /* Col Q: Antelación renovación */
      aviso:row[17]!=null?String(row[17]).trim():"",        /* Col R: Aviso */
      fechaReajuste:serialToDate(row[52]),  /* Col BA: Fecha Reajuste */
      pctReaj:row[53]!=null?String(row[53]):"",            /* Col BB: % Reajuste */
      cadaAnios:row[54]!=null?String(row[54]).trim():"",   /* Col BC: Cada cuántos años */
      m2:row[26]!=null&&row[26]!==""?Number(row[26]):null,  /* Col AA: Metros cuadrados */
      hist:(()=>{
        /* BN=65, cada mes ocupa 4 cols: UF planilla, Facturado, Diferencia, Comentarios */
        /* Desde Abr-2023 hasta el presente */
        const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
        const result=[];
        let col=65,mes=3,anio=2023;
        while(!(anio===2027||(anio===2026&&mes>11))){
          const uf=row[col],fact=row[col+1],dif=row[col+2];
          result.push({
            key:`${anio}-${String(mes+1).padStart(2,"0")}`,
            label:`${MESES[mes]}`,
            anio,mes,
            uf:typeof uf==="number"?Math.round(uf*100)/100:null,
            fact:typeof fact==="number"?Math.round(fact*100)/100:null,
            dif:typeof dif==="number"?Math.round(dif*100)/100:null,
          });
          col+=4; mes++; if(mes>11){mes=0;anio++;}
        }
        return result;
      })(),
      ufArr:Math.round(ufArr*100)/100,
      ufSrv:Math.round(ufSrv*100)/100,
      ufTotal:Math.round((ufArr+ufSrv)*100)/100,
      afecto:String(row[48]||"").trim(),
      ufInicio:typeof row[61]==="number"?Math.round(row[61]*100)/100:0,
      monthly,
    });
  }
  const siteMap={};
  for(const c of clients){
    const s=(c.sitio||"Otro").trim();
    if(!siteMap[s])siteMap[s]={count:0,ufArr:0,ufSrv:0,arrendadora:c.arrendadora||""};
    siteMap[s].count++;
    siteMap[s].ufArr=Math.round((siteMap[s].ufArr+c.ufArr)*100)/100;
    siteMap[s].ufSrv=Math.round((siteMap[s].ufSrv+c.ufSrv)*100)/100;
    if(!siteMap[s].arrendadora&&c.arrendadora)siteMap[s].arrendadora=c.arrendadora;
  }
  const monthTotals={};
  for(const mc of monthCols){
    let totalArr=0;
    for(const c of clients){const v=c.monthly[mc.key];if(v)totalArr+=v;}
    const totalSrv=clients.reduce((s,c)=>s+c.ufSrv,0);
    monthTotals[mc.key]={
      label:mc.label,
      arr:Math.round(totalArr*100)/100,
      srv:Math.round(totalSrv*100)/100,
      total:Math.round((totalArr+totalSrv)*100)/100,
      year:mc.year,
      month:mc.month,
    };
  }
  return{clients,siteMap,monthTotals,monthCols};
}

async function procesarPlanillaFacturacion(file,periodo){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla de facturación");
  /* raw:true para obtener seriales Excel en números; lo usamos para detectar la columna */
  const dataRaw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const mesNum=MES_NUM[periodo.split(" ")[0]];
  const anio=parseInt(periodo.split(" ")[1]);
  let colGS=-1,colGT=-1;

  function esTargetMes(val){
    if(val===null||val===undefined)return false;
    if(typeof val==="number"&&val>40000&&val<60000){
      const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(val)*86400000);
      return d.getUTCFullYear()===anio&&(d.getUTCMonth()+1)===mesNum;
    }
    if(typeof val==="string"){try{const d=new Date(val);if(!isNaN(d))return d.getFullYear()===anio&&(d.getMonth()+1)===mesNum;}catch(e){}}
    return false;
  }

  /* Fechas en fila 3 (índice 2) */
  const fila3=dataRaw[2]||[];
  for(let i=64;i<fila3.length;i++){
    if(esTargetMes(fila3[i])){colGS=i;colGT=i+1;break;}
  }
  if(colGS===-1)throw new Error(`No se encontró columna para ${periodo}. Verifica que la planilla tenga ese mes.`);

  const excl=["","VACANTE","Nombre Cliente","Areas Comunes Edificio","Areas comunes Edificio (Subterraneos)","Area Comun"];
  const clientes=[];
  for(let i=4;i<dataRaw.length;i++){
    const row=dataRaw[i];if(!row)continue;
    const sitio=row[7];
    const cliente=row[11];
    const ufGS=row[colGS];
    const ufGT=row[colGT];
    if(!cliente||excl.includes(String(cliente).trim()))continue;
    const sName=String(cliente).trim();
    const sito=sitio?String(sitio).trim():"";
    const edif=row[8]?String(row[8]).trim():""; /* Col I: nro local / bodega / edif */
    const emailBilling=row[12]?String(row[12]).trim():"";
    const rutBilling=row[9]?String(row[9]).replace(/\./g,"").trim().toLowerCase():""; /* Col J: RUT normalizado */
    const yaEnviado=row[210]&&String(row[210]).trim().toLowerCase()==="enviado"; /* Col HC: Correo Enviado */
    const sheetRow=i+1; /* fila 1-indexed en el Sheets (dataRaw[i] = fila i+1) */
    if(typeof ufGS==="number"&&ufGS>0)clientes.push({sitio:sito,edificio:edif,cliente:sName,tipo:"arriendo",uf:Math.round(ufGS*10000)/10000,email:emailBilling,rut:rutBilling,yaEnviado,sheetRow});
    if(typeof ufGT==="number"&&ufGT>0&&ufGT<=999999)clientes.push({sitio:sito,edificio:edif,cliente:sName,tipo:"serv_adm",uf:Math.round(ufGT*10000)/10000,email:emailBilling,rut:rutBilling,yaEnviado,sheetRow});
  }
  return clientes;
}
async function extraerTextoPDF(arrayBuffer){
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    let texto="";
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      texto+=content.items.map(it=>it.str).join(" ")+"\n";
    }
    return texto;
  }catch(e){console.warn("pdfjs error:",e.message);return"";}
}

async function procesarPDFs(zipFile,addLog){
  const buf=await readFileAsBuffer(zipFile);
  const zip=await JSZip.loadAsync(buf);
  const pdfs=[];
  const archivos=Object.keys(zip.files).filter(f=>f.toLowerCase().endsWith(".pdf"));
  addLog(`▶ ${archivos.length} PDFs encontrados en el ZIP`,"info");

  for(const path of archivos){
    const parts=path.split("/");
    const carpeta=parts.length>1?parts[parts.length-2]:"";
    const nombre=parts[parts.length-1];
    const sitio=SITIO_MAP[carpeta]||carpeta;

    /* Número y nombre desde archivo: "F-14540 Ingersoll Rand.pdf" */
    const nroMatch=nombre.match(/^(F(?:EE)?-\d+)\s*(.+)?\.pdf$/i);
    if(!nroMatch)continue;
    const nroFact=nroMatch[1].toUpperCase();
    const nombreEnArchivo=(nroMatch[2]||"").trim().toLowerCase();
      const pdfBuf=await zip.files[path].async("arraybuffer");
      const texto=await extraerTextoPDF(pdfBuf);
      const textoJ=texto.replace(/\s+/g," ");
      const tipo=textoJ.includes("Serv. Adm.")||textoJ.includes("Serv.Adm.")?"serv_adm":textoJ.includes("Arriendo")?"arriendo":nroFact.startsWith("FEE-")?"serv_adm":"arriendo";

    /* Extraer UF del texto del PDF — 3 patrones + fallback flat */
    let ufPdf=null;
    try{
      if(texto.length>10){
        const flat0=texto.replace(/\s+/g," ");
        /* P1: Cant/Unidad "11,84 UF 40.695" — decimal obligatorio antes de UF (evita capturar nº de edificio) */
        let m=flat0.match(/([\d]+[,.][\d]+)\s*UF\s*\d{2}[,.\d]/);
        if(m) ufPdf=parseFloat(m[1].replace(",","."));
        /* P2: descripción "UF 85,37 x 40186" — número DESPUÉS de UF (Arriendo) */
        if(!ufPdf){m=flat0.match(/UF\s*([\d]+(?:[,.][\d]+)?)\s*x\s*\d{2}/);if(m) ufPdf=parseFloat(m[1].replace(",","."));}
        /* P3: fallback — "UF X,XX x " o "(X,XX) x NN" */
        if(!ufPdf){
          m=flat0.match(/UF\s*([\d]+(?:[,.][\d]+)?)\s*x\s/);if(m) ufPdf=parseFloat(m[1].replace(",","."));
          if(!ufPdf){m=flat0.match(/([\d]+[,.][\d]+)\s*x\s*\d{2}/);if(m) ufPdf=parseFloat(m[1].replace(",","."));}
        }
        /* P4: precio CLP fijo "1 UNID 317.000" — Serv. Adm. sin UF */
        if(!ufPdf){
          m=flat0.match(/1\s*UNID\s+([\d]+(?:\.[\d]{3})+(?:,[\d]+)?)/i)
            ||flat0.match(/1\s*UNID\s+([\d]{4,})/i);
          if(m){const raw=m[1].replace(/\./g,"").replace(",",".");ufPdf=parseFloat(raw)||null;}
        }
        if(ufPdf) ufPdf=Math.round(ufPdf*10000)/10000;
      }
    }catch(e){}

    /* Extraer IVA y Monto Total del PDF */
    let montoTotal=null,ivaAmount=null;
    try{
      if(texto.length>10){
        const flat=texto.replace(/\s+/g," ");
        console.log(`[pdf-texto] ${nroFact}: "${flat.slice(0,400)}"`);
        // P1: "Monto Total 4.995.800"
        let mt=flat.match(/Monto\s*Total\s*([\d]+(?:\.\d{3})+)/i);
        if(mt) montoTotal=parseInt(mt[1].replace(/\./g,""),10)||null;
        // P2: IVA para calcular total = subtotal + IVA
        if(!montoTotal){
          const im=flat.match(/IVA\s+([\d]+(?:\.\d{3})+)/i)
            ||flat.match(/19%\s*IVA\s*([\d]+(?:\.\d{3})+)/i);
          if(im) ivaAmount=parseInt(im[1].replace(/\./g,""),10)||null;
          console.log(`[monto] ${nroFact}: Monto Total no encontrado, IVA=${ivaAmount}`);
        } else {
          console.log(`[monto] ${nroFact}: Monto Total directo = $${montoTotal}`);
        }
      }
    }catch(e){console.warn("[monto] error:",e.message);}

    pdfs.push({sitio,nroFact,tipo,ufPdf,montoTotal,ivaAmount,nombreEnArchivo,zipPath:path,pdfNombre:nombre});
  }

  const conUF=pdfs.filter(p=>p.ufPdf!==null).length;
  addLog(`✓ ${pdfs.length} PDFs: ${conUF} con UF, ${pdfs.length-conUF} sin UF`,"ok");
  addLog(`  Sitios: ${[...new Set(pdfs.map(p=>p.sitio))].join(", ")}`,"info");
  pdfs.slice(0,2).forEach(p=>addLog(`  ${p.nroFact} ${p.sitio} ${p.tipo} UF=${p.ufPdf} "${p.nombreEnArchivo}"`,"info"));
  return pdfs;
}
async function getPdfBase64FromZip(zipFile,zipPath){
  const buf=await readFileAsBuffer(zipFile);
  const zip=await JSZip.loadAsync(buf);
  const pdfBuf=await zip.files[zipPath].async("uint8array");
  let binary="";const chunkSize=8192;
  for(let i=0;i<pdfBuf.length;i+=chunkSize)binary+=String.fromCharCode(...pdfBuf.slice(i,i+chunkSize));
  return btoa(binary);
}

/* ═══════════════════════════════════
   DETALLE VENTAS — Cruce Odoo vs SII
   via /api/cruce (automático)
═══════════════════════════════════ */
function VentasView({periodo}){
  const [empresas, setEmpresas] = React.useState([
    {id:"multi", nombre:"Distribuidora Sánchez 4G", rut:"77.538.786-6", result:null, loading:false, error:null},
    {id:"dko",   nombre:"Sánchez Hermanos",         rut:"77.454.587-5", result:null, loading:false, error:null},
  ]);
  const [activeEmp, setActiveEmp] = React.useState("multi");
  const fmtCLP = v => "$"+Math.round(v).toLocaleString("es-CL");

  const getMes = (p) => {
    const MN={"Enero":"01","Febrero":"02","Marzo":"03","Abril":"04","Mayo":"05","Junio":"06","Julio":"07","Agosto":"08","Septiembre":"09","Octubre":"10","Noviembre":"11","Diciembre":"12"};
    const [nom,anio] = (p||periodo).split(" ");
    return `${anio}-${MN[nom]||"05"}`;
  };

  // mes se pasa como argumento — sin closures sobre periodo
  const cargarEmpresa = React.useCallback(async (empId, mes) => {
    setEmpresas(prev => prev.map(e => e.id===empId ? {...e, loading:true, error:null} : e));
    try {
      const res = await fetch(`/api/cruce?empresa=${empId}&mes=${mes}`);
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "Error al cruzar");
      setEmpresas(prev => prev.map(e => e.id===empId ? {...e, loading:false, error:null, result:data} : e));
    } catch(err) {
      setEmpresas(prev => prev.map(e => e.id===empId ? {...e, loading:false, error:err.message} : e));
    }
  }, []);

  React.useEffect(() => {
    if (!periodo || !periodo.includes(" ")) return;
    const mes = getMes(periodo);
    setEmpresas(p => p.map(e => ({...e, result:null, error:null})));
    cargarEmpresa("multi", mes);
    cargarEmpresa("dko", mes);
  }, [periodo]);

  const emp = empresas.find(e => e.id===activeEmp);
  const r   = emp?.result;
  // allLoaded = true cuando todas las empresas terminaron (resultado o error)
  const allLoaded = empresas.every(e => !e.loading);

  const totalCoinciden = empresas.reduce((s,e) => s+(e.result?.coinciden||0), 0);
  const totalFacturas  = empresas.reduce((s,e) => s+(e.result?.odoo_count||0), 0);
  const totalNeto      = empresas.reduce((s,e) => s+(e.result?.total_odoo_neto ?? e.result?.total_odoo ?? 0), 0);
  const totalAlertas   = empresas.reduce((s,e) => s+(e.result?.solo_odoo?.length||0)+(e.result?.diff_monto?.length||0), 0);
  const pct = r ? Math.round(r.coinciden / Math.max(r.odoo_count,1) * 100) : 0;

  return h("main",{style:{flex:1,overflowY:"auto",padding:"20px 24px",display:"flex",flexDirection:"column",gap:18},className:"fade-up"},

    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}},
      h("div",null,
        h("div",{style:{fontSize:13,color:"var(--txm)"}},"Cruce automático Odoo vs SII · Facturas tipo 33 · "+periodo)
      ),
      h("button",{
        onClick:()=>{const mes=getMes(periodo); setEmpresas(p=>p.map(e=>({...e,result:null,error:null}))); cargarEmpresa("multi",mes); cargarEmpresa("dko",mes);},
        style:{fontSize:11,padding:"5px 14px",borderRadius:8,border:"1px solid var(--bdr)",background:"var(--surf2)",color:"var(--txm)",cursor:"pointer",display:"flex",alignItems:"center",gap:5}
      },"↻ Actualizar")
    ),

    /* KPIs */
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}},
      [
        {lbl:"Facturas Odoo",    val:allLoaded?totalFacturas:"—",  sub:"ambas empresas",           col:"var(--accl)"},
        {lbl:"Coinciden SII",    val:allLoaded?totalCoinciden:"—", sub:"Odoo = SII monto exacto",  col:"var(--green)"},
        {lbl:"Alertas",          val:allLoaded?totalAlertas:"—",   sub:totalAlertas===0?"✓ Sin diferencias":"requieren revisión", col:totalAlertas>0?"var(--red)":"var(--green)"},
        {lbl:"Total Neto",       val:allLoaded?fmtCLP(totalNeto):"—", sub:"facturas − NC · ambas empresas", col:"var(--blue)", mono:true},
      ].map((k,i) => h("div",{key:i,className:"dash-card",style:{borderLeft:"3px solid "+k.col}},
        h("div",{className:"dash-card-lbl"},k.lbl),
        h("div",{style:{fontSize:k.mono?15:28,fontWeight:700,fontFamily:"'DM Mono',monospace",color:k.col,lineHeight:1,marginTop:2,letterSpacing:"-1px"}},
          !allLoaded ? h("span",{className:"spin",style:{fontSize:16}},"⟳") : k.val
        ),
        h("div",{className:"dash-card-sub"},k.sub)
      ))
    ),

    /* Selector empresa */
    h("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
      empresas.map(e => {
        const isActive = activeEmp===e.id;
        const hasAlert = (e.result?.solo_odoo?.length||0)+(e.result?.diff_monto?.length||0) > 0;
        return h("button",{key:e.id, onClick:()=>{ setActiveEmp(e.id); if(!e.result&&!e.loading&&!e.error) cargarEmpresa(e.id); },
          style:{padding:"12px 20px",borderRadius:10,border:"2px solid "+(isActive?"var(--acc)":"var(--bdr)"),
            background:isActive?"linear-gradient(135deg,var(--acc),var(--acc2))":"var(--surf)",
            color:isActive?"#fff":"var(--tx)",cursor:"pointer",transition:"all .15s",
            display:"flex",flexDirection:"column",alignItems:"flex-start",gap:4,minWidth:220,textAlign:"left"}},
          h("div",{style:{fontWeight:700,fontSize:13,display:"flex",alignItems:"center",gap:6}},
            e.nombre,
            e.loading && h("span",{className:"spin",style:{fontSize:12}},"⟳"),
            hasAlert && h("span",{style:{background:"#e53935",color:"#fff",borderRadius:10,fontSize:9,padding:"1px 7px",fontWeight:700}},

            e.error  ? "⚠ "+e.error.slice(0,40) :

        emp.loading && h("div",{style:{color:"var(--txm)",fontSize:12,display:"flex",alignItems:"center",gap:6}},

        emp.error && !emp.loading && h("div",{style:{background:"var(--rbg)",border:"1px solid var(--rdim)",borderRadius:8,padding:"10px",fontSize:11,color:"var(--red)",marginBottom:8}},

        ),

        r && h("div",null,

function formatRUT(rut){
  if(!rut)return"";
  const clean=rut.replace(/\./g,"").toUpperCase();
  const dash=clean.indexOf("-");
  if(dash<0)return rut;
  const cuerpo=clean.slice(0,dash),dv=clean.slice(dash);
  let result="";
  for(let i=0;i<cuerpo.length;i++){if(i>0&&(cuerpo.length-i)%3===0)result+=".";result+=cuerpo[i];}
  return result+dv;
}
function getEstado(r){
  if(!r.factura)return"missing";
  // Facturas grandes (>500 UF): solo verificar que tengan PDF asignado
  if(r.ufPlan>5000)return r.factura?"ok":"missing";
  // Facturas CLP fijo (ufPdf===null): si hay factura asignada es ok
  if(r.ufPdf===null||r.ufPdf===undefined)return r.factura?"ok":"missing";
  // Match por fallback de único candidato — marcar como "diff" para revisión
  if(r.matchScore===1)return"diff";
  // Comparar UF: PDF vs Planilla, y Planilla vs SII
  const diffPdf=Math.abs(r.ufPdf-r.ufPlan)>0.5;
  const diffSII=r.ufSII!=null&&Math.abs(r.ufPlan-r.ufSII)>0.5;
  if(diffPdf||diffSII)return"diff";
  return"ok";
}

  function wp(text,opts){

          h("span",{className:"sidebar-item-label"},unlocked?`Enviar todos (${pendFact})`:"Enviar todos")
        ),
        h("button",{className:"sidebar-item",onClick:unlocked?()=>setUnlocked(false):()=>setShowPwdModal(true),style:{color:unlocked?"var(--green)":"var(--txm)"}},
          h("span",{className:"sidebar-item-icon"},unlocked?"🔓":"🔒"),
          h("span",{className:"sidebar-item-label"},unlocked?"Bloquear":"Desbloquear envíos")
        )
      )
    ),
    h("div",{className:"sidebar-footer"},h("div",{className:"sidebar-footer-dot"}),h("span",null,VER))
  );
}

function App(){
  /* Config viene 100% de env vars Vercel — no hay setup manual */
  const apiKey=PRESET_KEY;
  const clientId=PRESET_GID;
  const [gmailToken,setGmailToken]=useState(null);
  const [nuboxCookies,setNuboxCookies]=useState(()=>{ try{ return localStorage.getItem('nuboxCookies')||''; }catch(e){ return ''; } });
  const [showNuboxSession,setShowNuboxSession]=useState(false);
  const saveNuboxCookies=(v)=>{ setNuboxCookies(v); try{ localStorage.setItem('nuboxCookies',v); }catch(e){} };
  const [view,setView]=useState("dashboard");
  const [periodo,setPeriodo]=useState(()=>{const now=new Date();return`${MESES_NOMBRES[now.getMonth()]} ${now.getFullYear()}`;});
  const [files,setFiles]=useState({planilla:null,zip:null});
  const [planillaStatus,setPlanillaStatus]=useState("idle"); /* idle | checking | ok | nodata | error */
  const [planillaError,setPlanillaError]=useState(null);
  const [data,setData]=useState([]);
  const [pdfMap,setPdfMap]=useState({});

  const [concFilter,setConcFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [searchFactura,setSearchFactura]=useState("");
  const [sentSet,setSentSet]=useState(new Set());
  const [sentKeys,setSentKeys]=useState(()=>{try{return new Set(JSON.parse(localStorage.getItem("pat_sent")||"[]"));}catch{return new Set();}});
  const marcarEnviado=useCallback((idx,key)=>{setSentSet(p=>new Set([...p,idx]));setSentKeys(p=>{const s=new Set([...p,key]);localStorage.setItem("pat_sent",JSON.stringify([...s]));return s;});},[]);
  const [sendingIdx,setSendingIdx]=useState(null);
  const [showProc,setShowProc]=useState(false);
  const [procLogs,setProcLogs]=useState([]);
  const [procProgress,setProcProgress]=useState(0);
  const [procDone,setProcDone]=useState(false);
  const [preview,setPreview]=useState(null);
  const [histClient,setHistClient]=useState(null);
  const [splitLoading,setSplitLoading]=useState(false);
  const [splitResult,setSplitResult]=useState(null);
  const [ufSII,setUfSII]=useState(null);
  const [histAnio,setHistAnio]=useState(2026);
  const [unlocked,setUnlocked]=useState(false);
  const [showPwdModal,setShowPwdModal]=useState(false);
  const [pwdInput,setPwdInput]=useState("");
  const [pwdError,setPwdError]=useState(false);
  const [notif,setNotif]=useState(null);

  /* ── DASHBOARD STATE ── */
  const [dashData,setDashData]=useState(null);
  const [dashLoading,setDashLoading]=useState(false);
  const [dashSearch,setDashSearch]=useState("");
  const [dashSitio,setDashSitio]=useState("all");
  const [dashMes,setDashMes]=useState("current"); /* "current" = UF actual, o "YYYY-MM" */

  /* CAMBIO 1: estado para UF y conversión a CLP */
  const [ufActual,setUfActual]=useState(null);
  const [ufLoading,setUfLoading]=useState(false);
  const [monthlyUF,setMonthlyUF]=useState({});
  const [driveLoading,setDriveLoading]=useState(false);

  /* Validar que la planilla tenga datos para el período seleccionado */
  useEffect(()=>{
    if(!files.planilla||!periodo){setPlanillaStatus("idle");return;}
    setPlanillaStatus("checking");
    setPlanillaError(null);
    procesarPlanillaFacturacion(files.planilla,periodo)
      .then(()=>setPlanillaStatus("ok"))
      .catch(e=>{
        if(e.message&&e.message.includes("No se encontró columna")){
          setPlanillaStatus("nodata");
          setPlanillaError("Sin datos para "+periodo);
        } else {
          setPlanillaStatus("error");
          setPlanillaError(e.message);
        }
      });
  },[files.planilla,periodo]);

  /* Cargar planilla automáticamente desde /api/planilla (Service Account — sin OAuth) */
  useEffect(()=>{
    if(files.planilla)return;
    setDriveLoading(true);
    fetch("/api/planilla")
      .then(r=>{
        if(!r.ok)return r.json().then(e=>{throw new Error(e.error||"Error "+r.status);});
        return r.blob();
      })
      .then(blob=>{
        const f=new File([blob],"Planilla Facturación.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        setFiles(p=>({...p,planilla:f}));
        setDriveLoading(false);
      })
      .catch(e=>{
        console.error("Planilla error:",e);
        setDriveLoading(false);
        notify("No se pudo cargar la planilla: "+e.message,"err");
      });
  },[]);

  const notify=(msg,t="ok")=>{setNotif({msg,t});setTimeout(()=>setNotif(null),4000);};
  const addLog=(txt,t="")=>setProcLogs(p=>[...p,{txt,t}]);

  /* Cargar ZIP desde Drive cuando cambia período y estamos en vista facturación */
  const [zipStatus,setZipStatus]=useState("idle");
  const [zipError,setZipError]=useState(null);
  const [pdfMaestroId,setPdfMaestroId]=useState(null); /* ID del PDF maestro en Drive si existe */
  const [canGenerate,setCanGenerate]=useState(false);  /* si se puede generar el ZIP */
  const zipPeriodoRef=React.useRef(""); /* período del ZIP actualmente cargado */

  /* Buscar ZIP cuando se selecciona un período */
  const buscarZip=React.useCallback((p)=>{
    if(!p)return;
    zipPeriodoRef.current=p;
    setZipStatus("loading");
    setZipError(null);
    setPdfMaestroId(null);
    setCanGenerate(false);
    setFiles(prev=>({...prev,zip:null}));
    fetch("/api/zip?periodo="+encodeURIComponent(p))
      .then(async r=>{
        if(zipPeriodoRef.current!==p)return;
        if(r.status===404){
          const data=await r.json();
          /* El servidor informa si hay PDF maestro disponible */
          setPdfMaestroId(data.pdfMaestroId||null);
          setCanGenerate(!!data.canGenerate);
          setZipStatus("missing");
          return;
        }
        if(!r.ok){const e=await r.json();throw new Error(e.error||"Error "+r.status);}
        const blob=await r.blob();
        if(zipPeriodoRef.current!==p)return;
        const f=new File([blob],p.replace(" ","-")+".zip",{type:"application/zip"});
        setFiles(prev=>({...prev,zip:f}));
        setZipStatus("ready");
      })
      .catch(e=>{
        if(zipPeriodoRef.current!==p)return;
        setZipStatus("error");setZipError(e.message);
      });
  },[]);

  const cargarZipDrive=React.useCallback(()=>buscarZip(periodo),[periodo,buscarZip]);

  /* Generar ZIP desde PDF maestro del mes */
  const generarZip=React.useCallback(async()=>{
    if(!periodo||!pdfMaestroId)return;
    setZipStatus("splitting");setZipError(null);
    const [mesNombre,anio]=periodo.split(" ");
    const mesNum=String(MES_NUM[mesNombre]||0).padStart(2,"0");
    const periodoCode=anio+"-"+mesNum;
    try{
      /* 1. Servidor separa el PDF y sube ZIP directo a Drive */
      const uTok=await getToken();
      const res=await fetch("/api/split-pdf",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({pdfFileId:pdfMaestroId,periodo:periodoCode,destFolderId:DRIVE_FACTURACION_FOLDER_ID,userToken:uTok}),
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||"Error desconocido");
      notify("✓ "+data.totalFacturas+" facturas generadas y subidas a Drive","ok");
      /* 2. Recargar ZIP desde Drive */
      buscarZip(periodo);
    }catch(e){
      setZipStatus("error");setZipError(e.message);
      notify("Error al separar PDF: "+e.message,"err");
    }
  },[periodo,pdfMaestroId]);

  /* No auto-generar — usuario decide cuándo generar */

  /* Refs de control de flujo automático */
  const autoProcesado=React.useRef(false);
  const autoNuboxRef=React.useRef(false);
  const periodoActivado=React.useRef(false);  /* true solo cuando el usuario elige período */
  useEffect(()=>{
    autoProcesado.current=false;
    autoNuboxRef.current=false;
    /* No reseteamos periodoActivado aquí — se resetea solo al cambiar período desde el selector */
  },[periodo]);
  /* Resetear periodoActivado al salir de facturación para evitar auto-ejecución al volver */
  useEffect(()=>{
    if(view!=="upload"&&view!=="table"){
      periodoActivado.current=false;
      autoProcesado.current=false;
      autoNuboxRef.current=false;
    }
  },[view]);

  /* Auto-procesar cuando planilla OK + ZIP listo — solo si el usuario activó el período */
  useEffect(()=>{
    if(periodoActivado.current&&planillaStatus==="ok"&&zipStatus==="ready"&&!autoProcesado.current&&data.length===0){
      autoProcesado.current=true;
      procesar();
    }
  },[planillaStatus,zipStatus]);

  /* Auto-descargar desde Nubox cuando no hay PDF — solo si el usuario activó el período */
  useEffect(()=>{
    if(periodoActivado.current&&planillaStatus==="ok"&&zipStatus==="missing"&&!canGenerate&&!splitLoading&&!autoNuboxRef.current){
      autoNuboxRef.current=true;
      splitPDF();
    }
  },[planillaStatus,zipStatus,canGenerate]);

  /* Cargar UF del mes actual al inicio */
  useEffect(()=>{
    const now=new Date();
    setUfLoading(true);
    getUFForMonth(now.getFullYear(),now.getMonth()+1).then(v=>{
      setUfActual(v);
      setUfLoading(false);
    }).catch(()=>setUfLoading(false));
  },[]);

  /* Cargar UF SII (día 05 del mes) cuando cambia el período */
  useEffect(()=>{
    const parts=periodo.split(" ");
    const MES_NUM={"Enero":1,"Febrero":2,"Marzo":3,"Abril":4,"Mayo":5,"Junio":6,"Julio":7,"Agosto":8,"Septiembre":9,"Octubre":10,"Noviembre":11,"Diciembre":12};
    const mes=MES_NUM[parts[0]],anio=parseInt(parts[1]);
    if(!mes||!anio)return;
    getUFDia5(anio,mes).then(v=>setUfSII(v?Math.round(v*100)/100:null));
  },[periodo]);

  /* Cargar UF históricas cuando dashData está disponible */
  useEffect(()=>{
    if(!dashData)return;
    const months=Object.values(dashData.monthTotals).filter(m=>m.arr>0);
    if(months.length===0)return;
    Promise.all(
      months.map(m=>
        getUFForMonth(m.year,m.month).then(v=>({key:`${m.year}-${String(m.month).padStart(2,"0")}`,uf:v}))
      )
    ).then(results=>{
      const map={};
      results.forEach(({key,uf})=>{if(uf)map[key]=uf;});
      setMonthlyUF(map);
    });
  },[dashData]);

  /* Auto-parsear planilla para dashboard */
  useEffect(()=>{
    if(!files.planilla)return;
    setDashLoading(true);
    setDashData(null);
    parsePlanillaParaDashboard(files.planilla)
      .then(d=>{setDashData(d);setDashLoading(false);})
      .catch(e=>{console.error(e);setDashLoading(false);notify("Error leyendo planilla: "+e.message,"err");});
  },[files.planilla]);

  const getToken=useCallback(async()=>{if(gmailToken)return gmailToken;const token=await getGoogleToken(clientId);setGmailToken(token);return token;},[gmailToken,clientId]);
  const todosSubidos=files.zip&&zipStatus==="ready"; /* planilla es opcional */

  /* ── PROCESAR ── */
  const procesar=useCallback(async()=>{
    if(!files.zip)return;
    setShowProc(true);setProcDone(false);setProcLogs([]);setProcProgress(5);
    try{
      /* ── PASO 1: PLANILLA (opcional — puede no tener datos del mes) ── */
      let clientes=[];
      let planillaOk=false;
      if(files.planilla){
        addLog("▶ Leyendo planilla de facturación...","info");
        try{
          clientes=await procesarPlanillaFacturacion(files.planilla,periodo);
          addLog(`✓ ${clientes.length} filas detectadas para ${periodo}`,"ok");
          planillaOk=true;
        }catch(e){
          addLog(`⚠ Planilla: ${e.message}`,"warn");
          addLog("  Continuando solo con PDFs — cruce de datos no disponible","warn");
        }
      }else{
        addLog("⚠ Sin planilla — procesando solo PDFs","warn");
      }
      setProcProgress(25);

      /* ── PASO 2: PDFs (siempre) ── */
      addLog("▶ Procesando PDFs del ZIP...","info");
      const pdfs=await procesarPDFs(files.zip,addLog);setProcProgress(65);
      /* Obtener montos UF del servidor (extracción server-side) */
      addLog("▶ Extrayendo montos UF de PDFs...","info");
      try{
        const ufRes=await fetch(`/api/pdftext?periodo=${encodeURIComponent(periodo)}`);
        if(ufRes.ok){
          const ufData=await ufRes.json();
          let conUF=0,conRUT=0;
          for(const p of pdfs){
            if(ufData.pdfs&&ufData.pdfs[p.nroFact]){
              const d=ufData.pdfs[p.nroFact];
              if(d.uf!==null&&d.uf!==undefined) p.ufPdf=d.uf;  /* no sobreescribir si servidor devuelve null */
              if(d.rut) p.rutPdf=d.rut;
              p.montoTotal=d.montoTotal||p.montoTotal||null;
              if(p.ufPdf!==null)conUF++;
              if(p.rutPdf)conRUT++;
            }
          }
          addLog(`✓ Datos extraídos: ${conRUT} RUTs, ${conUF} montos UF de ${pdfs.length} PDFs`,"ok");
        }else{
          addLog("⚠ No se pudieron extraer datos del servidor","warn");
        }
      }catch(e){addLog("⚠ Error extrayendo datos: "+e.message,"warn");}
      setProcProgress(75);
      addLog("▶ Cruzando datos planilla vs PDFs...","info");
      const pdfUsado=new Set();
      const MANUAL={"A-2|Banco Estado Express|202.6|arriendo":"FEE-39","A-2|Banco del Estado de Chile|256.7|arriendo":"FEE-39"};
      const filas=[];

      /* CRUCE: scoring RUT + UF
       * Scoring:
       *   RUT exacto                         → +200 pts  (identificador inequívoco)
       *   UF exacta   (diff < 0.01)          → +50  pts
       *   UF próxima  (diff < 0.5)           → +20  pts
       *   UF muy próxima (diff < 2, sin RUT) → +5   pts  (tiebreak leve)
       *
       * Reglas:
       *   - Candidatos válidos: mismo sitio + mismo tipo, no usados aún
       *   - Solo se asigna si score >= 200 (RUT match) O score >= 50 (UF exacta sin RUT)
       *   - Fallback sin score mínimo: solo si hay exactamente 1 candidato disponible
       *     para ese sitio+tipo (evita asignación ciega cuando hay ambigüedad)
       *   - Facturas CLP fijo (ufPdf===null): se cruzan solo por RUT exacto
       */
      for(const c of clientes){
        const correo=c.email||"";
        const concepto=c.tipo==="arriendo"?"Arriendo":"Serv. Adm.";
        const colRef=c.tipo==="arriendo"?"GS":"GT";
        const mk=`${c.sitio}|${c.cliente}|${c.uf}|${c.tipo}`;
        let factura="",ufPdf=null,montoTotal=null,ivaAmount=null,matchScore=0;
        if(MANUAL[mk]){factura=MANUAL[mk];ufPdf=c.uf;matchScore=999;}
        else{
          let bestIdx=-1,bestScore=0;
          const rutNorm=c.rut||"";

          for(let idx=0;idx<pdfs.length;idx++){
            if(pdfUsado.has(idx))continue;
            const p=pdfs[idx];
            if(p.sitio!==c.sitio||p.tipo!==c.tipo)continue;
            let score=0;
            /* RUT exacto — identificador inequívoco */
            if(rutNorm&&p.rutPdf&&p.rutPdf===rutNorm) score+=200;
            /* UF */
            if(p.ufPdf!==null&&c.uf!=null){
              const diff=Math.abs(p.ufPdf-c.uf);
              if(diff<0.01)       score+=50;
              else if(diff<0.5)   score+=20;
              else if(diff<2.0)   score+=5;
            }
            if(score>bestScore){bestScore=score;bestIdx=idx;}
          }

          const UMBRAL_RUT=200;
          const UMBRAL_UF=50;

          if(bestScore>=UMBRAL_RUT||bestScore>=UMBRAL_UF){
            pdfUsado.add(bestIdx);factura=pdfs[bestIdx].nroFact;ufPdf=pdfs[bestIdx].ufPdf;montoTotal=pdfs[bestIdx].montoTotal||null;ivaAmount=pdfs[bestIdx].ivaAmount||null;matchScore=bestScore;
          } else {
            const candidatos=pdfs.reduce((acc,p,idx)=>{
              if(!pdfUsado.has(idx)&&p.sitio===c.sitio&&p.tipo===c.tipo)acc.push(idx);
              return acc;
            },[]);
            if(candidatos.length===1){
              bestIdx=candidatos[0];
              pdfUsado.add(bestIdx);factura=pdfs[bestIdx].nroFact;ufPdf=pdfs[bestIdx].ufPdf;montoTotal=pdfs[bestIdx].montoTotal||null;ivaAmount=pdfs[bestIdx].ivaAmount||null;matchScore=1;
            }
          }
        }
        filas.push({sitio:c.sitio,edificio:c.edificio||"",cliente:c.cliente,rut:c.rut,correo,concepto,colRef,factura,matchScore,ufSII:null,ufPlan:c.uf,ufPdf,montoTotal,ivaAmount,enviado:false,yaEnviado:c.yaEnviado||false,sheetRow:c.sheetRow||null});
      }

      /* ── Si no hay datos de planilla, mostrar igual los PDFs detectados ── */
      if(!planillaOk){
        for(const p of pdfs){
          filas.push({
            sitio:p.sitio,cliente:p.nombreEnArchivo||p.nroFact,rut:"",correo:"",
            concepto:p.tipo==="arriendo"?"Arriendo":"Serv. Adm.",colRef:"",
            factura:p.nroFact,matchScore:0,ufSII:null,ufPlan:p.ufPdf||0,ufPdf:p.ufPdf,montoTotal:p.montoTotal||null,enviado:false
          });
        }
        addLog(`⚠ Sin datos de planilla — mostrando ${pdfs.length} PDFs detectados`,"warn");
        addLog("  Agrega el período a la planilla para cruzar datos y enviar correos","warn");
      }

      const nuevoMapa={};
      for(const p of pdfs){if(p.nroFact&&p.zipPath)nuevoMapa[p.nroFact]={zipPath:p.zipPath,nombre:p.pdfNombre};}
      setPdfMap(nuevoMapa);
      const sinPdf=filas.filter(f=>!f.factura);
      const revisar=filas.filter(f=>f.factura&&f.matchScore===1);
      if(planillaOk){
        addLog(`✓ ${filas.filter(f=>f.factura).length}/${filas.length} facturas cruzadas`,"ok");
        if(sinPdf.length>0){addLog(`  ⚠ Sin PDF (${sinPdf.length}): ${sinPdf.slice(0,3).map(f=>f.sitio+"/"+f.cliente.slice(0,20)).join(" | ")}`,"warn");}
        if(revisar.length>0){addLog(`  ⚠ Revisar (${revisar.length}): cruce por candidato único, verificar manualmente`,"warn");}
      }
      setProcProgress(100);setProcDone(true);
      setTimeout(()=>{setShowProc(false);setView("table");},1800);
      setData(filas);
      const prevSent=new Set();
      filas.forEach((f,i)=>{const key=`${periodo}|${f.cliente}|${f.concepto}`;if(sentKeys.has(key))prevSent.add(i);});
      setSentSet(prevSent);
      if(prevSent.size>0)addLog(`✓ ${prevSent.size} correos ya enviados en sesiones anteriores`,"ok");
      /* ── Email de notificación con stats reales ── */
      try{
        const eTotal=filas.length;
        const eConPdf=filas.filter(f=>f.factura&&f.ufPdf!==null).length;
        const eSinPdf=filas.filter(f=>!f.factura||f.ufPdf===null).length;
        const eCoinc=filas.filter(f=>getEstado(f)==="ok").length;
        const notifHtml=`<p>Las facturas PISA de <strong>${periodo}</strong> han sido separadas y subidas a Google Drive.</p><p><strong>TOTAL ${eTotal}</strong> | <strong style="color:#16a34a">CON PDF ${eConPdf}</strong> Facturas cruzadas | <strong style="color:#dc2626">SIN PDF ${eSinPdf}</strong> revisar | <strong style="color:#2563eb">COINCIDEN ${eCoinc}</strong> listos para enviar</p><p>Ingresa a la app y presiona <strong>Procesar ${periodo}</strong> para continuar.</p>`;
        const gmailTok=await getToken();
        await sendGmail(gmailTok,"amelendez@patagonica.cl","",REMITENTE,`📋 Facturas PISA ${periodo} listas en Drive`,notifHtml,null,null);
        addLog("✓ Email de notificación enviado","ok");
      }catch(e){console.warn("Email notif error:",e.message);}
    }catch(e){addLog("✗ Error: "+e.message,"err");setProcDone(true);notify("Error: "+e.message,"err");}
  },[files,periodo]);

  const finishProc=()=>{setShowProc(false);setView("table");notify(`${data.length} filas procesadas — ${periodo}`);};

  /* ── DESCARGAR REPORTE CSV ── */
  const descargarReporte=()=>{
    const ahora=new Date();
    const fechaStr=ahora.toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit",year:"numeric"});
    const horaStr=ahora.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
    const rows=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
    const esc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const lines=[];
    // Encabezado del reporte
    lines.push([esc("Reporte Facturación Patagónica Inmobiliaria"),esc(""),esc(""),esc(""),esc(""),esc(""),esc(""),esc(""),esc("")].join(";"));
    lines.push([esc("Período:"),esc(periodo),esc(""),esc("Fecha:"),esc(fechaStr+" "+horaStr),esc(""),esc(""),esc(""),esc("")].join(";"));
    lines.push([esc("Total:"),esc(stats.total),esc("Coinciden:"),esc(stats.ok),esc("Revisar:"),esc(stats.total-stats.ok),esc("Enviados:"),esc(stats.sent),esc(ufSII?"UF día 5: "+ufSII.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2}):"")].join(";"));
    lines.push(["","","","","","","","",""].map(esc).join(";"));
    // Columnas
    lines.push([esc("Sitio"),esc("Local/Edif"),esc("Cliente"),esc("RUT"),esc("Correo"),esc("Concepto"),esc("Factura"),esc("UF Planilla"),esc("UF PDF"),esc("Monto CLP"),esc("Estado")].join(";"));
    // Filas
    for(const r of rows){
      const estadoLabel=r.estado==="ok"?"Coincide":r.estado==="diff"?(r.matchScore===1?"Revisar":"Difiere"):"Sin PDF";
      const sentido=sentSet.has(r.i)?"✓ Enviado":estadoLabel;
      const montoCLP=r.montoTotal||( r.ufPdf!=null&&ufSII?Math.round(r.ufPdf*ufSII):r.ufPlan>500?Math.round(r.ufPlan):"");

    const mesCode=`${anio}-${mesNum}`;
    const periodoCode=`${mesCode} prueba`;
    const pdfNombre=`Facturas_PISA_${mesCode}.pdf`;
    try{
      // 1. Buscar PDF en Drive (via servidor con Service Account)
      notify(`Buscando ${pdfNombre} en Drive...`,"info");
      const qRes=await fetch(`/api/zip?buscarPdf=${encodeURIComponent(pdfNombre)}&folderId=${DRIVE_FACTURACION_FOLDER_ID}`);
      const qData=await qRes.json();
      let pdfFileId=qData.pdfFileId||null;
      // 2. Si no existe, descargar de Nubox automáticamente
      if(!pdfFileId){
        notify(`PDF no encontrado. Descargando facturas PISA ${mesCode} desde Nubox...`,"info");
        const nbRes=await fetch("/api/nubox-pdf",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({mes:mesCode,destFolderId:DRIVE_FACTURACION_FOLDER_ID}),
        });
        const nbData=await nbRes.json();
        if(!nbRes.ok)throw new Error("Nubox: "+(nbData.error||"Error desconocido"));
        pdfFileId=nbData.fileId;
        notify(`✓ ${nbData.total} facturas descargadas desde Nubox y guardadas en Drive`,"ok");
      }else{
        notify(`✓ PDF encontrado en Drive`,"ok");
      }
      // 4. Separar PDF por cliente
      const res=await fetch("/api/split-pdf",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({pdfFileId,periodo:periodoCode,destFolderId:DRIVE_FACTURACION_FOLDER_ID,userToken:await getToken().catch(()=>null)}),
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||"Error desconocido");
      setSplitResult(data);
      if(data.zipBase64){
        const bytes=Uint8Array.from(atob(data.zipBase64),c=>c.charCodeAt(0));
        const blob=new Blob([bytes],{type:"application/zip"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url; a.download=data.zipName; a.click();
        URL.revokeObjectURL(url);
      }
      notify("✓ "+data.zipName+" descargado ("+data.totalFacturas+" facturas)","ok");

      setSplitResult({error:e.message});

                  notify("Subiendo PDF a Drive...","info");
                  // Subir PDF directo a Drive con OAuth del usuario (drive.file scope)
                  const gToken=await getToken();
                  const buf=await file.arrayBuffer();
                  const meta=JSON.stringify({name:fileName,mimeType:"application/pdf",parents:[DRIVE_FACTURACION_FOLDER_ID]});
                  const boundary="pdf_upload_boundary";
                  const metaBytes=new TextEncoder().encode(`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/pdf\r\n\r\n`);
                  const endBytes=new TextEncoder().encode(`\r\n--${boundary}--`);
                  const bodyBytes=new Uint8Array(metaBytes.length+buf.byteLength+endBytes.length);
                  bodyBytes.set(metaBytes,0);bodyBytes.set(new Uint8Array(buf),metaBytes.length);bodyBytes.set(endBytes,metaBytes.length+buf.byteLength);
                  const uploadResp=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{
                    method:"POST",
                    headers:{Authorization:`Bearer ${gToken}`,"Content-Type":`multipart/related; boundary=${boundary}`},
                    body:bodyBytes
                  });
                  if(!uploadResp.ok){const t=await uploadResp.text();throw new Error("Drive upload error "+uploadResp.status+": "+t.slice(0,100));}
                  const uploadJson=await uploadResp.json();
                  const fileId=uploadJson.id;
                  if(!fileId)throw new Error("Drive no devolvió fileId");
                  notify("✓ PDF subido — separando facturas...","ok");
                  setZipStatus("splitting");
                  const splitRes=await fetch("/api/split-pdf",{
                    method:"POST",headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({pdfFileId:fileId,periodo:mesCode,destFolderId:DRIVE_FACTURACION_FOLDER_ID,userToken:gToken}),
                  });
                  const splitData=await splitRes.json();
                  if(!splitRes.ok)throw new Error(splitData.error||"Error al separar PDF");
                  notify("✓ "+splitData.totalFacturas+" facturas de "+periodo+" listas en Drive","ok");
                  setZipStatus("idle");
                  /* ── Notificación Telegram al subir ── */
                  try{
                    const tgBot=window.__TG_BOT__;
                    const tgChat=window.__TG_CHAT__;
                    if(tgBot&&tgChat) await sendTelegram(tgBot,tgChat,`✅ Facturas PISA ${periodo} listas\n${splitData.totalFacturas} PDFs subidos a Drive.\nPresiona Procesar para continuar.`);
                  }catch(e){console.warn("Telegram notif error:",e.message);}
                }catch(e){setZipStatus("error");setZipError(e.message);notify("Error: "+e.message,"err");}
                ev.target.value="";
              }
            }),
            "📄 Subir PDF manualmente"
          )
        )
      )
    ),
    view==="table"&&h("main",{style:{flex:1,display:"flex",flexDirection:"column",overflowX:"hidden",background:"#eef4fd"},className:"fade-up"},
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",borderBottom:"1px solid #b8d0ee",background:"#ddeaf8"}},
        [{label:"Total",val:stats.total,col:"var(--tx)",sub:""},{label:"Con PDF",val:stats.conPdf,col:"var(--green)",sub:"facturas cruzadas"},{label:"Sin PDF",val:stats.sinPdf,col:"var(--red)",sub:"revisar"},{label:"Coinciden",val:stats.ok,col:"var(--accl)",sub:"listos para enviar"},{label:"Enviados",val:stats.sent,col:"var(--amber)",sub:MODO_PRUEBA?"→ "+TEST_DEST:"esta sesión"}]

          m.sub&&h("div",{style:{fontSize:10,color:"var(--txd)",marginTop:3}},m.sub)
        ))
      ),
      h("div",{style:{background:"#ddeaf8",borderBottom:"1px solid #b8d0ee",padding:"8px 18px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
        [{k:"all",l:`Todos (${stats.total})`},{k:"ok",l:`Coinciden (${stats.ok})`},{k:"diff",l:`Revisar (${stats.total-stats.ok})`},{k:"sent",l:`Enviados (${stats.sent})`},
         {k:"difiere",l:`Difiere (${enriched.filter(r=>r.estado==="diff"&&r.matchScore!==1).length})`},
         {k:"sinpdf",l:`Sin PDF (${stats.sinPdf})`}]
        .map(f=>h("button",{key:f.k,className:`pill${filter===f.k?" active":""}`,onClick:()=>setFilter(f.k)},f.l)),
        h("span",{style:{color:"var(--txd)",fontSize:11,marginLeft:3}},"·"),
        [{k:"all",l:"Ambos"},{k:"arr",l:"Arriendo"},{k:"srv",l:"Serv.Adm."}]
        .map(f=>h("button",{key:f.k,className:`pill${concFilter===f.k?" active":""}`,onClick:()=>setConcFilter(f.k),style:{fontSize:10}},f.l)),
        h("div",{style:{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}},
          ufSII&&h("span",{style:{fontSize:11,fontFamily:"'DM Mono',monospace",fontWeight:600,
            background:"var(--surf)",border:"1px solid var(--bdr)",borderRadius:6,padding:"4px 10px",
            color:"var(--blue)",whiteSpace:"nowrap"}},
            `UF día 5: ${ufSII.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2})}`
          ),
          data.length>0&&h("button",{
            onClick:descargarReporte,
            title:"Descargar reporte CSV con el estado actual",
            style:{fontSize:11,fontWeight:600,padding:"5px 12px",borderRadius:8,
              border:"1px solid var(--bdr)",background:"var(--surf)",color:"var(--txm)",
              cursor:"pointer",display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",
              fontFamily:"'DM Sans',sans-serif"}
          },"⬇ Reporte")
        ),
        h("input",{value:search,onChange:e=>setSearch(e.target.value),placeholder:"Buscar cliente o RUT...",style:{width:190,fontFamily:"'DM Sans',sans-serif"}}),
        h("input",{value:searchFactura,onChange:e=>setSearchFactura(e.target.value),placeholder:"N° Factura...",style:{width:130,fontFamily:"'DM Mono',monospace"}})
      ),
      h("div",{style:{flex:1,overflowX:"auto"}},
        h("table",{style:{width:"100%",borderCollapse:"collapse",tableLayout:"fixed",minWidth:880}},
          h("colgroup",null,h("col",{style:{width:58}}),h("col",{style:{width:"15%"}}),h("col",{style:{width:"17%"}}),h("col",{style:{width:88}}),h("col",{style:{width:88}}),h("col",{style:{width:72}}),h("col",{style:{width:72}}),h("col",{style:{width:96}}),h("col",{style:{width:110}})),
          h("thead",null,h("tr",{style:{background:"#ddeaf8"}},
            ["Sitio","Cliente","Correo","Concepto","Factura","UF planilla","UF PDF","Monto+IVA","Estado/Acción"].map(hd=>
              h("th",{key:hd,style:{padding:"8px 11px",textAlign:"left",fontSize:10,fontWeight:700,color:"var(--txd)",letterSpacing:"0.07em",borderBottom:"1px solid var(--bdr)"}},hd.toUpperCase())
            )

          h("tbody",null,filtered.length===0?
            h("tr",null,h("td",{colSpan:9,style:{padding:"48px",textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin resultados")):
            filtered.map(row=>{
              const i=row.i,sent=sentSet.has(i),sending=sendingIdx===i,noEmail=!row.correo;
              const diffPdf=row.ufPdf!==null&&row.ufPdf!==undefined&&(row.ufPdf>5000?Math.abs(row.ufPdf-row.ufPlan)>500:Math.abs(row.ufPdf-row.ufPlan)>0.5);
              const diffSII=row.ufSII!=null&&row.ufPlan<=500&&Math.abs(row.ufPlan-row.ufSII)>0.5;
              const diff=diffPdf||diffSII;
              const esArr=row.concepto==="Arriendo";
              const bg=sent?"#e6f7ef":esArr?"#ffffff":"#fffdf5";
              return h("tr",{key:i,className:"row-tr"},
                h("td",{style:{padding:"8px 11px",background:bg}},
                  h("div",{style:{display:"flex",flexDirection:"column",gap:2}},
                    h("span",{style:{display:"inline-block",padding:"2px 7px",borderRadius:5,fontSize:10,fontWeight:700,background:`${SITIO_C[row.sitio]||"#888"}18`,color:SITIO_C[row.sitio]||"#888",border:`1px solid ${SITIO_C[row.sitio]||"#888"}40`,alignSelf:"flex-start"}},row.sitio),
                    row.edificio&&h("span",{style:{fontSize:9,color:"var(--txd)",fontFamily:"'DM Mono',monospace",paddingLeft:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:52}},row.edificio)
                  )
                ),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:12,fontWeight:600}},row.cliente),row.rut&&h("div",{style:{fontSize:10,fontFamily:"'DM Mono',monospace",color:"var(--txd)",marginTop:2}},formatRUT(row.rut))),
                h("td",{style:{padding:"8px 11px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",background:bg}},h("span",{style:{fontSize:11,fontFamily:"'DM Mono',monospace",color:row.correo?"var(--accl)":"var(--txd)"}},row.correo||"— sin correo")),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{className:esArr?"tag-arr":"tag-srv"},row.concepto)),
                h("td",{style:{padding:"8px 11px",background:bg}},
                  row.factura&&pdfMap[row.factura]
                  ?h("button",{
                      title:"Ver PDF de "+row.factura,
                      style:{fontSize:11,fontFamily:"'DM Mono',monospace",color:"var(--blue)",background:"none",border:"none",cursor:"pointer",padding:0,textDecoration:"underline",fontWeight:600},
                      onClick:async()=>{
                        try{
                          const b64=await getPdfBase64FromZip(files.zip,pdfMap[row.factura].zipPath);
                          const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
                          const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
                          window.open(url,"_blank");
                          setTimeout(()=>URL.revokeObjectURL(url),30000);
                        }catch(e){notify("Error abriendo PDF: "+e.message,"err");}
                      }
                    },row.factura)
                  :h("span",{style:{fontSize:11,fontFamily:"'DM Mono',monospace",color:"var(--txm)"}},row.factura||"—")
                ),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace"}},row.ufPlan>5000?"$"+Math.round(row.ufPlan).toLocaleString("es-CL"):row.ufPlan.toFixed(2))),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace",color:diffPdf?"var(--amber)":"var(--tx)"}},
  row.ufPdf!==null&&row.ufPdf!==undefined
    ?(row.ufPdf>5000?"$"+Math.round(row.ufPdf).toLocaleString("es-CL"):row.ufPdf.toFixed(2))
    :"—"
)),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace",fontWeight:600,color:"var(--tx)"}},
                  (()=>{
                    if(row.montoTotal) return "$"+row.montoTotal.toLocaleString("es-CL");
                    const sub=row.ufPdf!=null&&ufSII?Math.round(row.ufPdf*ufSII):row.ufPlan>500?Math.round(row.ufPlan):null;
                    if(sub&&row.ivaAmount) return "$"+(sub+row.ivaAmount).toLocaleString("es-CL");
                    if(sub) return "$"+sub.toLocaleString("es-CL");
                    return "—";
                  })()
                )),
                h("td",{style:{padding:"8px 11px",background:bg}},

                  sent?h("span",{style:{color:"var(--green)",fontSize:11,fontWeight:600}},"✓ Enviado"):
                  sending?h("span",{style:{color:"var(--blue)",fontSize:11,display:"inline-flex",alignItems:"center",gap:4}},h("span",{className:"spin"},"⟳")," Enviando..."):
                  row.estado==="ok"&&!noEmail?h("button",{
                    className:"btn-send",
                    onClick:unlocked?()=>setPreview({row,idx:i}):()=>setShowPwdModal(true),
                    title:unlocked?"Enviar correo":"Clave requerida para enviar",
                    style:{opacity:unlocked?1:0.55,cursor:unlocked?"pointer":"pointer"}
                  },"✉ "+(unlocked?"Enviar":"🔒")):
                  h(Badge,{e:row.estado,row})
                )
              );

        h("span",{style:{fontSize:11,color:"var(--txd)",fontFamily:"'DM Mono',monospace"}},`${filtered.length}/${stats.total} · ${stats.sent} enviados · ${periodo}`),
        h("div",{style:{display:"flex",gap:8,alignItems:"center"}},

              style:{background:"var(--surf2)",border:"1px solid var(--bdr)",color:"var(--txm)",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5}
            },"📋 Sincronizar planilla"),
          h("button",{
              onClick:unlocked?sendAll:()=>setShowPwdModal(true),
              style:{background:unlocked?"var(--gbg)":"var(--surf2)",border:unlocked?"1px solid var(--gdim)":"1px solid var(--bdr)",color:unlocked?"var(--green)":"var(--txm)",borderRadius:8,padding:"7px 16px",fontSize:12,fontWeight:700,display:"flex",alignItems:"center",gap:6,cursor:"pointer"}
            },unlocked?`✉ Enviar todos (${Math.max(0,stats.ok-stats.sent)})`:`🔒 Enviar todos (${Math.max(0,stats.ok-stats.sent)})`)
        )
      )
    )
    ,view==="ventas"&&h(VentasView,{periodo})
