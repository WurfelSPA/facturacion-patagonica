<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Facturación — Patagónica Inmobiliaria</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* CAMBIO 3: fondo gris tipo Claude */
  --bg:#f0f0eb;--surf:#ffffff;--surf2:#f5f5f0;--surf3:#ebebE5;
  --bdr:#d8d8d0;--bdr2:#c8c8c0;
  --tx:#1a1a1a;--txm:#6b6b6b;--txd:#a0a0a0;
  --green:#0a7c4e;--gdim:#b6ddd0;--gbg:#e8f5f0;
  --amber:#a05c00;--adim:#f0d090;--abg:#fff8e8;
  --red:#c0392b;--rdim:#f5c0bc;--rbg:#fdf0ef;
  --blue:#1a5fa8;--bbg:#e8f0fb;
  --acc:#5b4cdb;--acc2:#7060f0;--accl:#4a3cc0;
}
html,body,#root{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:4px}
input,select{font-family:'DM Mono',monospace;background:var(--surf);border:1px solid var(--bdr);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:12px;outline:none;transition:border 0.2s}
input:focus,select:focus{border-color:var(--acc2)}
input::placeholder{color:var(--txd)}
button{font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.15s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 0.9s linear infinite}
.fade-up{animation:fadeUp 0.3s cubic-bezier(.16,1,.3,1)}
.row-tr:hover td{background:var(--surf2)!important}
.pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--bdr);background:transparent;color:var(--txm);cursor:pointer;transition:all 0.15s}
.pill:hover:not(.active){background:var(--surf2)}
.pill.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.drop-zone{border:2px dashed var(--bdr2);border-radius:12px;padding:28px 20px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--surf2)}
.drop-zone:hover,.drop-zone.drag{border-color:var(--acc2);background:var(--surf3)}
.drop-zone.done{border-color:var(--green);border-style:solid;background:var(--gbg)}
.btn-primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:13px;font-weight:700;letter-spacing:-0.2px;box-shadow:0 4px 20px rgba(91,76,219,0.2)}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.hist-panel{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;margin:0 18px 18px;overflow:hidden}
.hist-tbl{width:100%;border-collapse:collapse;font-size:11px}
.hist-tbl th{padding:6px 10px;background:var(--surf2);color:var(--txd);font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.05em;border-bottom:1px solid var(--bdr);white-space:nowrap}
.hist-tbl td{padding:7px 10px;border-bottom:1px solid var(--bdr);font-family:"DM Mono",monospace;font-size:11px;white-space:nowrap;background:var(--surf)}
.hist-tbl tr:last-child td{border-bottom:none}
.hist-tbl tr:nth-child(even) td{background:var(--surf2)}
.hist-dif-pos{color:#0a7c4e;font-weight:600}
.hist-dif-neg{color:#c0392b;font-weight:600}
.hist-null{color:#bbb}
.pwd-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:200}
.pwd-modal{background:var(--surf);border-radius:14px;padding:28px 32px;width:320px;box-shadow:0 8px 40px rgba(0,0,0,0.18);border:1px solid var(--bdr)}
.pwd-input{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--surf2);color:var(--tx);font-size:14px;font-family:inherit;outline:none;box-sizing:border-box}
.pwd-input:focus{border-color:var(--acc)}
.pwd-input.error{border-color:#e53935;animation:shake .3s}
.btn-send{background:var(--bbg);border:1px solid #b5d0f0;color:var(--blue);padding:5px 11px;border-radius:7px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.btn-send:hover{background:#c6dff5}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--surf);border:1px solid var(--bdr2);border-radius:18px;padding:28px;width:600px;max-width:96vw;animation:fadeUp 0.25s cubic-bezier(.16,1,.3,1)}
.notif{position:fixed;top:18px;right:18px;z-index:200;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;animation:fadeIn 0.2s;pointer-events:none;max-width:380px;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.tag-arr{background:#e8f0fb;border:1px solid #b5d0f0;color:#1a5fa8;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tag-srv{background:#fff8e8;border:1px solid #f0d090;color:#a05c00;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.col-gs{background:#e8f0fb;color:#1a5fa8;font-family:'DM Mono',monospace;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.col-gt{background:#fff8e8;color:#a05c00;font-family:'DM Mono',monospace;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.log-line{font-family:'DM Mono',monospace;font-size:11px;line-height:1.9;color:var(--txm)}
.log-ok{color:var(--green)}.log-err{color:var(--red)}.log-info{color:var(--blue)}
.pbar{height:3px;background:var(--surf3);border-radius:2px;overflow:hidden;margin:10px 0}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:2px;transition:width 0.5s ease}
.test-banner{background:var(--abg);border-bottom:1px solid var(--adim);padding:8px 24px;font-size:11px;color:var(--amber);display:flex;align-items:center;gap:8px;font-weight:500}
.key-input{font-family:'DM Mono',monospace;letter-spacing:0.04em;font-size:11px}
.dash-card{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:16px 20px}
.dash-card-lbl{font-size:10px;font-weight:700;color:var(--txd);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.dash-card-val{font-size:26px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;letter-spacing:-1px}
.dash-card-sub{font-size:11px;color:var(--txm);margin-top:6px}
.site-bar-wrap{background:var(--surf3);border-radius:4px;height:5px;flex:1;min-width:40px}
.site-bar-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.16,1,.3,1)}
.month-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;width:58px;cursor:default}
.month-bar-wrap{display:flex;flex-direction:column;justify-content:flex-end;height:110px;width:34px;gap:1px}
.month-seg-arr{width:34px;background:#378add;border-radius:3px 3px 0 0;transition:height .4s}
.month-seg-srv{width:34px;background:#ef9f27;opacity:.75;transition:height .4s}
.month-lbl{font-size:9px;color:var(--txd);font-family:'DM Mono',monospace;text-align:center}
.month-val{font-size:9px;color:var(--txm);font-family:'DM Mono',monospace;text-align:center}
.month-col:hover .month-seg-arr{background:#185fa5}
.month-col:hover .month-val{color:var(--tx)}
.dash-client-hdr{display:grid;grid-template-columns:58px minmax(140px,1fr) 100px 100px 100px 60px 95px 80px 65px 80px 60px 60px 55px 70px 28px;border-bottom:2px solid var(--bdr);background:var(--surf)}
.dash-client-hdr>div{padding:7px 8px;font-size:9px;font-weight:700;color:var(--txd);letter-spacing:.06em;text-transform:uppercase}
.dash-client-row{display:grid;grid-template-columns:58px minmax(140px,1fr) 100px 100px 100px 60px 95px 80px 65px 80px 60px 60px 55px 70px;border-bottom:1px solid var(--bdr);transition:background .1s;cursor:default}
.dash-client-row:hover>div{background:var(--surf2)}
.dash-client-row>div{padding:8px 8px;font-size:11px;display:flex;align-items:center}
.nav-btn{background:transparent;border:1px solid var(--bdr);color:var(--txm);border-radius:8px;padding:5px 14px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:5px}
.nav-btn:hover{background:var(--surf2);color:var(--tx)}
.nav-btn.active{background:var(--surf3);border-color:var(--acc);color:var(--accl)}
.nav-btn-navy{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);color:#d0e4f7;border-radius:8px;padding:5px 14px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:5px;cursor:pointer;transition:all .15s}
.nav-btn-navy:hover{background:rgba(255,255,255,0.16);color:#fff}
.nav-btn-navy.active{background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.4);color:#fff}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(10,124,78,0.4)}50%{box-shadow:0 0 0 8px rgba(10,124,78,0)}}

.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;width:48px;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;transition:width 0.22s cubic-bezier(.16,1,.3,1);overflow:hidden;}
.sidebar:hover{width:210px;box-shadow:4px 0 24px rgba(0,0,0,0.08);}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:14px 10px 10px;border-bottom:1px solid var(--bdr);min-height:52px;overflow:hidden;white-space:nowrap;}
.sidebar-logo-icon{width:28px;height:28px;min-width:28px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700;flex-shrink:0;}
.sidebar-logo-text{font-size:12px;font-weight:700;color:var(--tx);}
.sidebar-logo-sub{font-size:9px;color:var(--txm);font-family:'DM Mono',monospace;margin-top:1px;}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:10px 6px;}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden;border:none;background:transparent;text-align:left;width:100%;font-family:'DM Sans',sans-serif;}
.sidebar-item:hover{background:var(--surf2);}
.sidebar-item.active{background:var(--acc);color:#fff!important;}
.sidebar-item-icon{font-size:16px;min-width:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar-item-label{font-size:12px;font-weight:600;color:var(--tx);overflow:hidden;}
.sidebar-item.active .sidebar-item-label{color:#fff!important;}
.sidebar-footer{padding:10px 6px;border-top:1px solid var(--bdr);font-size:9px;color:var(--txd);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:8px;}
.sidebar-footer-dot{width:6px;height:6px;min-width:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
.app-content{margin-left:48px;flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.app-content>header{flex-shrink:0;}
.app-content>main{flex:1;min-height:0;}

.user-menu{padding:10px 6px;border-top:1px solid var(--bdr);}
.user-info{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap;overflow:hidden;}
.user-info:hover{background:var(--surf2);}
.user-avatar{width:28px;height:28px;min-width:28px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2,#7c3aed));display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;flex-shrink:0;}
.user-name{font-size:11px;font-weight:600;color:var(--tx);}
.user-email{font-size:9px;color:var(--txm);font-family:'DM Mono',monospace;overflow:hidden;text-overflow:ellipsis;}
.user-dropdown{display:none;position:absolute;bottom:62px;left:6px;right:6px;background:var(--surf);border:1px solid var(--bdr);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200;overflow:hidden;}
.user-dropdown.open{display:block;}
.user-dropdown button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:none;background:transparent;text-align:left;font-size:12px;font-weight:500;color:var(--tx);cursor:pointer;font-family:'DM Sans',sans-serif;}
.user-dropdown button:hover{background:var(--surf2);}
.user-dropdown button.danger{color:#e53935;}
@media print{
  .sidebar{display:none!important;}
  header{position:relative!important;}
  #root>div{display:block!important;overflow:visible!important;height:auto!important;}
  main{overflow:visible!important;height:auto!important;max-height:none!important;flex:none!important;display:block!important;}
  main>div{overflow:visible!important;height:auto!important;max-height:none!important;flex:none!important;}
  .fade-up{animation:none!important;}
}

/* ══════════════════════════════════════════════════════════
   PILOTO DE DISEÑO — Facturación (acotado, no toca otras vistas)
   Variables scoped a .fv2: cualquier var(--xxx) usada dentro de un
   elemento con esta clase (o descendiente de él) toma estos valores
   en vez de los globales de :root, sin afectar Sidebar u otras vistas.
═══════════════════════════════════════════════════════════ */
.fv2{
  --bg:#F7F9FC;--surf:#FFFFFF;--surf2:#F0F3F9;--surf3:#E9EDF5;
  --bdr:#E3E8F0;--bdr2:#D3DAE6;
  --tx:#0F1420;--txm:#5B6478;--txd:#94A0B8;
  --green:#0E9F6E;--gdim:#a7ecd2;--gbg:#e7faf1;
  --amber:#D97706;--adim:#fbdca0;--abg:#fef6e7;
  --red:#E5484D;--rdim:#f6c6c8;--rbg:#fdecec;
  --blue:#3B6EF5;--bbg:#eaf1ff;
  --acc:#3B6EF5;--acc2:#7C6CFF;--accl:#2F5AD1;
}
.fv2, .fv2 input, .fv2 select{font-family:'DM Sans',sans-serif}
.fv2-title{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-.01em}
.fv2-lbl{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
/* Punto "en vivo" — respira suavemente, para datos que vienen de Nubox/Drive en tiempo real.
   Anillo exterior + halo para que se note incluso a tamaño chico. */
@keyframes fv2breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}}
@keyframes fv2halo{0%{box-shadow:0 0 0 0 rgba(59,110,245,.45)}70%{box-shadow:0 0 0 7px rgba(59,110,245,0)}100%{box-shadow:0 0 0 0 rgba(59,110,245,0)}}
.fv2-pulse{position:relative;display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);flex-shrink:0;animation:fv2halo 1.8s ease-out infinite}
.fv2-pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--acc);animation:fv2breathe 1.8s ease-in-out infinite}
.fv2-card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;transition:border-color .15s,box-shadow .15s}
.fv2-card:hover{border-color:var(--bdr2);box-shadow:0 2px 12px rgba(15,20,32,.05)}
.fv2 .pill{border-radius:8px;font-weight:600;transition:all .15s}
.fv2 .pill.active{background:var(--acc);border-color:var(--acc);box-shadow:0 2px 10px rgba(59,110,245,.28)}
.fv2 .pill:hover:not(.active){border-color:var(--bdr2);transform:translateY(-1px)}
.fv2 .btn-primary{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 4px 18px rgba(59,110,245,.25);border-radius:8px}
.fv2 .btn-primary:hover{box-shadow:0 6px 22px rgba(59,110,245,.35);transform:translateY(-1px)}
.fv2 thead th{font-family:'Space Grotesk',sans-serif!important}
.fv2 .row-tr{transition:background .12s}
.fv2 .row-tr:hover td{background:var(--surf2)!important}

/* Loader "espacial" — anillo con degradé + satélite orbitando + núcleo con halo.
   Reemplaza el ⟳ de texto en los momentos de carga largos dentro de Facturación. */
@keyframes fv2spin{to{transform:rotate(360deg)}}
@keyframes fv2spinRev{to{transform:rotate(-360deg)}}
.fv2-loader{position:relative;width:1em;height:1em;display:inline-block;flex-shrink:0}
.fv2-loader::before{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(59,110,245,.15);border-top-color:var(--acc);border-right-color:var(--acc2);animation:fv2spin .85s linear infinite}
.fv2-loader::after{content:'';position:absolute;top:-2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc2);box-shadow:0 0 6px 1px rgba(124,108,255,.8);animation:fv2spinRev 1.7s linear infinite;transform-origin:50% calc(0.5em + 2px)}
.fv2-loading-row{display:flex;align-items:center;justify-content:center;gap:10px}
.fv2-loading-row .fv2-loader{width:22px;height:22px;font-size:22px}
/* Línea de "flujo de datos" — barrido sutil, firma ambiental de la vista */
@keyframes fv2stream{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fv2-stream{height:2px;background:linear-gradient(90deg,transparent,var(--acc) 45%,var(--acc2) 55%,transparent);background-size:200% 100%;animation:fv2stream 2.6s linear infinite;opacity:.55}

/* ═══ Estado de Pagos — modo oscuro "centro de control" (inspirado en panel-ia) ═══ */
.epv2{
  --bg:#060B14;--surf:#0F172A;--surf2:#131C30;--surf3:#1B2540;
  --bdr:rgba(148,163,184,.16);--bdr2:rgba(148,163,184,.32);
  --tx:#E7ECF5;--txm:#93A0BD;--txd:#5C6884;
  --green:#34D399;--gdim:rgba(52,211,153,.4);--gbg:rgba(52,211,153,.12);
  --amber:#FBBF24;--adim:rgba(251,191,36,.4);--abg:rgba(251,191,36,.12);
  --red:#FB7185;--rdim:rgba(251,113,133,.4);--rbg:rgba(251,113,133,.12);
  --blue:#38BDF8;--bbg:rgba(56,189,248,.12);
  --acc:#22D3EE;--acc2:#8B5CF6;--accl:#06B6D4;
  background:
    radial-gradient(circle at 12% -10%,rgba(34,211,238,.12),transparent 42%),
    radial-gradient(circle at 88% 10%,rgba(139,92,246,.12),transparent 42%),
    var(--bg);
}
.epv2, .epv2 input, .epv2 select{font-family:'DM Sans',sans-serif;color:var(--tx)}
.epv2 .dash-card{background:rgba(15,23,42,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--bdr);border-radius:14px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.epv2 .dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);opacity:.75}
.epv2 .dash-card:hover{border-color:var(--bdr2);transform:translateY(-2px)}
.epv2 .dash-card-val{font-family:'JetBrains Mono',monospace}
.epv2 .tag-arr{background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.38);color:#7dd3fc}
.epv2 .tag-srv{background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.38);color:#fcd34d}
.epv2 select option{background:#0F172A;color:#E7ECF5}
/* Barras con crecimiento animado + brillo + barrido — la "vida" que pidió el usuario */
.epv2-bar-track{border-radius:11px;overflow:hidden;background:var(--surf2);border:1px solid var(--bdr);position:relative;display:flex}
.epv2-bar-fill{transition:width 1.1s cubic-bezier(.22,.9,.24,1),min-width 1.1s cubic-bezier(.22,.9,.24,1);position:relative;box-shadow:0 0 12px -2px var(--glow,transparent),inset 0 0 12px -4px rgba(255,255,255,.25)}
.epv2-bar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-120%);animation:epv2shimmer 2.8s ease-in-out infinite}
@keyframes epv2shimmer{0%{transform:translateX(-120%)}55%{transform:translateX(120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){
  .epv2-bar-fill{transition:none}

   CAMBIO 1: CACHÉ UF HISTÓRICA
   Fuente: mindicador.cl API pública
═══════════════════════════════════ */
const ufCache={};

async function getUFDia5(year,month){
  const key=`uf5-${year}-${String(month).padStart(2,"0")}`;
  if(ufCache[key])return ufCache[key];
  try{
    // Pedir el día 5 exacto a mindicador.cl (formato DD-MM-YYYY)
    const mon=String(month).padStart(2,"0");
    const url=`https://mindicador.cl/api/uf/05-${mon}-${year}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const serie=data.serie||[];
    if(serie.length>0){ufCache[key]=serie[0].valor;return serie[0].valor;}
    return null;
  }catch(e){console.warn("Error UF día 5",e.message);return null;}
}
async function getUFHoy(){
  const now=new Date();
  const key=`hoy-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  if(ufCache[key])return ufCache[key];
  try{
    const res=await fetch("https://mindicador.cl/api/uf");
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const serie=data.serie||[];
    if(serie.length>0){ufCache[key]=serie[0].valor;return serie[0].valor;}
    return null;
  }catch(e){console.warn("Error UF hoy",e.message);return null;}
}
async function getUFForMonth(year,month){
  const key=`${year}-${String(month).padStart(2,"0")}`;
  if(ufCache[key])return ufCache[key];
  try{
    // Usamos mindicador.cl — API pública sin auth, retorna UF histórica
    // Pedimos el día 1 del mes siguiente y tomamos el último valor disponible del mes
    const url=`https://mindicador.cl/api/uf/${String(year)}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    // data.serie = [{fecha:"2025-01-01T...", valor:xxxxx}, ...]
    const serie=data.serie||[];
    // Buscar el último valor del mes solicitado
    const entries=serie.filter(e=>{
      const d=new Date(e.fecha);
      return d.getUTCFullYear()===year&&(d.getUTCMonth()+1)===month;
    });
    if(entries.length===0){
      // Fallback: primer valor del mes siguiente
      const next=serie.filter(e=>{
        const d=new Date(e.fecha);
        const nm=month===12?1:month+1;
        const ny=month===12?year+1:year;
        return d.getUTCFullYear()===ny&&(d.getUTCMonth()+1)===nm;
      });
      if(next.length>0){ufCache[key]=next[0].valor;return next[0].valor;}
      return null;
    }
    // Tomar el valor más reciente del mes (último día disponible)
    entries.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    ufCache[key]=entries[0].valor;
    return entries[0].valor;
  }catch(e){
    console.warn("Error obteniendo UF para",key,e.message);
    return null;
  }
}

function formatCLP(pesos){
  if(pesos===null||pesos===undefined||isNaN(pesos))return"—";
  return"$"+Math.round(pesos).toLocaleString("es-CL");
}

function formatCLPCompact(pesos){
  if(pesos===null||pesos===undefined||isNaN(pesos))return"—";
  const n=Math.round(pesos);
  if(n>=1000000)return"$"+(n/1000000).toFixed(1).replace(".",",")+"M";
  if(n>=1000)return"$"+(n/1000).toFixed(0)+"K";
  return"$"+n.toLocaleString("es-CL");
}

/* ── Google OAuth (Gmail + Drive) ── */
function loadGisScript(){return new Promise(res=>{if(window.google?.accounts){res();return;}const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;document.head.appendChild(s);});}
let _gToken=null,_gTokenExp=0;
async function getGoogleToken(clientId,forceConsent){
  await loadGisScript();
  if(!forceConsent&&_gToken&&Date.now()<_gTokenExp-60000)return _gToken;
  if(forceConsent){_gToken=null;_gTokenExp=0;}
  return new Promise((res,rej)=>{
    const client=google.accounts.oauth2.initTokenClient({
      client_id:clientId,scope:GOOGLE_SCOPES,
      hint:"facturacion@patagonica.cl",
      callback:(resp)=>{
        if(resp.error)rej(new Error(resp.error));
        else{_gToken=resp.access_token;_gTokenExp=Date.now()+(resp.expires_in||3600)*1000;res(_gToken);}
      }
    });
    client.requestAccessToken({prompt:forceConsent?"consent":""});
  });
}

function makeEmail(to,cco,from,subject,body,attachBase64,attachName,attachMime,bcc){
  attachMime=attachMime||"application/pdf";
  const boundary="PAT_BOUNDARY_"+Date.now();
  const fromHeader=`=?UTF-8?B?${btoa(unescape(encodeURIComponent("Patagónica Inmobiliaria")))}?= <${from}>`;
  let msg;
  const ccLine=cco?`Cc: ${cco}`:"";
  const bccLine=bcc?`Bcc: ${bcc}`:"";
  if(attachBase64&&attachName){
    const headers=[`From: ${fromHeader}`,`To: ${to}`];
    if(ccLine)headers.push(ccLine);
    if(bccLine)headers.push(bccLine);
    headers.push(`Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,`MIME-Version: 1.0`,`Content-Type: multipart/mixed; boundary="${boundary}"`,``,`--${boundary}`,`Content-Type: text/html; charset=UTF-8`,`Content-Transfer-Encoding: base64`,``,btoa(unescape(encodeURIComponent(body))),``,`--${boundary}`,`Content-Type: ${attachMime}; name="${attachName}"`,`Content-Disposition: attachment; filename="${attachName}"`,`Content-Transfer-Encoding: base64`,``,attachBase64,``,`--${boundary}--`);
    msg=headers.join("\r\n");
  }else{
    const headers=[`From: ${fromHeader}`,`To: ${to}`];
    if(ccLine)headers.push(ccLine);
    if(bccLine)headers.push(bccLine);
    headers.push(`Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,`MIME-Version: 1.0`,`Content-Type: text/html; charset=UTF-8`,`Content-Transfer-Encoding: base64`,``,btoa(unescape(encodeURIComponent(body))));
    msg=headers.join("\r\n");
  }
  return btoa(unescape(encodeURIComponent(msg))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

/* ── Extraer comentarios de la planilla para el mes indicado ── */
async function extraerComentariosMes(xlsxFile, periodo){
  const MESES={Enero:0,Febrero:1,Marzo:2,Abril:3,Mayo:4,Junio:5,Julio:6,Agosto:7,Septiembre:8,Octubre:9,Noviembre:10,Diciembre:11};
  const[mesNombre,anio]=periodo.split(" ");
  const targetYear=parseInt(anio),targetMonth=MESES[mesNombre];
  const buf=await readFileAsBuffer(xlsxFile);
  const wb=XLSX.read(buf,{type:"buffer",cellDates:true});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("Hoja 'Flujo' no encontrada en la planilla");
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const headerRow=rows[2]||[];  /* fila 3 de Excel = índice 2 en XLSX.js */
  // Debug: mostrar valores alrededor de la columna 207
  console.log("[planilla] headerRow cols 200-215:", headerRow.slice(200,215).map((v,i)=>`${200+i}:${JSON.stringify(v)}`).join(" | "));
  // Buscar columna de fecha del mes target (robusto: Date UTC, Date local, serial numérico)
  // Excel serial: días desde 1900-01-01; Jun 2026 = ~46000
  function excelSerialToDate(serial){
    const d=new Date(Math.round((serial-25569)*86400*1000));return d;
  }
  let monthCol=-1;
  for(let c=50;c<headerRow.length;c++){
    const v=headerRow[c];
    let match=false;
    if(v instanceof Date){
      match=(v.getUTCFullYear()===targetYear&&v.getUTCMonth()===targetMonth)
        ||(v.getFullYear()===targetYear&&v.getMonth()===targetMonth);
    } else if(typeof v==="number"&&v>40000&&v<60000){
      const d=excelSerialToDate(v);
      match=(d.getUTCFullYear()===targetYear&&d.getUTCMonth()===targetMonth)
        ||(d.getFullYear()===targetYear&&d.getMonth()===targetMonth);
    }
    if(match){monthCol=c;break;}
  }
  if(monthCol===-1)throw new Error(`Columna del mes ${periodo} no encontrada en la planilla`);
  // Buscar "Comentarios" por encabezado — el ancho del bloque mensual cambió
  // al agregar "Pago Arriendo"/"Pago GC" desde Mayo 2026, así que monthCol+4
  // ya no cae siempre en Comentarios (a veces cae en Nro Fact GC).
  let comentariosCol=-1;
  for(let j=monthCol+1;j<=Math.min(monthCol+10,headerRow.length-1);j++){
    const h=headerRow[j];
    if(typeof h==="string"&&h.trim().toLowerCase()==="comentarios"){comentariosCol=j;break;}
  }
  if(comentariosCol===-1)comentariosCol=monthCol+4;
  const SITIO_ORDER=["5-A","4-A","A-1","A-2","B","D-2","D-3"];
  const grupos={};
  for(let r=4;r<rows.length;r++){
    const row=rows[r];if(!row)continue;
    const sitio=row[7],edif=row[8],cliente=row[11];
    const comentario=row[comentariosCol];
    if(!sitio||!cliente)continue;
    const comStr=comentario!=null?String(comentario).trim():"";
    if(!comStr)continue;
    if(!grupos[sitio])grupos[sitio]=[];
    grupos[sitio].push({edif:edif?String(edif).trim():"",cliente:String(cliente).trim(),comentario:comStr});
  }
  // Ordenar sitios
  const ordenados={};
  SITIO_ORDER.forEach(s=>{if(grupos[s])ordenados[s]=grupos[s];});
  Object.keys(grupos).forEach(s=>{if(!ordenados[s])ordenados[s]=grupos[s];});
  return ordenados;
}
async function generarExcelResumen(xlsxFile,periodo){
  /* Genera un Excel reducido con solo las columnas relevantes para Contabilidad:
     H(Sitio) I(Edificio) J(RUT) K(Dirección) L(Cliente) AQ(Total m²)
     + columnas dinámicas del mes: Arriendo | GC | Comentarios */
  const MESES={Enero:0,Febrero:1,Marzo:2,Abril:3,Mayo:4,Junio:5,Julio:6,Agosto:7,Septiembre:8,Octubre:9,Noviembre:10,Diciembre:11};
  const[mesNombre,anio]=periodo.split(" ");
  const targetYear=parseInt(anio),targetMonth=MESES[mesNombre];
  const buf=await readFileAsBuffer(xlsxFile);
  const wb=XLSX.read(buf,{type:"buffer",cellDates:true});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("Hoja 'Flujo' no encontrada en la planilla");
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const headerRow=rows[2]||[];
  function excelSerialToDate(s){return new Date(Math.round((s-25569)*86400*1000));}
  let monthCol=-1;
  for(let c=50;c<headerRow.length;c++){
    const v=headerRow[c];let match=false;
    if(v instanceof Date){
      match=(v.getUTCFullYear()===targetYear&&v.getUTCMonth()===targetMonth)||(v.getFullYear()===targetYear&&v.getMonth()===targetMonth);
    }else if(typeof v==="number"&&v>40000&&v<60000){
      const d=excelSerialToDate(v);
      match=(d.getUTCFullYear()===targetYear&&d.getUTCMonth()===targetMonth)||(d.getFullYear()===targetYear&&d.getMonth()===targetMonth);
    }
    if(match){monthCol=c;break;}
  }
  if(monthCol===-1)throw new Error(`Columna del mes ${periodo} no encontrada en planilla`);
  // Columnas fijas (índice 0-based): H=7 I=8 J=9 K=10 L=11 AQ=42
  // Columnas dinámicas: buscar "GC" y "Comentarios" por encabezado en vez de un
  // offset fijo — el ancho del bloque mensual cambió al agregar "Pago Arriendo"/
  // "Pago GC" desde Mayo 2026 (monthCol+2/+4 ya no caen siempre en GC/Comentarios).
  let colGT=-1;
  for(let j=monthCol+1;j<=Math.min(monthCol+6,headerRow.length-1);j++){
    const h=headerRow[j];
    if(typeof h==="string"&&h.trim()==="GC"){colGT=j;break;}
  }
  if(colGT===-1)colGT=monthCol+2;
  let colComentarios=-1;
  for(let j=monthCol+1;j<=Math.min(monthCol+10,headerRow.length-1);j++){
    const h=headerRow[j];
    if(typeof h==="string"&&h.trim().toLowerCase()==="comentarios"){colComentarios=j;break;}
  }
  if(colComentarios===-1)colComentarios=monthCol+4;
  const COLS=[7,8,9,10,11,42,monthCol,colGT,colComentarios];
  const HEADERS=["Sitio","Edificio","RUT","Direcci\u00f3n","Cliente","Total m\u00b2",`Arriendo ${periodo}`,"GC","Comentarios"];
  const outRows=[HEADERS];
  for(let r=4;r<rows.length;r++){
    const row=rows[r];if(!row)continue;
    const clienteVal=row[11]!=null?String(row[11]).trim():"";if(!clienteVal||clienteVal.toUpperCase()==="VACANTE")continue;
    /* Si tanto Arriendo como GC están en 0 (o vacío), no se emitirá factura
       este mes — no tiene sentido dejar la fila en el resumen */
    const arriendoVal=row[monthCol],gcVal=row[colGT];
    const arriendoZero=!arriendoVal||arriendoVal===0;
    const gcZero=!gcVal||gcVal===0;
    if(arriendoZero&&gcZero)continue;
    outRows.push(COLS.map(c=>row[c]!=null?row[c]:""));
  }
  // ── Construir XLSX con estilos usando JSZip + XML puro ──────────────────
  // SheetJS 0.18 CE no soporta cell styles → generamos el ZIP manualmente.
  function xlCol(idx){let r='',n=idx+1;while(n>0){const rem=(n-1)%26;r=String.fromCharCode(65+rem)+r;n=Math.floor((n-1)/26);}return r;}
  function xlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  // Shared strings
  const ss=[],ssMap=new Map();
  function ssIdx(v){const s=String(v);if(ssMap.has(s))return ssMap.get(s);const i=ss.length;ss.push(s);ssMap.set(s,i);return i;}
  // Ancho de columnas (caracteres)
  const COL_W=[8,12,14,30,28,10,14,14,40];
  // Índices 0-based de columnas con formato 2 decimales: Arriendo(6) y GC(7)
  const DEC_COLS=new Set([6,7]);

  const ssXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${ss.length}" uniqueCount="${ss.length}">${ss.map(s=>`<si><t xml:space="preserve">${xlEsc(s)}</t></si>`).join('')}</sst>`;
  const stylesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0277BD"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>`;
  const wbXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Resumen" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const relsXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wbRelsXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const ctXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const zipOut=new JSZip();
  zipOut.file('[Content_Types].xml',ctXml);
  zipOut.file('_rels/.rels',relsXml);
  zipOut.file('xl/workbook.xml',wbXml);
  zipOut.file('xl/_rels/workbook.xml.rels',wbRelsXml);
  zipOut.file('xl/styles.xml',stylesXml);
  zipOut.file('xl/sharedStrings.xml',ssXml);
  zipOut.file('xl/worksheets/sheet1.xml',sheetXml);
  return await zipOut.generateAsync({type:'base64'});
}

/* ═══════════════════════════════════
   DASHBOARD: parsear planilla F→BJ
═══════════════════════════════════ */
async function parsePlanillaParaDashboard(file){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla");
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  const row3=raw[2]||[];
  const MES_L=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  function serialToYM(serial){
    const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(serial)*86400000);
    return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1};
  }
  const monthCols=[];
  for(let ci=64;ci<Math.min(row3.length,400);ci++){
    const v=row3[ci];
    if(typeof v==="number"&&v>40000&&v<50000){
      const{y,m}=serialToYM(v);
      if(y>=2024&&y<=2026){
        /* Columna "GC" (Serv. Admin.) del mes — su distancia a la fecha del mes
           varía (6 o 7 columnas según si el bloque incluye "Pagado"), por eso se
           busca dinámicamente en vez de asumir un offset fijo. */
        let gcCol=-1;
        for(let j=ci+1;j<=Math.min(ci+6,row3.length-1);j++){if(row3[j]==="GC"){gcCol=j;break;}}
        monthCols.push({key:`${y}-${String(m).padStart(2,"0")}`,label:`${MES_L[m-1]} ${y}`,col:ci,gcCol,year:y,month:m});
      }
    }
  }
  const SKIP=/^(Total|Area|Arrendado|En negociación|Para confirmar|#|\d+$)/;
  const clients=[];
  const vacantes=[];
  for(let ri=4;ri<raw.length;ri++){
    const row=raw[ri];
    if(!row)continue;
    const rut=row[9];
    const nombre=row[11]||row[10]; /* Col L o K según la fila */
    if(!nombre)continue;
    const name=String(nombre).trim();
    /* Capturar VACANTE separado para Cuentas Servicios */
    if(/^(VACANTE|Vacante)/.test(name)){
      const cta2=(()=>{const raw2=row[6]?String(row[6]):"";const o={idAgua:"",medAgua:"",idEnel:"",medEnel:""};if(!raw2)return o;const p=raw2.split("||").map(s=>s.trim());const lim=v=>{const t=(v||"").trim();return(!t||t==="?"||t==="-")?"":t;};if(p[0]){const[a,b]=p[0].split("/");o.idAgua=lim(a);o.medAgua=lim(b);}if(p[1]){const[a,b]=p[1].split("/");o.idEnel=lim(a);o.medEnel=lim(b);}return o;})();
      /* Un sitio vacante hoy pudo haber estado ocupado antes: retroceder por
         las columnas mensuales de Arriendo y quedarse con el último mes que
         SÍ tuvo un valor facturado (ej. may-26), aunque los meses posteriores
         estén en cero. El GC/Serv. Admin. no se rastrea igual — queda fijo en
         0, ya que dependerá del contrato nuevo cuando se arriende de nuevo. */
      let vArriendoVal=null,vArriendoLabel=null;
      for(const mc of monthCols){
        const vv=row[mc.col];
        if(typeof vv==="number"&&vv>0&&vv<15000){vArriendoVal=Math.round(vv*100)/100;vArriendoLabel=mc.label;}
      }
      vacantes.push({ri,isVacante:true,nombre:"VACANTE",rut:"",sitio:String(row[7]||"").replace(/\s+/g," ").trim(),edificio:String(row[8]||"").trim(),dir:String(row[10]||"").trim(),
        m2:row[42]!=null&&row[42]!==""?Number(row[42]):null,        /* Col AQ: Metros cuadrados */
        ufM2:row[47]!=null&&row[47]!==""?Number(row[47]):null,      /* Col AV: UF x m2 */
        pctAdm:row[51]!=null&&row[51]!==""?Number(row[51]):null,    /* Col AZ: % Arriendo (Serv. Admin.) */
        arriendoActual:vArriendoVal,mesActual:vArriendoLabel,servAdminActual:0,
        ...cta2});
      continue;
    }
    if(!rut||typeof rut!=="string")continue;
    if(!rut.match(/\d+\.\d+/))continue;
    if(SKIP.test(name)||name.includes("Total")||name.startsWith("#")||name==="")continue;
    const ufArr=typeof row[47]==="number"?row[47]:0;
    const pctAdm=row[51];
    let ufSrv=0;
    if(typeof pctAdm==="number"&&pctAdm>0&&pctAdm<1) ufSrv=ufArr*pctAdm;
    else if(typeof pctAdm==="number"&&pctAdm>=1&&pctAdm<=10) ufSrv=pctAdm;
    const monthly={};

    for(const mc of monthCols){

      if(typeof v==="number"&&v>0&&v<15000){monthly[mc.key]=Math.round(v*100)/100;currentMonthKey=mc.key;currentMonthLabel=mc.label;}
      if(mc.gcCol>=0){
        const vg=row[mc.gcCol];
        if(typeof vg==="number"&&vg>0&&vg<15000) monthlyGC[mc.key]=Math.round(vg*100)/100;
      }
    }
    /* Tarifa REAL vigente (post-reajuste): el último mes con arriendo
       efectivamente facturado en la planilla, no el valor pactado al inicio
       del contrato (col AV) — así lo pidió el usuario tras notar que AV queda
       desactualizado apenas hay un reajuste. */
    const arriendoActual=currentMonthKey!=null?monthly[currentMonthKey]:null;
    const servAdminActual=currentMonthKey!=null&&monthlyGC[currentMonthKey]!=null?monthlyGC[currentMonthKey]:null;
    /* Conversión serial Excel → fecha legible */
    function serialToDate(v){if(!v||typeof v!=="number")return"";try{const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(v)*86400000);return`${d.getUTCDate().toString().padStart(2,"0")}/${(d.getUTCMonth()+1).toString().padStart(2,"0")}/${d.getUTCFullYear()}`;}catch(e){return"";}}
    /* Col G (row[6]): "idAgua / medAgua || idEnel / medEnel" */
    function parseCuenta(raw){
      const out={idAgua:"",medAgua:"",idEnel:"",medEnel:""};
      if(!raw||typeof raw!=="string")return out;
      const partes=raw.split("||").map(s=>s.trim());
      function limpiar(v){const t=(v||"").trim();return(!t||t==="?"||t==="-")?"":t;}
      if(partes[0]){const[a,b]=partes[0].split("/");out.idAgua=limpiar(a);out.medAgua=limpiar(b);}
      if(partes[1]){const[a,b]=partes[1].split("/");out.idEnel=limpiar(a);out.medEnel=limpiar(b);}
      return out;
    }
    const cta=parseCuenta(row[6]?String(row[6]):"");
    clients.push({
      ri,nombre:name,rut:String(rut).trim(),
      arrendadora:String(row[5]||"").trim(),
      sitio:String(row[7]||"").replace(/\s+/g," ").trim(),
      edificio:String(row[8]||"").trim(),
      dir:String(row[10]||"").trim(),
      idAgua:cta.idAgua,medAgua:cta.medAgua,idEnel:cta.idEnel,medEnel:cta.medEnel,
      email:String(row[12]||"").trim(),
      termContrato:serialToDate(row[14]),   /* Col O: Fecha Inicio Contrato */
      termTermino:serialToDate(row[15]),    /* Col P: Fecha Término Contrato */
      renovacion:row[16]!=null?String(row[16]).trim():"",  /* Col Q: Antelación renovación */
      aviso:row[17]!=null?String(row[17]).trim():"",        /* Col R: Aviso */
      fechaReajuste:serialToDate(row[52]),  /* Col BA: Fecha Reajuste */
      pctReaj:row[53]!=null?String(row[53]):"",            /* Col BB: % Reajuste */
      cadaAnios:row[54]!=null?String(row[54]).trim():"",   /* Col BC: Cada cuántos años */
      m2:row[42]!=null&&row[42]!==""?Number(row[42]):null,   /* Col AQ: Metros cuadrados */
      ufM2:row[47]!=null&&row[47]!==""?Number(row[47]):null, /* Col AV: UF x m2 (tarifa pactada al inicio) */
      arriendoActual,servAdminActual,mesActual:currentMonthLabel, /* Tarifa real vigente, último mes facturado */
      hist:(()=>{
        /* BN=65, cada mes ocupa 4 cols: UF planilla, Facturado, Diferencia, Comentarios */
        /* Desde Abr-2023 hasta el presente */
        const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
        const result=[];

      })(),
      ufArr:Math.round(ufArr*100)/100,
      ufSrv:Math.round(ufSrv*100)/100,
      ufTotal:Math.round((ufArr+ufSrv)*100)/100,
      pctAdm:typeof pctAdm==="number"?pctAdm:0,

  for(const c of clients){
    const s=(c.sitio||"Otro").trim();
    if(!siteMap[s])siteMap[s]={count:0,ufArr:0,ufSrv:0,arrendadora:c.arrendadora||""};
    siteMap[s].count++;
    siteMap[s].ufArr=Math.round((siteMap[s].ufArr+c.ufArr)*100)/100;
    siteMap[s].ufSrv=Math.round((siteMap[s].ufSrv+c.ufSrv)*100)/100;
    if(!siteMap[s].arrendadora&&c.arrendadora)siteMap[s].arrendadora=c.arrendadora;
  }
  const monthTotals={};
  for(const mc of monthCols){
    let totalArr=0;
    for(const c of clients){const v=c.monthly[mc.key];if(v)totalArr+=v;}
    const totalSrv=clients.reduce((s,c)=>s+c.ufSrv,0);
    monthTotals[mc.key]={
      label:mc.label,
      arr:Math.round(totalArr*100)/100,
      srv:Math.round(totalSrv*100)/100,
      total:Math.round((totalArr+totalSrv)*100)/100,
      year:mc.year,
      month:mc.month,
    };
  }
  return{clients,vacantes,siteMap,monthTotals,monthCols};
}

═══════════════════════════════════ */
/* Acepta números reales y texto numérico guardado por error como texto
   (Excel a veces deja una celda en texto en vez de número). El punto es
   siempre el separador decimal (ej. "7.56" → 7,56); si además aparece una
   coma, se asume separador de miles ("1,234.56" → 1234.56) — y viceversa
   si la coma queda más a la derecha que el punto ("1.234,56" → 1234.56).
   Devuelve null si no es interpretable como número. */
function parseNumCelda(v){
  if(typeof v==="number")return v;
  if(typeof v==="string"){
    let s=v.trim();
    const iComa=s.lastIndexOf(","),iPunto=s.lastIndexOf(".");
    if(iComa>=0&&iPunto>=0){
      s=iComa>iPunto?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
    }else if(iComa>=0){
      s=s.replace(",",".");
    }
    /* si solo tiene punto, se deja tal cual — el punto ya es decimal */
    const n=parseFloat(s);
    if(!isNaN(n))return n;
  }
  return null;
}
async function procesarPlanillaFacturacion(file,periodo){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla de facturación");
  /* raw:true para obtener seriales Excel en números; lo usamos para detectar la columna */
  const dataRaw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const mesNum=MES_NUM[periodo.split(" ")[0]];
  const anio=parseInt(periodo.split(" ")[1]);
  let colGS=-1,colGT=-1,colEnviado=-1,colPagado=-1,colPagadoArr=-1,colPagadoGC=-1;

  function esTargetMes(val){
    if(val===null||val===undefined)return false;
    if(typeof val==="number"&&val>40000&&val<60000){
      const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(val)*86400000);
      return d.getUTCFullYear()===anio&&(d.getUTCMonth()+1)===mesNum;
    }
    if(typeof val==="string"){try{const d=new Date(val);if(!isNaN(d))return d.getFullYear()===anio&&(d.getMonth()+1)===mesNum;}catch(e){}}
    return false;
  }

  /* Fechas en fila 3 (índice 2) */
  const fila3=dataRaw[2]||[];
  for(let i=64;i<fila3.length;i++){
    if(esTargetMes(fila3[i])){
      colGS=i;
      /* Buscar 'GC' (Serv.Adm.) dinámicamente: en planillas antiguas está en i+1, en nuevas puede estar en i+2+ por columnas extra */
      for(let j=i+1;j<=Math.min(i+6,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim()==="GC"){colGT=j;break;}}
      if(colGT===-1)colGT=i+1;
      /* Buscar 'Pago Arriendo' dinámicamente (columna dedicada, agregada desde Mayo 2026 junto a Nro Fact Arriendo) */
      for(let j=i+1;j<=Math.min(i+6,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim().toLowerCase()==="pago arriendo"){colPagadoArr=j;break;}}
      /* Buscar 'Pago GC' dinámicamente (columna dedicada, agregada desde Mayo 2026 junto a Nro Fact GC) */
      for(let j=colGT+1;j<=Math.min(colGT+6,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim().toLowerCase()==="pago gc"){colPagadoGC=j;break;}}
      /* Buscar 'Correo Enviado' dinámicamente */
      for(let j=i+1;j<=Math.min(i+10,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim().toLowerCase().includes("correo enviado")){colEnviado=j;break;}}
      if(colEnviado===-1)colEnviado=i+3;
      /* Buscar 'Pagado' dinámicamente — columna compartida, respaldo para períodos anteriores
         a Mayo 2026 que no tienen 'Pago Arriendo'/'Pago GC' separados */
      for(let j=i+1;j<=Math.min(i+10,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim().toLowerCase()==="pagado"){colPagado=j;break;}}
      if(colPagado===-1)colPagado=i+4;
      break;
    }
  }
  if(colGS===-1)throw new Error(`No se encontró columna para ${periodo}. Verifica que la planilla tenga ese mes.`);

  const excl=["","VACANTE","Nombre Cliente","Areas Comunes Edificio","Areas comunes Edificio (Subterraneos)","Area Comun"];
  const clientes=[];
  for(let i=4;i<dataRaw.length;i++){
    const row=dataRaw[i];if(!row)continue;
    const sitio=row[7];
    const cliente=row[11];
    /* Tolerar celdas guardadas como texto con coma decimal (ej. "7,56"),
       que a veces quedan así por formato de celda en vez de número real —
       antes se descartaban silenciosamente por no ser typeof "number". */
    const ufGS=parseNumCelda(row[colGS]);
    const ufGT=parseNumCelda(row[colGT]);
    if(!cliente||excl.includes(String(cliente).trim()))continue;
    const sName=String(cliente).trim();
    const sociedad=row[5]?String(row[5]).trim():""; /* Col F: Sociedad Arrendadora (PISA, SÁNCHEZ, ...) */
    const afecto=row[48]?String(row[48]).trim():""; /* Col AW: Afecto / Exento IVA */
    const sito=sitio?String(sitio).trim():"";
    const edif=row[8]?String(row[8]).trim():""; /* Col I: nro local / bodega / edif */
    const emailBilling=row[12]?String(row[12]).trim():"";
    const rutBilling=row[9]?String(row[9]).replace(/\./g,"").trim().toLowerCase():""; /* Col J: RUT normalizado */
    const yaEnviado=colEnviado>0&&row[colEnviado]&&String(row[colEnviado]).trim().toLowerCase()==="enviado";
    const yaPagado=colPagado>0&&row[colPagado]&&String(row[colPagado]).trim()!==""; /* compartida — respaldo meses previos a Pago Arriendo/Pago GC */
    const sheetRow=i+1; /* fila 1-indexed en el Sheets (dataRaw[i] = fila i+1) */
    const sentColLetter=colIndexToLetter(colEnviado); /* columna dinámica: HC para Junio, HG para Julio, etc. */
    const pagadoColLetter=colPagado>0?colIndexToLetter(colPagado):"";
    /* Pago Arriendo / Pago GC por separado (desde Mayo 2026) — si el período no tiene
       la columna dedicada, cada concepto cae de vuelta a la columna "Pagado" compartida */
    const yaPagadoArr=colPagadoArr>0?!!(row[colPagadoArr]&&String(row[colPagadoArr]).trim()!==""):yaPagado;
    const yaPagadoGC=colPagadoGC>0?!!(row[colPagadoGC]&&String(row[colPagadoGC]).trim()!==""):yaPagado;
    const pagadoArrColLetter=colPagadoArr>0?colIndexToLetter(colPagadoArr):pagadoColLetter;
    const pagadoGCColLetter=colPagadoGC>0?colIndexToLetter(colPagadoGC):pagadoColLetter;
    const nroFactArrColLetter=colIndexToLetter(colGS+1); /* Nro Fact Arriendo = columna inmediata después del UF Arriendo */
    const nroFactGCColLetter=colGT>0?colIndexToLetter(colGT+1):"";   /* Nro Fact GC = columna inmediata después del UF GC */
    /* Leer nros de factura ya escritos en planilla (si existen) — evitan re-procesar ZIP */
    const _nfArr=row[colGS+1];const nroFactArr=(typeof _nfArr==="number"&&_nfArr>0)?String(Math.round(_nfArr)):(typeof _nfArr==="string"&&_nfArr.trim())?_nfArr.trim():null;
    const _nfGC=colGT>0?row[colGT+1]:null;const nroFactGC=(typeof _nfGC==="number"&&_nfGC>0)?String(Math.round(_nfGC)):(typeof _nfGC==="string"&&_nfGC.trim())?_nfGC.trim():null;
    const m2Billing=row[42]!=null&&row[42]!==""?Number(row[42]):null; /* Col AQ: m² */
    if(ufGS!=null&&ufGS>0)clientes.push({sitio:sito,edificio:edif,cliente:sName,sociedad,afecto,tipo:"arriendo",uf:Math.round(ufGS*10000)/10000,email:emailBilling,rut:rutBilling,yaEnviado,yaPagado:yaPagadoArr,sheetRow,sentColLetter,pagadoColLetter:pagadoArrColLetter,nroFactArrColLetter,nroFactGCColLetter,nroFactArr,nroFactGC,m2:m2Billing});
    if(ufGT!=null&&ufGT>0&&ufGT<=999999)clientes.push({sitio:sito,edificio:edif,cliente:sName,sociedad,afecto,tipo:"serv_adm",uf:Math.round(ufGT*10000)/10000,email:emailBilling,rut:rutBilling,yaEnviado,yaPagado:yaPagadoGC,sheetRow,sentColLetter,pagadoColLetter:pagadoGCColLetter,nroFactArrColLetter,nroFactGCColLetter,nroFactArr,nroFactGC,m2:m2Billing});
  }
  return clientes;
}
/* ── Días de mora por cliente desde "Facturas x Cobrar PISA" (mismo criterio que FactxCobrarView) ── */
/* Ignora el dígito verificador — el archivo "Facturas x Cobrar" a veces lo
   trae corrupto (ej. "77478992-C" en vez de "77478992-8"), así que se
   compara solo el cuerpo numérico del RUT contra la Planilla. */
function _rutNormMora(r){const s=(r||"").replace(/\./g,"").replace(/-/g,"").toLowerCase();return s.slice(0,-1);}
function parseFacturasPorCobrarBase(values){
  if(!values||values.length<2)throw new Error("Sin datos en hoja Base");
  const hdr=values[0].map(h=>String(h||"").toLowerCase().replace(/[\r\n\s_]/g,""));
  function fi(tests){for(let i=0;i<hdr.length;i++)for(const t of tests)if(hdr[i].includes(t))return i;return -1;}
  const iCod=fi(["cod"])>=0?fi(["cod"]):3;
  const iCliente=fi(["cliente"])>=0?fi(["cliente"]):4;
  const iDiasDoc=fi(["diasdoc","ddoc","diaspag"])>=0?fi(["diasdoc","ddoc","diaspag"]):11;
  const iMonto=fi(["monto","c/d(ml)","c/d(m"])>=0?fi(["monto","c/d(ml)","c/d(m"]):13;
  const iSdo=fi(["sdo","vencido"])>=0?fi(["sdo","vencido"]):14;
  function n(v){return parseFloat(String(v||"0").replace(/[^0-9.\-]/g,""))||0;}
  return values.slice(1)
    .filter(r=>r.length>4&&String(r[iCliente]||"").trim()!==""&&String(r[iCliente]||"").trim()!=="Cliente")
    .map(r=>({rut:String(r[iCod]||"").trim(),cliente:String(r[iCliente]||"").trim(),diasDoc:n(r[iDiasDoc]),monto:n(r[iMonto]),sdoVencido:n(r[iSdo])}))
    .filter(r=>r.monto>0||r.sdoVencido>0);
}
/* Descubre y carga el último "F x Cobrar Pisa *.xlsx" en Drive, agregado por RUT → {maxDias,totalDeuda,nombre} */
async function fetchFacturasPorCobrarMora(){
  const ls1=await fetch("/api/historial?ls="+DRIVE_FACTURACION_FOLDER_ID).then(r=>r.json());
  const sub=(ls1.files||[]).find(f=>f.name.toLowerCase().includes("cobrar")&&(f.mimeType||"").includes("folder"));
  if(!sub)return null;
  const ls2=await fetch("/api/historial?ls="+sub.id).then(r=>r.json());
  function dateKey(name){const m=name.match(/(\d{2})-(\d{2})-(\d{4})/);return m?m[3]+m[2]+m[1]:name;}
  const xl=(ls2.files||[]).filter(f=>f.name.toLowerCase().endsWith(".xlsx")).sort((a,b)=>dateKey(a.name).localeCompare(dateKey(b.name)));
  if(!xl.length)return null;
  const last=xl[xl.length-1];
  const buf=await fetch("/api/historial?fileId="+last.id).then(r=>r.arrayBuffer());
  const wb=XLSX.read(new Uint8Array(buf),{type:"array",cellDates:true});
  const ws=wb.Sheets["Base"]||wb.Sheets["base"]||wb.Sheets["BASE"]||wb.Sheets[wb.SheetNames[0]];
  if(!ws)return null;
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  const rows=parseFacturasPorCobrarBase(raw);
  const porRut={};
  rows.forEach(r=>{
    const key=_rutNormMora(r.rut);
    if(!key)return;
    if(!porRut[key])porRut[key]={maxDias:0,totalDeuda:0,nombre:r.cliente};
    porRut[key].totalDeuda+=r.monto;
    if(r.diasDoc>porRut[key].maxDias)porRut[key].maxDias=r.diasDoc;
  });
  return{porRut,fecha:dateKey(last.name)};
}
/* ── Lee la planilla para TODOS los meses del año dado ─────────────────────── */
async function leerHistorialAnio(xlsxFile, anio){
  const MESES_N=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const buf=await readFileAsBuffer(xlsxFile);
  const wb=XLSX.read(buf,{cellStyles:true,raw:true});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error('Hoja "Flujo" no encontrada');
  const dataRaw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const fila3=dataRaw[2]||[];

  /* Detectar columnas de cada mes */
  const mesesMap={};
  for(let i=0;i<fila3.length;i++){
    const val=fila3[i];if(!val)continue;
    let d=null;
    if(typeof val==="number"&&val>40000&&val<60000)
      d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(val)*86400000);
    else if(typeof val==="string"){try{const p=new Date(val);if(!isNaN(p))d=p;}catch(e){}}
    if(!d||d.getUTCFullYear()!==anio)continue;
    const mesIdx=d.getUTCMonth();
    const mesNombre=MESES_N[mesIdx];
    const mesNum=mesIdx+1;
    if(mesesMap[mesNombre])continue; /* solo primer hit por mes */
    /* Buscar GC y Correo Enviado dinámicamente (la posición varía según versión de planilla) */
    let gtCol=-1;for(let j=i+1;j<=Math.min(i+6,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim()==="GC"){gtCol=j;break;}}
    if(gtCol===-1)gtCol=i+1;
    let envCol=-1;for(let j=i+1;j<=Math.min(i+10,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim().toLowerCase().includes("correo enviado")){envCol=j;break;}}
    mesesMap[mesNombre]={colGS:i,colGT:gtCol,colEnviado:envCol,mesNum};
  }

  const excl=["","VACANTE","Nombre Cliente","Areas Comunes Edificio","Areas comunes Edificio (Subterraneos)","Area Comun"];
  const historial={};

  for(let i=4;i<dataRaw.length;i++){
    const row=dataRaw[i];if(!row)continue;
    const cli=row[11];if(!cli||excl.includes(String(cli).trim()))continue;
    const nombre=String(cli).trim();
    const correo=row[12]?String(row[12]).trim():"";
    const rut=row[9]?String(row[9]).trim():"";
    if(!historial[nombre])historial[nombre]={correo,rut,meses:{}};
    for(const[mes,cols]of Object.entries(mesesMap)){
      const ufArr=typeof row[cols.colGS]==="number"&&row[cols.colGS]>0?row[cols.colGS]:null;
      const ufAdm=typeof row[cols.colGT]==="number"&&row[cols.colGT]>0&&row[cols.colGT]<999999?row[cols.colGT]:null;
      if(!ufArr&&!ufAdm)continue;
      const yaEnviado=cols.colEnviado>0&&row[cols.colEnviado]&&String(row[cols.colEnviado]).trim().toLowerCase()==="enviado";
      if(!historial[nombre].meses[mes])
        historial[nombre].meses[mes]={ufArriendo:ufArr,ufServAdm:ufAdm,yaEnviado:!!yaEnviado,sheetRow:i+1,sentColLetter:cols.colEnviado>0?colIndexToLetter(cols.colEnviado):"HC",mesNum:cols.mesNum};
      else{
        const ex=historial[nombre].meses[mes];
        if(ufArr)ex.ufArriendo=ufArr;if(ufAdm)ex.ufServAdm=ufAdm;if(yaEnviado)ex.yaEnviado=true;
      }
    }
  }
  return{historial,mesesOrden:MESES_N.filter(m=>mesesMap[m])};
}

/* ── Guarda el mapping factura→cliente en Drive tras procesar() ─────────────── */
async function guardarHistorialPeriodo(anio,periodo,filas){
  const data={};
  for(const f of filas){
    if(!f.factura)continue;
    if(!data[f.cliente])data[f.cliente]={};
    /* Guardar con estructura {CLIENTE:{SITIO:{arriendo,servAdm}}} para que
       batchPeriodo pueda desambiguar por sitio (igual que historial-excel-2026.json) */
    const sitioKey=f.sitio||"default";
    if(!data[f.cliente][sitioKey])data[f.cliente][sitioKey]={};
    const conc=(f.concepto||"").toLowerCase();
    const obj={nro:f.factura,uf:f.ufPdf??f.uf??null,total:f.montoTotal||null};
    if(conc==="arriendo")data[f.cliente][sitioKey].arriendo=obj;
    else if(conc==="serv. adm."||conc==="serv_adm")data[f.cliente][sitioKey].servAdm=obj;
    else if(conc==="habilitación"||conc==="habilitacion")data[f.cliente][sitioKey].habilitacion=obj;
  }
  if(!Object.keys(data).length)return;
  try{
    await fetch("/api/historial",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({anio:String(anio),periodo,data})});
  }catch(e){console.warn("guardarHistorial:",e.message);}
}

async function extraerTextoPDF(arrayBuffer){
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    let texto="";
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      texto+=content.items.map(it=>it.str).join(" ")+"\n";
    }
    return texto;
  }catch(e){console.warn("pdfjs error:",e.message);return"";}
}

async function procesarPDFs(zipFile,addLog){
  const buf=await readFileAsBuffer(zipFile);
  const zip=await JSZip.loadAsync(buf);
  const pdfs=[];
  const archivos=Object.keys(zip.files).filter(f=>f.toLowerCase().endsWith(".pdf"));
  addLog(`▶ ${archivos.length} PDFs encontrados en el ZIP`,"info");

  for(const path of archivos){
    const parts=path.split("/");
    const carpeta=parts.length>1?parts[parts.length-2]:"";
    const nombre=parts[parts.length-1];
    const sitio=SITIO_MAP[carpeta]||carpeta;

    /* Número y nombre desde archivo: "F-14540 Ingersoll Rand.pdf" */
    const nroMatch=nombre.match(/^(F(?:EE)?-\d+)\s*(.+)?\.pdf$/i);
    if(!nroMatch)continue;
    const nroFact=nroMatch[1].toUpperCase();
    const nombreEnArchivo=(nroMatch[2]||"").trim().toLowerCase();
      const pdfBuf=await zip.files[path].async("arraybuffer");
      const texto=await extraerTextoPDF(pdfBuf);
      const textoJ=texto.replace(/\s+/g," ");
      const tipo=textoJ.includes("Serv. Adm.")||textoJ.includes("Serv.Adm.")?"serv_adm":textoJ.includes("Habilitaci")?"habilitacion":textoJ.includes("Arriendo")?"arriendo":nroFact.startsWith("FEE-")?"serv_adm":"arriendo";

    /* Extraer UF del texto del PDF — 3 patrones + fallback flat */
    let ufPdf=null,ufValorPdf=null;
    const _parseChile=s=>parseFloat(s.replace(/\./g,"").replace(",","."));
    try{
      if(texto.length>10){
        const flat0=texto.replace(/\s+/g," ");
        /* P1: Cant/Unidad "11,84 UF" o "12,8 UF" — máx 2 decimales (3 dígitos = separador de miles CLP, no decimal UF) */
        /* P1a: "12,80 UF 40.833,91" – captura cantidad Y valor UF */
        let m=flat0.match(/([\d]{1,3}[,.][\d]{1,2})\s*UF\s+([\d]{2,3}(?:[.][\d]{3})*(?:[,]\d+)?)/i);
        if(m){ufPdf=parseFloat(m[1].replace(",","."));ufValorPdf=_parseChile(m[2]);}
        /* P1b: fallback – solo cantidad UF (el valor no está visible junto) */
        if(!ufPdf){m=flat0.match(/([\d]{1,3}[,.][\d]{1,2})\s*UF\b/i);if(m)ufPdf=parseFloat(m[1].replace(",","."));}
        /* P2: descripción "UF 85,37 x 40186" — número DESPUÉS de UF (Arriendo) */
        if(!ufPdf){m=flat0.match(/UF\s*([\d]+(?:[,.][\d]+)?)\s*x\s*([\d]{2,3}(?:[.][\d]{3})*(?:[,]\d+)?)/);if(m){ufPdf=parseFloat(m[1].replace(",","."));if(m[2])ufValorPdf=_parseChile(m[2]);}}
        /* P3: fallback — "UF X,XX x " o "(X,XX) x NN" */
        if(!ufPdf){
          m=flat0.match(/UF\s*([\d]+(?:[,.][\d]+)?)\s*x\s/);if(m) ufPdf=parseFloat(m[1].replace(",","."));
          if(!ufPdf){m=flat0.match(/([\d]+[,.][\d]+)\s*x\s*\d{2}/);if(m) ufPdf=parseFloat(m[1].replace(",","."));}
        }
        /* P4: precio CLP fijo "1 UNID 317.000" — Serv. Adm. sin UF */
        if(!ufPdf){
          m=flat0.match(/1\s*UNID\s+([\d]+(?:\.[\d]{3})+(?:,[\d]+)?)/i)
            ||flat0.match(/1\s*UNID\s+([\d]{4,})/i);
          if(m){const raw=m[1].replace(/\./g,"").replace(",",".");ufPdf=parseFloat(raw)||null;}
        }
        /* P5: Cant/Unidad "12,8 UF" — decimal con 1 solo dígito (Serv. Adm. con UF) */
        if(!ufPdf){
          m=flat0.match(/([\d]{1,3}[,.]\d)\s*UF\b/i);
          if(m){const v=parseFloat(m[1].replace(",","."));if(v>=0.1&&v<9999)ufPdf=v;}
        }
        if(ufPdf) ufPdf=Math.round(ufPdf*10000)/10000;
        if(ufValorPdf&&(ufValorPdf<25000||ufValorPdf>80000))ufValorPdf=null;
      }
    }catch(e){}

    /* Extraer Monto Total del PDF
       pdf.js puede extraer columnas en orden visual (todas etiquetas, luego todos valores):
       "Monto Neto Monto Exento 19% IVA Monto Total 3.807.328 547.200 723.392 5.077.920"
       Por eso NO tomamos el primer número tras "Monto Total", sino el MAYOR de todos
       los números que aparecen después de esa etiqueta (el total siempre es la suma). */
    let montoTotal=null,ivaAmount=null;
    try{
      if(texto.length>10){
        const flat=texto.replace(/\s+/g," ");
        console.log(`[pdf-texto] ${nroFact}: "${flat.slice(-600)}"`);
        /* pdf.js puede entregar texto en orden variable según cómo fue construido el PDF:
           A) Etiquetas primero, valores después: "Monto Neto 19% IVA Monto Total → 835.012 158.701 993.713"
           B) Valores primero, etiquetas después: "835.012 158.701 993.713 → Monto Neto 19% IVA Monto Total"
           → Buscamos todos los números en un radio de 300 chars alrededor de "Monto Total"
             en ambas direcciones y tomamos el máximo (el total siempre es la suma mayor). */
        const parseAmts=str=>[...str.matchAll(/([\d]+(?:\.[\d]{3})+|[\d]{5,})/g)]
          .map(m=>parseInt(m[1].replace(/\./g,""),10)).filter(n=>n>=50000&&n<=25000000);
        const mtIdx=flat.toLowerCase().indexOf("monto total");
        if(mtIdx>=0){
          const numsAfter=parseAmts(flat.slice(mtIdx+"monto total".length));
          const numsBefore=parseAmts(flat.slice(Math.max(0,mtIdx-300),mtIdx));
          const cands=[...numsAfter,...numsBefore];
          if(cands.length>0) montoTotal=Math.max(...cands)||null;
        }
        /* Fallback final: máximo valor de rango facturable en los últimos 500 chars del PDF */
        if(!montoTotal){
          const tailNums=parseAmts(flat.slice(-500));
          if(tailNums.length>0) montoTotal=Math.max(...tailNums)||null;
        }
        if(!montoTotal){
          /* Fallback: extraer IVA para estimación neto + IVA en columna */
          const im=flat.match(/19%\s*IVA\s*([\d]+(?:\.[\d]{3})+)/i)
            ||flat.match(/IVA\s+([\d]+(?:\.[\d]{3})+)/i)
            ||flat.match(/19%\s*IVA\s*([\d]{3,})/i)
            ||flat.match(/IVA\s+([\d]{3,})/i);
          if(im) ivaAmount=parseInt(im[1].replace(/\./g,""),10)||null;
          console.log(`[monto] ${nroFact}: Monto Total no encontrado, IVA=${ivaAmount}`);
        } else {
          console.log(`[monto] ${nroFact}: Monto Total = $${montoTotal.toLocaleString("es-CL")}`);
        }
      }
    }catch(e){console.warn("[monto] error:",e.message);}

    pdfs.push({sitio,nroFact,tipo,ufPdf,ufValor:ufValorPdf,montoTotal,ivaAmount,nombreEnArchivo,zipPath:path,pdfNombre:nombre});
  }

  const conUF=pdfs.filter(p=>p.ufPdf!==null).length;
  addLog(`✓ ${pdfs.length} PDFs: ${conUF} con UF, ${pdfs.length-conUF} sin UF`,"ok");
  addLog(`  Sitios: ${[...new Set(pdfs.map(p=>p.sitio))].join(", ")}`,"info");
  pdfs.slice(0,2).forEach(p=>addLog(`  ${p.nroFact} ${p.sitio} ${p.tipo} UF=${p.ufPdf} "${p.nombreEnArchivo}"`,"info"));
  return pdfs;
}
async function getPdfBase64FromZip(zipFile,zipPath){
  const buf=await readFileAsBuffer(zipFile);
  const zip=await JSZip.loadAsync(buf);
  const pdfBuf=await zip.files[zipPath].async("uint8array");
  let binary="";const chunkSize=8192;
  for(let i=0;i<pdfBuf.length;i+=chunkSize)binary+=String.fromCharCode(...pdfBuf.slice(i,i+chunkSize));
  return btoa(binary);
}

async function getPdfBase64FromDrive(fileId){
  const r=await fetch(`/api/historial?fileId=${fileId}`);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const buf=await r.arrayBuffer();
  const arr=new Uint8Array(buf);
  let binary="";const chunk=8192;
  for(let i=0;i<arr.length;i+=chunk)binary+=String.fromCharCode(...arr.slice(i,i+chunk));
  return btoa(binary);
}

async function procesarHabilitacionesDrive(periodo,clientes,addLog){
  const HAB_FOLDER="1O1nBsti_reAKnAXXKdL2opNWz1ocZu8u";
  const MESES_ES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};
  const parts=periodo.split(" ");
  if(parts.length<2)return[];
  const mesNum=MESES_ES[parts[0].toLowerCase()];
  const anioNum=parseInt(parts[1]);
  if(!mesNum||!anioNum)return[];
  const resultado=[];
  const vistosNro=new Set();
  try{
    const r=await fetch(`/api/historial?ls=${HAB_FOLDER}`);
    if(!r.ok)return[];
    const {files}=await r.json();
    if(!files?.length){addLog("ℹ Carpeta Habilitaciones vacía","info");return[];}
    addLog(`📁 Habilitaciones Drive: ${files.length} archivo(s)`,"info");
    for(const file of files.filter(f=>f.name.toLowerCase().endsWith(".pdf"))){
      try{
        const pdfR=await fetch(`/api/historial?fileId=${file.id}`);
        if(!pdfR.ok)continue;
        const pdfBuf=await pdfR.arrayBuffer();
        const texto=await extraerTextoPDF(pdfBuf);
        const flat=texto.replace(/\s+/g," ");

        /*  Estrategia: encontrar todos los Nº de documento en el texto,
            para cada uno tomar el contexto hasta el siguiente Nº,
            verificar: 1) no es Nota de Crédito, 2) descripción dice "Habilitaci",
            3) fecha de emisión coincide con el periodo */
        const nroRe=/N[º°]\s*(\d{4,6})/g;
        const nros=[...flat.matchAll(nroRe)];
        for(let ni=0;ni<nros.length;ni++){
          const posStart=Math.max(0,nros[ni].index-300); /* incluir cabecera */
          const posEnd=ni+1<nros.length?nros[ni+1].index:flat.length;
          const ctx=flat.slice(posStart,posEnd);
          /* Saltar Notas de Crédito */
          if(/NOTA\s+DE\s+CR[EÉ]DITO/i.test(ctx))continue;
          /* Solo facturas de habilitación — la descripción lo confirma */
          if(!/Habilitaci/i.test(ctx))continue;
          /* N° de factura de este bloque */
          const nroM=ctx.match(/N[º°]\s*(\d{4,6})/);
          if(!nroM)continue;
          const nroFact="F-"+nroM[1];
          if(vistosNro.has(nroFact))continue;
          /* Fecha de emisión: "5 de junio de 2026" */
          const fechaM=ctx.match(/(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+de\s+(\d{4})/i);
          if(!fechaM)continue;
          const mesFact=MESES_ES[fechaM[2].toLowerCase()];
          const anioFact=parseInt(fechaM[3]);
          if(mesFact!==mesNum||anioFact!==anioNum)continue;
          /* Cliente y RUT */
          const cliM=ctx.match(/Se[nñ]or\(es\)\s+(.+?)\s+RUT\s+([\d.]+-[\dkK])/i);
          const clienteNombre=cliM?cliM[1].trim():"";
          const rut=cliM?cliM[2].trim():"";
          /* UF desde Cant/Unidad: "157,14 UF" */
          let ufPdf=null;
          const ufM=ctx.match(/([\d]+[,.][\d]+)\s*UF/);
          if(ufM)ufPdf=parseFloat(ufM[1].replace(",","."));
          /* Monto Total CLP */
          let montoTotal=null;
          const mtM=ctx.match(/Monto\s*Total\s*([\d.]+)/i);
          if(mtM)montoTotal=parseInt(mtM[1].replace(/\./g,""),10)||null;
          /* Email desde planilla por RUT */
          const rutNorm=rut.replace(/[.\-]/g,"").toLowerCase();
          const cPlan=clientes.find(c=>c.rut&&c.rut.replace(/[.\-]/g,"").toLowerCase()===rutNorm);
          vistosNro.add(nroFact);
          addLog(`  ✓ Hab ${nroFact} | ${(clienteNombre||rut).slice(0,30)} | UF ${ufPdf} | $${montoTotal?montoTotal.toLocaleString("es-CL"):"?"}`,"ok");
          resultado.push({
            sitio:cPlan?.sitio||"",edificio:cPlan?.edificio||"",
            clienteNombre:clienteNombre||cPlan?.cliente||rut,rut,
            correo:cPlan?.email||"",
            nroFact,tipo:"habilitacion",
            ufPdf,montoTotal,ivaAmount:null,
            yaEnviado:false,
            sheetRow:cPlan?.sheetRow||null,
            sentColLetter:cPlan?.sentColLetter||"HC",
            driveFileId:file.id,pdfNombre:file.name,
          });
        }
      }catch(eFile){addLog(`  ⚠ ${file.name}: ${eFile.message}`,"warn");}
    }
  }catch(e){addLog("⚠ Error habilitaciones Drive: "+e.message,"warn");}
  return resultado;
}

   DETALLE VENTAS — Cruce Odoo vs SII
   via /api/cruce (automático)
═══════════════════════════════════ */
function VentasView({periodo}){
  const [empresas, setEmpresas] = React.useState([
    {id:"multi", nombre:"Distribuidora Sánchez 4G", rut:"77.538.786-6", result:null, loading:false, error:null},
    {id:"dko",   nombre:"Sánchez Hermanos",         rut:"77.454.587-5", result:null, loading:false, error:null},
  ]);
  const [activeEmp, setActiveEmp] = React.useState("multi");
  const fmtCLP = v => "$"+Math.round(v).toLocaleString("es-CL");

  const getMes = (p) => {
    const MN={"Enero":"01","Febrero":"02","Marzo":"03","Abril":"04","Mayo":"05","Junio":"06","Julio":"07","Agosto":"08","Septiembre":"09","Octubre":"10","Noviembre":"11","Diciembre":"12"};
    const [nom,anio] = (p||periodo).split(" ");
    return `${anio}-${MN[nom]||"05"}`;
  };

  // mes se pasa como argumento — sin closures sobre periodo
  const cargarEmpresa = React.useCallback(async (empId, mes) => {
    setEmpresas(prev => prev.map(e => e.id===empId ? {...e, loading:true, error:null} : e));
    try {
      const res = await fetch(`/api/cruce?empresa=${empId}&mes=${mes}`);
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "Error al cruzar");
      setEmpresas(prev => prev.map(e => e.id===empId ? {...e, loading:false, error:null, result:data} : e));
    } catch(err) {
      setEmpresas(prev => prev.map(e => e.id===empId ? {...e, loading:false, error:err.message} : e));
    }
  }, []);

  React.useEffect(() => {
    if (!periodo || !periodo.includes(" ")) return;
    const mes = getMes(periodo);
    setEmpresas(p => p.map(e => ({...e, result:null, error:null})));
    cargarEmpresa("multi", mes);
    cargarEmpresa("dko", mes);
  }, [periodo]);

  const emp = empresas.find(e => e.id===activeEmp);
  const r   = emp?.result;
  // allLoaded = true cuando todas las empresas terminaron (resultado o error)
  const allLoaded = empresas.every(e => !e.loading);

  const totalCoinciden = empresas.reduce((s,e) => s+(e.result?.coinciden||0), 0);
  const totalFacturas  = empresas.reduce((s,e) => s+(e.result?.odoo_count||0), 0);
  const totalNeto      = empresas.reduce((s,e) => s+(e.result?.total_odoo_neto ?? e.result?.total_odoo ?? 0), 0);
  const totalAlertas   = empresas.reduce((s,e) => s+(e.result?.solo_odoo?.length||0)+(e.result?.diff_monto?.length||0), 0);
  const pct = r ? Math.round(r.coinciden / Math.max(r.odoo_count,1) * 100) : 0;

  return h("main",{style:{flex:1,overflowY:"auto",padding:"20px 24px",display:"flex",flexDirection:"column",gap:18},className:"fade-up"},

    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}},
      h("div",null,
        h("div",{style:{fontSize:13,color:"var(--txm)"}},"Cruce automático Odoo vs SII · Facturas tipo 33 · "+periodo)
      ),
      h("button",{
        onClick:()=>{const mes=getMes(periodo); setEmpresas(p=>p.map(e=>({...e,result:null,error:null}))); cargarEmpresa("multi",mes); cargarEmpresa("dko",mes);},
        style:{fontSize:11,padding:"5px 14px",borderRadius:8,border:"1px solid var(--bdr)",background:"var(--surf2)",color:"var(--txm)",cursor:"pointer",display:"flex",alignItems:"center",gap:5}
      },"↻ Actualizar")
    ),

    /* KPIs */
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}},
      [
        {lbl:"Facturas Odoo",    val:allLoaded?totalFacturas:"—",  sub:"ambas empresas",           col:"var(--accl)"},
        {lbl:"Coinciden SII",    val:allLoaded?totalCoinciden:"—", sub:"Odoo = SII monto exacto",  col:"var(--green)"},
        {lbl:"Alertas",          val:allLoaded?totalAlertas:"—",   sub:totalAlertas===0?"✓ Sin diferencias":"requieren revisión", col:totalAlertas>0?"var(--red)":"var(--green)"},
        {lbl:"Total Neto",       val:allLoaded?fmtCLP(totalNeto):"—", sub:"facturas − NC · ambas empresas", col:"var(--blue)", mono:true},
      ].map((k,i) => h("div",{key:i,className:"dash-card",style:{borderLeft:"3px solid "+k.col}},
        h("div",{className:"dash-card-lbl"},k.lbl),
        h("div",{style:{fontSize:k.mono?15:28,fontWeight:700,fontFamily:"'DM Mono',monospace",color:k.col,lineHeight:1,marginTop:2,letterSpacing:"-1px"}},
          !allLoaded ? h("span",{className:"spin",style:{fontSize:16}},"⟳") : k.val
        ),
        h("div",{className:"dash-card-sub"},k.sub)
      ))
    ),

    /* Selector empresa */
    h("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
      empresas.map(e => {
        const isActive = activeEmp===e.id;

        return h("button",{key:e.id, onClick:()=>{ setActiveEmp(e.id); if(!e.result&&!e.loading&&!e.error) cargarEmpresa(e.id); },

function HistPanel({client,anio,setAnio,onClose}){
  if(!client)return null;
  const MESES_FULL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const anios=[...new Set(client.hist.map(r=>r.anio))].sort((a,b)=>b-a);
  const filas=client.hist.filter(r=>r.anio===anio);
  const fmt=v=>v!=null?v.toFixed(2):"S/Inf";
  const [ufDia5Map,setUfDia5Map]=React.useState({});
  React.useEffect(()=>{
    // Cargar UF día 5 para cada mes del año visible
    const meses=[...new Set(filas.map(r=>r.mes+1))];
    Promise.all(meses.map(async mes=>{
      const v=await getUFDia5(anio,mes);
      return[anio+"-"+String(mes).padStart(2,"0"),v?Math.round(v*100)/100:null];
    })).then(pairs=>{
      setUfDia5Map(Object.fromEntries(pairs));
    });
  },[anio,client]);
  const fmtDif=v=>{
    if(v==null)return h("span",{className:"hist-null"},"S/Inf");
    if(Math.abs(v)<0.01)return h("span",{style:{color:"var(--txm)"}},v.toFixed(2));
    return h("span",{className:v>0?"hist-dif-pos":"hist-dif-neg"},(v>0?"+":"")+v.toFixed(2));
  };
  return h("div",{className:"hist-panel"},
    h("div",{style:{padding:"12px 16px",borderBottom:"1px solid var(--bdr)",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",background:"#f8fbff"}},
      h("div",{style:{flex:1}},
        h("span",{style:{fontSize:13,fontWeight:700,color:"var(--tx)"}},"📋 Historial — "+client.nombre),
        h("span",{style:{fontSize:11,color:"var(--txm)",marginLeft:8,fontFamily:"'DM Mono',monospace"}},formatRUT(client.rut)),
        h("span",{style:{fontSize:11,color:"var(--txm)",marginLeft:8}},"Sitio: "+client.sitio)
      ),
      h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
        h("span",{style:{fontSize:11,color:"var(--txm)"}},"Año:"),
        anios.map(a=>h("button",{
          key:a,
          onClick:()=>setAnio(a),
          style:{padding:"3px 12px",borderRadius:6,border:"1px solid "+(a===anio?"var(--acc)":"var(--bdr)"),
            background:a===anio?"var(--acc)":"var(--surf2)",color:a===anio?"#fff":"var(--txm)",
            fontSize:11,fontWeight:a===anio?700:400,cursor:"pointer"}
        },a))
      ),
      h("button",{
        onClick:onClose,
        style:{padding:"3px 10px",borderRadius:6,border:"1px solid var(--bdr)",background:"var(--surf2)",color:"var(--txm)",fontSize:11,cursor:"pointer"}
      },"✕ Cerrar")
    ),
    h("div",{style:{overflowX:"auto"}},
      h("table",{className:"hist-tbl"},
        h("thead",null,
          h("tr",null,
            h("th",null,"Mes"),
            h("th",{style:{textAlign:"right",color:"#1a5fa8"}},"UF día 5"),
            h("th",{style:{textAlign:"right"}},"UF Planilla"),
            h("th",{style:{textAlign:"right"}},"Facturado UF"),
            h("th",{style:{textAlign:"right"}},"Diferencia"),
          )
        ),
        h("tbody",null,
          filas.length===0
            ? h("tr",null,h("td",{colSpan:4,style:{textAlign:"center",color:"var(--txm)",padding:"20px"}},"Sin datos para "+anio))
            : filas.map(r=>h("tr",{key:r.key},
                h("td",{style:{color:"var(--tx)",fontWeight:500,fontFamily:"inherit"}},MESES_FULL[r.mes]),
                h("td",{style:{textAlign:"right",color:"#1a5fa8",fontWeight:500}},ufDia5Map[r.key]!=null?ufDia5Map[r.key].toFixed(2):"—"),
                h("td",{style:{textAlign:"right",color:r.uf!=null?"var(--tx)":"#bbb"}},fmt(r.uf)),
                h("td",{style:{textAlign:"right",color:r.fact!=null?"var(--tx)":"#bbb"}},fmt(r.fact)),
                h("td",{style:{textAlign:"right"}},fmtDif(r.dif))
              ))
        )
      )
    )
  );
}
