<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Facturación — Patagónica Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surf:#181c26;--surf2:#1e2330;
  --bdr:#2a2f3e;--bdr2:#333848;
  --tx:#e8eaf0;--txm:#7b8299;--txd:#4a5068;
  --green:#22c55e;--gdim:#14532d;--gbg:#0d2818;
  --amber:#f59e0b;--adim:#78350f;--abg:#1c1200;
  --red:#ef4444;--rdim:#7f1d1d;--rbg:#1a0000;
  --blue:#3b82f6;--bbg:#0d1a2e;
  --acc:#6366f1;--accl:#818cf8;
}
html,body,#root{height:100%;font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--tx);font-size:13px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}
input,select,textarea{font-family:inherit;background:var(--bg);border:0.5px solid var(--bdr);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:12px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
input::placeholder{color:var(--txd)}
button{font-family:'IBM Plex Sans',sans-serif;cursor:pointer;transition:all 0.15s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.spin{display:inline-block;animation:spin 1s linear infinite}
.fade-in{animation:fadeIn 0.25s ease}
.fade-up{animation:fadeUp 0.3s ease}
.row-tr{transition:background 0.1s}
.row-tr:hover{background:var(--surf2)!important}
.pill-btn{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:500;border:0.5px solid var(--bdr);background:transparent;color:var(--txm);cursor:pointer;transition:all 0.15s}
.pill-btn:hover:not(.active){background:var(--surf2)}
.pill-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.send-ready{background:var(--gbg);border:0.5px solid var(--gdim);color:var(--green);padding:5px 12px;border-radius:7px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.send-ready:hover{background:#163a1f;border-color:var(--green)}
.send-dis{background:transparent;border:0.5px solid var(--bdr);color:var(--txd);padding:5px 12px;border-radius:7px;font-size:11px;opacity:0.4;cursor:not-allowed}
.send-sent{color:var(--green);font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal{background:var(--surf);border:0.5px solid var(--bdr2);border-radius:16px;padding:28px;width:560px;max-width:95vw;animation:fadeUp 0.2s ease}
.notif{position:fixed;top:20px;right:20px;z-index:200;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;animation:fadeIn 0.2s ease;pointer-events:none}
.metric-card{background:var(--surf);padding:16px 22px}
.step-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:0.5px solid var(--bdr)}
.step-item:first-child{border-top:none}
.log-box{background:var(--bg);border-radius:8px;padding:12px;font-family:monospace;font-size:11px;color:var(--txm);max-height:120px;overflow-y:auto;line-height:1.7;margin-top:14px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef,useCallback,createElement:h}=React;

/* ── DATOS DE MUESTRA (reemplazar con datos reales al procesar) ── */

  {sitio:"A-2",cliente:"Hydrotorc SpA",correo:"ariel.martinez@hydrotorc.cl",factura:"F-14608",ufPlan:96.05,ufPdf:96.05},

  {sitio:"B",cliente:"Banco Itau",correo:"gastoscomunes@itau.cl",factura:"F-14661",ufPlan:189.95,ufPdf:22.79},
  {sitio:"B",cliente:"Visibility S.A.",correo:"",factura:"F-14660",ufPlan:31.7,ufPdf:3.8},
  {sitio:"B",cliente:"Ideal S.A.",correo:"",factura:"F-14619",ufPlan:61.19,ufPdf:null},
  {sitio:"A-2",cliente:"Claro Infraestructura 171 S.A.",correo:"clarorecepcion@custodium.com",factura:"",ufPlan:27.0,ufPdf:null},
];

const SITIO_C={"5-A":"#534AB7","4-A":"#0F6E56","A-2":"#D85A30","A-1":"#3b82f6","D-2":"#D4537E","B":"#888780"};
const PERIODOS=["Enero 2026","Febrero 2026","Marzo 2026","Abril 2026","Mayo 2026","Junio 2026","Julio 2026","Agosto 2026","Septiembre 2026","Octubre 2026","Noviembre 2026","Diciembre 2026"];

function getEstado(r){
  if(!r.factura||r.ufPdf===null)return"missing";
  if(Math.abs(r.ufPdf-r.ufPlan)>0.5)return"diff";
  return"ok";
}

/* ── BADGE ESTADO ── */
function Badge({e}){
  const c={
    ok:{label:"Coincide",bg:"var(--gbg)",col:"var(--green)",bdr:"var(--gdim)",icon:"✓"},
    diff:{label:"Difiere",bg:"var(--abg)",col:"var(--amber)",bdr:"var(--adim)",icon:"△"},
    missing:{label:"Sin PDF",bg:"var(--rbg)",col:"var(--red)",bdr:"var(--rdim)",icon:"○"}
  }[e];
  return h("span",{style:{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:500,background:c.bg,color:c.col,border:`0.5px solid ${c.bdr}`}},c.icon," ",c.label);
}

/* ── MODAL PROCESAMIENTO ── */
function ProcModal({step,log,done,onClose}){
  const ref=useRef(null);
  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[log]);
  const steps=["Conectando con Google Drive","Leyendo planillas Excel","Descargando PDFs de facturas","Extrayendo montos UF","Cruzando datos y correos","Generando planilla de verificación","Guardando resultado en Drive"];
  return h("div",{className:"overlay"},
    h("div",{className:"modal"},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}},
        h("div",null,
          h("div",{style:{fontWeight:600,fontSize:15,fontFamily:"'IBM Plex Sans',sans-serif"}},"Procesando facturación"),
          h("div",{style:{fontSize:11,color:"var(--txm)",marginTop:3}},"Leyendo Drive · extrayendo PDFs · cruzando datos")
        ),
        done&&h("button",{onClick:onClose,style:{background:"var(--acc)",color:"#fff",border:"none",borderRadius:8,padding:"7px 18px",fontSize:13,fontWeight:600}},"Ver resultados →")
      ),
      h("div",null,steps.map((s,i)=>
        h("div",{key:i,className:"step-item"},
          h("span",{style:{width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,
            background:i<step?"var(--gbg)":i===step?"var(--bbg)":"var(--bg)",
            color:i<step?"var(--green)":i===step?"var(--blue)":"var(--txd)",
            border:`0.5px solid ${i<step?"var(--gdim)":i===step?"var(--blue)":"var(--bdr)"}`}},
            i<step?"✓":i===step?h("span",{className:"spin",style:{fontSize:10}},"⟳"):i+1),
          h("span",{style:{fontSize:12,color:i<=step?"var(--tx)":"var(--txm)",fontFamily:"'IBM Plex Sans',sans-serif"}},s),
          i===step&&h("span",{style:{marginLeft:"auto",fontSize:11,color:"var(--blue)",animation:"pulse 1.5s infinite"}},"en curso...")
        )
      )),
      h("div",{ref,className:"log-box"},log.map((l,i)=>h("div",{key:i},l)))
    )
  );
}

/* ── MODAL VISTA PREVIA CORREO ── */
function EmailModal({row,periodo,onClose,onConfirm}){
  const mes=periodo.toLowerCase();
  return h("div",{className:"overlay"},
    h("div",{className:"modal",style:{width:600}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
        h("div",null,
          h("div",{style:{fontWeight:600,fontSize:14,fontFamily:"'IBM Plex Sans',sans-serif"}},"Vista previa del correo"),
          h("div",{style:{fontSize:11,color:"var(--txm)",marginTop:2}},row.cliente)
        ),
        h("button",{onClick:onClose,style:{background:"none",border:"none",color:"var(--txm)",fontSize:22,lineHeight:1,cursor:"pointer"}},"×")
      ),
      h("div",{style:{background:"var(--bg)",borderRadius:10,padding:18,fontSize:12,lineHeight:1.9}},
        h("div",{style:{borderBottom:"0.5px solid var(--bdr)",paddingBottom:12,marginBottom:14}},
          h("div",{style:{marginBottom:4}},h("span",{style:{color:"var(--txd)"}},"Para: "),h("span",{style:{color:"var(--accl)"}},row.correo)),
          h("div",{style:{marginBottom:4}},h("span",{style:{color:"var(--txd)"}},"Asunto: "),`Factura ${row.factura} — Arriendo y Servicios ${mes.charAt(0).toUpperCase()+mes.slice(1)} — Patagónica Inmobiliaria SpA`),
          h("div",{style:{fontSize:11}},h("span",{style:{color:"var(--txd)"}},"Adjunto: "),h("span",{style:{color:"var(--green)"}},`${row.factura}.pdf`))
        ),
        h("div",{style:{color:"var(--tx)",fontFamily:"'IBM Plex Sans',sans-serif",lineHeight:2}},
          h("p",null,"Estimado(a) cliente,"),
          h("p",{style:{marginTop:10}},`Junto con saludar, hacemos envío de la factura correspondiente al arriendo y servicios de administración del mes de ${mes}, por un monto de `,h("strong",{style:{color:"var(--accl)"}},`${row.ufPlan.toFixed(4)} UF`),`, factura N° ${row.factura}.`),
          h("p",{style:{marginTop:10}},"Adjunto encontrará el documento para su registro y gestión de pago."),
          h("p",{style:{marginTop:10}},"Ante cualquier consulta, no dude en contactarnos."),
          h("p",{style:{marginTop:10,color:"var(--txm)"}},"Atentamente,",h("br"),h("em",null,"Área de Administración — Patagónica Inmobiliaria SpA"))
        )
      ),
      h("div",{style:{display:"flex",gap:10,marginTop:18,justifyContent:"flex-end"}},
        h("button",{onClick:onClose,style:{padding:"8px 18px",borderRadius:8,border:"0.5px solid var(--bdr)",background:"transparent",color:"var(--txm)",fontSize:12}},"Cancelar"),
        h("button",{onClick:onConfirm,style:{padding:"8px 20px",borderRadius:8,border:"none",background:"var(--green)",color:"#0d2818",fontSize:12,fontWeight:700,fontFamily:"'IBM Plex Sans',sans-serif"}},"✉ Confirmar envío")
      )
    )
  );
}

/* ── APP PRINCIPAL ── */
function App(){
  const [view,setView]=useState("idle");
  const [data,setData]=useState([]);
  const [periodo,setPeriodo]=useState("Mayo 2026");
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [sentSet,setSentSet]=useState(new Set());
  const [sendingSet,setSendingSet]=useState(new Set());
  const [showProc,setShowProc]=useState(false);
  const [procStep,setProcStep]=useState(0);
  const [procLog,setProcLog]=useState([]);
  const [procDone,setProcDone]=useState(false);
  const [preview,setPreview]=useState(null);
  const [notif,setNotif]=useState(null);

  const notify=(msg,t="ok")=>{setNotif({msg,t});setTimeout(()=>setNotif(null),3500);};

  const runProcess=useCallback(async()=>{
    setShowProc(true);setProcDone(false);setProcStep(0);setProcLog([]);
    const mm=periodo.split(" ")[0].slice(0,3).toUpperCase();
    const yy=periodo.split(" ")[1];
    const logs=[
      [`▶ Conectando con Google Drive...`,`▶ Cuenta: amelendez@patagonica.cl`,`✓ Sesión iniciada correctamente`],
      [`▶ Buscando carpeta 'Facturación Mensual/${mm}-${yy}'...`,`✓ Carpeta encontrada — subcarpetas detectadas`,`▶ Identificando archivos de planillas...`],
      [`▶ Descargando Planilla_Facturacion_${mm}_${yy}.xlsx`,`▶ Descargando Detalle_envío_facturas_Inpasa_y_Pisa.xlsx`,`✓ Planillas descargadas correctamente`],
      [`▶ Escaneando PDFs de facturas...`,`✓ 128 archivos PDF encontrados`,`▶ Filtrando facturas de ${periodo} (excluyendo meses anteriores)...`,`✓ 118 PDFs de ${periodo} identificados`],
      [`▶ Extrayendo UF planilla (col. GS — hoja Flujo)...`,`✓ 82 clientes con UF > 0`,`▶ Cruzando correos desde planilla de envío...`,`✓ 52 correos mapeados correctamente`],
      [`▶ Cruzando PDFs con planilla por sitio + monto UF...`,`✓ 77 facturas cruzadas sin diferencias`,`⚠ 5 clientes requieren revisión manual`,`▶ Generando planilla de verificación...`],
      [`▶ Subiendo Verificacion_Facturacion_${mm}-${yy}.xlsx a Drive...`,`✓ Archivo guardado en 'Facturación Mensual/${mm}-${yy}/'`,`✓ Proceso completado exitosamente — ${new Date().toLocaleString('es-CL')}`],
    ];
    for(let i=0;i<logs.length;i++){
      await new Promise(r=>setTimeout(r,800+Math.random()*400));
      setProcStep(i+1);
      setProcLog(prev=>[...prev,...logs[i]]);
    }
    setProcDone(true);
  },[periodo]);

  const finishProc=()=>{
    setShowProc(false);
    setData(SAMPLE);
    setView("table");
    setSentSet(new Set());
    setSendingSet(new Set());
    setFilter("all");
    setSearch("");
    notify(`${SAMPLE.length} clientes cargados — ${periodo}`);
  };

  const doSend=i=>setPreview({row:data[i],idx:i});

  const confirmSend=async()=>{
    const{idx,row}=preview;
    setPreview(null);
    setSendingSet(p=>new Set([...p,idx]));
    await new Promise(r=>setTimeout(r,1200));
    setSendingSet(p=>{const s=new Set(p);s.delete(idx);return s;});
    setSentSet(p=>new Set([...p,idx]));
    notify(`Correo enviado → ${row.correo.split(";")[0].trim()}`);
  };

  const sendAll=async()=>{
    const pend=data.map((_,i)=>i).filter(i=>getEstado(data[i])==="ok"&&data[i].correo&&!sentSet.has(i)&&!sendingSet.has(i));
    if(!pend.length)return notify("No hay correos pendientes","warn");
    for(const i of pend){
      setSendingSet(p=>new Set([...p,i]));
      await new Promise(r=>setTimeout(r,180));
      setSendingSet(p=>{const s=new Set(p);s.delete(i);return s;});
      setSentSet(p=>new Set([...p,i]));
    }
    notify(`${pend.length} correos enviados exitosamente`);
  };

  const enriched=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
  const stats={
    total:enriched.length,
    ok:enriched.filter(r=>r.estado==="ok").length,
    diff:enriched.filter(r=>r.estado!=="ok").length,
    sent:sentSet.size,
  };
  const filtered=enriched.filter(r=>{
    const mf=filter==="all"
      ||(filter==="ok"&&r.estado==="ok"&&!sentSet.has(r.i))
      ||(filter==="diff"&&r.estado!=="ok")
      ||(filter==="sent"&&sentSet.has(r.i));
    const ms=!search||r.cliente.toLowerCase().includes(search.toLowerCase())||r.sitio.includes(search.toUpperCase());
    return mf&&ms;
  });

  return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column"}},

    /* NOTIFICACIÓN */
    notif&&h("div",{className:"notif",style:{
      background:notif.t==="ok"?"var(--gbg)":"var(--abg)",
      border:`0.5px solid ${notif.t==="ok"?"var(--gdim)":"var(--adim)"}`,
      color:notif.t==="ok"?"var(--green)":"var(--amber)"
    }},(notif.t==="ok"?"✓ ":"△ ")+notif.msg),

    /* MODALES */
    showProc&&h(ProcModal,{step:procStep,log:procLog,done:procDone,onClose:finishProc}),
    preview&&h(EmailModal,{row:preview.row,periodo,onClose:()=>setPreview(null),onConfirm:confirmSend}),

    /* HEADER */
    h("header",{style:{background:"var(--surf)",borderBottom:"0.5px solid var(--bdr)",padding:"13px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}},
      h("div",{style:{display:"flex",alignItems:"center",gap:14}},
        h("div",{style:{width:34,height:34,background:"var(--acc)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,color:"#fff",fontWeight:700,flexShrink:0}},"⬡"),
        h("div",null,
          h("div",{style:{fontSize:14,fontWeight:600,fontFamily:"'IBM Plex Sans',sans-serif",letterSpacing:"-0.3px"}},"Patagónica Inmobiliaria"),
          h("div",{style:{fontSize:10,color:"var(--txm)"}},"agente de facturación mensual")
        ),
        view==="table"&&h("span",{className:"fade-in",style:{background:"var(--bbg)",border:"0.5px solid var(--blue)",color:"var(--blue)",fontSize:11,padding:"3px 11px",borderRadius:20,marginLeft:4}},periodo)
      ),
      h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        view==="table"&&h("select",{value:periodo,onChange:e=>{setPeriodo(e.target.value);setView("idle");},style:{fontSize:12,cursor:"pointer"}},
          PERIODOS.map(p=>h("option",{key:p,value:p},p))
        ),
        view==="table"&&h("button",{
          onClick:()=>runProcess(),
          style:{background:"transparent",border:"0.5px solid var(--bdr)",color:"var(--txm)",borderRadius:8,padding:"6px 14px",fontSize:12}
        },"⟳ Reprocesar"),
        h("button",{
          onClick:view==="table"?sendAll:runProcess,
          style:{background:view==="table"?"var(--green)":"var(--acc)",color:view==="table"?"#0d2818":"#fff",border:"none",borderRadius:8,padding:"7px 18px",fontSize:12,fontWeight:700,fontFamily:"'IBM Plex Sans',sans-serif"}
        },view==="table"?"✉ Enviar todos":"▶ Procesar Drive")
      )
    ),

    /* IDLE */
    view==="idle"&&h("main",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:24,padding:40}},
      h("div",{style:{width:64,height:64,background:"var(--surf)",border:"0.5px solid var(--bdr)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}},"⬡"),
      h("div",{style:{textAlign:"center"}},
        h("h1",{style:{fontSize:20,fontWeight:600,fontFamily:"'IBM Plex Sans',sans-serif",marginBottom:8}},"Listo para procesar"),
        h("p",{style:{fontSize:13,color:"var(--txm)",maxWidth:400,lineHeight:1.8}},
          "Sube los archivos a ",h("code",{style:{color:"var(--accl)",fontSize:12}},"Facturación Mensual/MM-AAAA/")," en Google Drive y presiona el botón para iniciar."
        )
      ),
      h("div",{style:{background:"var(--surf)",border:"0.5px solid var(--bdr)",borderRadius:12,padding:20,width:"100%",maxWidth:440}},
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}},
          h("span",{style:{fontSize:12,color:"var(--txm)",fontFamily:"'IBM Plex Sans',sans-serif",fontWeight:500}},"Archivos esperados en Drive"),
          h("select",{value:periodo,onChange:e=>setPeriodo(e.target.value),style:{fontSize:11,padding:"4px 8px"}},
            PERIODOS.map(p=>h("option",{key:p,value:p},p))
          )
        ),
        [["⊞","Planilla_Facturacion_MM-AAAA.xlsx","col. G (sitio) · J (cliente) · GS (UF)"],
         ["⊞","Detalle_envío_facturas_Inpasa_y_Pisa.xlsx","col. E (cliente) · F (correo)"],
         ["⊟","MM-AAAA/  (carpeta con PDFs de facturas)","subcarpetas por sitio: 5A · 4A · A2 · A1 · B · D2"]
        ].map(([ic,name,desc],i)=>
          h("div",{key:i,style:{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 0",borderTop:i>0?"0.5px solid var(--bdr)":"none"}},
            h("span",{style:{color:"var(--acc)",fontSize:16,marginTop:1,flexShrink:0}},ic),
            h("div",null,
              h("div",{style:{fontSize:12,fontFamily:"monospace",color:"var(--tx)"}}," ",name),
              h("div",{style:{fontSize:11,color:"var(--txd)",marginTop:2}},desc)
            )
          )
        )
      ),
      h("button",{onClick:runProcess,style:{background:"var(--acc)",color:"#fff",border:"none",borderRadius:10,padding:"12px 36px",fontSize:14,fontWeight:700,fontFamily:"'IBM Plex Sans',sans-serif",letterSpacing:"-0.2px"}},"▶ Procesar facturación")
    ),

    /* TABLE */
    view==="table"&&h("main",{style:{flex:1,display:"flex",flexDirection:"column",overflowX:"hidden"},className:"fade-up"},

      /* MÉTRICAS */
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",borderBottom:"0.5px solid var(--bdr)"}},
        [{label:"Total clientes",val:stats.total,col:"var(--tx)",sub:""},{label:"UF coinciden",val:stats.ok,col:"var(--green)",sub:"listos para enviar"},{label:"Para revisar",val:stats.diff,col:"var(--amber)",sub:"diferencia detectada"},{label:"Enviados",val:stats.sent,col:"var(--accl)",sub:"correos despachados"}]
        .map((m,i)=>h("div",{key:i,className:"metric-card",style:{borderRight:i<3?"0.5px solid var(--bdr)":"none"}},
          h("div",{style:{fontSize:10,color:"var(--txm)",marginBottom:6,fontFamily:"'IBM Plex Sans',sans-serif",fontWeight:500}},m.label),
          h("div",{style:{fontSize:28,fontWeight:700,color:m.col,lineHeight:1}},m.val),
          m.sub&&h("div",{style:{fontSize:10,color:"var(--txd)",marginTop:4}},m.sub)
        ))
      ),

      /* FILTROS */
      h("div",{style:{background:"var(--surf)",borderBottom:"0.5px solid var(--bdr)",padding:"10px 22px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
        [{k:"all",l:`Todos (${stats.total})`},{k:"ok",l:`Coinciden (${stats.ok})`},{k:"diff",l:`Revisar (${stats.diff})`},{k:"sent",l:`Enviados (${stats.sent})`}]
        .map(f=>h("button",{key:f.k,className:`pill-btn${filter===f.k?" active":""}`,onClick:()=>setFilter(f.k)},f.l)),
        h("input",{value:search,onChange:e=>setSearch(e.target.value),placeholder:"Buscar cliente o sitio...",style:{marginLeft:"auto",width:200}})
      ),

      /* TABLA */
      h("div",{style:{flex:1,overflowX:"auto"}},
        h("table",{style:{width:"100%",borderCollapse:"collapse",tableLayout:"fixed",minWidth:800}},
          h("colgroup",null,
            h("col",{style:{width:64}}),h("col",{style:{width:"17%"}}),h("col",{style:{width:"20%"}}),
            h("col",{style:{width:96}}),h("col",{style:{width:88}}),h("col",{style:{width:88}}),
            h("col",{style:{width:108}}),h("col",{style:{width:88}})
          ),
          h("thead",null,h("tr",{style:{background:"var(--surf)"}},
            ["Sitio","Cliente","Correo","Factura","UF planilla","UF PDF","Estado","Acción"].map(hd=>
              h("th",{key:hd,style:{padding:"9px 13px",textAlign:"left",fontSize:10,fontWeight:600,color:"var(--txd)",letterSpacing:"0.06em",borderBottom:"0.5px solid var(--bdr)",fontFamily:"'IBM Plex Sans',sans-serif"}},hd.toUpperCase())
            )
          )),
          h("tbody",null,filtered.length===0
            ?h("tr",null,h("td",{colSpan:8,style:{padding:"40px",textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin resultados para este filtro"))
            :filtered.map(row=>{
              const i=row.i;
              const sent=sentSet.has(i),sending=sendingSet.has(i),noEmail=!row.correo;
              const diff=row.ufPdf!==null&&Math.abs(row.ufPdf-row.ufPlan)>0.5;
              return h("tr",{key:i,className:"row-tr",style:{borderBottom:"0.5px solid var(--bdr)",background:sent?"rgba(13,40,24,0.5)":"transparent"}},
                h("td",{style:{padding:"10px 13px"}},
                  h("span",{style:{display:"inline-block",padding:"2px 8px",borderRadius:5,fontSize:10,fontWeight:700,fontFamily:"'IBM Plex Sans',sans-serif",background:`${SITIO_C[row.sitio]||"#888"}22`,color:SITIO_C[row.sitio]||"#888",border:`0.5px solid ${SITIO_C[row.sitio]||"#888"}44`}},row.sitio)
                ),
                h("td",{style:{padding:"10px 13px"}},h("span",{style:{fontSize:12,fontWeight:500,fontFamily:"'IBM Plex Sans',sans-serif"}},row.cliente)),
                h("td",{style:{padding:"10px 13px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},
                  h("span",{style:{fontSize:11,color:row.correo?"var(--accl)":"var(--txd)"}},row.correo||"— sin correo registrado")
                ),
                h("td",{style:{padding:"10px 13px"}},h("span",{style:{fontSize:11,fontFamily:"monospace",color:"var(--txm)"}},row.factura||"—")),
                h("td",{style:{padding:"10px 13px"}},h("span",{style:{fontSize:12,fontFamily:"monospace"}},row.ufPlan.toFixed(4))),
                h("td",{style:{padding:"10px 13px"}},
                  h("span",{style:{fontSize:12,fontFamily:"monospace",color:diff?"var(--amber)":"var(--tx)"}},
                    row.ufPdf!==null?row.ufPdf.toFixed(4):"—")
                ),
                h("td",{style:{padding:"10px 13px"}},h(Badge,{e:sent?"ok":row.estado})),
                h("td",{style:{padding:"10px 13px"}},
                  sent?h("span",{className:"send-sent"},"✓ Enviado"):
                  sending?h("span",{style:{fontSize:11,color:"var(--blue)",display:"inline-flex",alignItems:"center",gap:5}},h("span",{className:"spin"},"⟳")," Enviando..."):
                  row.estado==="ok"&&!noEmail?h("button",{className:"send-ready",onClick:()=>doSend(i)},"✉ Enviar"):
                  h("button",{className:"send-dis",disabled:true,title:noEmail?"Sin correo registrado":"Monto difiere — revisar primero"},"✉ Enviar")
                )
              );
            })
          )
        )
      ),

      /* FOOTER */
      h("footer",{style:{background:"var(--surf)",borderTop:"0.5px solid var(--bdr)",padding:"11px 22px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h("span",{style:{fontSize:11,color:"var(--txd)"}},`${filtered.length} de ${data.length} clientes · ${stats.sent} enviados · ${periodo}`),
        h("button",{onClick:sendAll,style:{background:"var(--gbg)",border:"0.5px solid var(--gdim)",color:"var(--green)",borderRadius:8,padding:"7px 18px",fontSize:12,fontWeight:700,fontFamily:"'IBM Plex Sans',sans-serif",display:"flex",alignItems:"center",gap:6}},
          `✉ Enviar todos los que coinciden (${Math.max(0,stats.ok-stats.sent)})`)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
