/* ═══════════════════════════════════
   CAMBIO 1: CACHÉ UF HISTÓRICA
   Fuente: mindicador.cl API pública
═══════════════════════════════════ */
const ufCache={};

async function getUFDia5(year,month){
  const key=`uf5-${year}-${String(month).padStart(2,"0")}`;
  if(ufCache[key])return ufCache[key];
  try{
    const url=`https://mindicador.cl/api/uf/${String(year)}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const serie=data.serie||[];
    // Buscar exactamente el día 05 del mes
    const dia5=serie.find(e=>{
      const d=new Date(e.fecha);
      return d.getUTCFullYear()===year&&(d.getUTCMonth()+1)===month&&d.getUTCDate()===5;
    });
    if(dia5){ufCache[key]=dia5.valor;return dia5.valor;}
    // Fallback: día más cercano al 05 por debajo
    const delMes=serie.filter(e=>{
      const d=new Date(e.fecha);
      return d.getUTCFullYear()===year&&(d.getUTCMonth()+1)===month&&d.getUTCDate()<=5;
    }).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    if(delMes.length>0){ufCache[key]=delMes[0].valor;return delMes[0].valor;}
    return null;
  }catch(e){console.warn("Error UF día 5",e.message);return null;}
}
async function getUFForMonth(year,month){
  const key=`${year}-${String(month).padStart(2,"0")}`;
  if(ufCache[key])return ufCache[key];
  try{
    // Usamos mindicador.cl — API pública sin auth, retorna UF histórica
    // Pedimos el día 1 del mes siguiente y tomamos el último valor disponible del mes
    const url=`https://mindicador.cl/api/uf/${String(year)}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    // data.serie = [{fecha:"2025-01-01T...", valor:xxxxx}, ...]
    const serie=data.serie||[];
    // Buscar el último valor del mes solicitado
    const entries=serie.filter(e=>{
      const d=new Date(e.fecha);
      return d.getUTCFullYear()===year&&(d.getUTCMonth()+1)===month;
    });
    if(entries.length===0){
      // Fallback: primer valor del mes siguiente
      const next=serie.filter(e=>{
        const d=new Date(e.fecha);
        const nm=month===12?1:month+1;
        const ny=month===12?year+1:year;
        return d.getUTCFullYear()===ny&&(d.getUTCMonth()+1)===nm;
      });
      if(next.length>0){ufCache[key]=next[0].valor;return next[0].valor;}
      return null;
    }
    // Tomar el valor más reciente del mes (último día disponible)
    entries.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    ufCache[key]=entries[0].valor;
    return entries[0].valor;
  }catch(e){
    console.warn("Error obteniendo UF para",key,e.message);
    return null;
  }
}

function formatCLP(pesos){
  if(pesos===null||pesos===undefined||isNaN(pesos))return"—";
  return"$"+Math.round(pesos).toLocaleString("es-CL");
}

function formatCLPCompact(pesos){
  if(pesos===null||pesos===undefined||isNaN(pesos))return"—";
  const n=Math.round(pesos);
  if(n>=1000000)return"$"+(n/1000000).toFixed(1).replace(".",",")+"M";
  if(n>=1000)return"$"+(n/1000).toFixed(0)+"K";
  return"$"+n.toLocaleString("es-CL");
}

/* ── Google OAuth (Gmail + Drive) ── */
function loadGisScript(){return new Promise(res=>{if(window.google?.accounts){res();return;}const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;document.head.appendChild(s);});}
async function getGoogleToken(clientId){
  await loadGisScript();
  return new Promise((res,rej)=>{
    const client=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:GOOGLE_SCOPES,callback:(resp)=>{if(resp.error)rej(new Error(resp.error));else res(resp.access_token);}});
    client.requestAccessToken({prompt:""});
  });
}
async function descargarPlanillaDrive(token){
  const url=`https://www.googleapis.com/drive/v3/files/${DRIVE_PLANILLA_ID}?alt=media`;
  const res=await fetch(url,{headers:{Authorization:"Bearer "+token}});
  if(!res.ok){const txt=await res.text();throw new Error(`Drive ${res.status}: ${txt.slice(0,120)}`);}
  const blob=await res.blob();
  return new File([blob],"Planilla Facturación.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function makeEmail(to,cco,from,subject,body,pdfBase64,pdfName){
  const boundary="PAT_BOUNDARY_"+Date.now();
  const fromHeader=`=?UTF-8?B?${btoa(unescape(encodeURIComponent("Patagónica Inmobiliaria")))}?= <${from}>`;
  let msg;
  if(pdfBase64&&pdfName){
    msg=[`From: ${fromHeader}`,`To: ${to}`,`Bcc: ${cco}`,`Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,`MIME-Version: 1.0`,`Content-Type: multipart/mixed; boundary="${boundary}"`,``,`--${boundary}`,`Content-Type: text/html; charset=UTF-8`,`Content-Transfer-Encoding: base64`,``,btoa(unescape(encodeURIComponent(body))),``,`--${boundary}`,`Content-Type: application/pdf; name="${pdfName}"`,`Content-Disposition: attachment; filename="${pdfName}"`,`Content-Transfer-Encoding: base64`,``,pdfBase64,``,`--${boundary}--`].join("\r\n");
  }else{
    msg=[`From: ${fromHeader}`,`To: ${to}`,`Bcc: ${cco}`,`Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,`MIME-Version: 1.0`,`Content-Type: text/html; charset=UTF-8`,`Content-Transfer-Encoding: base64`,``,btoa(unescape(encodeURIComponent(body)))].join("\r\n");
  }
  return btoa(unescape(encodeURIComponent(msg))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function sendGmail(token,to,cco,from,subject,htmlBody,pdfBase64,pdfName){
  const raw=makeEmail(to,cco,from,subject,htmlBody,pdfBase64,pdfName);
  const res=await fetch("https://www.googleapis.com/gmail/v1/users/me/messages/send",{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({raw})});
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||"Error Gmail API");}
  return await res.json();
}
async function sendTelegram(botToken,chatId,mensaje){

function buildEmailHtml(cliente,concepto,periodo,ufPlan,factura){

const PERIODOS=["Enero 2026","Febrero 2026","Marzo 2026","Abril 2026","Mayo 2026","Junio 2026","Julio 2026","Agosto 2026","Septiembre 2026","Octubre 2026","Noviembre 2026","Diciembre 2026"];

const SITIO_MAP={"5A":"5-A","4A":"4-A","A1":"A-1","A2":"A-2","B":"B","D2":"D-2"};

async function callClaude(prompt){
  const body={model:"claude-sonnet-4-5",max_tokens:4096,messages:[{role:"user",content:prompt}]};
  const res=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json","anthropic-version":"2023-06-01"},body:JSON.stringify(body)});
  const text=await res.text();
  let data;
  try{data=JSON.parse(text);}catch(e){throw new Error("Respuesta no JSON: "+text.slice(0,150));}
  if(!res.ok)throw new Error(data.error?.message||JSON.stringify(data));
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

function readFileAsBuffer(file){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=e=>res(e.target.result);fr.onerror=rej;fr.readAsArrayBuffer(file);});
}

/* ═══════════════════════════════════
   DASHBOARD: parsear planilla F→BJ
═══════════════════════════════════ */
async function parsePlanillaParaDashboard(file){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla");
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  const row3=raw[2]||[];
  const MES_L=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  function serialToYM(serial){
    const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(serial)*86400000);
    return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1};
  }
  const monthCols=[];
  for(let ci=64;ci<Math.min(row3.length,220);ci++){
    const v=row3[ci];
    if(typeof v==="number"&&v>40000&&v<50000){
      const{y,m}=serialToYM(v);
      if(y>=2024&&y<=2026){
        monthCols.push({key:`${y}-${String(m).padStart(2,"0")}`,label:`${MES_L[m-1]} ${y}`,col:ci,year:y,month:m});
      }
    }
  }
  const SKIP=/^(Total|VACANTE|Vacante|Area|Arrendado|En negociación|Para confirmar|#|\d+$)/;
  const clients=[];
  for(let ri=4;ri<raw.length;ri++){
    const row=raw[ri];
    if(!row)continue;
    const rut=row[9];
    const nombre=row[11]||row[10]; /* Col L o K según la fila */
    if(!rut||!nombre||typeof rut!=="string")continue;
    if(!rut.match(/\d+\.\d+/))continue;
    const name=String(nombre).trim();
    if(SKIP.test(name)||name.includes("Total")||name.startsWith("#")||name==="")continue;
    const ufArr=typeof row[47]==="number"?row[47]:0;
    const pctAdm=row[51];
    let ufSrv=0;
    if(typeof pctAdm==="number"&&pctAdm>0&&pctAdm<1) ufSrv=ufArr*pctAdm;
    else if(typeof pctAdm==="number"&&pctAdm>=1&&pctAdm<=10) ufSrv=pctAdm;
    const monthly={};
    for(const mc of monthCols){
      const v=row[mc.col];
      if(typeof v==="number"&&v>0&&v<15000) monthly[mc.key]=Math.round(v*100)/100;
    }
    /* Conversión serial Excel → fecha legible */
    function serialToDate(v){if(!v||typeof v!=="number")return"";try{const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(v)*86400000);return`${d.getUTCDate().toString().padStart(2,"0")}/${(d.getUTCMonth()+1).toString().padStart(2,"0")}/${d.getUTCFullYear()}`;}catch(e){return"";}}
    clients.push({
      ri,nombre:name,rut:String(rut).trim(),
      arrendadora:String(row[5]||"").trim(),
      sitio:String(row[7]||"").replace(/\s+/g," ").trim(),
      edificio:String(row[8]||"").trim(),
      email:String(row[12]||"").trim(),
      termContrato:serialToDate(row[14]),   /* Col O: Fecha Término Contrato */
      renovacion:row[16]!=null?String(row[16]).trim():"",  /* Col Q: Antelación renovación */
      aviso:row[17]!=null?String(row[17]).trim():"",        /* Col R: Aviso */
      fechaReajuste:serialToDate(row[52]),  /* Col BA: Fecha Reajuste */
      pctReaj:row[53]!=null?String(row[53]):"",            /* Col BB: % Reajuste */
      cadaAnios:row[54]!=null?String(row[54]).trim():"",   /* Col BC: Cada cuántos años */
      m2:row[26]!=null&&row[26]!==""?Number(row[26]):null,  /* Col AA: Metros cuadrados */
      hist:(()=>{
        /* BN=65, cada mes ocupa 4 cols: UF planilla, Facturado, Diferencia, Comentarios */
        /* Desde Abr-2023 hasta el presente */
        const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
        const result=[];
        let col=65,mes=3,anio=2023;
        while(!(anio===2027||(anio===2026&&mes>11))){
          const uf=row[col],fact=row[col+1],dif=row[col+2];
          result.push({
            key:`${anio}-${String(mes+1).padStart(2,"0")}`,
            label:`${MESES[mes]}`,
            anio,mes,
            uf:typeof uf==="number"?Math.round(uf*100)/100:null,
            fact:typeof fact==="number"?Math.round(fact*100)/100:null,
            dif:typeof dif==="number"?Math.round(dif*100)/100:null,
          });
          col+=4; mes++; if(mes>11){mes=0;anio++;}
        }
        return result;
      })(),
      ufArr:Math.round(ufArr*100)/100,
      ufSrv:Math.round(ufSrv*100)/100,
      ufTotal:Math.round((ufArr+ufSrv)*100)/100,
      afecto:String(row[48]||"").trim(),
      ufInicio:typeof row[61]==="number"?Math.round(row[61]*100)/100:0,
      monthly,
    });
  }
  const siteMap={};
  for(const c of clients){
    const s=(c.sitio||"Otro").trim();
    if(!siteMap[s])siteMap[s]={count:0,ufArr:0,ufSrv:0,arrendadora:c.arrendadora||""};
    siteMap[s].count++;
    siteMap[s].ufArr=Math.round((siteMap[s].ufArr+c.ufArr)*100)/100;
    siteMap[s].ufSrv=Math.round((siteMap[s].ufSrv+c.ufSrv)*100)/100;
    if(!siteMap[s].arrendadora&&c.arrendadora)siteMap[s].arrendadora=c.arrendadora;
  }
  const monthTotals={};
  for(const mc of monthCols){
    let totalArr=0;
    for(const c of clients){const v=c.monthly[mc.key];if(v)totalArr+=v;}
    const totalSrv=clients.reduce((s,c)=>s+c.ufSrv,0);
    monthTotals[mc.key]={
      label:mc.label,
      arr:Math.round(totalArr*100)/100,
      srv:Math.round(totalSrv*100)/100,
      total:Math.round((totalArr+totalSrv)*100)/100,
      year:mc.year,
      month:mc.month,
    };
  }
  return{clients,siteMap,monthTotals,monthCols};
}

async function procesarPlanillaFacturacion(file,periodo){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla de facturación");
  /* raw:true para obtener seriales Excel en números; lo usamos para detectar la columna */
  const dataRaw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const mesNum=MES_NUM[periodo.split(" ")[0]];
  const anio=parseInt(periodo.split(" ")[1]);
  let colGS=-1,colGT=-1;

  function esTargetMes(val){
    if(val===null||val===undefined)return false;
    if(typeof val==="number"&&val>40000&&val<60000){
      const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(val)*86400000);
      return d.getUTCFullYear()===anio&&(d.getUTCMonth()+1)===mesNum;
    }
    if(typeof val==="string"){try{const d=new Date(val);if(!isNaN(d))return d.getFullYear()===anio&&(d.getMonth()+1)===mesNum;}catch(e){}}
    return false;
  }

  /* Fechas en fila 3 (índice 2) */
  const fila3=dataRaw[2]||[];
  for(let i=64;i<fila3.length;i++){
    if(esTargetMes(fila3[i])){colGS=i;colGT=i+1;break;}
  }
  if(colGS===-1)throw new Error(`No se encontró columna para ${periodo}. Verifica que la planilla tenga ese mes.`);

  const excl=["","VACANTE","Nombre Cliente","Areas Comunes Edificio","Areas comunes Edificio (Subterraneos)","Area Comun"];
  const clientes=[];
  for(let i=4;i<dataRaw.length;i++){
    const row=dataRaw[i];if(!row)continue;
    const sitio=row[7];
    const cliente=row[11];
    const ufGS=row[colGS];
    const ufGT=row[colGT];
    if(!cliente||excl.includes(String(cliente).trim()))continue;
    const sName=String(cliente).trim();
    const sito=sitio?String(sitio).trim():"";
    const emailBilling=row[12]?String(row[12]).trim():"";
    const rutBilling=row[9]?String(row[9]).replace(/\./g,"").trim().toLowerCase():""; /* Col J: RUT normalizado */
    if(typeof ufGS==="number"&&ufGS>0)clientes.push({sitio:sito,cliente:sName,tipo:"arriendo",uf:Math.round(ufGS*10000)/10000,email:emailBilling,rut:rutBilling});
    if(typeof ufGT==="number"&&ufGT>0&&ufGT<=999999)clientes.push({sitio:sito,cliente:sName,tipo:"serv_adm",uf:Math.round(ufGT*10000)/10000,email:emailBilling,rut:rutBilling});
  }
  return clientes;
}
async function extraerTextoPDF(arrayBuffer){
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    let texto="";
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      texto+=content.items.map(it=>it.str).join(" ")+"\n";
    }
    return texto;
  }catch(e){console.warn("pdfjs error:",e.message);return"";}
}

async function procesarPDFs(zipFile,addLog){
  const buf=await readFileAsBuffer(zipFile);
  const zip=await JSZip.loadAsync(buf);
  const pdfs=[];
  const archivos=Object.keys(zip.files).filter(f=>f.toLowerCase().endsWith(".pdf"));
  addLog(`▶ ${archivos.length} PDFs encontrados en el ZIP`,"info");

  for(const path of archivos){
    const parts=path.split("/");
    const carpeta=parts.length>1?parts[parts.length-2]:"";
    const nombre=parts[parts.length-1];
    const sitio=SITIO_MAP[carpeta]||carpeta;

    /* Número y nombre desde archivo: "F-14540 Ingersoll Rand.pdf" */
    const nroMatch=nombre.match(/^(F(?:EE)?-\d+)\s*(.+)?\.pdf$/i);
    if(!nroMatch)continue;
    const nroFact=nroMatch[1].toUpperCase();
    const nombreEnArchivo=(nroMatch[2]||"").trim().toLowerCase();
      const pdfBuf=await zip.files[path].async("arraybuffer");
      const texto=await extraerTextoPDF(pdfBuf);
      const textoJ=texto.replace(/\s+/g," ");
      const tipo=textoJ.includes("Serv. Adm.")||textoJ.includes("Serv.Adm.")?"serv_adm":textoJ.includes("Arriendo")?"arriendo":nroFact.startsWith("FEE-")?"serv_adm":"arriendo";

    /* Extraer UF del texto del PDF */
    let ufPdf=null;
    try{
      if(texto.length>10){
        const textoJ=texto.replace(/\s+/g," ");
        /* Arriendo: "UF 380,57 x 39.841,72" */
        const mArr=textoJ.match(/UF\s+([\d]+(?:[,.]\d+)?)\s+x\s+[\d]/);
        /* Serv.Adm: "11,84 UF" */
        const mSrv=textoJ.match(/([\d]+[,.]\d+)\s*UF/i);
        if(tipo==="arriendo"&&mArr) ufPdf=parseFloat(mArr[1].replace(",","."));
        else if(tipo==="serv_adm"&&mSrv) ufPdf=parseFloat(mSrv[1].replace(",","."));
        if(ufPdf) ufPdf=Math.round(ufPdf*10000)/10000;
      }
    }catch(e){}

    pdfs.push({sitio,nroFact,tipo,ufPdf,nombreEnArchivo,zipPath:path,pdfNombre:nombre});
  }

  const conUF=pdfs.filter(p=>p.ufPdf!==null).length;
  addLog(`✓ ${pdfs.length} PDFs: ${conUF} con UF, ${pdfs.length-conUF} sin UF`,"ok");
  addLog(`  Sitios: ${[...new Set(pdfs.map(p=>p.sitio))].join(", ")}`,"info");
  pdfs.slice(0,2).forEach(p=>addLog(`  ${p.nroFact} ${p.sitio} ${p.tipo} UF=${p.ufPdf} "${p.nombreEnArchivo}"`,"info"));
  return pdfs;
}
async function getPdfBase64FromZip(zipFile,zipPath){
  const buf=await readFileAsBuffer(zipFile);
  const zip=await JSZip.loadAsync(buf);
  const pdfBuf=await zip.files[zipPath].async("uint8array");
  let binary="";const chunkSize=8192;
  for(let i=0;i<pdfBuf.length;i+=chunkSize)binary+=String.fromCharCode(...pdfBuf.slice(i,i+chunkSize));
  return btoa(binary);
}

function HistPanel({client,anio,setAnio,onClose}){
  if(!client)return null;
  const MESES_FULL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const anios=[...new Set(client.hist.map(r=>r.anio))].sort((a,b)=>b-a);
  const filas=client.hist.filter(r=>r.anio===anio);
  const fmt=v=>v!=null?v.toFixed(2):"S/Inf";
  const [ufDia5Map,setUfDia5Map]=React.useState({});
  React.useEffect(()=>{
    // Cargar UF día 5 para cada mes del año visible
    const meses=[...new Set(filas.map(r=>r.mes+1))];
    Promise.all(meses.map(async mes=>{
      const v=await getUFDia5(anio,mes);
      return[anio+"-"+String(mes).padStart(2,"0"),v?Math.round(v*100)/100:null];
    })).then(pairs=>{
      setUfDia5Map(Object.fromEntries(pairs));
    });
  },[anio,client]);
  const fmtDif=v=>{
    if(v==null)return h("span",{className:"hist-null"},"S/Inf");
    if(Math.abs(v)<0.01)return h("span",{style:{color:"var(--txm)"}},v.toFixed(2));
    return h("span",{className:v>0?"hist-dif-pos":"hist-dif-neg"},(v>0?"+":"")+v.toFixed(2));
  };
  return h("div",{className:"hist-panel"},
    h("div",{style:{padding:"12px 16px",borderBottom:"1px solid var(--bdr)",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",background:"#f8fbff"}},
      h("div",{style:{flex:1}},
        h("span",{style:{fontSize:13,fontWeight:700,color:"var(--tx)"}},"📋 Historial — "+client.nombre),
        h("span",{style:{fontSize:11,color:"var(--txm)",marginLeft:8,fontFamily:"'DM Mono',monospace"}},formatRUT(client.rut)),
        h("span",{style:{fontSize:11,color:"var(--txm)",marginLeft:8}},"Sitio: "+client.sitio)
      ),
      h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
        h("span",{style:{fontSize:11,color:"var(--txm)"}},"Año:"),
        anios.map(a=>h("button",{
          key:a,
          onClick:()=>setAnio(a),
          style:{padding:"3px 12px",borderRadius:6,border:"1px solid "+(a===anio?"var(--acc)":"var(--bdr)"),
            background:a===anio?"var(--acc)":"var(--surf2)",color:a===anio?"#fff":"var(--txm)",
            fontSize:11,fontWeight:a===anio?700:400,cursor:"pointer"}
        },a))
      ),
      h("button",{
        onClick:onClose,
        style:{padding:"3px 10px",borderRadius:6,border:"1px solid var(--bdr)",background:"var(--surf2)",color:"var(--txm)",fontSize:11,cursor:"pointer"}
      },"✕ Cerrar")
    ),
    h("div",{style:{overflowX:"auto"}},
      h("table",{className:"hist-tbl"},
        h("thead",null,
          h("tr",null,
            h("th",null,"Mes"),
            h("th",{style:{textAlign:"right",color:"#1a5fa8"}},"UF día 5"),
            h("th",{style:{textAlign:"right"}},"UF Planilla"),
            h("th",{style:{textAlign:"right"}},"Facturado UF"),
            h("th",{style:{textAlign:"right"}},"Diferencia"),
          )
        ),
        h("tbody",null,
          filas.length===0
            ? h("tr",null,h("td",{colSpan:4,style:{textAlign:"center",color:"var(--txm)",padding:"20px"}},"Sin datos para "+anio))
            : filas.map(r=>h("tr",{key:r.key},
                h("td",{style:{color:"var(--tx)",fontWeight:500,fontFamily:"inherit"}},MESES_FULL[r.mes]),
                h("td",{style:{textAlign:"right",color:"#1a5fa8",fontWeight:500}},ufDia5Map[r.key]!=null?ufDia5Map[r.key].toFixed(2):"—"),
                h("td",{style:{textAlign:"right",color:r.uf!=null?"var(--tx)":"#bbb"}},fmt(r.uf)),

                h("td",{style:{textAlign:"right"}},fmtDif(r.dif))
              ))
        )
      )
    )
  );
}

function formatRUT(rut){
  if(!rut)return"";
  const clean=rut.replace(/\./g,"").toUpperCase();
  const dash=clean.indexOf("-");
  if(dash<0)return rut;
  const cuerpo=clean.slice(0,dash),dv=clean.slice(dash);
  let result="";
  for(let i=0;i<cuerpo.length;i++){if(i>0&&(cuerpo.length-i)%3===0)result+=".";result+=cuerpo[i];}
  return result+dv;
}
function getEstado(r){
  if(!r.factura)return"missing";
  if(r.ufPlan>500)return r.factura?"ok":"missing";
  if(r.ufPdf===null||r.ufPdf===undefined)return"missing";
  // Comparar las 3 UF: PDF vs Planilla, y Planilla vs SII
  const diffPdf=Math.abs(r.ufPdf-r.ufPlan)>0.5;
  const diffSII=r.ufSII!=null&&Math.abs(r.ufPlan-r.ufSII)>0.5;
  if(diffPdf||diffSII)return"diff";
  return"ok";
}

  /* ── DASHBOARD STATE ── */

  /* CAMBIO 1: estado para UF y conversión a CLP */

  /* Cargar planilla automáticamente desde /api/planilla (Service Account — sin OAuth) */

  /* NO auto-procesar — el usuario decide cuándo ir a Facturación */

  /* Cargar UF SII (día 05 del mes) cuando cambia el período */
  useEffect(()=>{
    const parts=periodo.split(" ");
    const MES_NUM={"Enero":1,"Febrero":2,"Marzo":3,"Abril":4,"Mayo":5,"Junio":6,"Julio":7,"Agosto":8,"Septiembre":9,"Octubre":10,"Noviembre":11,"Diciembre":12};
    const mes=MES_NUM[parts[0]],anio=parseInt(parts[1]);
    if(!mes||!anio)return;
    getUFDia5(anio,mes).then(v=>setUfSII(v?Math.round(v*100)/100:null));
  },[periodo]);

  /* Cargar UF históricas cuando dashData está disponible */
  useEffect(()=>{
    if(!dashData)return;
    const months=Object.values(dashData.monthTotals).filter(m=>m.arr>0);
    if(months.length===0)return;
    Promise.all(
      months.map(m=>
        getUFForMonth(m.year,m.month).then(v=>({key:`${m.year}-${String(m.month).padStart(2,"0")}`,uf:v}))
      )
    ).then(results=>{
      const map={};
      results.forEach(({key,uf})=>{if(uf)map[key]=uf;});
      setMonthlyUF(map);
    });
  },[dashData]);

  /* Auto-parsear planilla para dashboard */
  useEffect(()=>{
    if(!files.planilla)return;
    setDashLoading(true);
    setDashData(null);
    parsePlanillaParaDashboard(files.planilla)
      .then(d=>{setDashData(d);setDashLoading(false);})
      .catch(e=>{console.error(e);setDashLoading(false);notify("Error leyendo planilla: "+e.message,"err");});
  },[files.planilla]);

  const getToken=useCallback(async()=>{if(gmailToken)return gmailToken;const token=await getGoogleToken(clientId);setGmailToken(token);return token;},[gmailToken,clientId]);
  const todosSubidos=files.planilla&&files.zip;

  /* ── PROCESAR ── */
  const procesar=useCallback(async()=>{
    if(!todosSubidos)return;
    setShowProc(true);setProcDone(false);setProcLogs([]);setProcProgress(5);
    try{
      addLog("▶ Leyendo planilla de facturación...","info");
      const clientes=await procesarPlanillaFacturacion(files.planilla,periodo);
      addLog(`✓ ${clientes.length} filas detectadas para ${periodo}`,"ok");setProcProgress(25);
      addLog("✓ Correos leídos desde columna M de la planilla","ok");setProcProgress(40);
      addLog("▶ Procesando PDFs del ZIP...","info");
      const pdfs=await procesarPDFs(files.zip,addLog);setProcProgress(65);
      /* Obtener montos UF del servidor (extracción server-side) */
      addLog("▶ Extrayendo montos UF de PDFs...","info");
      try{
        const ufRes=await fetch(`/api/pdftext?periodo=${encodeURIComponent(periodo)}`);
        if(ufRes.ok){
          const ufData=await ufRes.json();
          let conUF=0,conRUT=0;
          for(const p of pdfs){
            if(ufData.pdfs&&ufData.pdfs[p.nroFact]){
              const d=ufData.pdfs[p.nroFact];
              p.ufPdf=d.uf;
              p.rutPdf=d.rut;
              if(p.ufPdf!==null)conUF++;
              if(p.rutPdf)conRUT++;
            }
          }
          addLog(`✓ Datos extraídos: ${conRUT} RUTs, ${conUF} montos UF de ${pdfs.length} PDFs`,"ok");
        }else{
          addLog("⚠ No se pudieron extraer datos del servidor","warn");
        }
      }catch(e){addLog("⚠ Error extrayendo datos: "+e.message,"warn");}
      setProcProgress(75);
      addLog("▶ Cruzando datos planilla vs PDFs...","info");
      const pdfUsado=new Set();
      const MANUAL={"A-2|Banco Estado Express|202.6|arriendo":"FEE-39","A-2|Banco del Estado de Chile|256.7|arriendo":"FEE-39"};
      const filas=[];
      for(const c of clientes){
        const correo=c.email||"";
        const concepto=c.tipo==="arriendo"?"Arriendo":"Serv. Adm.";
        const colRef=c.tipo==="arriendo"?"GS":"GT";
        const mk=`${c.sitio}|${c.cliente}|${c.uf}|${c.tipo}`;
        let factura="",ufPdf=null;
        if(MANUAL[mk]){factura=MANUAL[mk];ufPdf=c.uf;}
        else{
          let bestIdx=-1,bestScore=0;
          const rutNorm=c.rut||"";

          for(let idx=0;idx<pdfs.length;idx++){
            if(pdfUsado.has(idx))continue;
            const p=pdfs[idx];
            if(p.sitio!==c.sitio||p.tipo!==c.tipo)continue;
            let score=0;
            /* 1. RUT exacto — prioridad máxima (100 puntos) */
            if(rutNorm&&p.rutPdf&&p.rutPdf===rutNorm) score+=100;
            /* 2. UF exacta — alta prioridad (50 puntos) */
            if(p.ufPdf!==null&&Math.abs(p.ufPdf-c.uf)<0.01) score+=50;
            else if(p.ufPdf!==null&&Math.abs(p.ufPdf-c.uf)<0.5) score+=20;
            if(score>bestScore){bestScore=score;bestIdx=idx;}
          }
          /* Fallback por sitio+tipo si no hubo match */
          if(bestScore===0){
            for(let idx=0;idx<pdfs.length;idx++){
              if(pdfUsado.has(idx))continue;
              const p=pdfs[idx];
              if(p.sitio===c.sitio&&p.tipo===c.tipo){bestIdx=idx;break;}
            }
          }
          if(bestIdx>=0){pdfUsado.add(bestIdx);factura=pdfs[bestIdx].nroFact;ufPdf=pdfs[bestIdx].ufPdf;}
        }
        filas.push({sitio:c.sitio,cliente:c.cliente,rut:c.rut,correo,concepto,colRef,factura,ufSII,ufPlan:c.uf,ufPdf,enviado:false});
      }
      const nuevoMapa={};
      for(const p of pdfs){if(p.nroFact&&p.zipPath)nuevoMapa[p.nroFact]={zipPath:p.zipPath,nombre:p.pdfNombre};}
      setPdfMap(nuevoMapa);
      const sinPdf=filas.filter(f=>!f.factura);
      addLog(`✓ ${filas.filter(f=>f.factura).length}/${filas.length} facturas cruzadas`,"ok");
      if(sinPdf.length>0){addLog(`  Sin PDF: ${sinPdf.slice(0,3).map(f=>f.sitio+"/"+f.cliente.slice(0,20)).join(" | ")}`,"info");}setProcProgress(100);setProcDone(true);
      /* Auto-cerrar y mostrar tabla si no hubo errores */
      setTimeout(()=>{setShowProc(false);setView("table");},1800);
      setData(filas);
      const prevSent=new Set();
      filas.forEach((f,i)=>{const key=`${periodo}|${f.cliente}|${f.concepto}`;if(sentKeys.has(key))prevSent.add(i);});
      setSentSet(prevSent);
      if(prevSent.size>0)addLog(`✓ ${prevSent.size} correos ya enviados en sesiones anteriores`,"ok");
    }catch(e){addLog("✗ Error: "+e.message,"err");setProcDone(true);notify("Error: "+e.message,"err");}
  },[files,periodo]);

  const finishProc=()=>{setShowProc(false);setView("table");notify(`${data.length} filas procesadas — ${periodo}`);};

  /* ── ENVÍO ── */
  const confirmSend=async()=>{
    const{idx,row}=preview;setPreview(null);setSendingIdx(idx);
    const dest=MODO_PRUEBA?TEST_DEST:row.correo;
    try{
      const token=await getToken();

    }catch(e){if(e.message.includes("invalid_grant")||e.message.includes("Token"))setGmailToken(null);notify("Error: "+e.message,"err");}
    setSendingIdx(null);
  };

  const MES_STR={"Enero":"01","Febrero":"02","Marzo":"03","Abril":"04","Mayo":"05","Junio":"06","Julio":"07","Agosto":"08","Septiembre":"09","Octubre":"10","Noviembre":"11","Diciembre":"12"};
  const splitPDF=async()=>{
    
    setSplitLoading(true);setSplitResult(null);
    const [mesNombre,anio]=periodo.split(" ");
    const mesNum=MES_STR[mesNombre];
    const periodoCode=`${anio}-${mesNum} prueba`;
    try{
      const res=await fetch("/api/split-pdf",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          pdfFileId:DRIVE_PDF_FACTURAS_ID,
          periodo:periodoCode,
          destFolderId:DRIVE_FACTURACION_FOLDER_ID,
        }),
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||"Error desconocido");
      setSplitResult(data);
      notify("✓ "+data.zipName+" subido a Drive ("+data.totalFacturas+" facturas)","ok");
    }catch(e){
      setSplitResult({error:e.message});
      notify("Error: "+e.message,"err");
    }finally{setSplitLoading(false);}
  };
  const handleLogin=()=>{
    if(pwdInput===SEND_PWD){setUnlocked(true);setShowPwdModal(false);setPwdInput("");setPwdError(false);}
    else{setPwdError(true);setPwdInput("");}
  };
  const sendAll=async()=>{
    const enriched=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
    const pend=enriched.filter(r=>r.estado==="ok"&&r.correo&&!sentSet.has(r.i));
    if(!pend.length)return notify("No hay correos pendientes","warn");
    try{
      const token=await getToken();notify("Enviando "+pend.length+" correos vía Gmail...","info");
      let enviados=0;
      for(const row of pend){
        const dest=MODO_PRUEBA?TEST_DEST:row.correo;
        const subject="Factura "+row.factura+" — "+row.concepto+" "+periodo+" — Patagónica Inmobiliaria SpA";
        const htmlBody=buildEmailHtml(row.cliente,row.concepto,periodo,row.ufPlan,row.factura);
        const pdf=pdfMap[row.factura];let pdfB64=null;
        if(pdf?.zipPath&&files.zip){try{pdfB64=await getPdfBase64FromZip(files.zip,pdf.zipPath);}catch(e){}}
        try{await sendGmail(token,dest,CCO,REMITENTE,subject,htmlBody,pdfB64,pdf?.nombre);const key=`${periodo}|${row.cliente}|${row.concepto}`;marcarEnviado(row.i,key);enviados++;await new Promise(r=>setTimeout(r,400));}
        catch(e){notify("Error en "+row.cliente+": "+e.message,"err");}
      }
      if(enviados>0){try{const resumenRows=pend.slice(0,enviados);const resumenHtml=buildResumenHtml(resumenRows,periodo);const resSubject="Resumen Facturación "+periodo+" — "+enviados+" correos enviados";await sendGmail(token,"amelendez@patagonica.cl","","amelendez@patagonica.cl",resSubject,resumenHtml,null,null);await sendGmail(token,"mmunoz@patagonica.cl","","amelendez@patagonica.cl",resSubject,resumenHtml,null,null);}catch(e){console.warn("Error enviando resumen:",e.message);}}
      notify("✓ "+enviados+"/"+pend.length+" correos enviados");
    }catch(e){notify(e.message.includes("popup")?"Autorización cancelada":"Error: "+e.message,"warn");}
  };

  /* Sin SetupPanel — siempre va al dashboard */

  const enriched=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
  const stats={total:enriched.length,ok:enriched.filter(r=>r.estado==="ok").length,diff:enriched.filter(r=>r.estado!=="ok").length,sent:sentSet.size,conPdf:enriched.filter(r=>r.factura&&r.ufPdf!==null).length,sinPdf:enriched.filter(r=>!r.factura||r.ufPdf===null).length};

    const mf=filter==="all"||(filter==="ok"&&r.estado==="ok"&&!sentSet.has(r.i))||(filter==="diff"&&r.estado!=="ok")||(filter==="sent"&&sentSet.has(r.i));
    const mc=concFilter==="all"||(concFilter==="arr"&&r.concepto==="Arriendo")||(concFilter==="srv"&&r.concepto==="Serv. Adm.");
    const ms=!search||r.cliente.toLowerCase().includes(search.toLowerCase())||r.sitio.includes(search.toUpperCase())||(r.rut&&r.rut.replace(/\./g,"").includes(search.replace(/\./g,"")));
    return mf&&mc&&ms;
  });

  /* ══════════════════════════════════════════════════════════
     RENDER DASHBOARD
  ══════════════════════════════════════════════════════════ */
  const renderDashboard=(curSitio,curMes,curSearch)=>{
    /* CAMBIO 1: todos los totales en CLP usando ufActual */

    const totalUfSrv=dashData?Math.round(dashData.clients.reduce((s,c)=>s+c.ufSrv,0)*100)/100:0;

    const totalClpArr=Math.round(totalUfArr*ufRef);

    const totalClp=Math.round(totalUf*ufRef);
    const afectoCount=dashData?dashData.clients.filter(c=>c.afecto==="Afecto").length:0;

    /* Gráfico: últimos 15 meses con datos — CAMBIO 1: valores en CLP */

      return{key,label:v.label,arr:Math.round(v.arr*uf),srv:Math.round(v.srv*uf),year:v.year,month:v.month};
    });
    const maxVal=chartData.length?Math.max(...chartData.map(v=>v.arr+v.srv)):1;
    const CHART_H=110;

    /* Totales por sitio en CLP para el desglose */
    const siteMapCLP=dashData?Object.fromEntries(
      Object.entries(dashData.siteMap).map(([sitio,info])=>([sitio,{
        ...info,
        clpArr:Math.round(info.ufArr*ufRef),
        clpSrv:Math.round(info.ufSrv*ufRef),
        clpTotal:Math.round((info.ufArr+info.ufSrv)*ufRef),
      }]))
    ):{};

    /* Variables tabla clientes — calculadas en el scope de renderDashboard */
    const tblMesOpts=[{k:"current",l:"Mes actual"},...Object.entries(dashData?dashData.monthTotals:{}).filter(([,v])=>v.arr>0).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>({k,l:v.label}))];
    const tblUf=curMes==="current"?ufRef:(monthlyUF[curMes]||ufRef);
    if(dashData&&curMes!=="current"&&!monthlyUF[curMes]){const[yr,mo]=curMes.split("-").map(Number);getUFForMonth(yr,mo).then(v=>{if(v)setMonthlyUF(p=>({...p,[curMes]:v}));});}
    const tblClients=dashData?dashData.clients.filter(c=>{
      const ms=!curSearch||c.nombre.toLowerCase().includes(curSearch.toLowerCase())||c.rut.includes(curSearch);
      const msite=curSitio==="all"||(c.sitio||"").trim()===(curSitio||"").trim();
      return ms&&msite;
    }):[];
    const tblUfLabel=curMes==="current"?`UF hoy: ${tblUf.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2})}`:`UF ${tblMesOpts.find(m=>m.k===dashMes)?.l||""}: ${tblUf.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2})}`;

    return h("main",{style:{flex:1,overflowY:"auto",padding:"18px 22px",display:"flex",flexDirection:"column",gap:16},className:"fade-up"},

      /* Barra de estado: UF + fuente planilla */

        ufLoading&&h("span",{className:"spin",style:{fontSize:14}},"⟳"),
        driveLoading&&h("span",{style:{display:"flex",alignItems:"center",gap:5,color:"var(--blue)"}},h("span",{className:"spin",style:{fontSize:13}},"⟳"),"Cargando planilla desde Drive..."),

        h("span",{style:{color:"var(--txd)",marginLeft:2}},"Montos en CLP · mindicador.cl"),

          h("div",{className:"dash-card-sub"},dashData?`${Object.keys(dashData.siteMap).filter(s=>dashData.siteMap[s].count>0).length} sitios activos`:"Carga la planilla")

        h("div",{className:"dash-card"},
          h("div",{className:"dash-card-lbl"},"Arriendo Mensual"),

          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},

            h("div",{style:{display:"flex",gap:14,fontSize:10,color:"var(--txm)"}},
              h("span",null,h("span",{style:{display:"inline-block",width:8,height:8,background:"#378add",borderRadius:2,marginRight:4,verticalAlign:"middle"}}),"Arriendo"),
              h("span",null,h("span",{style:{display:"inline-block",width:8,height:8,background:"#ef9f27",borderRadius:2,marginRight:4,verticalAlign:"middle"}}),"Serv. Adm. (est.)")

        driveLoading?

            h("span",{className:"spin",style:{fontSize:18}},"⟳"),

            h("div",{style:{fontSize:12,fontWeight:600,marginBottom:10,color:"var(--txm)"}},"📂 O sube la planilla manualmente"),

        /* Barra de controles */

          h("span",{style:{fontWeight:700,fontSize:12,color:"var(--tx)"}},"Clientes"),
          h("span",{style:{fontSize:11,color:"var(--txd)",fontFamily:"'DM Mono',monospace",background:"var(--surf2)",padding:"2px 8px",borderRadius:6}},tblClients.length+" / "+dashData.clients.length),
          h("div",{style:{display:"flex",gap:4,flexWrap:"wrap",marginLeft:4}},
            h("button",{onClick:()=>setDashSitio("all"),className:`pill${curSitio==="all"?" active":""}`,style:{fontSize:10,padding:"3px 10px"}},"Ver todos"),
            ...Object.keys(dashData.siteMap).filter(s=>s&&!/^\d+$/.test(s)).sort().map(s=>
              h("button",{key:s,onClick:()=>setDashSitio(curSitio===s?"all":s),
                style:{padding:"3px 9px",borderRadius:10,fontSize:10,fontWeight:700,
                  background:curSitio===s?(SITIO_C[s]||"#888"):`${SITIO_C[s]||"#888"}18`,
                  color:curSitio===s?"#fff":(SITIO_C[s]||"#888"),
                  border:`1px solid ${SITIO_C[s]||"#888"}${curSitio===s?"":"40"}`,
                  cursor:"pointer",transition:"all .15s"}
              },s)
            )
          ),
          h("select",{value:curMes,onChange:e=>{setDashMes(e.target.value);},
            style:{fontSize:11,padding:"4px 8px",borderRadius:7,border:"1px solid var(--bdr)",background:"var(--surf)",color:"var(--tx)",fontFamily:"'DM Mono',monospace",marginLeft:4}},
            tblMesOpts.map(m=>h("option",{key:m.k,value:m.k},m.l))
          ),
          h("span",{style:{fontSize:10,color:"var(--txd)",fontFamily:"'DM Mono',monospace"}},tblUfLabel),
          h("input",{value:dashSearch,onChange:e=>setDashSearch(e.target.value),placeholder:"Buscar cliente o RUT...",style:{width:180,marginLeft:"auto"}})
        ),
        h("div",{className:"dash-client-hdr"},
          ["Sitio","Cliente / RUT","Arriendo CLP","Serv.Adm. CLP","Total CLP","IVA","Término","Antelac.","Aviso","F.Reajuste","% Reaj.","Cada","m²",""].map(col=>h("div",{key:col},col))
        ),
        h("div",{key:"rows-"+curSitio+"-"+tblClients.length,style:{maxHeight:420,overflowY:"auto",overflowX:"auto"}},
          tblClients.length===0?
            h("div",{style:{padding:"32px",textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin resultados"):
            tblClients.map(c=>{
              const color=SITIO_C[c.sitio]||"#888";
              const clpArr=c.ufArr>0?Math.round(c.ufArr*tblUf):null;
              const clpSrv=c.ufSrv>0?Math.round(c.ufSrv*tblUf):null;

              return h("div",{key:c.rut+c.nombre+c.sitio+"_wrap",style:{borderBottom:"1px solid var(--bdr)",background:isSelected?"#f0f6ff":"transparent"}},
              h("div",{
                className:"dash-client-row",
                style:{cursor:"pointer",borderBottom:"none",background:isSelected?"#e8f2ff":"transparent"},
                onClick:()=>{setHistClient(isSelected?null:c);setHistAnio(2026);},
                title:isSelected?"Cerrar historial":"Ver historial del cliente"
              },
                h("div",null,h("span",{style:{padding:"2px 6px",borderRadius:5,fontSize:9,fontWeight:700,background:`${color}18`,color,border:`1px solid ${color}40`}},c.sitio||"—")),
                h("div",{style:{flexDirection:"column",alignItems:"flex-start",gap:2}},
                  h("div",{style:{fontWeight:600,fontSize:11,lineHeight:1.3}},c.nombre),
                  h("div",{style:{fontSize:9,color:"var(--txd)",fontFamily:"'DM Mono',monospace"}},c.rut),
                  c.email&&h("a",{href:"mailto:"+c.email,style:{fontSize:9,color:"var(--accl)",fontFamily:"'DM Mono',monospace",textDecoration:"none",userSelect:"text"},title:c.email},c.email)
                ),
                h("div",{style:{fontFamily:"'DM Mono',monospace",color:"var(--blue)",fontWeight:600,fontSize:10}},clpArr?formatCLP(clpArr):"—"),
                h("div",{style:{fontFamily:"'DM Mono',monospace",color:"var(--amber)",fontSize:10}},clpSrv?formatCLP(clpSrv):"—"),
                h("div",{style:{fontFamily:"'DM Mono',monospace",fontWeight:700,fontSize:10}},clpTotal?formatCLP(clpTotal):"—"),

  /* ══════════════════════════════════════════════════════════
