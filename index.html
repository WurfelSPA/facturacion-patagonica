*{box-sizing:border-box;margin:0;padding:0}
:root{

html,body,#root{height:100%;font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--tx);font-size:13px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}
input,select{font-family:inherit;background:var(--bg);border:0.5px solid var(--bdr);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:12px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
input::placeholder{color:var(--txd)}
button{font-family:'IBM Plex Sans',sans-serif;cursor:pointer;transition:all 0.15s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
.fade-up{animation:fadeUp 0.3s ease}
.row-tr:hover td{background:var(--surf2)!important}
.pill-btn{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:500;border:0.5px solid var(--bdr);background:transparent;color:var(--txm);cursor:pointer;transition:all 0.15s}
.pill-btn:hover:not(.active){background:var(--surf2)}
.pill-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.send-ready{background:var(--gbg);border:0.5px solid var(--gdim);color:var(--green);padding:5px 12px;border-radius:7px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.send-ready:hover{background:#163a1f;border-color:var(--green)}
.send-dis{background:transparent;border:0.5px solid var(--bdr);color:var(--txd);padding:5px 12px;border-radius:7px;font-size:11px;opacity:0.4;cursor:not-allowed}
.send-sent{color:var(--green);font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal{background:var(--surf);border:0.5px solid var(--bdr2);border-radius:16px;padding:28px;width:580px;max-width:95vw;animation:fadeUp 0.2s ease}
.notif{position:fixed;top:20px;right:20px;z-index:200;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;animation:fadeIn 0.2s ease;pointer-events:none;max-width:420px}
.concepto-arr{background:#1a2535;border:0.5px solid #2a4a6a;color:#60a5fa;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;font-family:'IBM Plex Sans',sans-serif}

function getEstado(r){
  if(!r.factura||r.ufPdf===null||r.ufPdf===undefined)return"missing";
  if(Math.abs(r.ufPdf-r.ufPlan)>0.5)return"diff";
  return"ok";
}

function Badge({e}){
  const c={
    ok:{label:"Coincide",bg:"var(--gbg)",col:"var(--green)",bdr:"var(--gdim)",icon:"✓"},
    diff:{label:"Difiere",bg:"var(--abg)",col:"var(--amber)",bdr:"var(--adim)",icon:"△"},
    missing:{label:"Sin PDF",bg:"var(--rbg)",col:"var(--red)",bdr:"var(--rdim)",icon:"○"}
  }[e];
  return h("span",{style:{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:500,background:c.bg,color:c.col,border:`0.5px solid ${c.bdr}`}},c.icon," ",c.label);
}

    "Conectando con Google Drive",

    h("div",{className:"modal"},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}},

function App(){
  const [view,setView]=useState("idle");
  const [data,setData]=useState([]);
  const [periodo,setPeriodo]=useState("Mayo 2026");
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [concFilter,setConcFilter]=useState("all");
  const [sentSet,setSentSet]=useState(new Set());
  const [sendingSet,setSendingSet]=useState(new Set());
  const [showProc,setShowProc]=useState(false);
  const [procStep,setProcStep]=useState(0);
  const [procLog,setProcLog]=useState([]);
  const [procDone,setProcDone]=useState(false);
  const [preview,setPreview]=useState(null);
  const [notif,setNotif]=useState(null);

  const notify=(msg,t="ok")=>{setNotif({msg,t});setTimeout(()=>setNotif(null),4000);};

  const runProcess=useCallback(async()=>{
    setShowProc(true);setProcDone(false);setProcStep(0);setProcLog([]);
    const mm=periodo.split(" ")[0].slice(0,3).toUpperCase();
    const yy=periodo.split(" ")[1];
    const mesNum=PERIODOS.indexOf(periodo)+1;
    const logs=[
      [`▶ Conectando con Google Drive (${REMITENTE})...`,`✓ Sesión iniciada`],
      [`▶ Leyendo Planilla_Facturacion_${mm}_${yy}.xlsx`,`▶ Buscando fecha ${yy}-${String(mesNum).padStart(2,'0')}-01 en fila 3...`,`✓ Columnas detectadas dinámicamente para ${periodo}`],
      [`▶ Leyendo hoja "${periodo}" de Detalle_envío_facturas.xlsx...`,`▶ Filtrando clientes con "Correo Enviado = NO"...`,`✓ Solo se cargarán los pendientes de envío`],
      [`▶ Escaneando PDFs en carpeta ${mm}-${yy}/...`,`✓ Arriendo: "UF X,XX x valor_dia" | Serv.Adm.: "X,XX UF valor_dia"`],
      [`▶ Arriendo → compara col. GS | Serv.Adm. → compara col. GT`,`✓ Montos cruzados correctamente`],
      [`▶ Cruzando correos desde planilla de envío...`,`✓ Correos mapeados · CCO: ${CCO}`],
      [`▶ Guardando Verificacion_${mm}-${yy}.xlsx en Drive...`,`✓ Proceso completado — ${new Date().toLocaleString('es-CL')}`],
    ];
    for(let i=0;i<logs.length;i++){
      await new Promise(r=>setTimeout(r,750+Math.random()*350));
      setProcStep(i+1);
      setProcLog(prev=>[...prev,...logs[i]]);
    }
    setProcDone(true);
  },[periodo]);

  const finishProc=()=>{
    setShowProc(false);setView("table");
    // Solo carga los que tienen enviado=false (Correo Enviado = NO)
    const pendientes=DATOS_CARGADOS.filter(r=>!r.enviado);
    setData(pendientes);
    setSentSet(new Set());setSendingSet(new Set());
    setFilter("all");setSearch("");setConcFilter("all");
    notify(`${pendientes.length} clientes pendientes cargados — ${periodo}`);
  };

  const doSend=i=>setPreview({row:data[i],idx:i});

  const confirmSend=async()=>{
    const{idx,row}=preview;setPreview(null);
    setSendingSet(p=>new Set([...p,idx]));
    await new Promise(r=>setTimeout(r,1100));
    setSendingSet(p=>{const s=new Set(p);s.delete(idx);return s;});
    setSentSet(p=>new Set([...p,idx]));
    const destEnvio=MODO_PRUEBA?TEST_DEST:row.correo;
    notify(`✓ Enviado${MODO_PRUEBA?" (PRUEBA)":""} → ${destEnvio} · CCO: ${CCO}`);
    sendPrompt(`Envía correo Gmail desde ${REMITENTE}, Para: ${destEnvio}, CCO: ${CCO}.
Asunto: "Factura ${row.factura} — ${row.concepto} ${periodo} — Patagónica Inmobiliaria SpA"
Cuerpo HTML profesional con: cliente="${row.cliente}", concepto="${row.concepto}", mes="${periodo}", UF=${row.ufPlan.toFixed(4)}, factura="${row.factura}".
${MODO_PRUEBA?"NOTA: Modo prueba — destino real del cliente es: "+row.correo:""}
Una vez enviado, actualiza la celda "Correo Enviado" del cliente "${row.cliente}" (${row.concepto}) en la hoja "${periodo}" de Detalle_envío_facturas_Inpasa_y_Pisa.xlsx en Google Drive, cambiando de NO a SI.`);
  };

  const sendAll=async()=>{
    const pend=data.map((_,i)=>i).filter(i=>getEstado(data[i])==="ok"&&data[i].correo&&!sentSet.has(i)&&!sendingSet.has(i));
    if(!pend.length)return notify("No hay correos pendientes","warn");
    for(const i of pend){
      setSendingSet(p=>new Set([...p,i]));
      await new Promise(r=>setTimeout(r,200));
      setSendingSet(p=>{const s=new Set(p);s.delete(i);return s;});
      setSentSet(p=>new Set([...p,i]));
    }
    const destEnvio=MODO_PRUEBA?TEST_DEST:"cada cliente";
    notify(`${pend.length} correos enviados${MODO_PRUEBA?" (PRUEBA → "+TEST_DEST+")":""} · CCO: ${CCO}`);
    const lista=pend.map(i=>({
      cliente:data[i].cliente,
      correoReal:data[i].correo,
      correoEnvio:MODO_PRUEBA?TEST_DEST:data[i].correo,
      factura:data[i].factura,
      concepto:data[i].concepto,
      ufPlan:data[i].ufPlan
    }));
    sendPrompt(`Envía ${pend.length} correos Gmail desde ${REMITENTE}, CCO: ${CCO} a cada destinatario de esta lista:
${JSON.stringify(lista,null,2)}
${MODO_PRUEBA?"⚠ MODO PRUEBA: todos los correos van a "+TEST_DEST+" (campo correoEnvio), NO al correo real del cliente.":""}
Formato de cada correo: Asunto "Factura [factura] — [concepto] ${periodo} — Patagónica Inmobiliaria SpA", cuerpo HTML profesional con nombre del cliente, concepto, período, monto UF y número de factura.
Al finalizar cada envío exitoso, actualiza "Correo Enviado" de NO a SI en la hoja "${periodo}" de Detalle_envío_facturas_Inpasa_y_Pisa.xlsx en Google Drive para ese cliente.`);
  };

  const enriched=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
  const stats={
    total:enriched.length,
    ok:enriched.filter(r=>r.estado==="ok").length,
    diff:enriched.filter(r=>r.estado!=="ok").length,
    sent:sentSet.size,
    arr:enriched.filter(r=>r.concepto==="Arriendo").length,
    srv:enriched.filter(r=>r.concepto==="Serv. Adm.").length,
  };
  const filtered=enriched.filter(r=>{
    const mf=filter==="all"||(filter==="ok"&&r.estado==="ok"&&!sentSet.has(r.i))||(filter==="diff"&&r.estado!=="ok")||(filter==="sent"&&sentSet.has(r.i));
    const mc=concFilter==="all"||(concFilter==="arr"&&r.concepto==="Arriendo")||(concFilter==="srv"&&r.concepto==="Serv. Adm.");
    const ms=!search||r.cliente.toLowerCase().includes(search.toLowerCase())||r.sitio.includes(search.toUpperCase());
    return mf&&mc&&ms;
  });

  return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column"}},
    notif&&h("div",{className:"notif",style:{
      background:notif.t==="ok"?"var(--gbg)":"var(--abg)",
      border:`0.5px solid ${notif.t==="ok"?"var(--gdim)":"var(--adim)"}`,
      color:notif.t==="ok"?"var(--green)":"var(--amber)"
    }},(notif.t==="ok"?"✓ ":"△ ")+notif.msg),

    showProc&&h(ProcModal,{step:procStep,log:procLog,done:procDone,onClose:finishProc}),
    preview&&h(EmailModal,{row:preview.row,periodo,onClose:()=>setPreview(null),onConfirm:confirmSend}),

    /* BANNER MODO PRUEBA */
    MODO_PRUEBA&&h("div",{className:"test-banner"},
      "⚠",h("strong",null,"MODO PRUEBA activo"),"— los correos se envían a",
      h("strong",{style:{marginLeft:4}},TEST_DEST),"en lugar del destinatario real del cliente.",
      h("span",{style:{marginLeft:"auto",color:"var(--txd)",fontSize:10}},'Para producción: cambiar TEST_DEST="" en el código')
    ),

    /* HEADER */
    h("header",{style:{background:"var(--surf)",borderBottom:"0.5px solid var(--bdr)",padding:"13px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}},
      h("div",{style:{display:"flex",alignItems:"center",gap:14}},
        h("div",{style:{width:34,height:34,background:"var(--acc)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,color:"#fff",fontWeight:700,flexShrink:0}},"⬡"),
        h("div",null,
          h("div",{style:{fontSize:14,fontWeight:600,fontFamily:"'IBM Plex Sans',sans-serif",letterSpacing:"-0.3px"}},"Patagónica Inmobiliaria"),
          h("div",{style:{fontSize:10,color:"var(--txm)"}},REMITENTE+" · CCO: "+CCO)
        ),
        view==="table"&&h("span",{style:{background:"var(--bbg)",border:"0.5px solid var(--blue)",color:"var(--blue)",fontSize:11,padding:"3px 11px",borderRadius:20,marginLeft:4}},periodo)
      ),
      h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        view==="table"&&h("select",{value:periodo,onChange:e=>{setPeriodo(e.target.value);setView("idle");},style:{fontSize:12,cursor:"pointer"}},
          PERIODOS.map(p=>h("option",{key:p,value:p},p))),
        view==="table"&&h("button",{onClick:()=>runProcess(),style:{background:"transparent",border:"0.5px solid var(--bdr)",color:"var(--txm)",borderRadius:8,padding:"6px 14px",fontSize:12}},"⟳ Reprocesar"),
        h("button",{onClick:view==="table"?sendAll:runProcess,
          style:{background:view==="table"?MODO_PRUEBA?"var(--amber)":"var(--green)":"var(--acc)",
                 color:view==="table"?"#0d1a00":"#fff",
                 border:"none",borderRadius:8,padding:"7px 18px",fontSize:12,fontWeight:700,fontFamily:"'IBM Plex Sans',sans-serif"}},
          view==="table"?MODO_PRUEBA?"⚠ Enviar todos (PRUEBA)":"✉ Enviar todos":"▶ Procesar Drive")
      )
    ),

    /* IDLE */
    view==="idle"&&h("main",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:24,padding:40}},
      h("div",{style:{width:64,height:64,background:"var(--surf)",border:"0.5px solid var(--bdr)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}},"⬡"),
      h("div",{style:{textAlign:"center"}},
        h("h1",{style:{fontSize:20,fontWeight:600,fontFamily:"'IBM Plex Sans',sans-serif",marginBottom:8}},"Listo para procesar"),
        h("p",{style:{fontSize:13,color:"var(--txm)",maxWidth:460,lineHeight:1.8}},
          "Sube los archivos a ",h("code",{style:{color:"var(--accl)",fontSize:12}},"Facturación Mensual/MM-AAAA/"),
          " en Drive. Solo se cargan los clientes con ",h("strong",{style:{color:"var(--amber)"}},"Correo Enviado = NO"),".")
      ),
      h("div",{style:{background:"var(--surf)",border:"0.5px solid var(--bdr)",borderRadius:12,padding:20,width:"100%",maxWidth:500}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
          h("span",{style:{fontSize:12,color:"var(--txm)",fontFamily:"'IBM Plex Sans',sans-serif",fontWeight:500}},"Archivos esperados"),
          h("select",{value:periodo,onChange:e=>setPeriodo(e.target.value),style:{fontSize:11,padding:"4px 8px"}},
            PERIODOS.map(p=>h("option",{key:p,value:p},p)))
        ),
        [["⊞","Planilla_Facturacion_MM-AAAA.xlsx","Columnas GS/GT detectadas dinámicamente por mes"],
         ["⊞","Detalle_envío_facturas_Inpasa_y_Pisa.xlsx","Hoja 'MM-AAAA' → columna 'Correo Enviado' SI/NO"],
         ["⊟","MM-AAAA/  (carpeta PDFs)","subcarpetas 5A · 4A · A2 · A1 · B · D2"]
        ].map(([ic,name,desc],i)=>
          h("div",{key:i,style:{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 0",borderTop:i>0?"0.5px solid var(--bdr)":"none"}},
            h("span",{style:{color:"var(--acc)",fontSize:16,marginTop:1,flexShrink:0}},ic),
            h("div",null,
              h("div",{style:{fontSize:12,fontFamily:"monospace",color:"var(--tx)"}}," ",name),
              h("div",{style:{fontSize:11,color:"var(--txd)",marginTop:2}},desc)
            )
          )
        ),
        h("div",{style:{marginTop:14,borderTop:"0.5px solid var(--bdr)",paddingTop:12}},
          h("div",{style:{fontSize:11,color:"var(--txm)",marginBottom:5}},
            h("span",{className:"concepto-arr"},"Arriendo")," → col. ",h("span",{className:"col-ref col-gs"},"GS"),
            "   ",h("span",{className:"concepto-srv"},"Serv. Adm.")," → col. ",h("span",{className:"col-ref col-gt"},"GT")),
          h("div",{style:{fontSize:11,color:"var(--txm)",marginTop:6}},
            "✉ De: ",h("span",{style:{color:"var(--accl)"}},REMITENTE),
            "  · CCO: ",h("span",{style:{color:"var(--txm)"}},CCO)),
          MODO_PRUEBA&&h("div",{style:{fontSize:11,color:"var(--amber)",marginTop:4}},
            "⚠ Modo prueba — envíos a: ",h("strong",null,TEST_DEST))
        )
      ),
      h("button",{onClick:runProcess,style:{background:"var(--acc)",color:"#fff",border:"none",borderRadius:10,padding:"12px 36px",fontSize:14,fontWeight:700,fontFamily:"'IBM Plex Sans',sans-serif"}},"▶ Procesar facturación")
    ),

    /* TABLE */
    view==="table"&&h("main",{style:{flex:1,display:"flex",flexDirection:"column",overflowX:"hidden"},className:"fade-up"},
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",borderBottom:"0.5px solid var(--bdr)"}},
        [{label:"Pendientes",val:stats.total,col:"var(--tx)",sub:"Correo Enviado = NO"},
         {label:"Arriendo",val:stats.arr,col:"#60a5fa",sub:"col. GS"},
         {label:"Serv. Adm.",val:stats.srv,col:"#fbbf24",sub:"col. GT"},
         {label:"Coinciden",val:stats.ok,col:"var(--green)",sub:"listos para enviar"},
         {label:"Enviados",val:stats.sent,col:"var(--accl)",sub:MODO_PRUEBA?"→ "+TEST_DEST:"correos despachados"}]
        .map((m,i)=>h("div",{key:i,style:{background:"var(--surf)",padding:"14px 18px",borderRight:i<4?"0.5px solid var(--bdr)":"none"}},
          h("div",{style:{fontSize:10,color:"var(--txm)",marginBottom:5,fontFamily:"'IBM Plex Sans',sans-serif",fontWeight:500}},m.label),
          h("div",{style:{fontSize:24,fontWeight:700,color:m.col,lineHeight:1}},m.val),
          m.sub&&h("div",{style:{fontSize:10,color:"var(--txd)",marginTop:3}},m.sub)
        ))
      ),
      h("div",{style:{background:"var(--surf)",borderBottom:"0.5px solid var(--bdr)",padding:"9px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
        [{k:"all",l:`Todos (${stats.total})`},{k:"ok",l:`Coinciden (${stats.ok})`},{k:"diff",l:`Revisar (${stats.total-stats.ok})`},{k:"sent",l:`Enviados (${stats.sent})`}]
        .map(f=>h("button",{key:f.k,className:`pill-btn${filter===f.k?" active":""}`,onClick:()=>setFilter(f.k)},f.l)),
        h("span",{style:{color:"var(--txd)",fontSize:11,marginLeft:4}},"·"),
        [{k:"all",l:"Ambos"},{k:"arr",l:"Arriendo"},{k:"srv",l:"Serv. Adm."}]
        .map(f=>h("button",{key:f.k,className:`pill-btn${concFilter===f.k?" active":""}`,onClick:()=>setConcFilter(f.k),style:{fontSize:10}},f.l)),
        h("input",{value:search,onChange:e=>setSearch(e.target.value),placeholder:"Buscar cliente o sitio...",style:{marginLeft:"auto",width:180}})
      ),
      h("div",{style:{flex:1,overflowX:"auto"}},
        h("table",{style:{width:"100%",borderCollapse:"collapse",tableLayout:"fixed",minWidth:900}},
          h("colgroup",null,
            h("col",{style:{width:60}}),h("col",{style:{width:"16%"}}),h("col",{style:{width:"18%"}}),
            h("col",{style:{width:92}}),h("col",{style:{width:52}}),h("col",{style:{width:96}}),
            h("col",{style:{width:88}}),h("col",{style:{width:88}}),h("col",{style:{width:100}})
          ),
          h("thead",null,h("tr",{style:{background:"var(--surf)"}},
            ["Sitio","Cliente","Correo","Concepto","Col.","Factura","UF planilla","UF PDF","Estado/Acción"].map(hd=>
              h("th",{key:hd,style:{padding:"8px 12px",textAlign:"left",fontSize:10,fontWeight:600,color:"var(--txd)",letterSpacing:"0.06em",borderBottom:"0.5px solid var(--bdr)",fontFamily:"'IBM Plex Sans',sans-serif"}},hd.toUpperCase())
            )
          )),
          h("tbody",null,filtered.length===0
            ?h("tr",null,h("td",{colSpan:9,style:{padding:"40px",textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin resultados"))
            :filtered.map(row=>{
              const i=row.i;
              const sent=sentSet.has(i),sending=sendingSet.has(i),noEmail=!row.correo;
              const diff=row.ufPdf!==null&&row.ufPdf!==undefined&&Math.abs(row.ufPdf-row.ufPlan)>0.5;
              const esArr=row.concepto==="Arriendo";
              const rowBg=esArr?"rgba(26,37,53,0.4)":"rgba(31,26,16,0.4)";
              return h("tr",{key:i,className:"row-tr"},
                h("td",{style:{padding:"9px 12px",background:sent?"rgba(13,40,24,0.5)":rowBg}},
                  h("span",{style:{display:"inline-block",padding:"2px 7px",borderRadius:5,fontSize:10,fontWeight:700,fontFamily:"'IBM Plex Sans',sans-serif",background:`${SITIO_C[row.sitio]||"#888"}22`,color:SITIO_C[row.sitio]||"#888",border:`0.5px solid ${SITIO_C[row.sitio]||"#888"}44`}},row.sitio)),
                h("td",{style:{padding:"9px 12px",background:sent?"rgba(13,40,24,0.5)":rowBg}},h("span",{style:{fontSize:12,fontWeight:500,fontFamily:"'IBM Plex Sans',sans-serif"}},row.cliente)),
                h("td",{style:{padding:"9px 12px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",background:sent?"rgba(13,40,24,0.5)":rowBg}},
                  h("span",{style:{fontSize:11,color:row.correo?"var(--accl)":"var(--txd)"}},row.correo||"— sin correo")),
                h("td",{style:{padding:"9px 12px",background:sent?"rgba(13,40,24,0.5)":rowBg}},h("span",{className:esArr?"concepto-arr":"concepto-srv"},row.concepto)),
                h("td",{style:{padding:"9px 12px",background:sent?"rgba(13,40,24,0.5)":rowBg}},h("span",{className:`col-ref ${esArr?"col-gs":"col-gt"}`},row.colRef)),
                h("td",{style:{padding:"9px 12px",background:sent?"rgba(13,40,24,0.5)":rowBg}},h("span",{style:{fontSize:11,fontFamily:"monospace",color:"var(--txm)"}},row.factura||"—")),
                h("td",{style:{padding:"9px 12px",background:sent?"rgba(13,40,24,0.5)":rowBg}},h("span",{style:{fontSize:12,fontFamily:"monospace"}},row.ufPlan.toFixed(4))),
                h("td",{style:{padding:"9px 12px",background:sent?"rgba(13,40,24,0.5)":rowBg}},
                  h("span",{style:{fontSize:12,fontFamily:"monospace",color:diff?"var(--amber)":"var(--tx)"}},
                    row.ufPdf!==null&&row.ufPdf!==undefined?row.ufPdf.toFixed(4):"—")),
                h("td",{style:{padding:"9px 12px",background:sent?"rgba(13,40,24,0.5)":rowBg}},
                  sent?h("span",{className:"send-sent"},"✓ Enviado"):
                  sending?h("span",{style:{fontSize:11,color:"var(--blue)",display:"inline-flex",alignItems:"center",gap:5}},h("span",{className:"spin"},"⟳")," Enviando..."):
                  row.estado==="ok"&&!noEmail?h("button",{className:"send-ready",onClick:()=>doSend(i)},"✉ Enviar"):
                  h(Badge,{e:row.estado})
                )
              );
            })
          )
        )
      ),
      h("footer",{style:{background:"var(--surf)",borderTop:"0.5px solid var(--bdr)",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h("span",{style:{fontSize:11,color:"var(--txd)"}},`${filtered.length} de ${stats.total} pendientes · ${stats.sent} enviados · ${periodo}`),
        h("button",{onClick:sendAll,style:{
          background:MODO_PRUEBA?"var(--abg)":"var(--gbg)",
          border:`0.5px solid ${MODO_PRUEBA?"var(--adim)":"var(--gdim)"}`,
          color:MODO_PRUEBA?"var(--amber)":"var(--green)",
          borderRadius:8,padding:"7px 16px",fontSize:12,fontWeight:700,
          fontFamily:"'IBM Plex Sans',sans-serif",display:"flex",alignItems:"center",gap:6}},
          MODO_PRUEBA?`⚠ Enviar todos (PRUEBA → ${TEST_DEST})`:`✉ Enviar todos los que coinciden (${Math.max(0,stats.ok-stats.sent)})`)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
