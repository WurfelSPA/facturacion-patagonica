<script>
const {useState,useRef,useCallback,useEffect,createElement:h}=React;
const REMITENTE="amelendez@patagonica.cl";
const CCO="mmunoz@patagonica.cl";
const TEST_DEST="";
const MODO_PRUEBA=TEST_DEST!=="";
const VER="v4.10.1";
const SEND_PWD="patagonica2026";
const DRIVE_PLANILLA_ID="1yIKK0ZgU5C1ARsD6NIryRlHnom2Qilml";
const DRIVE_FACTURACION_FOLDER_ID="1O1nBsti_reAKnAXXKdL2opNWz1ocZu8u"; /* Carpeta Facturacion Mensual */
const DRIVE_PDF_FACTURAS_ID="1Pl7s4FNyjVQOMcEBtgCcvCGD4FlzRg2W"; /* PDF Facturas del mes — actualizar cada mes */
const GOOGLE_SCOPES="https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets";
const TG_BOT=window.__TG_BOT__||"";
const TG_CHAT=window.__TG_CHAT__||"";
const PRESET_KEY=window.__PAT_KEY__||"";
const PRESET_GID=window.__PAT_GID__||"";

/* ═══════════════════════════════════
   CAMBIO 1: CACHÉ UF HISTÓRICA
   Fuente: mindicador.cl API pública
═══════════════════════════════════ */
const ufCache={};

async function getUFDia5(year,month){
  const key=`uf5-${year}-${String(month).padStart(2,"0")}`;
  if(ufCache[key])return ufCache[key];
  try{
    // Pedir el día 5 exacto a mindicador.cl (formato DD-MM-YYYY)
    const mon=String(month).padStart(2,"0");
    const url=`https://mindicador.cl/api/uf/05-${mon}-${year}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const serie=data.serie||[];
    if(serie.length>0){ufCache[key]=serie[0].valor;return serie[0].valor;}
    return null;
  }catch(e){console.warn("Error UF día 5",e.message);return null;}
}
async function getUFForMonth(year,month){
  const key=`${year}-${String(month).padStart(2,"0")}`;
  if(ufCache[key])return ufCache[key];
  try{
    // Usamos mindicador.cl — API pública sin auth, retorna UF histórica
    // Pedimos el día 1 del mes siguiente y tomamos el último valor disponible del mes
    const url=`https://mindicador.cl/api/uf/${String(year)}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    // data.serie = [{fecha:"2025-01-01T...", valor:xxxxx}, ...]
    const serie=data.serie||[];
    // Buscar el último valor del mes solicitado
    const entries=serie.filter(e=>{
      const d=new Date(e.fecha);
      return d.getUTCFullYear()===year&&(d.getUTCMonth()+1)===month;
    });
    if(entries.length===0){
      // Fallback: primer valor del mes siguiente
      const next=serie.filter(e=>{
        const d=new Date(e.fecha);
        const nm=month===12?1:month+1;
        const ny=month===12?year+1:year;
        return d.getUTCFullYear()===ny&&(d.getUTCMonth()+1)===nm;
      });
      if(next.length>0){ufCache[key]=next[0].valor;return next[0].valor;}
      return null;
    }
    // Tomar el valor más reciente del mes (último día disponible)
    entries.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    ufCache[key]=entries[0].valor;
    return entries[0].valor;
  }catch(e){
    console.warn("Error obteniendo UF para",key,e.message);
    return null;
  }
}

function formatCLP(pesos){
  if(pesos===null||pesos===undefined||isNaN(pesos))return"—";
  return"$"+Math.round(pesos).toLocaleString("es-CL");
}

function formatCLPCompact(pesos){
  if(pesos===null||pesos===undefined||isNaN(pesos))return"—";
  const n=Math.round(pesos);
  if(n>=1000000)return"$"+(n/1000000).toFixed(1).replace(".",",")+"M";
  if(n>=1000)return"$"+(n/1000).toFixed(0)+"K";
  return"$"+n.toLocaleString("es-CL");
}

/* ── Google OAuth (Gmail + Drive) ── */
function loadGisScript(){return new Promise(res=>{if(window.google?.accounts){res();return;}const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;document.head.appendChild(s);});}
let _gToken=null,_gTokenExp=0;
async function getGoogleToken(clientId,forceConsent){
  await loadGisScript();
  if(!forceConsent&&_gToken&&Date.now()<_gTokenExp-60000)return _gToken;
  if(forceConsent){_gToken=null;_gTokenExp=0;}
  return new Promise((res,rej)=>{
    const client=google.accounts.oauth2.initTokenClient({
      client_id:clientId,scope:GOOGLE_SCOPES,
      hint:"amelendez@patagonica.cl",
      callback:(resp)=>{
        if(resp.error)rej(new Error(resp.error));
        else{_gToken=resp.access_token;_gTokenExp=Date.now()+(resp.expires_in||3600)*1000;res(_gToken);}
      }
    });
    client.requestAccessToken({prompt:forceConsent?"consent":""});
  });
}
async function descargarPlanillaDrive(token){
  const url=`https://www.googleapis.com/drive/v3/files/${DRIVE_PLANILLA_ID}?alt=media`;
  const res=await fetch(url,{headers:{Authorization:"Bearer "+token}});
  if(!res.ok){const txt=await res.text();throw new Error(`Drive ${res.status}: ${txt.slice(0,120)}`);}
  const blob=await res.blob();
  return new File([blob],"Planilla Facturación.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function makeEmail(to,cco,from,subject,body,attachBase64,attachName,attachMime){
  attachMime=attachMime||"application/pdf";
  const boundary="PAT_BOUNDARY_"+Date.now();
  const fromHeader=`=?UTF-8?B?${btoa(unescape(encodeURIComponent("Patagónica Inmobiliaria")))}?= <${from}>`;
  let msg;
  const ccLine=cco?`Cc: ${cco}`:"";
  if(attachBase64&&attachName){
    const headers=[`From: ${fromHeader}`,`To: ${to}`];
    if(ccLine)headers.push(ccLine);
    headers.push(`Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,`MIME-Version: 1.0`,`Content-Type: multipart/mixed; boundary="${boundary}"`,``,`--${boundary}`,`Content-Type: text/html; charset=UTF-8`,`Content-Transfer-Encoding: base64`,``,btoa(unescape(encodeURIComponent(body))),``,`--${boundary}`,`Content-Type: ${attachMime}; name="${attachName}"`,`Content-Disposition: attachment; filename="${attachName}"`,`Content-Transfer-Encoding: base64`,``,attachBase64,``,`--${boundary}--`);
    msg=headers.join("\r\n");
  }else{
    const headers=[`From: ${fromHeader}`,`To: ${to}`];
    if(ccLine)headers.push(ccLine);
    headers.push(`Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,`MIME-Version: 1.0`,`Content-Type: text/html; charset=UTF-8`,`Content-Transfer-Encoding: base64`,``,btoa(unescape(encodeURIComponent(body))));
    msg=headers.join("\r\n");
  }
  return btoa(unescape(encodeURIComponent(msg))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

/* ── Test de escritura en planilla vía servidor (ejecutar desde consola) ── */
window.__testSheets=async function(sheetRow){
  sheetRow=typeof sheetRow==="number"?sheetRow:5;
  console.log("=== TEST PLANILLA (servidor) ===");
  console.log("Fila destino:", sheetRow, "→ columna HC (Enviado)");
  try{

/* ── Extraer comentarios de la planilla para el mes indicado ── */
async function extraerComentariosMes(xlsxFile, periodo){
  const MESES={Enero:0,Febrero:1,Marzo:2,Abril:3,Mayo:4,Junio:5,Julio:6,Agosto:7,Septiembre:8,Octubre:9,Noviembre:10,Diciembre:11};
  const[mesNombre,anio]=periodo.split(" ");
  const targetYear=parseInt(anio),targetMonth=MESES[mesNombre];
  const buf=await readFileAsBuffer(xlsxFile);
  const wb=XLSX.read(buf,{type:"buffer",cellDates:true});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("Hoja 'Flujo' no encontrada en la planilla");
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const headerRow=rows[2]||[];  /* fila 3 de Excel = índice 2 en XLSX.js */
  // Debug: mostrar valores alrededor de la columna 207
  console.log("[planilla] headerRow cols 200-215:", headerRow.slice(200,215).map((v,i)=>`${200+i}:${JSON.stringify(v)}`).join(" | "));
  // Buscar columna de fecha del mes target (robusto: Date UTC, Date local, serial numérico)
  // Excel serial: días desde 1900-01-01; Jun 2026 = ~46000
  function excelSerialToDate(serial){
    const d=new Date(Math.round((serial-25569)*86400*1000));return d;
  }
  let monthCol=-1;
  for(let c=50;c<headerRow.length;c++){
    const v=headerRow[c];
    let match=false;
    if(v instanceof Date){
      match=(v.getUTCFullYear()===targetYear&&v.getUTCMonth()===targetMonth)
        ||(v.getFullYear()===targetYear&&v.getMonth()===targetMonth);
    } else if(typeof v==="number"&&v>40000&&v<60000){
      const d=excelSerialToDate(v);
      match=(d.getUTCFullYear()===targetYear&&d.getUTCMonth()===targetMonth)
        ||(d.getFullYear()===targetYear&&d.getMonth()===targetMonth);
    }
    if(match){monthCol=c;break;}
  }
  if(monthCol===-1)throw new Error(`Columna del mes ${periodo} no encontrada en la planilla`);
  const comentariosCol=monthCol+4; // fecha → N°Fact → GC → N°FactGC → Comentarios
  const SITIO_ORDER=["5-A","4-A","A-1","A-2","B","D-2","D-3"];
  const grupos={};
  for(let r=4;r<rows.length;r++){
    const row=rows[r];if(!row)continue;
    const sitio=row[7],edif=row[8],cliente=row[11];
    const comentario=row[comentariosCol];
    if(!sitio||!cliente)continue;
    const comStr=comentario!=null?String(comentario).trim():"";
    if(!comStr)continue;
    if(!grupos[sitio])grupos[sitio]=[];
    grupos[sitio].push({edif:edif?String(edif).trim():"",cliente:String(cliente).trim(),comentario:comStr});
  }
  // Ordenar sitios
  const ordenados={};
  SITIO_ORDER.forEach(s=>{if(grupos[s])ordenados[s]=grupos[s];});
  Object.keys(grupos).forEach(s=>{if(!ordenados[s])ordenados[s]=grupos[s];});
  return ordenados;
}
async function generarExcelResumen(xlsxFile,periodo){
  /* Genera un Excel reducido con solo las columnas relevantes para Contabilidad:
     H(Sitio) I(Edificio) J(RUT) K(Dirección) L(Cliente) AQ(Total m²)
     + columnas dinámicas del mes: Arriendo | GC | Comentarios */
  const MESES={Enero:0,Febrero:1,Marzo:2,Abril:3,Mayo:4,Junio:5,Julio:6,Agosto:7,Septiembre:8,Octubre:9,Noviembre:10,Diciembre:11};
  const[mesNombre,anio]=periodo.split(" ");
  const targetYear=parseInt(anio),targetMonth=MESES[mesNombre];
  const buf=await readFileAsBuffer(xlsxFile);
  const wb=XLSX.read(buf,{type:"buffer",cellDates:true});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("Hoja 'Flujo' no encontrada en la planilla");
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const headerRow=rows[2]||[];
  function excelSerialToDate(s){return new Date(Math.round((s-25569)*86400*1000));}
  let monthCol=-1;
  for(let c=50;c<headerRow.length;c++){
    const v=headerRow[c];let match=false;
    if(v instanceof Date){
      match=(v.getUTCFullYear()===targetYear&&v.getUTCMonth()===targetMonth)||(v.getFullYear()===targetYear&&v.getMonth()===targetMonth);
    }else if(typeof v==="number"&&v>40000&&v<60000){
      const d=excelSerialToDate(v);
      match=(d.getUTCFullYear()===targetYear&&d.getUTCMonth()===targetMonth)||(d.getFullYear()===targetYear&&d.getMonth()===targetMonth);
    }
    if(match){monthCol=c;break;}
  }
  if(monthCol===-1)throw new Error(`Columna del mes ${periodo} no encontrada en planilla`);
  // Columnas fijas (índice 0-based): H=7 I=8 J=9 K=10 L=11 AQ=42
  // Columnas dinámicas: monthCol=Arriendo  monthCol+2=GC  monthCol+4=Comentarios
  const COLS=[7,8,9,10,11,42,monthCol,monthCol+2,monthCol+4];
  const HEADERS=["Sitio","Edificio","RUT","Direcci\u00f3n","Cliente","Total m\u00b2",`Arriendo ${periodo}`,"GC","Comentarios"];
  const outRows=[HEADERS];
  for(let r=4;r<rows.length;r++){
    const row=rows[r];if(!row)continue;
    const clienteVal=row[11]!=null?String(row[11]).trim():"";if(!clienteVal||clienteVal.toUpperCase()==="VACANTE")continue;
    outRows.push(COLS.map(c=>row[c]!=null?row[c]:""));
  }
  // ── Construir XLSX con estilos usando JSZip + XML puro ──────────────────
  // SheetJS 0.18 CE no soporta cell styles → generamos el ZIP manualmente.
  function xlCol(idx){let r='',n=idx+1;while(n>0){const rem=(n-1)%26;r=String.fromCharCode(65+rem)+r;n=Math.floor((n-1)/26);}return r;}
  function xlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  // Shared strings
  const ss=[],ssMap=new Map();
  function ssIdx(v){const s=String(v);if(ssMap.has(s))return ssMap.get(s);const i=ss.length;ss.push(s);ssMap.set(s,i);return i;}
  // Ancho de columnas (caracteres)
  const COL_W=[8,12,14,30,28,10,14,14,40];
  // Índices 0-based de columnas con formato 2 decimales: Arriendo(6) y GC(7)
  const DEC_COLS=new Set([6,7]);
  // Construir XML de filas
  let rowsXml='';
  // Fila 1: encabezados con estilo 1 (azul oscuro, negrita, centrado)
  let hCells='';
  outRows[0].forEach((h,c)=>{hCells+=`<c r="${xlCol(c)}1" t="s" s="1"><v>${ssIdx(h)}</v></c>`;});
  rowsXml+=`<row r="1" ht="18" customHeight="1">${hCells}</row>`;
  // Filas de datos desde índice 1
  for(let ri=1;ri<outRows.length;ri++){
    const rowNum=ri+1;
    let cells='';
    outRows[ri].forEach((val,c)=>{
      const addr=`${xlCol(c)}${rowNum}`;
      if(val===null||val===undefined||val===''){cells+=`<c r="${addr}" s="0"/>`;return;}
      if(typeof val==='number'){
        const sIdx=DEC_COLS.has(c)?'2':'0';
        cells+=`<c r="${addr}" t="n" s="${sIdx}"><v>${val}</v></c>`;
      } else {
        cells+=`<c r="${addr}" t="s" s="0"><v>${ssIdx(val)}</v></c>`;
      }
    });
    rowsXml+=`<row r="${rowNum}">${cells}</row>`;
  }
  const colsXml=COL_W.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  const sheetXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${colsXml}</cols><sheetData>${rowsXml}</sheetData></worksheet>`;
  const ssXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${ss.length}" uniqueCount="${ss.length}">${ss.map(s=>`<si><t xml:space="preserve">${xlEsc(s)}</t></si>`).join('')}</sst>`;
  const stylesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0277BD"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>`;
  const wbXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Resumen" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const relsXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wbRelsXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const ctXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const zipOut=new JSZip();
  zipOut.file('[Content_Types].xml',ctXml);
  zipOut.file('_rels/.rels',relsXml);
  zipOut.file('xl/workbook.xml',wbXml);
  zipOut.file('xl/_rels/workbook.xml.rels',wbRelsXml);
  zipOut.file('xl/styles.xml',stylesXml);
  zipOut.file('xl/sharedStrings.xml',ssXml);
  zipOut.file('xl/worksheets/sheet1.xml',sheetXml);
  return await zipOut.generateAsync({type:'base64'});
}

async function parsePlanillaParaDashboard(file){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla");
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  const row3=raw[2]||[];
  const MES_L=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  function serialToYM(serial){
    const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(serial)*86400000);
    return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1};
  }
  const monthCols=[];
  for(let ci=64;ci<Math.min(row3.length,400);ci++){
    const v=row3[ci];
    if(typeof v==="number"&&v>40000&&v<50000){
      const{y,m}=serialToYM(v);
      if(y>=2024&&y<=2026){
        monthCols.push({key:`${y}-${String(m).padStart(2,"0")}`,label:`${MES_L[m-1]} ${y}`,col:ci,year:y,month:m});
      }
    }
  }
  const SKIP=/^(Total|Area|Arrendado|En negociación|Para confirmar|#|\d+$)/;
  const clients=[];
  const vacantes=[];
  for(let ri=4;ri<raw.length;ri++){
    const row=raw[ri];
    if(!row)continue;
    const rut=row[9];
    const nombre=row[11]||row[10]; /* Col L o K según la fila */
    if(!nombre)continue;
    const name=String(nombre).trim();
    /* Capturar VACANTE separado para Cuentas Servicios */
    if(/^(VACANTE|Vacante)/.test(name)){
      const cta2=(()=>{const raw2=row[6]?String(row[6]):"";const o={idAgua:"",medAgua:"",idEnel:"",medEnel:""};if(!raw2)return o;const p=raw2.split("||").map(s=>s.trim());const lim=v=>{const t=(v||"").trim();return(!t||t==="?"||t==="-")?"":t;};if(p[0]){const[a,b]=p[0].split("/");o.idAgua=lim(a);o.medAgua=lim(b);}if(p[1]){const[a,b]=p[1].split("/");o.idEnel=lim(a);o.medEnel=lim(b);}return o;})();
      vacantes.push({ri,isVacante:true,nombre:"VACANTE",rut:"",sitio:String(row[7]||"").replace(/\s+/g," ").trim(),edificio:String(row[8]||"").trim(),dir:String(row[10]||"").trim(),...cta2});
      continue;
    }
    if(!rut||typeof rut!=="string")continue;
    if(!rut.match(/\d+\.\d+/))continue;
    if(SKIP.test(name)||name.includes("Total")||name.startsWith("#")||name==="")continue;
    const ufArr=typeof row[47]==="number"?row[47]:0;
    const pctAdm=row[51];
    let ufSrv=0;
    if(typeof pctAdm==="number"&&pctAdm>0&&pctAdm<1) ufSrv=ufArr*pctAdm;
    else if(typeof pctAdm==="number"&&pctAdm>=1&&pctAdm<=10) ufSrv=pctAdm;
    const monthly={};
    for(const mc of monthCols){
      const v=row[mc.col];
      if(typeof v==="number"&&v>0&&v<15000) monthly[mc.key]=Math.round(v*100)/100;
    }
    /* Conversión serial Excel → fecha legible */
    function serialToDate(v){if(!v||typeof v!=="number")return"";try{const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(v)*86400000);return`${d.getUTCDate().toString().padStart(2,"0")}/${(d.getUTCMonth()+1).toString().padStart(2,"0")}/${d.getUTCFullYear()}`;}catch(e){return"";}}
    /* Col G (row[6]): "idAgua / medAgua || idEnel / medEnel" */
    function parseCuenta(raw){
      const out={idAgua:"",medAgua:"",idEnel:"",medEnel:""};
      if(!raw||typeof raw!=="string")return out;
      const partes=raw.split("||").map(s=>s.trim());
      function limpiar(v){const t=(v||"").trim();return(!t||t==="?"||t==="-")?"":t;}
      if(partes[0]){const[a,b]=partes[0].split("/");out.idAgua=limpiar(a);out.medAgua=limpiar(b);}
      if(partes[1]){const[a,b]=partes[1].split("/");out.idEnel=limpiar(a);out.medEnel=limpiar(b);}
      return out;
    }
    const cta=parseCuenta(row[6]?String(row[6]):"");
    clients.push({
      ri,nombre:name,rut:String(rut).trim(),
      arrendadora:String(row[5]||"").trim(),
      sitio:String(row[7]||"").replace(/\s+/g," ").trim(),
      edificio:String(row[8]||"").trim(),
      dir:String(row[10]||"").trim(),
      idAgua:cta.idAgua,medAgua:cta.medAgua,idEnel:cta.idEnel,medEnel:cta.medEnel,
      email:String(row[12]||"").trim(),
      termContrato:serialToDate(row[14]),   /* Col O: Fecha Inicio Contrato */
      termTermino:serialToDate(row[15]),    /* Col P: Fecha Término Contrato */
      renovacion:row[16]!=null?String(row[16]).trim():"",  /* Col Q: Antelación renovación */
      aviso:row[17]!=null?String(row[17]).trim():"",        /* Col R: Aviso */
      fechaReajuste:serialToDate(row[52]),  /* Col BA: Fecha Reajuste */
      pctReaj:row[53]!=null?String(row[53]):"",            /* Col BB: % Reajuste */
      cadaAnios:row[54]!=null?String(row[54]).trim():"",   /* Col BC: Cada cuántos años */
      m2:row[42]!=null&&row[42]!==""?Number(row[42]):null,   /* Col AQ: Metros cuadrados */
      ufM2:row[47]!=null&&row[47]!==""?Number(row[47]):null, /* Col AV: UF x m2 */
      hist:(()=>{
        /* BN=65, cada mes ocupa 4 cols: UF planilla, Facturado, Diferencia, Comentarios */
        /* Desde Abr-2023 hasta el presente */
        const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
        const result=[];
        let col=65,mes=3,anio=2023;
        while(!(anio===2027||(anio===2026&&mes>11))){
          const uf=row[col],fact=row[col+1],dif=row[col+2];
          result.push({
            key:`${anio}-${String(mes+1).padStart(2,"0")}`,
            label:`${MESES[mes]}`,
            anio,mes,
            uf:typeof uf==="number"?Math.round(uf*100)/100:null,
            fact:typeof fact==="number"?Math.round(fact*100)/100:null,
            dif:typeof dif==="number"?Math.round(dif*100)/100:null,
          });
          col+=4; mes++; if(mes>11){mes=0;anio++;}
        }
        return result;
      })(),
      ufArr:Math.round(ufArr*100)/100,
      ufSrv:Math.round(ufSrv*100)/100,
      ufTotal:Math.round((ufArr+ufSrv)*100)/100,
      pctAdm:typeof pctAdm==="number"?pctAdm:0,
      afecto:String(row[48]||"").trim(),
      ufInicio:typeof row[61]==="number"?Math.round(row[61]*100)/100:0,
      monthly,
    });
  }
  const siteMap={};
  for(const c of clients){
    const s=(c.sitio||"Otro").trim();
    if(!siteMap[s])siteMap[s]={count:0,ufArr:0,ufSrv:0,arrendadora:c.arrendadora||""};
    siteMap[s].count++;
    siteMap[s].ufArr=Math.round((siteMap[s].ufArr+c.ufArr)*100)/100;
    siteMap[s].ufSrv=Math.round((siteMap[s].ufSrv+c.ufSrv)*100)/100;
    if(!siteMap[s].arrendadora&&c.arrendadora)siteMap[s].arrendadora=c.arrendadora;
  }
  const monthTotals={};
  for(const mc of monthCols){
    let totalArr=0;
    for(const c of clients){const v=c.monthly[mc.key];if(v)totalArr+=v;}
    const totalSrv=clients.reduce((s,c)=>s+c.ufSrv,0);
    monthTotals[mc.key]={
      label:mc.label,
      arr:Math.round(totalArr*100)/100,
      srv:Math.round(totalSrv*100)/100,
      total:Math.round((totalArr+totalSrv)*100)/100,
      year:mc.year,
      month:mc.month,
    };
  }
  return{clients,vacantes,siteMap,monthTotals,monthCols};
}

/* ═══════════════════════════════════
   PROCESAMIENTO DE BILLING
═══════════════════════════════════ */
async function procesarPlanillaFacturacion(file,periodo){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla de facturación");
  /* raw:true para obtener seriales Excel en números; lo usamos para detectar la columna */
  const dataRaw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const mesNum=MES_NUM[periodo.split(" ")[0]];
  const anio=parseInt(periodo.split(" ")[1]);
  let colGS=-1,colGT=-1,colEnviado=-1,colPagado=-1;

  function esTargetMes(val){
    if(val===null||val===undefined)return false;
    if(typeof val==="number"&&val>40000&&val<60000){
      const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(val)*86400000);
      return d.getUTCFullYear()===anio&&(d.getUTCMonth()+1)===mesNum;
    }
    if(typeof val==="string"){try{const d=new Date(val);if(!isNaN(d))return d.getFullYear()===anio&&(d.getMonth()+1)===mesNum;}catch(e){}}
    return false;
  }

  /* Fechas en fila 3 (índice 2) */
  const fila3=dataRaw[2]||[];
  for(let i=64;i<fila3.length;i++){
    if(esTargetMes(fila3[i])){
      colGS=i;
      /* Buscar 'GC' (Serv.Adm.) dinámicamente: en planillas antiguas está en i+1, en nuevas puede estar en i+2+ por columnas extra */
      for(let j=i+1;j<=Math.min(i+6,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim()==="GC"){colGT=j;break;}}
      if(colGT===-1)colGT=i+1;
      /* Buscar 'Correo Enviado' dinámicamente */
      for(let j=i+1;j<=Math.min(i+10,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim().toLowerCase().includes("correo enviado")){colEnviado=j;break;}}
      if(colEnviado===-1)colEnviado=i+3;
      /* Buscar 'Pagado' dinámicamente */
      for(let j=i+1;j<=Math.min(i+10,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim().toLowerCase()==="pagado"){colPagado=j;break;}}
      if(colPagado===-1)colPagado=i+4;
      break;
    }
  }
  if(colGS===-1)throw new Error(`No se encontró columna para ${periodo}. Verifica que la planilla tenga ese mes.`);

  const excl=["","VACANTE","Nombre Cliente","Areas Comunes Edificio","Areas comunes Edificio (Subterraneos)","Area Comun"];
  const clientes=[];
  for(let i=4;i<dataRaw.length;i++){
    const row=dataRaw[i];if(!row)continue;
    const sitio=row[7];
    const cliente=row[11];
    const ufGS=row[colGS];
    const ufGT=row[colGT];
    if(!cliente||excl.includes(String(cliente).trim()))continue;
    const sName=String(cliente).trim();
    const sito=sitio?String(sitio).trim():"";
    const edif=row[8]?String(row[8]).trim():""; /* Col I: nro local / bodega / edif */
    const emailBilling=row[12]?String(row[12]).trim():"";
    const rutBilling=row[9]?String(row[9]).replace(/\./g,"").trim().toLowerCase():""; /* Col J: RUT normalizado */
    const yaEnviado=colEnviado>0&&row[colEnviado]&&String(row[colEnviado]).trim().toLowerCase()==="enviado";
    const yaPagado=colPagado>0&&row[colPagado]&&String(row[colPagado]).trim()!=="";
    const sheetRow=i+1; /* fila 1-indexed en el Sheets (dataRaw[i] = fila i+1) */
    const sentColLetter=colIndexToLetter(colEnviado); /* columna dinámica: HC para Junio, HG para Julio, etc. */
    const pagadoColLetter=colPagado>0?colIndexToLetter(colPagado):"";
    const nroFactArrColLetter=colIndexToLetter(colGS+1); /* Nro Fact Arriendo = columna inmediata después del UF Arriendo */
    const nroFactGCColLetter=colGT>0?colIndexToLetter(colGT+1):"";   /* Nro Fact GC = columna inmediata después del UF GC */
    /* Leer nros de factura ya escritos en planilla (si existen) — evitan re-procesar ZIP */
    const _nfArr=row[colGS+1];const nroFactArr=(typeof _nfArr==="number"&&_nfArr>0)?String(Math.round(_nfArr)):(typeof _nfArr==="string"&&_nfArr.trim())?_nfArr.trim():null;
    const _nfGC=colGT>0?row[colGT+1]:null;const nroFactGC=(typeof _nfGC==="number"&&_nfGC>0)?String(Math.round(_nfGC)):(typeof _nfGC==="string"&&_nfGC.trim())?_nfGC.trim():null;
    const m2Billing=row[42]!=null&&row[42]!==""?Number(row[42]):null; /* Col AQ: m² */
    if(typeof ufGS==="number"&&ufGS>0)clientes.push({sitio:sito,edificio:edif,cliente:sName,tipo:"arriendo",uf:Math.round(ufGS*10000)/10000,email:emailBilling,rut:rutBilling,yaEnviado,yaPagado,sheetRow,sentColLetter,pagadoColLetter,nroFactArrColLetter,nroFactGCColLetter,nroFactArr,nroFactGC,m2:m2Billing});
    if(typeof ufGT==="number"&&ufGT>0&&ufGT<=999999)clientes.push({sitio:sito,edificio:edif,cliente:sName,tipo:"serv_adm",uf:Math.round(ufGT*10000)/10000,email:emailBilling,rut:rutBilling,yaEnviado,yaPagado,sheetRow,sentColLetter,pagadoColLetter,nroFactArrColLetter,nroFactGCColLetter,nroFactArr,nroFactGC,m2:m2Billing});
  }
  return clientes;
}
/* ── Lee la planilla para TODOS los meses del año dado ─────────────────────── */
async function leerHistorialAnio(xlsxFile, anio){
  const MESES_N=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const buf=await readFileAsBuffer(xlsxFile);
  const wb=XLSX.read(buf,{cellStyles:true,raw:true});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error('Hoja "Flujo" no encontrada');
  const dataRaw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const fila3=dataRaw[2]||[];

  /* Detectar columnas de cada mes */
  const mesesMap={};
  for(let i=0;i<fila3.length;i++){
    const val=fila3[i];if(!val)continue;
    let d=null;
    if(typeof val==="number"&&val>40000&&val<60000)
      d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(val)*86400000);
    else if(typeof val==="string"){try{const p=new Date(val);if(!isNaN(p))d=p;}catch(e){}}
    if(!d||d.getUTCFullYear()!==anio)continue;
    const mesIdx=d.getUTCMonth();
    const mesNombre=MESES_N[mesIdx];
    const mesNum=mesIdx+1;
    if(mesesMap[mesNombre])continue; /* solo primer hit por mes */
    /* Buscar GC y Correo Enviado dinámicamente (la posición varía según versión de planilla) */
    let gtCol=-1;for(let j=i+1;j<=Math.min(i+6,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim()==="GC"){gtCol=j;break;}}
    if(gtCol===-1)gtCol=i+1;
    let envCol=-1;for(let j=i+1;j<=Math.min(i+10,fila3.length-1);j++){const h=fila3[j];if(typeof h==="string"&&h.trim().toLowerCase().includes("correo enviado")){envCol=j;break;}}
    mesesMap[mesNombre]={colGS:i,colGT:gtCol,colEnviado:envCol,mesNum};
  }

  const excl=["","VACANTE","Nombre Cliente","Areas Comunes Edificio","Areas comunes Edificio (Subterraneos)","Area Comun"];
  const historial={};

  for(let i=4;i<dataRaw.length;i++){
    const row=dataRaw[i];if(!row)continue;
    const cli=row[11];if(!cli||excl.includes(String(cli).trim()))continue;
    const nombre=String(cli).trim();
    const correo=row[12]?String(row[12]).trim():"";
    const rut=row[9]?String(row[9]).trim():"";
    if(!historial[nombre])historial[nombre]={correo,rut,meses:{}};
    for(const[mes,cols]of Object.entries(mesesMap)){
      const ufArr=typeof row[cols.colGS]==="number"&&row[cols.colGS]>0?row[cols.colGS]:null;
      const ufAdm=typeof row[cols.colGT]==="number"&&row[cols.colGT]>0&&row[cols.colGT]<999999?row[cols.colGT]:null;
      if(!ufArr&&!ufAdm)continue;
      const yaEnviado=cols.colEnviado>0&&row[cols.colEnviado]&&String(row[cols.colEnviado]).trim().toLowerCase()==="enviado";
      if(!historial[nombre].meses[mes])
        historial[nombre].meses[mes]={ufArriendo:ufArr,ufServAdm:ufAdm,yaEnviado:!!yaEnviado,sheetRow:i+1,sentColLetter:cols.colEnviado>0?colIndexToLetter(cols.colEnviado):"HC",mesNum:cols.mesNum};
      else{
        const ex=historial[nombre].meses[mes];
        if(ufArr)ex.ufArriendo=ufArr;if(ufAdm)ex.ufServAdm=ufAdm;if(yaEnviado)ex.yaEnviado=true;
      }
    }
  }
  return{historial,mesesOrden:MESES_N.filter(m=>mesesMap[m])};
}

/* ── Guarda el mapping factura→cliente en Drive tras procesar() ─────────────── */
async function guardarHistorialPeriodo(anio,periodo,filas){
  const data={};
  for(const f of filas){
    if(!f.factura)continue;
    if(!data[f.cliente])data[f.cliente]={};
    /* Guardar con estructura {CLIENTE:{SITIO:{arriendo,servAdm}}} para que
       batchPeriodo pueda desambiguar por sitio (igual que historial-excel-2026.json) */
    const sitioKey=f.sitio||"default";
    if(!data[f.cliente][sitioKey])data[f.cliente][sitioKey]={};
    const conc=(f.concepto||"").toLowerCase();
    const obj={nro:f.factura,uf:f.ufPdf??f.uf??null,total:f.montoTotal||null};
    if(conc==="arriendo")data[f.cliente][sitioKey].arriendo=obj;
    else if(conc==="serv. adm."||conc==="serv_adm")data[f.cliente][sitioKey].servAdm=obj;
    else if(conc==="habilitación"||conc==="habilitacion")data[f.cliente][sitioKey].habilitacion=obj;
  }
  if(!Object.keys(data).length)return;
  try{
    await fetch("/api/historial",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({anio:String(anio),periodo,data})});
  }catch(e){console.warn("guardarHistorial:",e.message);}
}

async function extraerTextoPDF(arrayBuffer){
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    let texto="";
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      texto+=content.items.map(it=>it.str).join(" ")+"\n";
    }
    return texto;
  }catch(e){console.warn("pdfjs error:",e.message);return"";}
}

async function procesarPDFs(zipFile,addLog){
  const buf=await readFileAsBuffer(zipFile);
  const zip=await JSZip.loadAsync(buf);
  const pdfs=[];
  const archivos=Object.keys(zip.files).filter(f=>f.toLowerCase().endsWith(".pdf"));
  addLog(`▶ ${archivos.length} PDFs encontrados en el ZIP`,"info");

  for(const path of archivos){
    const parts=path.split("/");
    const carpeta=parts.length>1?parts[parts.length-2]:"";
    const nombre=parts[parts.length-1];
    const sitio=SITIO_MAP[carpeta]||carpeta;

    /* Número y nombre desde archivo: "F-14540 Ingersoll Rand.pdf" */
    const nroMatch=nombre.match(/^(F(?:EE)?-\d+)\s*(.+)?\.pdf$/i);
    if(!nroMatch)continue;
    const nroFact=nroMatch[1].toUpperCase();
    const nombreEnArchivo=(nroMatch[2]||"").trim().toLowerCase();
      const pdfBuf=await zip.files[path].async("arraybuffer");
      const texto=await extraerTextoPDF(pdfBuf);
      const textoJ=texto.replace(/\s+/g," ");
      const tipo=textoJ.includes("Serv. Adm.")||textoJ.includes("Serv.Adm.")?"serv_adm":textoJ.includes("Habilitaci")?"habilitacion":textoJ.includes("Arriendo")?"arriendo":nroFact.startsWith("FEE-")?"serv_adm":"arriendo";

    /* Extraer UF del texto del PDF — 3 patrones + fallback flat */
    let ufPdf=null,ufValorPdf=null;
    const _parseChile=s=>parseFloat(s.replace(/\./g,"").replace(",","."));
    try{
      if(texto.length>10){
        const flat0=texto.replace(/\s+/g," ");
        /* P1: Cant/Unidad "11,84 UF" o "12,8 UF" — máx 2 decimales (3 dígitos = separador de miles CLP, no decimal UF) */
        /* P1a: "12,80 UF 40.833,91" – captura cantidad Y valor UF */
        let m=flat0.match(/([\d]{1,3}[,.][\d]{1,2})\s*UF\s+([\d]{2,3}(?:[.][\d]{3})*(?:[,]\d+)?)/i);
        if(m){ufPdf=parseFloat(m[1].replace(",","."));ufValorPdf=_parseChile(m[2]);}
        /* P1b: fallback – solo cantidad UF (el valor no está visible junto) */
        if(!ufPdf){m=flat0.match(/([\d]{1,3}[,.][\d]{1,2})\s*UF\b/i);if(m)ufPdf=parseFloat(m[1].replace(",","."));}
        /* P2: descripción "UF 85,37 x 40186" — número DESPUÉS de UF (Arriendo) */
        if(!ufPdf){m=flat0.match(/UF\s*([\d]+(?:[,.][\d]+)?)\s*x\s*([\d]{2,3}(?:[.][\d]{3})*(?:[,]\d+)?)/);if(m){ufPdf=parseFloat(m[1].replace(",","."));if(m[2])ufValorPdf=_parseChile(m[2]);}}
        /* P3: fallback — "UF X,XX x " o "(X,XX) x NN" */
        if(!ufPdf){
          m=flat0.match(/UF\s*([\d]+(?:[,.][\d]+)?)\s*x\s/);if(m) ufPdf=parseFloat(m[1].replace(",","."));
          if(!ufPdf){m=flat0.match(/([\d]+[,.][\d]+)\s*x\s*\d{2}/);if(m) ufPdf=parseFloat(m[1].replace(",","."));}
        }
        /* P4: precio CLP fijo "1 UNID 317.000" — Serv. Adm. sin UF */
        if(!ufPdf){
          m=flat0.match(/1\s*UNID\s+([\d]+(?:\.[\d]{3})+(?:,[\d]+)?)/i)
            ||flat0.match(/1\s*UNID\s+([\d]{4,})/i);
          if(m){const raw=m[1].replace(/\./g,"").replace(",",".");ufPdf=parseFloat(raw)||null;}
        }
        /* P5: Cant/Unidad "12,8 UF" — decimal con 1 solo dígito (Serv. Adm. con UF) */
        if(!ufPdf){
          m=flat0.match(/([\d]{1,3}[,.]\d)\s*UF\b/i);
          if(m){const v=parseFloat(m[1].replace(",","."));if(v>=0.1&&v<9999)ufPdf=v;}
        }
        if(ufPdf) ufPdf=Math.round(ufPdf*10000)/10000;
        if(ufValorPdf&&(ufValorPdf<25000||ufValorPdf>80000))ufValorPdf=null;
      }
    }catch(e){}

    /* Extraer Monto Total del PDF
       pdf.js puede extraer columnas en orden visual (todas etiquetas, luego todos valores):
       "Monto Neto Monto Exento 19% IVA Monto Total 3.807.328 547.200 723.392 5.077.920"
       Por eso NO tomamos el primer número tras "Monto Total", sino el MAYOR de todos
       los números que aparecen después de esa etiqueta (el total siempre es la suma). */
    let montoTotal=null,ivaAmount=null;
    try{
      if(texto.length>10){
        const flat=texto.replace(/\s+/g," ");
        console.log(`[pdf-texto] ${nroFact}: "${flat.slice(-600)}"`);
        /* pdf.js puede entregar texto en orden variable según cómo fue construido el PDF:
           A) Etiquetas primero, valores después: "Monto Neto 19% IVA Monto Total → 835.012 158.701 993.713"
           B) Valores primero, etiquetas después: "835.012 158.701 993.713 → Monto Neto 19% IVA Monto Total"
           → Buscamos todos los números en un radio de 300 chars alrededor de "Monto Total"
             en ambas direcciones y tomamos el máximo (el total siempre es la suma mayor). */
        const parseAmts=str=>[...str.matchAll(/([\d]+(?:\.[\d]{3})+|[\d]{5,})/g)]
          .map(m=>parseInt(m[1].replace(/\./g,""),10)).filter(n=>n>=50000&&n<=25000000);
        const mtIdx=flat.toLowerCase().indexOf("monto total");
        if(mtIdx>=0){
          const numsAfter=parseAmts(flat.slice(mtIdx+"monto total".length));
          const numsBefore=parseAmts(flat.slice(Math.max(0,mtIdx-300),mtIdx));
          const cands=[...numsAfter,...numsBefore];
          if(cands.length>0) montoTotal=Math.max(...cands)||null;
        }
        /* Fallback final: máximo valor de rango facturable en los últimos 500 chars del PDF */
        if(!montoTotal){
          const tailNums=parseAmts(flat.slice(-500));
          if(tailNums.length>0) montoTotal=Math.max(...tailNums)||null;
        }
        if(!montoTotal){
          /* Fallback: extraer IVA para estimación neto + IVA en columna */
          const im=flat.match(/19%\s*IVA\s*([\d]+(?:\.[\d]{3})+)/i)
            ||flat.match(/IVA\s+([\d]+(?:\.[\d]{3})+)/i)
            ||flat.match(/19%\s*IVA\s*([\d]{3,})/i)
            ||flat.match(/IVA\s+([\d]{3,})/i);
          if(im) ivaAmount=parseInt(im[1].replace(/\./g,""),10)||null;
          console.log(`[monto] ${nroFact}: Monto Total no encontrado, IVA=${ivaAmount}`);
        } else {
          console.log(`[monto] ${nroFact}: Monto Total = $${montoTotal.toLocaleString("es-CL")}`);
        }
      }
    }catch(e){console.warn("[monto] error:",e.message);}

    pdfs.push({sitio,nroFact,tipo,ufPdf,ufValor:ufValorPdf,montoTotal,ivaAmount,nombreEnArchivo,zipPath:path,pdfNombre:nombre});
  }

  const conUF=pdfs.filter(p=>p.ufPdf!==null).length;
  addLog(`✓ ${pdfs.length} PDFs: ${conUF} con UF, ${pdfs.length-conUF} sin UF`,"ok");
  addLog(`  Sitios: ${[...new Set(pdfs.map(p=>p.sitio))].join(", ")}`,"info");
  pdfs.slice(0,2).forEach(p=>addLog(`  ${p.nroFact} ${p.sitio} ${p.tipo} UF=${p.ufPdf} "${p.nombreEnArchivo}"`,"info"));
  return pdfs;
}
async function getPdfBase64FromZip(zipFile,zipPath){
  const buf=await readFileAsBuffer(zipFile);
  const zip=await JSZip.loadAsync(buf);
  const pdfBuf=await zip.files[zipPath].async("uint8array");
  let binary="";const chunkSize=8192;
  for(let i=0;i<pdfBuf.length;i+=chunkSize)binary+=String.fromCharCode(...pdfBuf.slice(i,i+chunkSize));
  return btoa(binary);
}

async function getPdfBase64FromDrive(fileId){
  const r=await fetch(`/api/historial?fileId=${fileId}`);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const buf=await r.arrayBuffer();
  const arr=new Uint8Array(buf);
  let binary="";const chunk=8192;
  for(let i=0;i<arr.length;i+=chunk)binary+=String.fromCharCode(...arr.slice(i,i+chunk));
  return btoa(binary);
}

async function procesarHabilitacionesDrive(periodo,clientes,addLog){
  const HAB_FOLDER="1O1nBsti_reAKnAXXKdL2opNWz1ocZu8u";
  const MESES_ES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};
  const parts=periodo.split(" ");
  if(parts.length<2)return[];
  const mesNum=MESES_ES[parts[0].toLowerCase()];
  const anioNum=parseInt(parts[1]);
  if(!mesNum||!anioNum)return[];
  const resultado=[];
  const vistosNro=new Set();
  try{
    const r=await fetch(`/api/historial?ls=${HAB_FOLDER}`);
    if(!r.ok)return[];
    const {files}=await r.json();
    if(!files?.length){addLog("ℹ Carpeta Habilitaciones vacía","info");return[];}
    addLog(`📁 Habilitaciones Drive: ${files.length} archivo(s)`,"info");
    for(const file of files.filter(f=>f.name.toLowerCase().endsWith(".pdf"))){
      try{
        const pdfR=await fetch(`/api/historial?fileId=${file.id}`);
        if(!pdfR.ok)continue;
        const pdfBuf=await pdfR.arrayBuffer();
        const texto=await extraerTextoPDF(pdfBuf);
        const flat=texto.replace(/\s+/g," ");

        /*  Estrategia: encontrar todos los Nº de documento en el texto,
            para cada uno tomar el contexto hasta el siguiente Nº,
            verificar: 1) no es Nota de Crédito, 2) descripción dice "Habilitaci",
            3) fecha de emisión coincide con el periodo */
        const nroRe=/N[º°]\s*(\d{4,6})/g;
        const nros=[...flat.matchAll(nroRe)];
        for(let ni=0;ni<nros.length;ni++){
          const posStart=Math.max(0,nros[ni].index-300); /* incluir cabecera */
          const posEnd=ni+1<nros.length?nros[ni+1].index:flat.length;
          const ctx=flat.slice(posStart,posEnd);
          /* Saltar Notas de Crédito */
          if(/NOTA\s+DE\s+CR[EÉ]DITO/i.test(ctx))continue;
          /* Solo facturas de habilitación — la descripción lo confirma */
          if(!/Habilitaci/i.test(ctx))continue;
          /* N° de factura de este bloque */
          const nroM=ctx.match(/N[º°]\s*(\d{4,6})/);
          if(!nroM)continue;
          const nroFact="F-"+nroM[1];
          if(vistosNro.has(nroFact))continue;
          /* Fecha de emisión: "5 de junio de 2026" */
          const fechaM=ctx.match(/(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+de\s+(\d{4})/i);
          if(!fechaM)continue;
          const mesFact=MESES_ES[fechaM[2].toLowerCase()];
          const anioFact=parseInt(fechaM[3]);
          if(mesFact!==mesNum||anioFact!==anioNum)continue;
          /* Cliente y RUT */
          const cliM=ctx.match(/Se[nñ]or\(es\)\s+(.+?)\s+RUT\s+([\d.]+-[\dkK])/i);
          const clienteNombre=cliM?cliM[1].trim():"";
          const rut=cliM?cliM[2].trim():"";
          /* UF desde Cant/Unidad: "157,14 UF" */
          let ufPdf=null;
          const ufM=ctx.match(/([\d]+[,.][\d]+)\s*UF/);
          if(ufM)ufPdf=parseFloat(ufM[1].replace(",","."));
          /* Monto Total CLP */
          let montoTotal=null;
          const mtM=ctx.match(/Monto\s*Total\s*([\d.]+)/i);
          if(mtM)montoTotal=parseInt(mtM[1].replace(/\./g,""),10)||null;
          /* Email desde planilla por RUT */
          const rutNorm=rut.replace(/[.\-]/g,"").toLowerCase();
          const cPlan=clientes.find(c=>c.rut&&c.rut.replace(/[.\-]/g,"").toLowerCase()===rutNorm);
          vistosNro.add(nroFact);
          addLog(`  ✓ Hab ${nroFact} | ${(clienteNombre||rut).slice(0,30)} | UF ${ufPdf} | $${montoTotal?montoTotal.toLocaleString("es-CL"):"?"}`,"ok");
          resultado.push({
            sitio:cPlan?.sitio||"",edificio:cPlan?.edificio||"",
            clienteNombre:clienteNombre||cPlan?.cliente||rut,rut,
            correo:cPlan?.email||"",
            nroFact,tipo:"habilitacion",
            ufPdf,montoTotal,ivaAmount:null,
            yaEnviado:false,
            sheetRow:cPlan?.sheetRow||null,
            sentColLetter:cPlan?.sentColLetter||"HC",
            driveFileId:file.id,pdfNombre:file.name,
          });
        }
      }catch(eFile){addLog(`  ⚠ ${file.name}: ${eFile.message}`,"warn");}
    }
  }catch(e){addLog("⚠ Error habilitaciones Drive: "+e.message,"warn");}
  return resultado;
}

function VentasView({periodo}){
  const [empresas, setEmpresas] = React.useState([
    {id:"multi", nombre:"Distribuidora Sánchez 4G", rut:"77.538.786-6", result:null, loading:false, error:null},
    {id:"dko",   nombre:"Sánchez Hermanos",         rut:"77.454.587-5", result:null, loading:false, error:null},
  ]);
  const [activeEmp, setActiveEmp] = React.useState("multi");
  const fmtCLP = v => "$"+Math.round(v).toLocaleString("es-CL");

  const getMes = (p) => {
    const MN={"Enero":"01","Febrero":"02","Marzo":"03","Abril":"04","Mayo":"05","Junio":"06","Julio":"07","Agosto":"08","Septiembre":"09","Octubre":"10","Noviembre":"11","Diciembre":"12"};
    const [nom,anio] = (p||periodo).split(" ");
    return `${anio}-${MN[nom]||"05"}`;
  };

  // mes se pasa como argumento — sin closures sobre periodo
  const cargarEmpresa = React.useCallback(async (empId, mes) => {
    setEmpresas(prev => prev.map(e => e.id===empId ? {...e, loading:true, error:null} : e));
    try {
      const res = await fetch(`/api/cruce?empresa=${empId}&mes=${mes}`);
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "Error al cruzar");
      setEmpresas(prev => prev.map(e => e.id===empId ? {...e, loading:false, error:null, result:data} : e));
    } catch(err) {
      setEmpresas(prev => prev.map(e => e.id===empId ? {...e, loading:false, error:err.message} : e));
    }
  }, []);

  React.useEffect(() => {
    if (!periodo || !periodo.includes(" ")) return;
    const mes = getMes(periodo);
    setEmpresas(p => p.map(e => ({...e, result:null, error:null})));
    cargarEmpresa("multi", mes);
    cargarEmpresa("dko", mes);

  const emp = empresas.find(e => e.id===activeEmp);

  const allLoaded = empresas.every(e => !e.loading);

      ),

        style:{fontSize:11,padding:"5px 14px",borderRadius:8,border:"1px solid var(--bdr)",background:"var(--surf2)",color:"var(--txm)",cursor:"pointer",display:"flex",alignItems:"center",gap:5}

        {lbl:"Coinciden SII",    val:allLoaded?totalCoinciden:"—", sub:"Odoo = SII monto exacto",  col:"var(--green)"},

function formatRUT(rut){
  if(!rut)return"";
  const clean=rut.replace(/\./g,"").toUpperCase();
  const dash=clean.indexOf("-");
  if(dash<0)return rut;
  const cuerpo=clean.slice(0,dash),dv=clean.slice(dash);
  let result="";
  for(let i=0;i<cuerpo.length;i++){if(i>0&&(cuerpo.length-i)%3===0)result+=".";result+=cuerpo[i];}
  return result+dv;
}
function getEstado(r){
  if(r.sitio==="B"&&r.concepto==="Arriendo")return"sanchez";
  if(!r.factura)return"missing";
  // Facturas grandes (>500 UF): solo verificar que tengan PDF asignado
  if(r.ufPlan>5000)return r.factura?"ok":"missing";
  // Facturas CLP fijo (ufPdf===null): si hay factura asignada es ok
  if(r.ufPdf===null||r.ufPdf===undefined)return r.factura?"ok":"missing";
  // Match por fallback de único candidato — marcar como "diff" para revisión
  if(r.matchScore===1)return"diff";
  // Comparar UF: PDF vs Planilla, y Planilla vs SII
  const diffPdf=Math.abs(r.ufPdf-r.ufPlan)>0.5;
  const diffSII=r.ufSII!=null&&Math.abs(r.ufPlan-r.ufSII)>0.5;
  if(diffPdf||diffSII)return"diff";
  return"ok";
}

  function bucketBg(b){return{"<=30":"rgba(16,185,129,0.12)","31-60":"rgba(245,158,11,0.12)","61-90":"rgba(249,115,22,0.12)","91-365":"rgba(239,68,68,0.12)","+365":"rgba(124,58,237,0.12)"}[b]||"var(--surf2)";}

  function parseSheetValues(values){
    if(!values||values.length<2)throw new Error("Sin datos ("+( values?values.length:0)+" filas)");
    var hdr=values[0].map(function(h){return String(h||"").toLowerCase().replace(/[\r\n\s_]/g,"");});
    function fi(tests){for(var i=0;i<hdr.length;i++){for(var t=0;t<tests.length;t++){if(hdr[i].includes(tests[t]))return i;}}return -1;}
    var iFecha=fi(["fecha"]); if(iFecha<0)iFecha=1;
    var iTipo=fi(["tipo"]); if(iTipo<0)iTipo=2;
    var iCod=fi(["cod"]); if(iCod<0)iCod=3;
    var iCliente=fi(["cliente"]); if(iCliente<0)iCliente=4;
    var iGlosa=fi(["glosa"]); if(iGlosa<0)iGlosa=5;
    var iFolio=fi(["folio"]); if(iFolio<0)iFolio=8;
    var iVcto=fi(["vcto"]); if(iVcto<0)iVcto=9;

    function n(v){return parseFloat(String(v||"0").replace(/[^0-9.\-]/g,""))||0;}

      var s=String(v||"").trim();
      /* ISO YYYY-MM-DD → DD-MM-YYYY */
      var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m)return m[3]+"-"+m[2]+"-"+m[1];
      /* DD/MM/YYYY → DD-MM-YYYY */
      return s.replace(/\//g,"-");
    }
    return values.slice(1).filter(function(r){
      return r.length>4&&String(r[iCliente]||"").trim()!==""&&String(r[iCliente]||"").trim()!=="Cliente";
    }).map(function(r){
      return{fecha:fmtFecha(r[iFecha]),tipo:String(r[iTipo]||"").trim(),rut:String(r[iCod]||"").trim(),
        cliente:String(r[iCliente]||"").trim(),glosa:String(r[iGlosa]||"").trim(),folio:String(r[iFolio]||"").trim(),
        vcto:String(r[iVcto]||"").trim(),diasDoc:n(r[iDiasDoc]),monto:n(r[iMonto]),sdoVencido:n(r[iSdo])};

  const now=new Date();
  const currentYear=now.getFullYear();
  function avisoDias(str){if(!str||str==="-"||str==="")return null;const s=str.toLowerCase();const m=s.match(/(\d+)/);if(!m)return null;const n=parseInt(m[1]);if(s.includes("año")||s.includes("ano"))return n*365;if(s.includes("mes"))return n*30;return n;}

function ElCortijoView(){
  /* estado: "loading" buscando en Drive | "fetching" descargando PDF | "ready" | "error" */
  const [phase,setPhase]=useState("loading");
  const [blobUrl,setBlobUrl]=useState(null);
  const [fileName,setFileName]=useState(null);
  const [error,setError]=useState(null);

  useEffect(function(){
    let alive=true;
    let _url=null;
    /* Paso 1: listar carpeta para encontrar el archivo exacto */
    fetch("/api/historial?ls="+DRIVE_FACTURACION_FOLDER_ID)
      .then(function(r){return r.json();})
      .then(function(d){
        if(!alive)return;
        /* Buscar "El Cortijo 2026_Arriendos.pdf" — requiere ambas palabras clave */
        const f=(d.files||[]).find(function(f){
          return /cortijo/i.test(f.name)&&/arriendos/i.test(f.name)&&/\.pdf$/i.test(f.name);
        });
        if(!f){setError("No se encontró 'El Cortijo 2026_Arriendos.pdf' en Drive");setPhase("error");return null;}
        setFileName(f.name);setPhase("fetching");
        /* Paso 2: descargar el PDF */
        return fetch("/api/historial?fileId="+f.id);
      })
      .then(function(r){
        if(!r||!alive)return;
        if(!r.ok)throw new Error("Error "+r.status+" al descargar el PDF");
        return r.arrayBuffer();
      })
      .then(function(buf){
        if(!buf||!alive)return;
        const blob=new Blob([buf],{type:"application/pdf"});
        _url=URL.createObjectURL(blob);
        setBlobUrl(_url);setPhase("ready");
      })
      .catch(function(e){if(alive){setError(e.message);setPhase("error");}});
    return function(){alive=false;if(_url)URL.revokeObjectURL(_url);};
  },[]);

  return h("main",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minHeight:0},className:"fade-up"},
    h("div",{style:{padding:"8px 20px",borderBottom:"1px solid var(--bdr)",flexShrink:0,background:"var(--surf)"}},
      h("span",{style:{fontSize:11,fontWeight:700,color:"var(--txd)",letterSpacing:".06em"}},"🏡 EL CORTIJO — PLANO DE ARRIENDOS 2026")
    ),
    /* Área del viewer — ocupa todo el espacio restante */
    h("div",{style:{flex:1,position:"relative",overflow:"hidden",background:"#404040"}},
      phase==="loading"&&h("div",{style:{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#ccc",fontSize:13}},
        "Buscando plano en Drive..."
      ),
      phase==="fetching"&&h("div",{style:{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,color:"#ccc"}},
        h("div",{className:"spin",style:{fontSize:28,display:"inline-block"}},"⧭"),
        h("div",{style:{fontSize:13}},"Cargando plano..."),
        fileName&&h("div",{style:{fontSize:11,opacity:.6}},fileName)
      ),
      phase==="error"&&h("div",{style:{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#f88",fontSize:13}},
        "⚠ "+error
      ),

/* ══════════════════════════════════════════════════════════
   CUENTAS SERVICIOS
══════════════════════════════════════════════════════════ */
function CuentasServiciosView({dashData,driveLoading}){
  const [search,setSearch]=useState("");
  const [aaData,setAaData]=useState({});
  const [aaLoading,setAaLoading]=useState(false);
  const [aaError,setAaError]=useState(null);
  const [aaUpdatedAt,setAaUpdatedAt]=useState(null);
  const [enelData,setEnelData]=useState({});
  const [enelLoading,setEnelLoading]=useState(false);
  const [enelError,setEnelError]=useState(null);
  const [enelUpdatedAt,setEnelUpdatedAt]=useState(null);
  const [sortCol,setSortCol]=useState(null);
  const [sortDir,setSortDir]=useState('asc');

  /* Fetch automático del caché de deudas AA (actualizado diariamente a las 6am) */
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      setAaLoading(true);
      setAaError(null);
      try{
        // Leer el caché estático directamente (más rápido que la función serverless)
        const r=await fetch("/aa-cache.json");
        const data=await r.json();
        if(data.accounts && Object.keys(data.accounts).length > 0){
          setAaData(data.accounts);
          setAaUpdatedAt(data.updatedAt);
        } else {
          setAaError("Sin datos de caché");
        }
      }catch(e){
        setAaError(e.message);
      }
      if(!cancelled) setAaLoading(false);
    })();
    return()=>{cancelled=true;};
  },[]);

  /* Cargar caché Enel */
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      setEnelLoading(true);setEnelError(null);
      try{
        const r=await fetch("/enel-cache.json");
        const data=await r.json();
        if(data.accounts&&Object.keys(data.accounts).length>0){
          setEnelData(data.accounts);
          setEnelUpdatedAt(data.updatedAt);
        }else if(data.source==="pending"){
          /* Aún no configurado — silencioso */
        }else{
          setEnelError("Sin datos de caché Enel");
        }
      }catch(e){setEnelError(e.message);}
      if(!cancelled)setEnelLoading(false);
    })();
    return()=>{cancelled=true;};
  },[]);

  useEffect(()=>{
    function beforePrint(){
      document.querySelectorAll('main,main>div,#root>div').forEach(el=>{
        el.dataset.pOvY=el.style.overflowY||'';
        el.dataset.pOvX=el.style.overflowX||'';
        el.dataset.pH=el.style.height||'';
        el.dataset.pMH=el.style.maxHeight||'';
        el.dataset.pF=el.style.flex||'';
        el.style.overflowY='visible';
        el.style.overflowX='visible';
        el.style.height='auto';
        el.style.maxHeight='none';
        el.style.flex='none';
      });
    }
    function afterPrint(){
      document.querySelectorAll('main,main>div,#root>div').forEach(el=>{
        el.style.overflowY=el.dataset.pOvY||'';
        el.style.overflowX=el.dataset.pOvX||'';
        el.style.height=el.dataset.pH||'';
        el.style.maxHeight=el.dataset.pMH||'';
        el.style.flex=el.dataset.pF||'';
      });
    }
    window.addEventListener('beforeprint',beforePrint);
    window.addEventListener('afterprint',afterPrint);
    return()=>{window.removeEventListener('beforeprint',beforePrint);window.removeEventListener('afterprint',afterPrint);};
  },[]);
  const normQ=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
  const clientes=dashData
    ?(()=>{
        const seen=new Set();
        return [...(dashData.clients||[]),...(dashData.vacantes||[])]
          .filter(c=>{const k=c.sitio+"|"+c.edificio;if(seen.has(k))return false;seen.add(k);return true;})
          .sort((a,b)=>a.ri-b.ri);
      })()
    :[];
  const q=normQ(search);
  const filtered=!q?clientes:clientes.filter(c=>
    normQ(c.nombre).includes(q)||normQ(c.sitio).includes(q)||normQ(c.edificio).includes(q)||
    (c.rut&&c.rut.replace(/[.\-]/g,"").includes(q.replace(/[.\-]/g,"")))
  );
  if(!dashData)return h("main",{style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,overflow:"hidden",minHeight:0}},
    driveLoading
      ?h("div",{style:{display:"flex",alignItems:"center",gap:10,color:"var(--txm)",fontSize:13}},h("span",{className:"spin",style:{fontSize:18}},"\u29B3"),"Cargando planilla desde Drive...")
      :h("div",{style:{fontSize:13,color:"var(--txd)"}},"Sin datos \u2014 carga la planilla de facturac\u00e9n")
  );
  const conIdAA=clientes.filter(c=>c.idAgua).length;
  const sinIdAA=clientes.filter(c=>!c.idAgua).length;
  const conDeuda=clientes.filter(c=>c.idAgua&&aaData[c.idAgua]?.deuda&&aaData[c.idAgua].deuda!=='$0').length;
  const conIdEnel=clientes.filter(c=>c.idEnel).length;
  const sinIdEnel=clientes.filter(c=>!c.idEnel).length;
  const conDeudaEnel=clientes.filter(c=>c.idEnel&&enelData[c.idEnel]?.deuda&&parseInt((enelData[c.idEnel].deuda||'$0').replace(/[$\.]/g,''))||0>0).length;
  const enelIdsEnPlanilla=new Set(clientes.map(c=>c.idEnel).filter(Boolean));
  const sinAsignarEnel=Object.keys(enelData).filter(id=>!enelIdsEnPlanilla.has(id)).length;
  function getSortVal(c,col){
    switch(col){
      case 'Sitio':return(c.sitio||'').toLowerCase();
      case 'Edificio':return(c.edificio||'').toLowerCase();
      case 'RUT':return(c.rut||'').replace(/[.\-]/g,'');
      case 'Cliente':return c.isVacante?'￿':(c.nombre||'').toLowerCase();
      case 'Dirección':return(c.dir||'').toLowerCase();
      case 'ID Aguas Andinas':return(c.idAgua||'').toLowerCase();
      case 'N° Medidor AA':return(c.medAgua||'').toLowerCase();
      case 'Deuda AA':{const d=aaData[c.idAgua];return d?.deuda?parseInt((d.deuda||'$0').replace(/[$\.]/g,''))||0:0;}
      case 'Nombre Factura AA':{const d=aaData[c.idAgua];return(d?.nombre||'').toLowerCase();}
      case 'ID Enel':return(c.idEnel||'').toLowerCase();
      case 'N° Medidor Enel':return(c.medEnel||'').toLowerCase();
      case 'Deuda Enel':{const d=enelData[c.idEnel];return d?.deuda?parseInt((d.deuda||'$0').replace(/[$\.]/g,''))||0:0;}
      default:return'';

  const sorted=sortCol?[...filtered].sort((a,b)=>{const va=getSortVal(a,sortCol),vb=getSortVal(b,sortCol);const cmp=typeof va==='number'?va-vb:va.localeCompare(vb,'es');return sortDir==='asc'?cmp:-cmp;}):filtered;

    h("div",{style:{padding:"14px 24px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,flexShrink:0,borderBottom:"1px solid var(--bdr)"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
        h("span",{style:{fontSize:11,fontWeight:700,color:"var(--txd)",letterSpacing:".06em"}},"\uD83D\uDD0C CUENTAS DE SERVICIOS"),
        h("span",{style:{fontSize:11,color:"var(--txd)",fontFamily:"'DM Mono',monospace",background:"var(--surf2)",padding:"2px 8px",borderRadius:6}},filtered.length+" / "+clientes.length),
        h("span",{style:{width:1,height:16,background:"var(--bdr)",display:"inline-block",margin:"0 4px"}}),
        /* \u2500\u2500 Aguas Andinas \u2500\u2500 */
        h("span",{style:{fontSize:10,fontWeight:700,color:AA_BLUE,marginRight:2}},"\uD83D\uDCA7 AA"),
        h("span",{title:"Cuentas con ID Aguas Andinas",style:{fontSize:10,color:"var(--green)",background:"var(--gbg)",border:"1px solid var(--gdim)",padding:"2px 8px",borderRadius:10,fontFamily:"'DM Mono',monospace",cursor:"default"}},conIdAA+" con ID"),
        h("span",{title:"Cuentas sin ID Aguas Andinas",style:{fontSize:10,color:"var(--amber)",background:"var(--abg)",border:"1px solid var(--adim)",padding:"2px 8px",borderRadius:10,fontFamily:"'DM Mono',monospace",cursor:"default"}},sinIdAA+" sin ID"),
        aaLoading&&h("span",{style:{fontSize:9,color:AA_BLUE},className:"spin"},"\u29B3"),

                          if(enelLoading) return h("span",{style:{color:"var(--bdr)",fontSize:9}},"\u00b7\u00b7\u00b7");
                          if(!d&&enelError) return h("span",{style:{color:"var(--err)",fontSize:9}},"\u26a0");
                          if(d) return h("span",{style:{color:d.deuda&&d.deuda!=="$0"?"#dc2626":ENEL_GRN,fontWeight:d.deuda&&d.deuda!=="$0"?700:400}},d.deuda||"$0");
                          return h("span",{style:{color:"var(--bdr)"}},"\u2014");
                        })()
                    )
                  );
                }),
                    ...huerfanas.map((id,idx)=>filaHuerfana(id,idx))
                  ];
                })()
              )
            )
    )
  );
}
