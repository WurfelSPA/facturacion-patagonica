      const pdfUsado=new Set();
      const MANUAL={"A-2|Banco Estado Express|202.6|arriendo":"FEE-39","A-2|Banco del Estado de Chile|256.7|arriendo":"FEE-39","4-A|Sociedad de Alimentos Leefood SpA|7.48|serv_adm":"F-14756","A-2|Servicio Local de Educación Pública de los Libertadores|7.92|arriendo":"F-14908","A-2|Servicio Local de Educación Pública de los Libertadores|167.73|arriendo":"F-14902","A-2|Servicio Local de Educación Pública de los Libertadores|157.14|arriendo":"F-14901","A-2|Visibility S.A.|31.7|arriendo":"F-14876","A-2|VISIBILITY S.A.|31.7|arriendo":"F-14876"};
      const filas=[];

      /* CRUCE: scoring RUT + UF
       * Scoring:
       *   RUT exacto                         → +200 pts  (identificador inequívoco)
       *   UF exacta   (diff < 0.01)          → +50  pts
       *   UF próxima  (diff < 0.5)           → +20  pts
       *   UF muy próxima (diff < 2, sin RUT) → +5   pts  (tiebreak leve)
       *
       * Reglas:
       *   - Candidatos válidos: mismo sitio + mismo tipo, no usados aún
       *   - Solo se asigna si score >= 200 (RUT match) O score >= 50 (UF exacta sin RUT)
       *   - Fallback sin score mínimo: solo si hay exactamente 1 candidato disponible
       *     para ese sitio+tipo (evita asignación ciega cuando hay ambigüedad)
       *   - Facturas CLP fijo (ufPdf===null): se cruzan solo por RUT exacto
       */
      for(const c of clientes){
        const correo=c.email||"";
        const concepto=c.tipo==="arriendo"?"Arriendo":c.tipo==="habilitacion"?"Habilitación":"Serv. Adm.";
        const colRef=c.tipo==="arriendo"?"GS":"GT";
        const mk=`${c.sitio}|${c.cliente}|${c.uf}|${c.tipo}`;
        let factura="",ufPdf=null,montoTotal=null,ivaAmount=null,ufValor=null,matchScore=0;
        /* ── Pre-carga desde planilla (nro ya escrito en Nro Fact col) ─── */
        const _planFact=c.tipo==="arriendo"?c.nroFactArr:c.nroFactGC;
        if(_planFact){const _pf=String(_planFact).replace(/^F(?:EE)?-/i,"");factura=`F-${_pf}`;ufPdf=c.uf;matchScore=888;const _mi=pdfs.findIndex((p,pi)=>!pdfUsado.has(pi)&&p.nroFact===factura);if(_mi>=0){pdfUsado.add(_mi);ufValor=pdfs[_mi].ufValor||null;montoTotal=pdfs[_mi].montoTotal||null;ivaAmount=pdfs[_mi].ivaAmount||null;if(pdfs[_mi].ufPdf!=null)ufPdf=pdfs[_mi].ufPdf;}}
        else if(MANUAL[mk]){factura=MANUAL[mk];ufPdf=c.uf;matchScore=999;const _mi=pdfs.findIndex((p,i)=>!pdfUsado.has(i)&&p.nroFact===factura);if(_mi>=0){pdfUsado.add(_mi);ufValor=pdfs[_mi].ufValor||null;montoTotal=pdfs[_mi].montoTotal||null;ivaAmount=pdfs[_mi].ivaAmount||null;if(pdfs[_mi].ufPdf!=null)ufPdf=pdfs[_mi].ufPdf;}}
        else{
          let bestIdx=-1,bestScore=0;
          const rutNorm=c.rut||"";

          /* Normaliza nombre para matching: minúsculas, sin tildes, solo alfanumérico */

          const ncli=normNombre(c.cliente);

          for(let idx=0;idx<pdfs.length;idx++){

            if(p.tipo!==c.tipo)continue;

            /* ── SCORING MULTI-SEÑAL ──────────────────────────────────────────────────
             * 1. RUT conocido y DIFERENTE → penalización severa (-400): la factura
             *    definitivamente no corresponde a este cliente.
             * 2. RUT exacto → +200 (identificador inequívoco)
             * 3. Nombre en archivo → +300 solo si hay coincidencia de SUBSTRING completo.
             *    Se elimina el match de "primera palabra" (fwN===fwC) que causaba falsos
             *    positivos entre clientes con nombre similar (ej: dos Cajas de Compensación).
             * 4. UF exacta / próxima → +50 / +20 / +5
             * 5. Nombre coincide pero UF difiere >20% → descontar bonus de nombre:
             *    archivo probablemente tiene nombre equivocado por detectCliente erróneo.
             * ──────────────────────────────────────────────────────────────────────── */

              const diff=Math.abs(p.ufPdf-c.uf);
              if(diff<0.01)       score+=50;
              else if(diff<0.5)   score+=20;

            if(score>=300&&p.ufPdf!==null&&p.ufPdf<1000&&c.uf>0&&Math.abs(p.ufPdf-c.uf)/c.uf>0.20){

        }

      if(!planillaOk){

      }

      for(const h of habDrive){

        if(sinPdf.length>0){addLog(`  ⚠ Sin PDF (${sinPdf.length}): ${sinPdf.slice(0,3).map(f=>f.sitio+"/"+f.cliente.slice(0,20)).join(" | ")}`,"warn");}

      const prevSent=new Set();
      filas.forEach((f,i)=>{const key=`${periodo}|${f.cliente}|${f.concepto}|${f.factura||""}`;if(sentKeys.has(key))prevSent.add(i);});
      setSentSet(prevSent);

      /* ── Email de notificación con stats reales ── */
      try{
        const eTotal=filas.length;

  const finishProc=()=>{setShowProc(false);setView("table");notify(`${data.length} filas procesadas — ${periodo}`);};

  /* ── DESCARGAR REPORTE CSV ── */

  /* ── ENVÍO ── */

  const MES_STR={"Enero":"01","Febrero":"02","Marzo":"03","Abril":"04","Mayo":"05","Junio":"06","Julio":"07","Agosto":"08","Septiembre":"09","Octubre":"10","Noviembre":"11","Diciembre":"12"};
  const splitPDF=async(force)=>{
    setSplitLoading(true);setSplitResult(null);setSplitStatus("");
    const [mesNombre,anio]=periodo.split(" ");
    const mesNum=MES_STR[mesNombre];
    const mesCode=`${anio}-${mesNum}`;
    const periodoCode=mesCode;
    const pdfNombre=`Facturas_PISA_${mesCode}.pdf`;
    try{
      // 1. Buscar PDF en Drive (via servidor con Service Account) — salvo que se
      //    esté forzando la descarga, en cuyo caso se ignora el PDF ya guardado
      //    y se le vuelve a pedir a Nubox (nubox-pdf.js elimina el viejo antes de subir el nuevo)
      let pdfFileId=null;
      if(!force){
        setSplitStatus("🔍 Buscando PDF en Drive...");
        const qRes=await fetch(`/api/storage?buscarPdf=${encodeURIComponent(pdfNombre)}&folderId=${DRIVE_FACTURACION_FOLDER_ID}`);
        const qData=await qRes.json();
        pdfFileId=qData.pdfFileId||null;
      }
      // 2. Si no existe (o se forzó), descargar de Nubox (2-3 min — el timer muestra el progreso)
      if(!pdfFileId){
        setSplitStatus(force?"🔄 Forzando nueva descarga desde Nubox... (puede tardar 2-3 min)":"🔐 Conectando con Nubox... (puede tardar 2-3 min)");
        const nbRes=await fetch("/api/nubox-pdf",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({mes:mesCode,destFolderId:DRIVE_FACTURACION_FOLDER_ID,userToken:await getToken().catch(()=>null)}),
        });
        const nbData=await nbRes.json().catch(()=>({}));
        if(!nbRes.ok)throw new Error("Nubox: "+(nbData.error||"Error desconocido"));
        pdfFileId=nbData.fileId;
        if(nbData.xmlFileId)notify(`✓ XML del período también guardado en Drive (${nbData.xmlFileName})`,"ok");
        else if(nbData.xmlError)notify(`⚠ No se pudo descargar el XML: ${nbData.xmlError}`,"warn");
        setSplitStatus(`✓ ${nbData.total} facturas descargadas. Separando por cliente...`);
      }else{
        setSplitStatus("✓ PDF encontrado en Drive. Separando por cliente...");
      }
      // 4. Separar PDF por cliente
      const res=await fetch("/api/split-pdf",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({pdfFileId,periodo:periodoCode,destFolderId:DRIVE_FACTURACION_FOLDER_ID,userToken:await getToken().catch(()=>null)}),
      });
      const rawText=await res.text();
      let data;
      try{data=JSON.parse(rawText);}catch(_){throw new Error("split-pdf: error del servidor (HTTP "+res.status+") — intente de nuevo");}
      if(!res.ok)throw new Error(data.error||"Error desconocido");
      setSplitResult(data);
      if(data.zipBase64){
        const bytes=Uint8Array.from(atob(data.zipBase64),c=>c.charCodeAt(0));
        const blob=new Blob([bytes],{type:"application/zip"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url; a.download=data.zipName; a.click();
        URL.revokeObjectURL(url);
      }
      notify("✓ "+data.zipName+" descargado ("+data.totalFacturas+" facturas)","ok");
      autoProcesado.current=false; /* permitir que procesar() corra con el ZIP nuevo */
      if(data.zipBase64){
        /* Usar el ZIP recién generado directamente (sin esperar a que Drive lo
           indexe para buscarZip) — dispara el auto-proceso de inmediato */
        const zipBytesLocal=Uint8Array.from(atob(data.zipBase64),c=>c.charCodeAt(0));
        const zipFileLocal=new File([zipBytesLocal],data.zipName,{type:"application/zip"});
        zipPeriodoRef.current=periodo;
        setPdfMaestroId(null);setCanGenerate(false);setZipError(null);
        setFiles(prev=>({...prev,zip:zipFileLocal}));
        setZipStatus("ready");
      }else{
        buscarZip(periodo);
      }
    }catch(e){
      setSplitResult({error:e.message});
      notify("Error: "+e.message,"err");
    }finally{setSplitLoading(false);}
  };

  const sendAll=async()=>{

  /* ── Sincronizar planilla: escribe "Enviado" en HC para todos los ya enviados ── */

  /* ── Guardar nros de factura en planilla (Nro Fact Arriendo / Nro Fact GC) ── */
  const [savingNros,setSavingNros]=React.useState(false);
  const guardarNrosPlanilla=useCallback(async()=>{
    const enriched=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
    /* Solo filas que coinciden perfecto, tienen factura, col destino, fila planilla, y NO venían ya de planilla */

  /* ── Cargar datos desde planilla sin ZIP ────────────────────────────────────
   * Muestra TODOS los clientes del período con su UF y comentarios.
   * Solo usa el Nro Fact cuando viene explícito de la columna de planilla
   * para ese período (colGS+1 / colGT+1). NO aplica MANUAL_STATIC aquí porque
   * esos números son de meses anteriores y generarían facturas falsas en meses
   * no procesados todavía.

  const cargarDesdePlanilla=useCallback(async()=>{

        const nfCol=c.tipo==="arriendo"?c.nroFactArrColLetter:c.nroFactGCColLetter;
        /* Solo usar Nro Fact si viene explícito de la planilla para este período */
        let factura="",matchScore=0;

      }

           la estimación UF×1.19 (no contempla montos exentos) mientras no se
           haya hecho clic en "Procesar". */
        await enriquecerConHistorialXML(filas,clientes,periodo);
        setData(filas);setSoloPlanilla(true);setView("table");
        /* Descargar ZIP en segundo plano para habilitar previsualización en meses procesados */
        if(zipStatus!=="ready"&&zipStatus!=="loading")buscarZip(periodo);
      }
    }catch(e){console.warn("cargarDesdePlanilla:",e.message);}
    finally{setAutoLoading(false);}

  /* Sin SetupPanel — siempre va al dashboard */

  const enriched=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
  const stats={total:enriched.length,ok:enriched.filter(r=>r.estado==="ok").length,diff:enriched.filter(r=>r.estado!=="ok"&&r.estado!=="sanchez").length,sent:enriched.filter(r=>sentSet.has(r.i)||r.yaEnviado).length,conPdf:enriched.filter(r=>r.factura&&r.ufPdf!==null&&r.estado!=="sanchez").length,sinPdf:enriched.filter(r=>(!r.factura||r.ufPdf===null)&&r.estado!=="sanchez").length,sanchez:enriched.filter(r=>r.estado==="sanchez").length};
  const filtered=enriched.filter(r=>{
    const mf=filter==="all"||(filter==="ok"&&r.estado==="ok"&&!sentSet.has(r.i)&&!r.yaEnviado)||(filter==="diff"&&r.estado!=="ok"&&r.estado!=="sanchez")||(filter==="sent"&&(sentSet.has(r.i)||r.yaEnviado))||(filter==="difiere"&&r.estado==="diff"&&r.matchScore!==1)||(filter==="sinpdf"&&!r.factura&&r.estado!=="sanchez");
    const mc=concFilter==="all"||(concFilter==="arr"&&r.concepto==="Arriendo")||(concFilter==="srv"&&r.concepto==="Serv. Adm.")||(concFilter==="hab"&&r.concepto==="Habilitación")||(concFilter==="pag"&&!!r.yaPagado)||(concFilter==="ppr"&&!r.yaPagado);
    const normQ=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
    const q=normQ(search);

    const mfact=!searchFactura||( r.factura&&r.factura.toLowerCase().includes(searchFactura.toLowerCase()));
    return mf&&mc&&ms&&mfact;
  });

  /* Monto Total (Neto+IVA) de una fila — misma lógica usada en la columna "Monto+IVA" */
  function montoIvaOf(row){
    if(row.montoTotal!=null&&row.montoTotal>0) return row.montoTotal;
    const exento=row.afecto==="Exento";
    const uf=row.ufPdf??null;
    const ufVal=ufSII??row.ufValor??null;
    if(uf!=null&&ufVal&&uf<10000){
      const neto=Math.round(uf*ufVal);
      const iva=exento?0:Math.round(neto*0.19);
      return neto+iva;
    }
    const base=(uf!=null&&uf>500)?Math.round(uf):(row.ufPlan>500)?Math.round(row.ufPlan):null;
    if(!base) return null;
    return exento?base:Math.round(base*1.19);
  }

        var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
        var fila3=raw[2]||[];
        var mesNum=MES_NUM[periodo.split(" ")[0]];
        var anio=parseInt(periodo.split(" ")[1]);
        var colMes=-1;
        function esTargetMes(val){
          if(!val)return false;
          if(typeof val==="number"&&val>40000&&val<60000){
            var d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+Math.round(val)*86400000);
            return d.getUTCFullYear()===anio&&(d.getUTCMonth()+1)===mesNum;
          }
          if(val instanceof Date)return val.getFullYear()===anio&&(val.getMonth()+1)===mesNum;
          return false;
        }
        for(var i=50;i<fila3.length;i++){if(esTargetMes(fila3[i])){colMes=i;break;}}
        var colExists=colMes>=0;
        if(!cancelled)setReadOnly(colExists);
        var colGC=colMes+2;
        var EXCL=["","VACANTE","Nombre Cliente","Areas Comunes Edificio","Areas comunes Edificio (Subterraneos)","Area Comun"];
        var parsed=[];
        for(var ri=4;ri<raw.length;ri++){
          var row=raw[ri];if(!row)continue;
          var cliente=row[5];
          if(!cliente||EXCL.includes(String(cliente).trim()))continue;
          var nombre=String(row[5]||"").trim();
          var sitio=String(row[7]||"").trim();
          var edificio=String(row[8]||"").trim();
          var rut=String(row[9]||"").trim();
          var dir=String(row[10]||"").trim();
          var clienteStr=String(row[11]||"").trim();
          if(EXCL.includes(clienteStr)||clienteStr.toUpperCase()==="VACANTE")continue;
          var correo=String(row[12]||"").trim();
          var key=sitio+"|"+edificio+"|"+rut+"|"+clienteStr;
          var uf=colMes>=0?(parseFloat(row[colMes])||0):0;
          var nroFactArr=colMes>=0?String(row[colMes+1]||""  ).trim():"";
          var gc=colGC>=0?(parseFloat(row[colGC])||0):0;
          var nroFactGC=colMes>=0?String(row[colMes+3]||""  ).trim():"";
          var comentarios=colMes>=0?String(row[colMes+4]||"").trim():"";
          var correoEnviado=colMes>=0?String(row[colMes+5]||"").trim():"";
          var m2Row=row[42]!=null&&row[42]!==""?Number(row[42]):null; /* Col AQ: m² */
          parsed.push({key,nombre,sitio,edificio,rut,dir,cliente:clienteStr,correo,uf,nroFactArr,gc,nroFactGC,comentarios,correoEnviado,m2:m2Row});
        }
        if(!cancelled)setRows(parsed);
        if(!colExists){
          try{
            var r=await fetch("/api/planilla?action=load-fill&periodo="+encodeURIComponent(periodo));
            if(r.ok){var d=await r.json();if(d.values&&!cancelled)setEdits(d.values);}
          }catch(e){}
        }
        if(!cancelled)setLoading(false);
      }
      load();
      return function(){cancelled=true;};

    function setEdit(key,field,val){

        return next;
      });
    }

    async function save(){
      setSaving(true);setMsg(null);
      var values={};
      rows.forEach(function(row){
        var e=edits[row.key]||{};
        var uf=e.uf!==undefined?parseFloat(e.uf)||0:parseFloat(row.uf)||0;
        var gc=e.gc!==undefined?parseFloat(e.gc)||0:parseFloat(row.gc)||0;
        if(uf||gc)values[row.key]={uf,gc};
      });
      try{
        var r=await fetch("/api/planilla?action=save-fill",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({periodo,values})
        });
        var d=await r.json();
        if(d.ok)setMsg({type:"ok",text:"✓ Guardado correctamente"});
        else setMsg({type:"err",text:d.error||"Error al guardar"});

    function stripNom(s){
      return(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
    }
    function normSitio(s){return(s||"").toUpperCase().replace(/-/g,"");}
    function getFactRow(row){
      /* Intentar match por cliente (arrendatario) primero, luego por nombre (arrendadora) */
      var entry=invMap[stripNom(row.cliente)]||invMap[stripNom(row.nombre)]||null;
      /* Fallback: buscar parcial — si ningún strip exacto, probar si alguna clave del map está contenida */
      if(!entry){
        var kc=stripNom(row.cliente);
        var kn=stripNom(row.nombre);
        var found=Object.keys(invMap).find(function(k){
          return (kc.length>6&&(k.includes(kc.substring(0,Math.min(kc.length,20)))||kc.includes(k.substring(0,Math.min(k.length,20)))))||
                 (kn.length>6&&(k.includes(kn.substring(0,Math.min(kn.length,20)))||kn.includes(k.substring(0,Math.min(k.length,20)))));
        });
        if(found)entry=invMap[found];
      }
      if(!entry)return{arrNro:null,srvNro:null};
      var sitios=entry.sitios||{};
      /* arriendo: en bucket del sitio (ej: "A2"); si no hay match exacto, tomar el único no-default */
      var normS=function(s){return(s||"").toUpperCase().replace(/-/g,"");};
      var siteKey=Object.keys(sitios).find(function(k){return k!=="default"&&normS(k)===normS(row.sitio);})||null;
      if(!siteKey){
        var nonDef=Object.keys(sitios).filter(function(k){return k!=="default";});
        if(nonDef.length===1)siteKey=nonDef[0];
      }
      var siteData=siteKey?sitios[siteKey]:null;
      var defData=sitios["default"]||{};
      var arrNro=(siteData&&siteData.arriendo&&siteData.arriendo.nro)||null;
      /* default.servAdm solo aplica si hay UN solo sitio (multi-sitio→GC es por edificio, no compartida) */
      var nonDefCount=Object.keys(sitios).filter(function(k){return k!=="default";}).length;
      var srvNro=(siteData&&siteData.servAdm&&siteData.servAdm.nro)||
                 (nonDefCount<=1&&defData.servAdm?defData.servAdm.nro:null)||null;
      return{arrNro:arrNro,srvNro:srvNro};

                  h("div",{style:{display:"flex",flexDirection:"column",gap:2}},
                    h("span",{style:{display:"inline-block",padding:"2px 7px",borderRadius:5,fontSize:10,fontWeight:700,background:`${SITIO_C[row.sitio]||"#888"}18`,color:SITIO_C[row.sitio]||"#888",border:`1px solid ${SITIO_C[row.sitio]||"#888"}40`,alignSelf:"flex-start"}},row.sitio),
                    row.edificio&&h("span",{style:{fontSize:9,color:"var(--txd)",fontFamily:"'DM Mono',monospace",paddingLeft:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:52}},row.edificio)
                  )
                ),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:12,fontWeight:600}},row.cliente),row.rut&&h("div",{style:{fontSize:10,fontFamily:"'DM Mono',monospace",color:"var(--txd)",marginTop:2}},formatRUT(row.rut))),
                h("td",{style:{padding:"8px 11px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",background:bg}},h("span",{style:{fontSize:11,fontFamily:"'DM Mono',monospace",color:row.correo?"var(--accl)":"var(--txd)"}},row.correo||"— sin correo")),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{className:esArr?"tag-arr":"tag-srv"},row.concepto)),
                h("td",{style:{padding:"8px 11px",background:bg}},
                  row.factura
                  ?h("button",{
                      title:"Ver PDF de "+row.factura,
                      style:{fontSize:11,fontFamily:"'DM Mono',monospace",color:(pdfMap[row.factura]||files.zip)?"var(--blue)":"var(--txm)",background:"none",border:"none",cursor:"pointer",padding:0,textDecoration:(pdfMap[row.factura]||files.zip)?"underline":"none",fontWeight:600},
                      onClick:async()=>{
                        try{
                          const pdf=pdfMap[row.factura];
                          let b64=null;
                          if(pdf?.zipPath&&files.zip){b64=await getPdfBase64FromZip(files.zip,pdf.zipPath);}
                          else if(pdf?.driveFileId){b64=await getPdfBase64FromDrive(pdf.driveFileId);}
                          /* Fallback: buscar en el ZIP por número de factura si pdfMap no tiene la entrada */
                          if(!b64&&files.zip&&row.factura){
                            try{
                              const _buf=await readFileAsBuffer(files.zip);
                              const _zip=await JSZip.loadAsync(_buf);
                              const _key=Object.keys(_zip.files).find(p=>{
                                const _fn=p.split("/").pop();
                                return _fn.match(new RegExp("^"+row.factura.replace(/[-]/g,"\\$&")+"\\b","i"));
                              });
                              if(_key){
                                const _pdfBuf=await _zip.files[_key].async("uint8array");
                                let _bin="";const _cs=8192;
                                for(let _i=0;_i<_pdfBuf.length;_i+=_cs)_bin+=String.fromCharCode(..._pdfBuf.slice(_i,_i+_cs));
                                b64=btoa(_bin);
                              }
                            }catch(e){console.warn("PDF fallback:",e);}
                          }
                          if(!b64){
                            if(soloPlanilla&&zipStatus==="loading")notify("Cargando PDFs desde Drive, intenta en un momento...","warn");
                            else notify("PDF no disponible — procesa el mes para verlo","warn");
                            return;
                          }
                          const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
                          const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
                          window.open(url,"_blank");
                          setTimeout(()=>URL.revokeObjectURL(url),30000);
                        }catch(e){notify("Error abriendo PDF: "+e.message,"err");}
                      }
                    },row.factura)

                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace"}},row.ufPlan>5000?"$"+Math.round(row.ufPlan).toLocaleString("es-CL"):row.ufPlan.toFixed(2))),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace",color:diffPdf?"var(--amber)":"var(--tx)"}},
  row.ufPdf!==null&&row.ufPdf!==undefined
    ?(row.ufPdf>5000?"$"+Math.round(row.ufPdf).toLocaleString("es-CL"):row.ufPdf.toFixed(2))
    :"—"
)),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace",fontWeight:600,color:"var(--tx)"}},
                  (()=>{const m=montoIvaOf(row);return m==null?"—":"$"+Math.round(m).toLocaleString("es-CL");})()
                )),

                  row.estado==="missing"?h(Badge,{e:"missing",row}):
                  sent?h("span",{onClick:()=>{if(window.confirm(row.cliente+" — "+row.factura+"\n\n¿Volver a marcar como pendiente por enviar?"))revertirEnviado(row);},title:"Clic para volver a pendiente por enviar",style:{cursor:"pointer"}},h(Badge,{e:"sent_sheet",row})):
                  sending?h("span",{style:{color:"var(--blue)",fontSize:11,display:"inline-flex",alignItems:"center",gap:4}},h("span",{className:"spin"},"⟳")," Enviando..."):
                  row.estado==="ok"&&!noEmail?h("button",{
                    className:"btn-send",
                    onClick:unlocked?()=>setPreview({row,idx:i}):()=>setShowPwdModal(true),
                    title:unlocked?(esClienteXML(row.cliente)?"Enviar XML":"Enviar correo"):"Clave requerida para enviar",
                    style:{opacity:unlocked?1:0.55,cursor:unlocked?"pointer":"pointer"}
                  },"✉ "+(unlocked?(esClienteXML(row.cliente)?"Enviar XML":"Enviar"):"🔒")):
                  h(Badge,{e:row.estado,row})
                ),
                h("td",{style:{padding:"8px 11px",background:bg,textAlign:"center"}},
                  h("input",{
                    type:"checkbox",
                    checked:!!row.yaPagado,
                    disabled:!row.sheetRow||!row.pagadoColLetter,
                    title:!row.sheetRow?"Sin fila en planilla":row.yaPagado?"Pagado — clic para desmarcar":"Marcar como pagado",
                    onChange:()=>{if(row.sheetRow&&row.pagadoColLetter)togglePagado(row.i,row.sheetRow,row.pagadoColLetter,row.yaPagado);},
                    style:{width:16,height:16,cursor:row.sheetRow&&row.pagadoColLetter?"pointer":"default",accentColor:"var(--green)"}
                  })
                )
              );
            })
          )
        )
      ),
      h("footer",{style:{background:"#EAF1FF",borderTop:"1px solid #D6E4FF",padding:"9px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h("span",{style:{fontSize:11,color:"var(--txd)",fontFamily:"'DM Mono',monospace"}},`${filtered.length}/${stats.total} · ${stats.sent} enviados · ${periodo}`),
        h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
          stats.sent>0&&h("button",{
              onClick:syncStatus?null:sincronizarPlanilla,
              disabled:!!syncStatus,
              title:"Escribe 'Enviado' en columna HC de la planilla para todos los correos enviados esta sesión",
              style:{background:"var(--surf2)",border:"1px solid var(--bdr)",color:syncStatus?"var(--accl)":"var(--txm)",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:600,cursor:syncStatus?"default":"pointer",display:"flex",alignItems:"center",gap:5,minWidth:180}
            },syncStatus?`📋 Sincronizando... ${syncStatus.done}/${syncStatus.total}`:"📋 Sincronizar planilla"),
          h("button",{
              onClick:unlocked?sendAll:()=>setShowPwdModal(true),

            },unlocked?`✉ Enviar todos (${Math.max(0,stats.ok-stats.sent)})`:`🔒 Enviar todos (${Math.max(0,stats.ok-stats.sent)})`)
        )
      )
    )
    ,view==="ventas"&&h(VentasView,{periodo})
    ,view==="fact-cobrar"&&h(FactxCobrarView,{notify})
    ,view==="pagos"&&h(EstadoPagosView,{notify})
    ,view==="contratos"&&h(ContratosView,{dashData,driveLoading})
    ,view==="cuentas"&&h(CuentasServiciosView,{dashData,driveLoading,notify})
    ,view==="vacantes"&&h(CatastroSitiosView,{dashData,driveLoading})
    ,view==="cortijo"&&h(ElCortijoView,{dashData,driveLoading})
    ,view==="torre2680"&&h(Torre2680View,{dashData,driveLoading})
    ,view==="historial-fact"&&h(HistorialFactView,{dashData,driveLoading,notify,planillaFile:files.planilla,marcarPagadoSheet})
  ));
}
