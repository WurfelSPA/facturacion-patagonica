/* ══════════════════════════════════════════════════════════
   HISTORIAL FACTURACIÓN
══════════════════════════════════════════════════════════ */
function HistorialFactView({dashData,driveLoading,notify}){
  const [selGroup,setSelGroup]=useState([]);           /* array de sitios del cliente seleccionado */
  const selClient=selGroup[0]||null;                   /* primer sitio → usado para fetch (comparten rut+nombre) */
  const [periodsAvail,setPeriodsAvail]=useState([]); /* períodos con ZIP en Drive */
  const [invoicesMap,setInvoicesMap]=useState({});   /* {periodo:{arriendo,servAdm,habilitacion}} */
  const [loadingSet,setLoadingSet]=useState(new Set());
  const [zipCache,setZipCache]=useState({});
  const [pdfPrev,setPdfPrev]=useState(null);
  const [pdfLoading,setPdfLoading]=useState(false);
  const [search,setSearch]=useState("");
  const [refreshTrigger,setRefreshTrigger]=useState(0);
  const refreshFlag=React.useRef(false);
  const [resumenData,setResumenData]=useState(null);   /* [{nombre, meses:{}, total}] desde /api/historial?resumen=1 */
  const [rutMapDTE,setRutMapDTE]=useState({});          /* {RazonSocial→RUT} desde /api/historial?rutMap=1 */
  const [sortCol,setSortCol]=useState("total");         /* columna activa: "rut"|"nombre"|"total" */
  const [sortDir,setSortDir]=useState("desc");          /* "asc"|"desc" */

  /* Invalidar caché localStorage si la versión cambió (evita datos stale de deploys anteriores) */
  const HIST_CACHE_VER = "fuente0-v6";
  React.useEffect(()=>{
    try{
      if(localStorage.getItem("histBatch_ver")!==HIST_CACHE_VER){
        Object.keys(localStorage).filter(k=>k.startsWith("histBatch:")).forEach(k=>localStorage.removeItem(k));
        localStorage.setItem("histBatch_ver",HIST_CACHE_VER);
      }
    }catch(_){}
  },[]);

  /* Carga resumen de ventas — fuente primaria: caché estático. API solo como fallback. */
  React.useEffect(()=>{
    let cancelled=false;
    // 1. Caché estático (nubox-resumen-cache.json) — fuente de verdad
    fetch("/nubox-resumen-cache.json")
      .then(r=>r.json())
      .then(d=>{
        if(!cancelled&&d.clientes&&d.clientes.length>0){
          setResumenData(d.clientes);
        }
      })
      .catch(()=>{
        // 2. API solo si el caché estático falla
        fetch("/api/historial?resumen=1")
          .then(r=>r.json())
          .then(d=>{if(!cancelled&&d.clientes&&d.clientes.length>0)setResumenData(d.clientes);})
          .catch(()=>{});
      });
    // Mapa RazonSocial→RUT (siempre)
    fetch("/api/historial?rutMap=1")
      .then(r=>r.json())
      .then(d=>{if(!cancelled)setRutMapDTE(d.ruts||{});})
      .catch(()=>{});
    return ()=>{cancelled=true;};
  },[]);

  /* Clave única por fila de planilla: sitio + edificio (ej: 'A-2|T. Of. 44') */
  const siteKey=sc=>`${sc.sitio}${sc.edificio?'|'+sc.edificio:''}`;

  /* Al seleccionar cliente: descubrir períodos y cargar en paralelo por sitio */
  useEffect(()=>{
    if(!selClient){setPeriodsAvail([]);setInvoicesMap({});setLoadingSet(new Set([]));return;}
    setPeriodsAvail([]);setInvoicesMap({});
    const doRefresh=refreshFlag.current;  // capturar antes de reset
    refreshFlag.current=false;
    let cancelled=false; // evita que fetches de cliente anterior contaminen el nuevo
    fetch("/api/historial?listPeriodos=1")
      .then(r=>r.json())
      .then(({periodos=[]})=>{
        if(cancelled) return;
        setPeriodsAvail(periodos);
        /* loadingSet: "sitio|periodo" para rastrear cada fetch independiente */
        const ls=new Set();
        selGroup.forEach(sc=>periodos.slice(0,10).forEach(p=>ls.add(siteKey(sc)+'|'+p)));
        setLoadingSet(ls);
        /* Fetch paralelo por sitio × período — pasa ufArr, ufSrv y siteIdx para que la API elija la factura correcta.
           siteIdx permite desempatar cuando varios sitios del mismo cliente tienen igual UF (ej: NCH Chile enero). */
        selGroup.forEach((sc,siteIdx)=>{
          periodos.slice(0,10).forEach(p=>{
            const [pMes,pAnio]=p.split(" ");
            const pNum=MES_NUM[pMes];
            const pKey2=pAnio&&pNum?`${pAnio}-${String(pNum).padStart(2,"0")}`:null;
            /* Verificar localStorage batch antes de llamar al API */
            if(!doRefresh&&pKey2){
              try{
                const stored=localStorage.getItem(`histBatch:${pKey2}`);
                if(stored){
                  const batch=JSON.parse(stored);
                  const nr=r=>((r||"").replace(/\./g,"").replace(/-/g,"").toLowerCase());
                  const entry=batch.sitios?.find(s=>nr(s.rut)===nr(sc.rut||"")&&s.sitio===(sc.sitio||"")&&(s.edificio||"")===(sc.edificio||""));
                  if(entry&&entry.estado!=="pendiente"&&Object.keys(entry.facturas||{}).length>0){
                    if(!cancelled){
                      setInvoicesMap(prev=>({...prev,[siteKey(sc)]:{...(prev[siteKey(sc)]||{}),[p]:entry.facturas}}));
                      setLoadingSet(prev=>{const s=new Set(prev);s.delete(siteKey(sc)+'|'+p);return s;});
                    }
                    return;
                  }
                }
              }catch(_){}
            }
            const histE2=pKey2?sc.hist?.find(h=>h.key===pKey2):null;
            const pufArr2=histE2?.uf>0?histE2.uf:sc.ufArr;
            const pufSrv2=histE2?.uf>0&&sc.ufArr>0&&sc.ufSrv>0
              ?Math.round(sc.ufSrv*(histE2.uf/sc.ufArr)*10000)/10000:sc.ufSrv;
            const url=`/api/historial?cliente=${encodeURIComponent(sc.nombre)}&rut=${encodeURIComponent(sc.rut||"")}`
              +`&ufArr=${encodeURIComponent(pufArr2||"")}&ufSrv=${encodeURIComponent(pufSrv2||"")}`
              +`&siteIdx=${siteIdx}&sitio=${encodeURIComponent(sc.sitio||"")}`
              +`&periodo=${encodeURIComponent(p)}`
              +(doRefresh?"&refresh=1":"");
            fetch(url)
              .then(r=>r.json())
              .then(({facturas,source})=>{
                if(cancelled) return;
                if(facturas){
                  setInvoicesMap(prev=>({...prev,[siteKey(sc)]:{...(prev[siteKey(sc)]||{}),[p]:facturas}}));
                  /* Si vino de FUENTE 0 (excel), actualizar localStorage para que próxima carga sea correcta */
                  if(source==="excel"&&pKey2){
                    try{
                      const stored=localStorage.getItem(`histBatch:${pKey2}`);
                      const batch=stored?JSON.parse(stored):{sitios:[]};
                      const nr=r=>((r||"").replace(/\./g,"").replace(/-/g,"").toLowerCase());
                      const idx=batch.sitios?.findIndex(s=>nr(s.rut)===nr(sc.rut||"")&&s.sitio===(sc.sitio||"")&&(s.edificio||"")===(sc.edificio||""));
                      const entry={rut:sc.rut,sitio:sc.sitio||"",edificio:sc.edificio||"",estado:"ok",facturas};
                      if(idx>=0) batch.sitios[idx]=entry; else batch.sitios=(batch.sitios||[]).concat(entry);
                      localStorage.setItem(`histBatch:${pKey2}`,JSON.stringify(batch));
                    }catch(_){}
                  }
                }
                setLoadingSet(prev=>{const s=new Set(prev);s.delete(siteKey(sc)+'|'+p);return s;});
              })
              .catch(()=>{if(!cancelled)setLoadingSet(prev=>{const s=new Set(prev);s.delete(siteKey(sc)+'|'+p);return s;});});
          });
        });
      })
      .catch(()=>{if(!cancelled){setPeriodsAvail([]);setLoadingSet(new Set());}});
    return ()=>{cancelled=true;};
  },[selClient,refreshTrigger]);

  const clients=dashData
    ?(()=>{const seen=new Set();return [...dashData.clients].sort((a,b)=>(a.ri||0)-(b.ri||0)).filter(c=>{const k=c.nombre+"|"+c.sitio;if(seen.has(k))return false;seen.add(k);return true;});})()
    :[];

  /* Búsqueda por nombre, correo y RUT (para detalle y modal historial) */
  const filtered=clients.filter(c=>{
    if(!search) return true;
    const q=search.toLowerCase();
    const rutNorm=(c.rut||"").replace(/\./g,"").toLowerCase();
    return c.nombre.toLowerCase().includes(q)||
      (c.email||"").toLowerCase().includes(q)||
      rutNorm.includes(q.replace(/\./g,""));
  });

  /* Columnas de meses para tabla resumen (más reciente primero) */
  const MESES_RESUMEN=["Enero 2026","Febrero 2026","Marzo 2026","Abril 2026","Mayo 2026","Junio 2026","Julio 2026"];
  const MESES_LABELS=["Ene","Feb","Mar","Abr","May","Jun","Jul"];

  /* Mapa stripNombre→RUT: prioridad 1=DTE directo, prioridad 2=planilla */
  const rutMap=React.useMemo(()=>{
    const stripN=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
    const m={};
    // Fuente 2: planilla (nombres pueden diferir del DTE)
    if(dashData){
      dashData.clients.forEach(c=>{if(c.rut&&!m[stripN(c.nombre)])m[stripN(c.nombre)]=c.rut;});
    }
    // Fuente 1: mapa exacto RazonSocial→RUT desde ZIPs DTE (sobreescribe planilla si coincide)
    Object.entries(rutMapDTE).forEach(([nombre,rut])=>{if(rut)m[stripN(nombre)]=rut;});
    return m;
  },[dashData,rutMapDTE]);

  /* Función strip para matching de nombres */
  const stripNombre=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");

  /* Filtrado y ordenamiento tabla resumen */
  const filteredResumen=React.useMemo(()=>{
    const arr=(resumenData||[]).filter(c=>{
      if(!search)return true;
      const q=search.toLowerCase();
      const rut=(rutMap[stripNombre(c.nombre)]||"").replace(/\./g,"").toLowerCase();
      return c.nombre.toLowerCase().includes(q)||rut.includes(q.replace(/\./g,""));
    });
    arr.sort((a,b)=>{
      let va,vb;
      if(sortCol==="rut"){
        va=(rutMap[stripNombre(a.nombre)]||"zzz").replace(/\./g,"");
        vb=(rutMap[stripNombre(b.nombre)]||"zzz").replace(/\./g,"");
        // Ordenar numéricamente por la parte antes del guión
        const na=parseInt((va.split("-")[0]||"0").replace(/\D/g,""))||0;
        const nb=parseInt((vb.split("-")[0]||"0").replace(/\D/g,""))||0;
        va=na; vb=nb;
      } else if(sortCol==="nombre"){
        va=a.nombre.toLowerCase(); vb=b.nombre.toLowerCase();
      } else {
        va=a.total; vb=b.total;
      }
      if(va<vb)return sortDir==="asc"?-1:1;
      if(va>vb)return sortDir==="asc"?1:-1;
      return 0;
    });
    return arr;
  },[resumenData,search,rutMap,sortCol,sortDir]);

  const toggleSort=col=>{
    if(sortCol===col)setSortDir(d=>d==="asc"?"desc":"asc");
    else{setSortCol(col);setSortDir(col==="nombre"?"asc":"desc");}
  };
  const sortArrow=col=>sortCol===col?(sortDir==="asc"?"↑":"↓"):"↕";

  const totalesResumen=React.useMemo(()=>{
    const tots={meses:{},total:0,enPlanilla:0,sinPlanilla:0};
    for(const c of filteredResumen){
      for(const[mes,val]of Object.entries(c.meses||{})){
        tots.meses[mes]=(tots.meses[mes]||0)+val;
      }
      tots.total+=(c.total||0);
      const inP=dashData&&dashData.clients.some(cl=>stripNombre(cl.nombre)===stripNombre(c.nombre));
      if(inP)tots.enPlanilla++;else tots.sinPlanilla++;
    }
    return tots;
  },[filteredResumen,dashData]);

  const previewFact=async(fNum,periodo)=>{
    if(pdfLoading)return;
    setPdfLoading(true);
    try{
      const MN={Enero:"01",Febrero:"02",Marzo:"03",Abril:"04",Mayo:"05",Junio:"06",
               Julio:"07",Agosto:"08",Septiembre:"09",Octubre:"10",Noviembre:"11",Diciembre:"12"};
      const numPart=(fNum||"").replace(/^F(?:EE)?-/i,"");
      const[mes,anio]=(periodo||"").split(" ");
      const mesNum=MN[mes];
      const pCode=mesNum?`${anio}-${mesNum}`:"";
      const url=`/api/drive-pdf?folio=${encodeURIComponent(numPart)}${pCode?`&periodo=${pCode}`:""}`;
      setPdfPrev({url,factNum:fNum,periodo,nombre:fNum});
    }catch(e){notify("Error: "+e.message,"err");}
    setPdfLoading(false);
  };
  const closePrev=()=>{setPdfPrev(null);};

  const conceptos=["arriendo","servAdm","habilitacion","servMant","servCont","asesoria"];
  const cLabel={arriendo:"Arriendo",servAdm:"Serv. Admin.",habilitacion:"Habilitación",servMant:"Serv. Mant.",servCont:"Serv. Contables",asesoria:"Asesoría Proyecto"};
  const cColor={arriendo:"var(--blue)",servAdm:"var(--amber)",habilitacion:"var(--green)",servMant:"var(--accl)",servCont:"#7c5cbf",asesoria:"#2a9d8f"};

  const totalLoading=loadingSet.size;
  const totalPeriods=periodsAvail.length*selGroup.length;

  return h("main",{style:{flex:1,minHeight:0,overflowY:"auto",padding:"18px 22px",display:"flex",flexDirection:"column",gap:16},className:"fade-up"},

    h("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",flexShrink:0}},
      h("div",{style:{fontSize:13,fontWeight:600,color:"var(--txm)",whiteSpace:"nowrap"}},
        "Nubox",
        h("span",{style:{color:"var(--bdr)",margin:"0 6px"}},"|"),
        h("span",{style:{fontWeight:400}},"Factura Electrónica")
      ),
      selClient&&h("button",{onClick:()=>setSelGroup([]),
        style:{fontSize:11,padding:"4px 12px",borderRadius:7,border:"1px solid var(--bdr)",background:"var(--surf2)",color:"var(--txm)",cursor:"pointer"}
      },"◀ Todos"),
      selClient&&h("div",{style:{fontSize:15,fontWeight:700,color:"var(--tx)"}},
        "📂 "+selClient.nombre
      ),
      selClient&&totalLoading>0&&h("div",{style:{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--txm)"}},
        h("span",{className:"spin"},"⟳"),
        `Consultando ${totalLoading}/${totalPeriods} períodos...`
      ),
      selClient&&totalLoading===0&&h("button",{
        onClick:()=>{refreshFlag.current=true;setRefreshTrigger(n=>n+1);},
        title:"Volver a consultar desde PDF — corrige datos incorrectos",
        style:{marginLeft:"auto",fontSize:11,padding:"4px 10px",borderRadius:7,border:"1px solid var(--bdr)",
          background:"var(--surf2)",color:"var(--txm)",cursor:"pointer",display:"flex",alignItems:"center",gap:4}
      },h("span",null,"⟳")," Refrescar"),
      !selClient&&h("input",{value:search,onChange:e=>setSearch(e.target.value),
        placeholder:"Buscar cliente o RUT...",style:{marginLeft:"auto",width:200}})
    ),

    !selClient&&h("div",{style:{fontSize:11,color:"var(--txm)",paddingLeft:2,flexShrink:0}},
      "🔄 Se actualiza cada lunes a las 8:00 AM"
    ),

    !selClient&&h("div",{style:{background:"var(--surf)",border:"1px solid var(--bdr)",borderRadius:12,overflow:"hidden",overflowX:"auto",flexShrink:0}},
      h("div",{style:{display:"grid",gridTemplateColumns:"120px 1fr 100px 100px 100px 100px 100px 100px 100px 130px",
        padding:"8px 14px",borderBottom:"1px solid var(--bdr)",background:"var(--surf2)",
        fontSize:10,fontWeight:700,color:"var(--txm)",letterSpacing:".06em",minWidth:1100}},
        h("div",{onClick:()=>toggleSort("rut"),style:{cursor:"pointer",userSelect:"none"}},
          "RUT ",h("span",{style:{opacity:.5,fontSize:9}},sortArrow("rut"))),
        h("div",{onClick:()=>toggleSort("nombre"),style:{cursor:"pointer",userSelect:"none"}},
          "CLIENTE ",h("span",{style:{opacity:.5,fontSize:9}},sortArrow("nombre"))),
        ...MESES_LABELS.map(m=>h("div",{key:m,style:{textAlign:"right"}},m)),
        h("div",{onClick:()=>toggleSort("total"),style:{textAlign:"right",cursor:"pointer",userSelect:"none"}},
          "TOTAL 2026 ",h("span",{style:{opacity:.5,fontSize:9}},sortArrow("total")))
      ),
      resumenData!==null&&filteredResumen.length>0&&h("div",{style:{
        display:"grid",gridTemplateColumns:"120px 1fr 100px 100px 100px 100px 100px 100px 100px 130px",
        padding:"9px 14px",borderBottom:"2px solid var(--bdr)",
        background:"#ddeaf8",fontSize:11,fontWeight:800,
        color:"var(--tx)",minWidth:1100}},
        h("div",null,""),
        h("div",{style:{fontSize:10,letterSpacing:".04em",color:"var(--txm)"}},
          "TOTAL ",h("span",{style:{fontWeight:900}},filteredResumen.length),
          " = ",
          h("span",{style:{color:"var(--green)"}},totalesResumen.enPlanilla," Planilla"),
          totalesResumen.sinPlanilla>0&&h("span",null,
            " + ",h("span",{style:{color:"var(--amber)"}},totalesResumen.sinPlanilla," No incluidos")
          )
        ),
        ...MESES_RESUMEN.map(mes=>h("div",{key:mes,style:{textAlign:"right",color:"var(--accl)"}},
          "$"+Math.round(totalesResumen.meses[mes]||0).toLocaleString("es-CL")
        )),
        h("div",{style:{textAlign:"right",color:"var(--accl)"}},
          "$"+Math.round(totalesResumen.total).toLocaleString("es-CL"))
      ),
      resumenData===null
        ?h("div",{style:{padding:"32px",textAlign:"center",color:"var(--txm)",fontSize:13}},
            h("span",{className:"spin",style:{fontSize:18,marginRight:8}},"⟳"),"Cargando...")
        :filteredResumen.length===0
        ?h("div",{style:{padding:"32px",textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin resultados")
        :h("div",{style:{maxHeight:"calc(100vh - 260px)",overflowY:"auto"}},
          filteredResumen.map(c=>{
            const rut=rutMap[stripNombre(c.nombre)]||"—";
            const canClick=true;
            return h("div",{key:c.nombre,
              onClick:()=>{
                const cStrip=stripNombre(c.nombre);
                const seen=new Set();
                const grp=dashData?dashData.clients.filter(cl=>{
                  if(stripNombre(cl.nombre)!==cStrip)return false;
                  const k=(cl.sitio||'')+'|'+(cl.edificio||'');
                  if(seen.has(k))return false;
                  seen.add(k);return true;
                }):[];
                if(grp.length)setSelGroup(grp);
                else setSelGroup([{nombre:c.nombre,rut:rut!=="—"?rut:"",sitio:"—",edificio:"",ufArr:0,ufSrv:0,_sinPlanilla:true}]);
              },
              style:{display:"grid",gridTemplateColumns:"120px 1fr 100px 100px 100px 100px 100px 100px 100px 130px",
                padding:"10px 14px",borderBottom:"1px solid var(--bdr)",minWidth:1100,
                cursor:canClick?"pointer":"default",transition:"background .1s"}
            },
              h("div",{style:{fontFamily:"'DM Mono',monospace",fontSize:10,color:"var(--txd)",alignSelf:"center",whiteSpace:"nowrap"}},rut),
              h("div",{style:{alignSelf:"center"}},
                h("div",{style:{fontWeight:600,fontSize:12,lineHeight:1.4}},c.nombre)
              ),
              ...MESES_RESUMEN.map(p=>{
                const v=c.meses[p]||0;
                return h("div",{key:p,style:{textAlign:"right",fontFamily:"'DM Mono',monospace",
                  fontSize:10,alignSelf:"center",color:v>0?"var(--tx)":"var(--txd)",opacity:v>0?1:.4}},
                  v>0?("$"+Math.round(v).toLocaleString("es-CL")):"—");
              }),
              h("div",{style:{textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:11,
                fontWeight:700,color:"var(--blue)",alignSelf:"center",whiteSpace:"nowrap"}},
                "$"+c.total.toLocaleString("es-CL"))
            );
          })
        )
    ),

    ...selGroup.map(sc=>{
      const siteInv=invoicesMap[siteKey(sc)]||{};
      const siteLd=new Set([...loadingSet].filter(k=>k.startsWith(siteKey(sc)+'|')));
      const periodos=periodsAvail.filter(p=>siteLd.has(siteKey(sc)+'|'+p)||siteInv[p]);
      const granTotal=Object.values(siteInv).reduce((s,pd)=>s+conceptos.reduce((s2,c)=>s2+(pd[c]?.total||0),0),0);
      /* Restar NCs del cliente (sólo en el primer sitio del grupo para no duplicar) */
      const _stripNx=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
      const _ncEntry=window._NC_STATIC&&Object.entries(window._NC_STATIC).find(([n])=>_stripNx(n)===_stripNx(sc.nombre));
      const _ncClientTotal=_ncEntry?Object.values(_ncEntry[1]).flat().reduce((s,nc)=>s+nc.total,0):0;
      const granTotalNet=granTotal+(selGroup.indexOf(sc)===0?_ncClientTotal:0);
      const granTotalStr=granTotalNet>0?"$"+granTotalNet.toLocaleString("es-CL"):null;
      return h("div",{key:siteKey(sc),style:{background:"var(--surf)",border:"1px solid var(--bdr)",borderRadius:12,overflow:"hidden",flexShrink:0}},
        h("div",{style:{padding:"12px 16px",background:"var(--surf2)",borderBottom:"1px solid var(--bdr)",
          display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
          h("span",{style:{padding:"3px 9px",borderRadius:8,fontSize:10,fontWeight:700,
            background:`${(SITIO_C[sc.sitio]||"#888")}18`,color:SITIO_C[sc.sitio]||"#888",
            border:`1px solid ${(SITIO_C[sc.sitio]||"#888")}40`}},sc.sitio),
          sc.edificio&&h("span",{style:{fontSize:10,color:"var(--txm)",fontFamily:"'DM Mono',monospace"}},sc.edificio),
          h("span",{style:{fontWeight:700,fontSize:13}},sc.nombre),
          sc.rut&&h("span",{style:{fontSize:10,color:"var(--txd)",fontFamily:"'DM Mono',monospace"}},sc.rut),
          granTotalStr&&h("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-start",marginLeft:18,paddingLeft:18,borderLeft:"1px solid var(--bdr)"}},
            h("span",{style:{fontSize:9,fontWeight:600,color:"var(--txm)",letterSpacing:".06em",textTransform:"uppercase"}},
              siteLd.size>0?"Total parcial":"Total acumulado"),
            h("span",{style:{fontSize:13,fontWeight:700,fontFamily:"'DM Mono',monospace",color:"var(--tx)"}},
              granTotalStr)
          ),
          sc.email&&h("span",{style:{marginLeft:"auto",fontSize:10,color:"var(--txm)",fontFamily:"'DM Mono',monospace"}},sc.email)

function HistorialPanel(){return null;}
function _HistorialPanel_REMOVED({files,data,pdfMap,filesZip,periodo,getToken,notify,clientId}){
  const MESES_N=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const anio=new Date().getFullYear();
  const[loading,setLoading]=useState(false);
  const[historial,setHistorial]=useState(null);      /* {historial,mesesOrden} */
  const[mapping,setMapping]=useState({});            /* periodo→{cliente→{arriendo,servAdm}} */
  const[cliente,setCliente]=useState("");
  const[zipList,setZipList]=useState(null);          /* archivos en DRIVE_PDF_FACTURAS_ID */
  const[habList,setHabList]=useState(null);          /* archivos en carpeta habilitaciones */
  const[loadingMes,setLoadingMes]=useState(null);
  const[loadedZips,setLoadedZips]=useState({});      /* mes→JSZip object */
  const[preview,setPreview]=useState(null);          /* {url,nombre} */
  const[pdfLoading,setPdfLoading]=useState(false);   /* cargando PDF desde Drive */
  const[sending,setSending]=useState(null);

  const HAB_FOLDER="1O1nBsti_reAKnAXXKdL2opNWz1ocZu8u";

  /* Cargar planilla y mapping al montar / cambiar planilla */
  useEffect(()=>{
    if(!files?.planilla)return;
    setLoading(true);
    Promise.all([
      leerHistorialAnio(files.planilla,anio),
      fetch(`/api/historial?anio=${anio}`).then(r=>r.json()).catch(()=>({})),
    ]).then(([hist,map])=>{setHistorial(hist);setMapping(map);setLoading(false);})
    .catch(e=>{notify("Error cargando historial: "+e.message,"err");setLoading(false);});
  },[files?.planilla]);

  /* Listar ZIPs de Drive y habilitaciones */
  useEffect(()=>{
    fetch(`/api/historial?ls=${DRIVE_PDF_FACTURAS_ID}`).then(r=>r.json()).then(d=>setZipList(d.files||[])).catch(()=>setZipList([]));
    fetch(`/api/historial?ls=${HAB_FOLDER}`).then(r=>r.json()).then(d=>setHabList(d.files||[])).catch(()=>setHabList([]));
  },[]);

  /* Descargar ZIP de un mes y cachearlo */
  const cargarZipMes=useCallback(async(mes)=>{
    if(loadedZips[mes])return loadedZips[mes];
    if(!zipList)return null;
    const zipFile=zipList.find(f=>f.name.toLowerCase().includes(mes.toLowerCase())&&f.name.includes(String(anio)));
    if(!zipFile){notify(`No se encontró ZIP para ${mes} ${anio}`,"warn");return null;}
    setLoadingMes(mes);
    try{
      const r=await fetch(`/api/historial?fileId=${zipFile.id}`);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const buf=await r.arrayBuffer();
      const zip=await JSZip.loadAsync(buf);
      setLoadedZips(p=>({...p,[mes]:zip}));
      setLoadingMes(null);
      return zip;
    }catch(e){notify("Error descargando ZIP: "+e.message,"err");setLoadingMes(null);return null;}
  },[zipList,loadedZips,anio]);

  /* Abrir preview de un PDF */
  const verPdf=useCallback(async(facturaNum,mes,blob)=>{
    setPdfLoading(true);
    try{
      if(blob){/* habilitacion: ya tiene blob */
        const url=URL.createObjectURL(blob);
        setPreview({url,nombre:blob.name||facturaNum});return;
      }
      /* Primero buscar en sesión actual */
      if(pdfMap[facturaNum]&&filesZip){
        try{
          const z=await JSZip.loadAsync(await filesZip.arrayBuffer());
          const _re1=new RegExp("(?<![0-9])"+facturaNum.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![0-9])");const entry=Object.values(z.files).find(f=>_re1.test(f.name)&&!f.dir);
          if(entry){const d=await entry.async("uint8array");const b=new Blob([d],{type:"application/pdf"});setPreview({url:URL.createObjectURL(b),nombre:`${facturaNum}.pdf`});return;}
        }catch(e){}
      }
      /* Cargar desde Drive */
      const zip=await cargarZipMes(mes);if(!zip)return;
      const _re2=new RegExp("(?<![0-9])"+facturaNum.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![0-9])");const entry=Object.values(zip.files).find(f=>_re2.test(f.name)&&f.name.endsWith(".pdf")&&!f.dir);
      if(!entry){notify(`PDF ${facturaNum} no encontrado en ZIP de ${mes}`,"warn");return;}
      const d=await entry.async("uint8array");
      setPreview({url:URL.createObjectURL(new Blob([d],{type:"application/pdf"})),nombre:`${facturaNum}.pdf`});
    }finally{setPdfLoading(false);}
  },[pdfMap,filesZip,cargarZipMes]);

  /* Reenviar email de un mes */
  const reenviar=useCallback(async(mes)=>{
    if(!historial||!cliente)return;
    const mesData=historial.historial[cliente]?.meses[mes];if(!mesData)return;
    const correo=historial.historial[cliente].correo;if(!correo){notify("Sin correo para este cliente","warn");return;}
    setSending(mes);
    try{
      const token=await getToken();
      const mesMapping=mapping[`${mes} ${anio}`]?.[cliente]||{};
      const concepto=mesData.ufArriendo?"Arriendo":"Serv. Administrativo";
      const subject=`Reenvío Factura(s) ${mes} ${anio} — ${cliente} — Patagónica Inmobiliaria SpA`;
      const htmlBody=buildEmailHtml(cliente,concepto,`${mes} ${anio}`,mesData.ufArriendo||mesData.ufServAdm,mesMapping.arriendo||mesMapping.servAdm,null);
      /* Intentar adjuntar PDF si hay número de factura */
      let pdfB64=null,pdfNombre=null;
      const facNum=mesMapping.arriendo||mesMapping.servAdm;
      if(facNum){
        try{
          let zip=loadedZips[mes]||(filesZip&&periodo===`${mes} ${anio}`?await JSZip.loadAsync(await filesZip.arrayBuffer()):null);
          if(!zip)zip=await cargarZipMes(mes);
          if(zip){
            const _re3=new RegExp("(?<![0-9])"+facNum.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![0-9])");const entry=Object.values(zip.files).find(f=>_re3.test(f.name)&&!f.dir);
            if(entry){const d=await entry.async("uint8array");pdfB64=btoa(String.fromCharCode(...d));pdfNombre=`${facNum}.pdf`;}
          }
        }catch(e){console.warn("adjuntar PDF:",e.message);}
      }
      await sendGmail(token,correo,CCO,REMITENTE,subject,htmlBody,pdfB64,pdfNombre);
      notify(`✓ Correo reenviado a ${correo}`+(pdfNombre?` con ${pdfNombre}`:""),"ok");
    }catch(e){notify("Error reenvío: "+e.message,"err");}
    setSending(null);
  },[historial,cliente,mapping,getToken,filesZip,loadedZips,periodo,cargarZipMes,anio]);

  /* ── Render ── */
  if(!files?.planilla)return h("div",{style:{padding:32,textAlign:"center",color:"var(--txm)"}},
    h("div",{style:{fontSize:32,marginBottom:8}},"📂"),
    h("div",null,"Carga la Planilla primero desde el menú Facturación."));

  if(loading)return h("div",{style:{padding:32,textAlign:"center",color:"var(--txm)"}},"Cargando historial...");

  const clientesList=historial?Object.keys(historial.historial).filter(c=>Object.keys(historial.historial[c].meses).length>0).sort():[];

function SplitTimer({loading}){
  const [elapsed,setElapsed]=React.useState(0);
  React.useEffect(()=>{
    if(!loading){setElapsed(0);return;}
    setElapsed(0);
    const t=setInterval(()=>setElapsed(s=>s+1),1000);
    return()=>clearInterval(t);
  },[loading]);
  if(!loading||elapsed===0)return null;
  return h("span",{style:{fontSize:10,color:"var(--txd)",fontFamily:"'DM Mono',monospace"}},
    `⏱ ${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,"0")} transcurridos`
  );
}

  },[]);
  const [pwdError,setPwdError]=useState(false);

  const [syncStatus,setSyncStatus]=useState(null); /* {done,total,error} | null */

  const [dashData,setDashData]=useState(null);

  const [ufActual,setUfActual]=useState(null);
  const [ufLoading,setUfLoading]=useState(false);
  const [monthlyUF,setMonthlyUF]=useState({});
  const [driveLoading,setDriveLoading]=useState(false);

  /* Validar que la planilla tenga datos para el período seleccionado */
  useEffect(()=>{
    if(!files.planilla||!periodo){setPlanillaStatus("idle");return;}
    setPlanillaStatus("checking");
    setPlanillaError(null);
    procesarPlanillaFacturacion(files.planilla,periodo)
      .then(()=>setPlanillaStatus("ok"))
      .catch(e=>{
        if(e.message&&e.message.includes("No se encontró columna")){
          setPlanillaStatus("nodata");
          setPlanillaError("Sin datos para "+periodo);
        } else {
          setPlanillaStatus("error");
          setPlanillaError(e.message);
        }
      });
  },[files.planilla,periodo]);

  /* Cargar planilla automáticamente desde /api/planilla (Service Account — sin OAuth) */
  useEffect(()=>{
    if(files.planilla)return;
    setDriveLoading(true);
    fetch("/api/planilla")
      .then(r=>{
        if(!r.ok)return r.json().then(e=>{throw new Error(e.error||"Error "+r.status);});
        return r.blob();
      })
      .then(blob=>{
        const f=new File([blob],"Planilla Facturación.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        setFiles(p=>({...p,planilla:f}));
        setDriveLoading(false);
      })
      .catch(e=>{
        console.error("Planilla error:",e);
        setDriveLoading(false);
        notify("No se pudo cargar la planilla: "+e.message,"err");
      });
  },[files.planilla]);

  const notify=(msg,t="ok")=>{setNotif({msg,t});setTimeout(()=>setNotif(null),4000);};
  const addLog=(txt,t="")=>setProcLogs(p=>[...p,{txt,t}]);

  /* Cargar ZIP desde Drive cuando cambia período y estamos en vista facturación */
  const [zipStatus,setZipStatus]=useState("idle");
  const [zipError,setZipError]=useState(null);
  const [pdfMaestroId,setPdfMaestroId]=useState(null); /* ID del PDF maestro en Drive si existe */
  const [canGenerate,setCanGenerate]=useState(false);  /* si se puede generar el ZIP */
  const zipPeriodoRef=React.useRef(""); /* período del ZIP actualmente cargado */

  /* Buscar ZIP cuando se selecciona un período */
  const buscarZip=React.useCallback((p)=>{
    if(!p)return;
    zipPeriodoRef.current=p;
    setZipStatus("loading");
    setZipError(null);
    setPdfMaestroId(null);
    setCanGenerate(false);
    setFiles(prev=>({...prev,zip:null}));
    fetch("/api/storage?periodo="+encodeURIComponent(p))
      .then(async r=>{
        if(zipPeriodoRef.current!==p)return;
        if(r.status===404){
          const data=await r.json();
          /* El servidor informa si hay PDF maestro disponible */
          setPdfMaestroId(data.pdfMaestroId||null);
          setCanGenerate(!!data.canGenerate);
          setZipStatus("missing");
          return;
        }
        if(!r.ok){const e=await r.json();throw new Error(e.error||"Error "+r.status);}
        const blob=await r.blob();
        if(zipPeriodoRef.current!==p)return;
        const f=new File([blob],p.replace(" ","-")+".zip",{type:"application/zip"});
        setFiles(prev=>({...prev,zip:f}));
        setZipStatus("ready");
      })
      .catch(e=>{
        if(zipPeriodoRef.current!==p)return;
        setZipStatus("error");setZipError(e.message);
      });
  },[]);

  const cargarZipDrive=React.useCallback(()=>buscarZip(periodo),[periodo,buscarZip]);

  /* Generar ZIP desde PDF maestro del mes */
  const generarZip=React.useCallback(async()=>{
    if(!periodo||!pdfMaestroId)return;
    setZipStatus("splitting");setZipError(null);
    const [mesNombre,anio]=periodo.split(" ");
    const mesNum=String(MES_NUM[mesNombre]||0).padStart(2,"0");
    const periodoCode=anio+"-"+mesNum;
    try{
      /* 1. Servidor separa el PDF y sube ZIP directo a Drive */
      const uTok=await getToken();
      const res=await fetch("/api/split-pdf",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({pdfFileId:pdfMaestroId,periodo:periodoCode,destFolderId:DRIVE_FACTURACION_FOLDER_ID,userToken:uTok}),
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||"Error desconocido");
      notify("✓ "+data.totalFacturas+" facturas generadas y subidas a Drive","ok");
      /* 2. Recargar ZIP desde Drive */
      buscarZip(periodo);
    }catch(e){
      setZipStatus("error");setZipError(e.message);
      notify("Error al separar PDF: "+e.message,"err");
    }
  },[periodo,pdfMaestroId]);

  /* No auto-generar — usuario decide cuándo generar */

  /* Refs de control de flujo automático */
  const autoProcesado=React.useRef(false);
  const autoNuboxRef=React.useRef(false);
  const periodoActivado=React.useRef(false);  /* true solo cuando el usuario elige período */
  useEffect(()=>{
    autoProcesado.current=false;
    autoNuboxRef.current=false;
    /* No reseteamos periodoActivado aquí — se resetea solo al cambiar período desde el selector */
  },[periodo]);
  /* Resetear periodoActivado al salir de facturación para evitar auto-ejecución al volver */
  useEffect(()=>{
    if(view!=="upload"&&view!=="table"){
      periodoActivado.current=false;
      autoProcesado.current=false;
      autoNuboxRef.current=false;
    }
  },[view]);

  /* Auto-procesar cuando planilla OK + ZIP listo — solo si el usuario activó el período */
  useEffect(()=>{
    if(periodoActivado.current&&planillaStatus==="ok"&&zipStatus==="ready"&&!autoProcesado.current&&(data.length===0||soloPlanilla)){
      autoProcesado.current=true;
      setSoloPlanilla(false);
      procesar();
    }
  },[planillaStatus,zipStatus,soloPlanilla]);

  /* Auto-descargar desde Nubox cuando no hay PDF — solo si el usuario activó el período */
  useEffect(()=>{
    if(periodoActivado.current&&planillaStatus==="ok"&&zipStatus==="missing"&&!splitLoading&&!autoNuboxRef.current){
      autoNuboxRef.current=true;
      splitPDF();
    }
  },[planillaStatus,zipStatus,canGenerate]);

  /* Auto-cargar desde planilla cuando hay datos disponibles y no hay nada en tabla.
   * Dispara en view="upload" (al abrir sección) Y en view="table" al cambiar período
   * (el onChange del selector hace setData([]) y setPeriodo(p); este efecto reacciona). */
  useEffect(()=>{
    if(planillaStatus==="ok"&&data.length===0&&(view==="upload"||view==="table")&&files.planilla&&periodo){
      cargarDesdePlanilla();
    }
  },[planillaStatus,view,periodo]);

  const MES_STR={"Enero":"01","Febrero":"02","Marzo":"03","Abril":"04","Mayo":"05","Junio":"06","Julio":"07","Agosto":"08","Septiembre":"09","Octubre":"10","Noviembre":"11","Diciembre":"12"};
  const splitPDF=async()=>{
    setSplitLoading(true);setSplitResult(null);setSplitStatus("");
    const [mesNombre,anio]=periodo.split(" ");
    const mesNum=MES_STR[mesNombre];
    const mesCode=`${anio}-${mesNum}`;
    const periodoCode=mesCode;
    const pdfNombre=`Facturas_PISA_${mesCode}.pdf`;
    try{
      // 1. Buscar PDF en Drive (via servidor con Service Account)
      setSplitStatus("🔍 Buscando PDF en Drive...");
      const qRes=await fetch(`/api/storage?buscarPdf=${encodeURIComponent(pdfNombre)}&folderId=${DRIVE_FACTURACION_FOLDER_ID}`);
      const qData=await qRes.json();
      let pdfFileId=qData.pdfFileId||null;
      // 2. Si no existe, descargar de Nubox (2-3 min — el timer muestra el progreso)
      if(!pdfFileId){
        setSplitStatus("🔐 Conectando con Nubox... (puede tardar 2-3 min)");
        const nbRes=await fetch("/api/nubox-pdf",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({mes:mesCode,destFolderId:DRIVE_FACTURACION_FOLDER_ID}),
        });
        const nbData=await nbRes.json().catch(()=>({}));
        if(!nbRes.ok)throw new Error("Nubox: "+(nbData.error||"Error desconocido"));
        pdfFileId=nbData.fileId;
        setSplitStatus(`✓ ${nbData.total} facturas descargadas. Separando por cliente...`);
      }else{
        setSplitStatus("✓ PDF encontrado en Drive. Separando por cliente...");
      }
      // 4. Separar PDF por cliente
      const res=await fetch("/api/split-pdf",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({pdfFileId,periodo:periodoCode,destFolderId:DRIVE_FACTURACION_FOLDER_ID,userToken:await getToken().catch(()=>null)}),
      });
      const rawText=await res.text();
      let data;
      try{data=JSON.parse(rawText);}catch(_){throw new Error("split-pdf: error del servidor (HTTP "+res.status+") — intente de nuevo");}
      if(!res.ok)throw new Error(data.error||"Error desconocido");
      setSplitResult(data);
      if(data.zipBase64){
        const bytes=Uint8Array.from(atob(data.zipBase64),c=>c.charCodeAt(0));
        const blob=new Blob([bytes],{type:"application/zip"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url; a.download=data.zipName; a.click();
        URL.revokeObjectURL(url);
      }
      notify("✓ "+data.zipName+" descargado ("+data.totalFacturas+" facturas)","ok");
      autoProcesado.current=false; /* permitir que procesar() corra con el ZIP nuevo */
      buscarZip(periodo);
    }catch(e){
      setSplitResult({error:e.message});
      notify("Error: "+e.message,"err");
    }finally{setSplitLoading(false);}
  };

  const [savingNros,setSavingNros]=React.useState(false);
  const guardarNrosPlanilla=useCallback(async()=>{

      }
      if(filas.length>0){

        /* Descargar ZIP en segundo plano para habilitar previsualización en meses procesados */
        if(zipStatus!=="ready"&&zipStatus!=="loading")buscarZip(periodo);
      }
