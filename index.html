<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Facturación — Patagónica Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--surf:#12151d;--surf2:#1a1e28;--surf3:#222736;
  --bdr:#252a38;--bdr2:#2e354a;
  --tx:#dde2f0;--txm:#6b7494;--txd:#3a4060;
  --green:#34d399;--gdim:#064e3b;--gbg:#022c22;
  --amber:#fbbf24;--adim:#78350f;--abg:#1c1200;
  --red:#f87171;--rdim:#7f1d1d;--rbg:#1a0000;
  --blue:#60a5fa;--bbg:#0d1a2e;
  --acc:#7c3aed;--acc2:#8b5cf6;--accl:#a78bfa;
  --pro:#10b981;
}
html,body,#root{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:4px}
input,select,textarea{font-family:'DM Mono',monospace;background:var(--surf2);border:1px solid var(--bdr);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:12px;outline:none;transition:border 0.2s}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
input::placeholder,textarea::placeholder{color:var(--txd)}
button{font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.15s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.spin{display:inline-block;animation:spin 0.8s linear infinite}
.fade-up{animation:fadeUp 0.35s cubic-bezier(.16,1,.3,1)}
.row-tr{transition:background 0.1s}
.row-tr:hover td{background:var(--surf2)!important}
.pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--bdr);background:transparent;color:var(--txm);cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif}
.pill:hover:not(.active){background:var(--surf2);border-color:var(--bdr2)}
.pill.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-send{background:var(--gbg);border:1px solid var(--gdim);color:var(--green);padding:5px 12px;border-radius:7px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif}
.btn-send:hover{background:#043a2a;border-color:var(--green)}
.btn-dis{background:transparent;border:1px solid var(--bdr);color:var(--txd);padding:5px 12px;border-radius:7px;font-size:11px;opacity:0.4;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--surf);border:1px solid var(--bdr2);border-radius:16px;padding:28px;width:580px;max-width:95vw;animation:fadeUp 0.25s cubic-bezier(.16,1,.3,1)}
.notif{position:fixed;top:20px;right:20px;z-index:200;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;animation:fadeIn 0.2s ease;pointer-events:none;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.tag-arr{background:#1a2535;border:1px solid #2a4a6a;color:#60a5fa;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tag-srv{background:#2a1f0a;border:1px solid #6a4a0a;color:#fbbf24;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.col-gs{background:#1a2535;color:#60a5fa;font-family:'DM Mono',monospace;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.col-gt{background:#2a1f0a;color:#fbbf24;font-family:'DM Mono',monospace;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.key-input{font-family:'DM Mono',monospace;letter-spacing:0.05em;font-size:11px}
.log-line{font-family:'DM Mono',monospace;font-size:11px;line-height:1.8;color:var(--txm)}
.log-line.ok{color:var(--green)}
.log-line.err{color:var(--red)}
.log-line.info{color:var(--blue)}
.progress-bar{height:3px;background:var(--surf3);border-radius:2px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--accl));border-radius:2px;transition:width 0.4s ease}
.test-banner{background:linear-gradient(90deg,#1c1200,#2a1f0a);border-bottom:1px solid var(--adim);padding:8px 24px;font-size:11px;color:var(--amber);display:flex;align-items:center;gap:8px;font-weight:500}
</style>
</head>

/* ── API Claude con MCP ── */
async function callClaude(apiKey, prompt, mcpServers=[]){
  const body={
    model:"claude-sonnet-4-20250514",
    max_tokens:4096,
    messages:[{role:"user",content:prompt}],
  };
  if(mcpServers.length>0) body.mcp_servers=mcpServers;
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-beta":"mcp-client-2025-04-04"},
    body:JSON.stringify(body)
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||"Error API");}
  const data=await res.json();
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

function getEstado(r){
  if(!r.factura||r.ufPdf===null||r.ufPdf===undefined)return"missing";
  if(Math.abs(r.ufPdf-r.ufPlan)>0.5)return"diff";
  return"ok";
}

}

- CCO: ${CCO}
- Cuerpo HTML profesional con saludo, descripción del cobro, monto en UF destacado, mención del PDF adjunto y firma "Área de Administración — Patagónica Inmobiliaria SpA"
${MODO_PRUEBA?"⚠ MODO PRUEBA: todos van a "+TEST_DEST+" (destinatarios reales son los correos originales de cada cliente)":""}
Al finalizar responde: ENVIADOS_OK:N donde N es la cantidad enviada`;
      const res=await callClaude(apiKey,prompt,[{type:"url",url:MCP_GMAIL,name:"google-gmail"}]);
      const match=res.match(/ENVIADOS_OK:(\d+)/);
      const enviados=match?parseInt(match[1]):pend.length;
      pend.forEach(r=>setSentSet(p=>new Set([...p,r.i])));
      notify(`✓ ${enviados} correos enviados${MODO_PRUEBA?" (PRUEBA → "+TEST_DEST+")":""}`);
      // Actualizar Drive en bloque
      callClaude(apiKey,
        `En Google Drive, abre "Detalle_envío_facturas_Inpasa_y_Pisa.xlsx", busca la hoja "${periodo}" y cambia de "NO" a "SI" la columna "Correo Enviado" para estos clientes: ${lista.map(r=>r.cliente+"("+r.concepto+")").join(", ")}. Guarda el archivo.`,
        [{type:"url",url:MCP_DRIVE,name:"google-drive"}]
      ).catch(()=>{});
    }catch(e){
      notify("Error al enviar: "+e.message,"err");
    }
  };

  /* ── RENDER ── */
  if(!apiKey) return h(SetupPanel,{onSave:k=>{setApiKey(k);notify("API key guardada ✓");}});

  const enriched=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
  const stats={
    total:enriched.length,
    ok:enriched.filter(r=>r.estado==="ok").length,
    diff:enriched.filter(r=>r.estado!=="ok").length,
    sent:sentSet.size,
    arr:enriched.filter(r=>r.concepto==="Arriendo").length,
    srv:enriched.filter(r=>r.concepto==="Serv. Adm.").length,
  };
  const filtered=enriched.filter(r=>{
    const mf=filter==="all"||(filter==="ok"&&r.estado==="ok"&&!sentSet.has(r.i))||(filter==="diff"&&r.estado!=="ok")||(filter==="sent"&&sentSet.has(r.i));
    const mc=concFilter==="all"||(concFilter==="arr"&&r.concepto==="Arriendo")||(concFilter==="srv"&&r.concepto==="Serv. Adm.");
    const ms=!search||r.cliente.toLowerCase().includes(search.toLowerCase())||r.sitio.includes(search.toUpperCase());
    return mf&&mc&&ms;
  });

  return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column"}},
    notif&&h("div",{className:"notif",style:{
      background:notif.t==="ok"?"var(--gbg)":notif.t==="err"?"var(--rbg)":"var(--abg)",
      border:`1px solid ${notif.t==="ok"?"var(--gdim)":notif.t==="err"?"var(--rdim)":"var(--adim)"}`,
      color:notif.t==="ok"?"var(--green)":notif.t==="err"?"var(--red)":"var(--amber)"
    }},(notif.t==="ok"?"✓ ":notif.t==="err"?"✗ ":"△ ")+notif.msg),

    showProc&&h(ProcModal,{logs:procLogs,progress:procProgress,done:procDone,onClose:finishProc}),
    preview&&h(EmailModal,{row:preview.row,periodo,onClose:()=>setPreview(null),onConfirm:confirmSend,sending:sendingIdx===preview.idx}),

    MODO_PRUEBA&&h("div",{className:"test-banner"},
      "⚠",h("strong",null,"MODO PRUEBA"),"— correos se envían a",
      h("strong",{style:{marginLeft:4}},TEST_DEST),
      h("span",{style:{marginLeft:"auto",fontSize:10,color:"var(--txd)"}},'Producción: TEST_DEST="" en el código')
    ),

    /* HEADER */
    h("header",{style:{background:"var(--surf)",borderBottom:"1px solid var(--bdr)",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}},
      h("div",{style:{display:"flex",alignItems:"center",gap:14}},
        h("div",{style:{width:32,height:32,background:"linear-gradient(135deg,var(--acc),var(--acc2))",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,color:"#fff",fontWeight:700,flexShrink:0}},"⬡"),
        h("div",null,
          h("div",{style:{fontSize:14,fontWeight:700,letterSpacing:"-0.4px"}},"Patagónica Inmobiliaria"),
          h("div",{style:{fontSize:10,color:"var(--txm)",fontFamily:"'DM Mono',monospace"}},REMITENTE)
        ),
        view==="table"&&h("span",{style:{background:"var(--bbg)",border:"1px solid var(--blue)",color:"var(--blue)",fontSize:10,fontWeight:600,padding:"3px 10px",borderRadius:20,marginLeft:4,fontFamily:"'DM Mono',monospace"}},periodo)
      ),
      h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        view==="table"&&h("select",{value:periodo,onChange:e=>{setPeriodo(e.target.value);setView("idle");setData([]);},style:{fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}},
          PERIODOS.map(p=>h("option",{key:p,value:p},p))),
        view==="table"&&h("button",{onClick:()=>setApiKey(""),
          style:{background:"transparent",border:"1px solid var(--bdr)",color:"var(--txm)",borderRadius:8,padding:"5px 12px",fontSize:11}
        },"🔑 API Key"),
        view==="table"&&h("button",{onClick:runProcess,
          style:{background:"transparent",border:"1px solid var(--bdr)",color:"var(--txm)",borderRadius:8,padding:"6px 14px",fontSize:12}},"⟳ Reprocesar"),
        h("button",{
          onClick:view==="table"?sendAll:runProcess,
          style:{background:view==="table"?MODO_PRUEBA?"var(--abg)":"linear-gradient(135deg,var(--green),#059669)":"linear-gradient(135deg,var(--acc),var(--acc2))",
                 color:view==="table"?MODO_PRUEBA?"var(--amber)":"#022c22":"#fff",
                 border:view==="table"&&MODO_PRUEBA?"1px solid var(--adim)":"none",
                 borderRadius:9,padding:"7px 18px",fontSize:12,fontWeight:700,letterSpacing:"-0.2px"}
        },view==="table"?MODO_PRUEBA?"⚠ Enviar todos (PRUEBA)":"✉ Enviar todos":"▶ Procesar Drive")
      )
    ),

    /* IDLE */
    view==="idle"&&h("main",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:24,padding:40}},
      h("div",{style:{width:72,height:72,background:"linear-gradient(135deg,var(--acc),var(--acc2))",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,boxShadow:"0 0 60px rgba(124,58,237,0.25)"}},"⬡"),
      h("div",{style:{textAlign:"center"}},
        h("h1",{style:{fontSize:22,fontWeight:700,marginBottom:8,letterSpacing:"-0.5px"}},data.length>0?`${data.length} clientes cargados`:"Listo para procesar"),
        h("p",{style:{fontSize:13,color:"var(--txm)",maxWidth:420,lineHeight:1.8}},
          data.length>0?`Período: ${periodo} — presiona "Ver resultados" o "Enviar todos" para continuar.`:
          h("span",null,"Conecta con Drive y procesa la planilla de ",h("strong",{style:{color:"var(--accl)"}},periodo),". Solo se cargan clientes con ",h("strong",{style:{color:"var(--amber)"}},"Correo Enviado = NO"),"."))
      ),
      h("div",{style:{background:"var(--surf)",border:"1px solid var(--bdr2)",borderRadius:14,padding:20,width:"100%",maxWidth:460}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
          h("span",{style:{fontSize:12,fontWeight:600}}),"Período a procesar",
          h("select",{value:periodo,onChange:e=>setPeriodo(e.target.value),style:{fontSize:11,padding:"5px 10px",fontFamily:"'DM Sans',sans-serif"}},
            PERIODOS.map(p=>h("option",{key:p,value:p},p)))
        ),
        [["⊞","Planilla_Facturacion_MM-AAAA.xlsx","Columnas GS (Arriendo) y GT (Serv.Adm.) detectadas por mes"],
         ["⊞","Detalle_envío_facturas_Inpasa_y_Pisa.xlsx","Hoja 'MM-AAAA' · col. 'Correo Enviado' SI/NO"],
         ["⊟","MM-AAAA/ (carpeta PDFs)","subcarpetas 5A · 4A · A2 · A1 · B · D2"]
        ].map(([ic,name,desc],i)=>
          h("div",{key:i,style:{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 0",borderTop:i>0?"1px solid var(--bdr)":"none"}},
            h("span",{style:{color:"var(--accl)",fontSize:16,marginTop:1,flexShrink:0}},ic),
            h("div",null,
              h("div",{style:{fontSize:12,fontFamily:"'DM Mono',monospace",color:"var(--tx)"}}," ",name),
              h("div",{style:{fontSize:11,color:"var(--txd)",marginTop:2}},desc)
            )
          )
        ),
        h("div",{style:{marginTop:14,borderTop:"1px solid var(--bdr)",paddingTop:12,fontFamily:"'DM Mono',monospace",fontSize:11,color:"var(--txm)"}},
          h("div",null,"De:  ",h("span",{style:{color:"var(--accl)"}},REMITENTE)),
          h("div",{style:{marginTop:4}},"CCO: ",h("span",null,CCO)),
          MODO_PRUEBA&&h("div",{style:{marginTop:4,color:"var(--amber)"}},"⚠ Prueba → ",h("strong",null,TEST_DEST))
        )
      ),
      h("div",{style:{display:"flex",gap:10}},
        data.length>0&&h("button",{onClick:()=>{setView("table");},
          style:{background:"var(--surf)",border:"1px solid var(--bdr2)",color:"var(--tx)",borderRadius:10,padding:"11px 24px",fontSize:13,fontWeight:600}
        },"← Ver resultados"),
        h("button",{onClick:runProcess,
          style:{background:"linear-gradient(135deg,var(--acc),var(--acc2))",color:"#fff",border:"none",borderRadius:10,padding:"11px 32px",fontSize:13,fontWeight:700,letterSpacing:"-0.2px",boxShadow:"0 4px 20px rgba(124,58,237,0.3)"}
        },"▶ Procesar Drive")
      )
    ),

    /* TABLE */
    view==="table"&&h("main",{style:{flex:1,display:"flex",flexDirection:"column",overflowX:"hidden"},className:"fade-up"},
      /* MÉTRICAS */
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",borderBottom:"1px solid var(--bdr)"}},
        [{label:"Pendientes",val:stats.total,col:"var(--tx)",sub:"Correo Enviado = NO"},
         {label:"Arriendo",val:stats.arr,col:"var(--blue)",sub:"col. GS"},
         {label:"Serv. Adm.",val:stats.srv,col:"var(--amber)",sub:"col. GT"},
         {label:"Coinciden",val:stats.ok,col:"var(--green)",sub:"listos para enviar"},
         {label:"Enviados",val:stats.sent,col:"var(--accl)",sub:MODO_PRUEBA?"→ "+TEST_DEST:"esta sesión"}]
        .map((m,i)=>h("div",{key:i,style:{background:"var(--surf)",padding:"14px 18px",borderRight:i<4?"1px solid var(--bdr)":"none"}},
          h("div",{style:{fontSize:10,fontWeight:600,color:"var(--txm)",marginBottom:5,letterSpacing:"0.05em"}},m.label.toUpperCase()),
          h("div",{style:{fontSize:26,fontWeight:700,color:m.col,lineHeight:1,fontFamily:"'DM Mono',monospace"}},m.val),
          m.sub&&h("div",{style:{fontSize:10,color:"var(--txd)",marginTop:3}},m.sub)
        ))
      ),
      /* FILTROS */
      h("div",{style:{background:"var(--surf)",borderBottom:"1px solid var(--bdr)",padding:"9px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
        [{k:"all",l:`Todos (${stats.total})`},{k:"ok",l:`Coinciden (${stats.ok})`},{k:"diff",l:`Revisar (${stats.total-stats.ok})`},{k:"sent",l:`Enviados (${stats.sent})`}]
        .map(f=>h("button",{key:f.k,className:`pill${filter===f.k?" active":""}`,onClick:()=>setFilter(f.k)},f.l)),
        h("span",{style:{color:"var(--txd)",fontSize:11,marginLeft:4}},"·"),
        [{k:"all",l:"Ambos"},{k:"arr",l:"Arriendo"},{k:"srv",l:"Serv.Adm."}]
        .map(f=>h("button",{key:f.k,className:`pill${concFilter===f.k?" active":""}`,onClick:()=>setConcFilter(f.k),style:{fontSize:10}},f.l)),
        h("input",{value:search,onChange:e=>setSearch(e.target.value),placeholder:"Buscar...",style:{marginLeft:"auto",width:170,fontFamily:"'DM Sans',sans-serif"}})
      ),
      /* TABLA */
      h("div",{style:{flex:1,overflowX:"auto"}},
        h("table",{style:{width:"100%",borderCollapse:"collapse",tableLayout:"fixed",minWidth:920}},
          h("colgroup",null,
            h("col",{style:{width:62}}),h("col",{style:{width:"17%"}}),h("col",{style:{width:"19%"}}),
            h("col",{style:{width:90}}),h("col",{style:{width:50}}),h("col",{style:{width:96}}),
            h("col",{style:{width:90}}),h("col",{style:{width:90}}),h("col",{style:{width:108}})
          ),
          h("thead",null,h("tr",{style:{background:"var(--surf)"}},
            ["Sitio","Cliente","Correo","Concepto","Col.","Factura","UF planilla","UF PDF","Estado/Acción"].map(hd=>
              h("th",{key:hd,style:{padding:"9px 13px",textAlign:"left",fontSize:10,fontWeight:700,color:"var(--txd)",letterSpacing:"0.08em",borderBottom:"1px solid var(--bdr)"}},hd.toUpperCase())
            )
          )),
          h("tbody",null,filtered.length===0
            ?h("tr",null,h("td",{colSpan:9,style:{padding:"48px",textAlign:"center",color:"var(--txd)",fontSize:13}},"Sin resultados para este filtro"))
            :filtered.map(row=>{
              const i=row.i;
              const sent=sentSet.has(i),sending=sendingIdx===i,noEmail=!row.correo;
              const diff=row.ufPdf!==null&&row.ufPdf!==undefined&&Math.abs(row.ufPdf-row.ufPlan)>0.5;
              const esArr=row.concepto==="Arriendo";
              const rowBg=sent?"rgba(13,40,24,0.4)":esArr?"rgba(26,37,53,0.3)":"rgba(31,26,16,0.3)";
              return h("tr",{key:i,className:"row-tr"},
                ...[
                  h("td",{style:{padding:"9px 13px",background:rowBg}},
                    h("span",{style:{display:"inline-block",padding:"2px 8px",borderRadius:6,fontSize:10,fontWeight:700,
                      background:`${SITIO_C[row.sitio]||"#888"}20`,color:SITIO_C[row.sitio]||"#888",
                      border:`1px solid ${SITIO_C[row.sitio]||"#888"}40`}},row.sitio)),
                  h("td",{style:{padding:"9px 13px",background:rowBg}},h("span",{style:{fontSize:12,fontWeight:600}},row.cliente)),
                  h("td",{style:{padding:"9px 13px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",background:rowBg}},
                    h("span",{style:{fontSize:11,fontFamily:"'DM Mono',monospace",color:row.correo?"var(--accl)":"var(--txd)"}},row.correo||"— sin correo")),
                  h("td",{style:{padding:"9px 13px",background:rowBg}},h("span",{className:esArr?"tag-arr":"tag-srv"},row.concepto)),
                  h("td",{style:{padding:"9px 13px",background:rowBg}},h("span",{className:esArr?"col-gs":"col-gt"},row.colRef)),
                  h("td",{style:{padding:"9px 13px",background:rowBg}},h("span",{style:{fontSize:11,fontFamily:"'DM Mono',monospace",color:"var(--txm)"}},row.factura||"—")),
                  h("td",{style:{padding:"9px 13px",background:rowBg}},h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace"}},row.ufPlan.toFixed(4))),
                  h("td",{style:{padding:"9px 13px",background:rowBg}},
                    h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace",color:diff?"var(--amber)":"var(--tx)"}},
                      row.ufPdf!==null&&row.ufPdf!==undefined?row.ufPdf.toFixed(4):"—")),
                  h("td",{style:{padding:"9px 13px",background:rowBg}},
                    sent?h("span",{style:{color:"var(--green)",fontSize:11,fontWeight:600,display:"inline-flex",alignItems:"center",gap:4}},"✓ Enviado"):
                    sending?h("span",{style:{color:"var(--blue)",fontSize:11,display:"inline-flex",alignItems:"center",gap:5}},h("span",{className:"spin"},"⟳")," Enviando..."):
                    row.estado==="ok"&&!noEmail?h("button",{className:"btn-send",onClick:()=>doSend(i)},"✉ Enviar"):
                    h(Badge,{e:row.estado})
                  )
                ]
              );
            })
          )
        )
      ),
      /* FOOTER */
      h("footer",{style:{background:"var(--surf)",borderTop:"1px solid var(--bdr)",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h("span",{style:{fontSize:11,color:"var(--txd)",fontFamily:"'DM Mono',monospace"}},
          `${filtered.length}/${stats.total} · ${stats.sent} enviados · ${periodo}`),
        h("button",{onClick:sendAll,style:{
          background:MODO_PRUEBA?"var(--abg)":"var(--gbg)",
          border:`1px solid ${MODO_PRUEBA?"var(--adim)":"var(--gdim)"}`,
          color:MODO_PRUEBA?"var(--amber)":"var(--green)",
          borderRadius:9,padding:"8px 18px",fontSize:12,fontWeight:700,
          display:"flex",alignItems:"center",gap:6}},
          MODO_PRUEBA?`⚠ Enviar todos (PRUEBA → ${TEST_DEST})`:`✉ Enviar todos los que coinciden (${Math.max(0,stats.ok-stats.sent)})`)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
