const MES_NUM={"Enero":1,"Febrero":2,"Marzo":3,"Abril":4,"Mayo":5,"Junio":6,"Julio":7,"Agosto":8,"Septiembre":9,"Octubre":10,"Noviembre":11,"Diciembre":12};

/* ═══════════════════════════════════
   PROXY CLAUDE API
═══════════════════════════════════ */
async function callClaude(apiKey,prompt){
  const body={model:"claude-sonnet-4-5",max_tokens:4096,messages:[{role:"user",content:prompt}]};
  const res=await fetch("/api/claude",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
    body:JSON.stringify(body)
  });
  const text=await res.text();
  let data;
  try{data=JSON.parse(text);}catch(e){throw new Error("Respuesta no JSON: "+text.slice(0,150));}
  if(!res.ok)throw new Error(data.error?.message||JSON.stringify(data));
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

/* ═══════════════════════════════════
   PROCESAMIENTO LOCAL DE ARCHIVOS
═══════════════════════════════════ */
function readFileAsBuffer(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=e=>res(e.target.result);
    fr.onerror=rej;
    fr.readAsArrayBuffer(file);
  });
}

async function procesarPlanillaFacturacion(file, periodo){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["Flujo"];
  if(!ws)throw new Error("No se encontró la hoja 'Flujo' en la planilla de facturación");
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});

  // Detectar columnas GS/GT dinámicamente buscando la fecha del mes en fila 3
  const mesNum=MES_NUM[periodo.split(" ")[0]];
  const anio=parseInt(periodo.split(" ")[1]);
  let colGS=-1,colGT=-1;
  const fila3=data[3]||[];
  for(let i=0;i<fila3.length;i++){
    const v=fila3[i];
    if(v instanceof Date||typeof v==="number"){
      let d=v instanceof Date?v:new Date(Math.round((v-25569)*86400*1000));
      if(d.getFullYear()===anio&&(d.getMonth()+1)===mesNum){
        colGS=i;colGT=i+1;break;
      }
    }
    // XLSX puede devolver fechas como strings también
    if(typeof v==="string"&&v.includes(anio)){
      try{
        const d=new Date(v);
        if(d.getFullYear()===anio&&(d.getMonth()+1)===mesNum){colGS=i;colGT=i+1;break;}
      }catch(e){}
    }
  }
  if(colGS===-1)throw new Error(`No se encontró columna para ${periodo} en la fila de fechas`);

  const excl=["","VACANTE","Nombre Cliente","Areas Comunes Edificio","Areas comunes Edificio (Subterraneos)","Area Comun"];
  const clientes=[];
  for(let i=5;i<data.length;i++){
    const row=data[i];
    if(!row)continue;
    const sitio=row[6];const cliente=row[9];
    const ufGS=row[colGS];const ufGT=row[colGT];
    if(!cliente||excl.includes(String(cliente).trim()))continue;
    const sName=String(cliente).trim();
    const sito=sitio?String(sitio).trim():"";
    if(typeof ufGS==="number"&&ufGS>0){
      clientes.push({sitio:sito,cliente:sName,tipo:"arriendo",uf:Math.round(ufGS*10000)/10000});
    }
    if(typeof ufGT==="number"&&ufGT>0&&ufGT<=500){
      clientes.push({sitio:sito,cliente:sName,tipo:"serv_adm",uf:Math.round(ufGT*10000)/10000});
    }
  }
  return clientes;
}

async function procesarPlanillaEnvio(file){
  const buf=await readFileAsBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const emailMap={};
  for(const sname of wb.SheetNames){
    const ws=wb.Sheets[sname];
    const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    for(const row of data){
      const nombre=row[4];const mail=row[5];
      if(nombre&&mail&&typeof nombre==="string"&&typeof mail==="string"){
        const n=nombre.trim().toUpperCase();const m=mail.trim();
        if(n&&m&&m.includes("@")&&n!=="NOMBRE")emailMap[n]=m;
      }
    }
  }
  return emailMap;
}

async function extraerTextoPDF(arrayBuffer){
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    let texto="";
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      texto+=content.items.map(it=>it.str).join(" ")+"\n";
    }
    return texto;
  }catch(e){return "";}
}

async function procesarPDFs(zipFile, addLog){
  const buf=await readFileAsBuffer(zipFile);
  const zip=await JSZip.loadAsync(buf);
  const pdfs=[];
  const archivos=Object.keys(zip.files).filter(f=>f.toLowerCase().endsWith(".pdf"));
  addLog(`▶ ${archivos.length} PDFs encontrados en el ZIP`,"info");

  const UFD=/(3[89]|4[012])[.,\d]+/;
  for(const path of archivos){
    const parts=path.split("/");
    const carpeta=parts.length>2?parts[parts.length-2]:parts[0];
    const nombre=parts[parts.length-1];
    const sitio=SITIO_MAP[carpeta]||carpeta;
    try{
      const pdfBuf=await zip.files[path].async("arraybuffer");
      const texto=await extraerTextoPDF(pdfBuf);
      const textoJ=texto.replace(/\s+/g," ");

      // Fecha → detectar abril
      const fechaM=textoJ.match(/Fecha Emisi[oó]n\s+(.{5,30})/i);
      const esAbril=fechaM&&/abril/i.test(fechaM[1]);
      if(esAbril)continue;

      // Número factura
      const nroM=textoJ.match(/N[º°]\s*(\d+)/);
      const nro=nroM?nroM[1]:"";
      const nroFact=nombre.startsWith("FEE")?(nro?`FEE-${nro}`:""):(nro?`F-${nro}`:"");

      // Tipo y UF
      const esSrv=/COD:.*?-\s*Serv\.?\s*Adm\./i.test(textoJ);
      const esArr=/COD:.*?-\s*Arriendo/i.test(textoJ)&&!esSrv;
      let tipo=esSrv?"serv_adm":esArr?"arriendo":"desconocido";
      let totalUF=0;

      if(esArr){
        const m1=textoJ.match(new RegExp(`UF\\s+([\\d.,]+)\\s+x\\s+${UFD.source}`));
        const m2=textoJ.match(new RegExp(`([\\d]+[.,]\\d+)\\s+UF\\s+${UFD.source}`));
        const m3=textoJ.match(new RegExp(`\\b(\\d+)\\s+UF\\s+${UFD.source}`));
        const match=m1||m2||m3;
        if(match)totalUF=parseFloat(match[1].replace(/\./g,"").replace(",","."));
      } else if(esSrv){
        const m1=textoJ.match(new RegExp(`([\\d]+[.,]\\d+)\\s+UF\\s+${UFD.source}`));
        const m2=textoJ.match(new RegExp(`\\b(\\d+)\\s+UF\\s+${UFD.source}`));
        const match=m1||m2;
        if(match)totalUF=parseFloat(match[1].replace(/\./g,"").replace(",","."));
      }

      if(nroFact&&tipo!=="desconocido"){
        pdfs.push({sitio,nroFact,tipo,ufPdf:totalUF>0?Math.round(totalUF*10000)/10000:null});
      }
    }catch(e){}
  }
  addLog(`✓ ${pdfs.length} facturas procesadas (Arriendo + Serv.Adm.)`,"ok");
  return pdfs;
}

function getEstado(r){
  if(!r.factura||r.ufPdf===null||r.ufPdf===undefined)return"missing";
  if(Math.abs(r.ufPdf-r.ufPlan)>0.5)return"diff";
  return"ok";

function Badge({e}){
  const c={
    ok:{l:"Coincide",bg:"var(--gbg)",col:"var(--green)",bdr:"var(--gdim)",ic:"✓"},
    diff:{l:"Difiere",bg:"var(--abg)",col:"var(--amber)",bdr:"var(--adim)",ic:"△"},

  return h("span",{style:{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 9px",borderRadius:20,fontSize:10,fontWeight:600,background:c.bg,color:c.col,border:`1px solid ${c.bdr}`}},c.ic," ",c.l);
}

function FileUpload({label,desc,accept,file,onFile,done}){
  const [drag,setDrag]=useState(false);
  const ref=useRef();
  const onDrop=e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f)onFile(f);};
  return h("div",{
    className:`drop-zone${drag?" drag":""}${done?" done":""}`,
    onDragOver:e=>{e.preventDefault();setDrag(true);},
    onDragLeave:()=>setDrag(false),
    onDrop,onClick:()=>ref.current.click()
  },
    h("input",{ref,type:"file",accept,style:{display:"none"},onChange:e=>e.target.files[0]&&onFile(e.target.files[0])}),
    done
      ?h("div",null,h("div",{style:{color:"var(--green)",fontWeight:600,fontSize:13,marginBottom:3}},"✓ "+file.name),h("div",{style:{fontSize:11,color:"var(--txm)"}},Math.round(file.size/1024)+" KB"))
      :h("div",null,
          h("div",{style:{fontSize:13,fontWeight:600,color:"var(--tx)",marginBottom:4}},"⊞ "+label),
          h("div",{style:{fontSize:11,color:"var(--txm)"}},desc)
        )
  );
}

function SetupPanel({onSave}){
  const [key,setKey]=useState("");
  const [show,setShow]=useState(false);
  const [testing,setTesting]=useState(false);
  const [err,setErr]=useState("");
  const test=async()=>{
    if(!key.startsWith("sk-ant-"))return setErr("Debe comenzar con sk-ant-");
    setTesting(true);setErr("");
    try{
      await callClaude(key,"Responde solo: OK");
      localStorage.setItem("pat_key",key);
      onSave(key);
    }catch(e){setErr("Key inválida: "+e.message);}
    setTesting(false);
  };
  return h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:24,padding:32}},
    h("div",{style:{width:56,height:56,background:"linear-gradient(135deg,var(--acc),var(--acc2))",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,color:"#fff",fontWeight:700,boxShadow:"0 0 40px rgba(91,76,219,0.35)"}},"⬡"),
    h("div",{style:{textAlign:"center"}},
      h("h1",{style:{fontSize:22,fontWeight:700,letterSpacing:"-0.5px",marginBottom:6}},"Patagónica Inmobiliaria"),

    h("div",{style:{background:"var(--surf)",border:"1px solid var(--bdr2)",borderRadius:14,padding:24,width:"100%",maxWidth:400}},

        h("a",{href:"https://console.anthropic.com/settings/keys",target:"_blank",style:{color:"var(--accl)"}},"console.anthropic.com")

      h("div",{style:{position:"relative",marginBottom:12}},
        h("input",{type:show?"text":"password",value:key,onChange:e=>setKey(e.target.value),

    h("div",{className:"modal"},

          h("div",{style:{fontWeight:700,fontSize:15,letterSpacing:"-0.3px"}},done?"✓ Proceso completado":"Procesando archivos..."),

        ),

/* ═══════════════════════════════════
   APP PRINCIPAL
═══════════════════════════════════ */
function App(){
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("pat_key")||"");
  const [view,setView]=useState("upload"); // upload | processing | table
  const [periodo,setPeriodo]=useState("Mayo 2026");
  const [files,setFiles]=useState({planilla:null,envio:null,zip:null});
  const [data,setData]=useState([]);
  const [filter,setFilter]=useState("all");
  const [concFilter,setConcFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [sentSet,setSentSet]=useState(new Set());
  const [sendingIdx,setSendingIdx]=useState(null);
  const [showProc,setShowProc]=useState(false);
  const [procLogs,setProcLogs]=useState([]);
  const [procProgress,setProcProgress]=useState(0);
  const [procDone,setProcDone]=useState(false);
  const [preview,setPreview]=useState(null);
  const [notif,setNotif]=useState(null);

  const notify=(msg,t="ok")=>{setNotif({msg,t});setTimeout(()=>setNotif(null),4000);};
  const addLog=(txt,t="")=>setProcLogs(p=>[...p,{txt,t}]);

  const todosSubidos=files.planilla&&files.envio&&files.zip;

  /* ── PROCESAR ARCHIVOS ── */
  const procesar=useCallback(async()=>{
    if(!todosSubidos)return;
    setShowProc(true);setProcDone(false);setProcLogs([]);setProcProgress(5);
    try{
      addLog("▶ Leyendo planilla de facturación...","info");
      const clientes=await procesarPlanillaFacturacion(files.planilla,periodo);
      addLog(`✓ ${clientes.length} filas detectadas (Arriendo + Serv.Adm.) para ${periodo}`,"ok");
      setProcProgress(25);

      addLog("▶ Leyendo correos desde planilla de envío...","info");
      const emailMap=await procesarPlanillaEnvio(files.envio);
      addLog(`✓ ${Object.keys(emailMap).length} correos mapeados`,"ok");
      setProcProgress(40);

      addLog("▶ Procesando PDFs del ZIP...","info");
      const pdfs=await procesarPDFs(files.zip,addLog);
      setProcProgress(75);

      addLog("▶ Cruzando datos planilla vs PDFs...","info");
      const pdfUsado=new Set();
      const MANUAL={
        "A-2|Banco Estado Express|202.6|arriendo":"FEE-39",
        "A-2|Banco del Estado de Chile|256.7|arriendo":"FEE-39",
      };
      const filas=[];
      for(const c of clientes){
        const correo=getEmail(c.cliente,emailMap);
        const concepto=c.tipo==="arriendo"?"Arriendo":"Serv. Adm.";
        const colRef=c.tipo==="arriendo"?"GS":"GT";
        const mk=`${c.sitio}|${c.cliente}|${c.uf}|${c.tipo}`;
        let factura="",ufPdf=null;
        if(MANUAL[mk]){factura=MANUAL[mk];ufPdf=c.uf;}
        else{
          let bestIdx=-1,bestDiff=9999;
          for(let idx=0;idx<pdfs.length;idx++){
            if(pdfUsado.has(idx))continue;
            const p=pdfs[idx];
            if(p.sitio===c.sitio&&p.tipo===c.tipo&&p.ufPdf!==null){
              const d=Math.abs(p.ufPdf-c.uf);
              if(d<bestDiff&&d<0.5){bestDiff=d;bestIdx=idx;}
            }
          }
          if(bestIdx>=0){pdfUsado.add(bestIdx);factura=pdfs[bestIdx].nroFact;ufPdf=pdfs[bestIdx].ufPdf;}
        }
        filas.push({sitio:c.sitio,cliente:c.cliente,correo,concepto,colRef,factura,ufPlan:c.uf,ufPdf,enviado:false});
      }
      addLog(`✓ ${filas.filter(f=>f.factura).length}/${filas.length} facturas cruzadas`,"ok");
      setProcProgress(100);
      setProcDone(true);
      setData(filas);
      setSentSet(new Set());
    }catch(e){
      addLog("✗ Error: "+e.message,"err");
      setProcDone(true);
      notify("Error: "+e.message,"err");
    }
  },[files,periodo]);

  const finishProc=()=>{setShowProc(false);setView("table");notify(`${data.length} filas procesadas — ${periodo}`);};

  /* ── ENVÍO ── */
  const confirmSend=async()=>{
    const{idx,row}=preview;setPreview(null);
    setSendingIdx(idx);
    const dest=MODO_PRUEBA?TEST_DEST:row.correo;
    try{
      const prompt="Envía un correo usando Gmail con estos datos exactos:\n"+
        "De: "+REMITENTE+"\nPara: "+dest+"\nCCO: "+CCO+"\n"+
        "Asunto: Factura "+row.factura+" — "+row.concepto+" "+periodo+" — Patagónica Inmobiliaria SpA\n"+
        "Cuerpo HTML profesional: saludo, descripción del cobro de "+row.concepto.toLowerCase()+" de "+periodo+
        " por "+row.ufPlan.toFixed(4)+" UF, factura N° "+row.factura+", mención de PDF adjunto, firma 'Área de Administración — Patagónica Inmobiliaria SpA'.\n"+
        (MODO_PRUEBA?"MODO PRUEBA: cliente real es "+row.correo+"\n":"")+
        "Confirma respondiendo: ENVIADO_OK";
      const res=await callClaude(apiKey,prompt);
      if(/ENVIADO_OK|enviado|sent/i.test(res)){
        setSentSet(p=>new Set([...p,idx]));
        notify("✓ Correo enviado"+(MODO_PRUEBA?" (PRUEBA)":"")+" → "+dest);
      }else{
        notify("No se confirmó el envío — revisa Gmail","warn");
      }
    }catch(e){notify("Error: "+e.message,"err");}
    setSendingIdx(null);
  };

  const sendAll=async()=>{
    const enriched=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
    const pend=enriched.filter(r=>r.estado==="ok"&&r.correo&&!sentSet.has(r.i));
    if(!pend.length)return notify("No hay correos pendientes","warn");
    notify("Enviando "+pend.length+" correos...","info");
    const lista=pend.map(r=>"- Para: "+(MODO_PRUEBA?TEST_DEST:r.correo)+" | "+r.cliente+" | Factura "+r.factura+" | "+r.concepto+" | "+r.ufPlan.toFixed(4)+" UF"+(MODO_PRUEBA?" (real: "+r.correo+")":"")).join("\n");
    try{
      const prompt="Envía los siguientes "+pend.length+" correos usando Gmail, uno por uno:\n"+lista+"\n\n"+
        "Para cada uno: De: "+REMITENTE+", CCO: "+CCO+", asunto 'Factura [N°] — [Concepto] "+periodo+" — Patagónica Inmobiliaria SpA', "+
        "cuerpo HTML profesional con nombre del cliente, concepto, período, monto UF, mención de PDF adjunto y firma de Área de Administración — Patagónica Inmobiliaria SpA.\n"+
        (MODO_PRUEBA?"MODO PRUEBA: todos van a "+TEST_DEST+"\n":"")+
        "Al finalizar responde: ENVIADOS_OK:N donde N es la cantidad enviada";
      const res=await callClaude(apiKey,prompt);
      const m=res.match(/ENVIADOS_OK:(\d+)/);
      pend.forEach(r=>setSentSet(p=>new Set([...p,r.i])));
      notify("✓ "+(m?m[1]:pend.length)+" correos enviados"+(MODO_PRUEBA?" (PRUEBA → "+TEST_DEST+")":""));
    }catch(e){notify("Error: "+e.message,"err");}
  };

  /* ── RENDER ── */
  if(!apiKey)return h(SetupPanel,{onSave:k=>{setApiKey(k);notify("API key guardada ✓");}});

  const enriched=data.map((r,i)=>({...r,i,estado:getEstado(r)}));
  const stats={
    total:enriched.length,
    ok:enriched.filter(r=>r.estado==="ok").length,
    diff:enriched.filter(r=>r.estado!=="ok").length,
    sent:sentSet.size,
    arr:enriched.filter(r=>r.concepto==="Arriendo").length,
    srv:enriched.filter(r=>r.concepto==="Serv. Adm.").length,
  };
  const filtered=enriched.filter(r=>{
    const mf=filter==="all"||(filter==="ok"&&r.estado==="ok"&&!sentSet.has(r.i))||(filter==="diff"&&r.estado!=="ok")||(filter==="sent"&&sentSet.has(r.i));
    const mc=concFilter==="all"||(concFilter==="arr"&&r.concepto==="Arriendo")||(concFilter==="srv"&&r.concepto==="Serv. Adm.");
    const ms=!search||r.cliente.toLowerCase().includes(search.toLowerCase())||r.sitio.includes(search.toUpperCase());
    return mf&&mc&&ms;
  });

  return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column"}},
    notif&&h("div",{className:"notif",style:{
      background:notif.t==="ok"?"var(--gbg)":notif.t==="err"?"var(--rbg)":"var(--abg)",
      border:`1px solid ${notif.t==="ok"?"var(--gdim)":notif.t==="err"?"var(--rdim)":"var(--adim)"}`,
      color:notif.t==="ok"?"var(--green)":notif.t==="err"?"var(--red)":"var(--amber)"
    }},(notif.t==="ok"?"✓ ":notif.t==="err"?"✗ ":"△ ")+notif.msg),
    showProc&&h(ProcModal,{logs:procLogs,progress:procProgress,done:procDone,onClose:finishProc}),
    preview&&h(EmailModal,{row:preview.row,periodo,onClose:()=>setPreview(null),onConfirm:confirmSend,sending:sendingIdx===preview.idx}),

    MODO_PRUEBA&&h("div",{className:"test-banner"},
      "⚠",h("strong",null,"MODO PRUEBA"),"— correos van a",h("strong",{style:{marginLeft:4}},TEST_DEST),
      h("span",{style:{marginLeft:"auto",fontSize:10,color:"var(--txd)"}},'Producción: TEST_DEST="" en el código')
    ),

    /* HEADER */
    h("header",{style:{background:"var(--surf)",borderBottom:"1px solid var(--bdr)",padding:"11px 22px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h("div",{style:{width:30,height:30,background:"linear-gradient(135deg,var(--acc),var(--acc2))",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#fff",fontWeight:700}},"⬡"),
        h("div",null,
          h("div",{style:{fontSize:13,fontWeight:700,letterSpacing:"-0.3px"}},"Patagónica Inmobiliaria"),
          h("div",{style:{fontSize:9,color:"var(--txm)",fontFamily:"'DM Mono',monospace"}},REMITENTE+" · "+VER)
        ),
        view==="table"&&h("span",{style:{background:"var(--bbg)",border:"1px solid var(--blue)",color:"var(--blue)",fontSize:10,fontWeight:600,padding:"2px 10px",borderRadius:20,marginLeft:4,fontFamily:"'DM Mono',monospace"}},periodo)
      ),
      h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        view==="table"&&h("button",{onClick:()=>{setView("upload");setData([]);},
          style:{background:"transparent",border:"1px solid var(--bdr)",color:"var(--txm)",borderRadius:8,padding:"5px 12px",fontSize:11}},"⊞ Nuevos archivos"),
        view==="table"&&h("button",{onClick:()=>setApiKey(""),
          style:{background:"transparent",border:"1px solid var(--bdr)",color:"var(--txm)",borderRadius:8,padding:"5px 12px",fontSize:11}},"🔑"),
        view==="table"&&h("button",{onClick:sendAll,style:{
          background:MODO_PRUEBA?"var(--abg)":"linear-gradient(135deg,var(--green),#059669)",
          border:MODO_PRUEBA?"1px solid var(--adim)":"none",
          color:MODO_PRUEBA?"var(--amber)":"#031c15",
          borderRadius:9,padding:"6px 16px",fontSize:12,fontWeight:700
        }},MODO_PRUEBA?"⚠ Enviar todos (PRUEBA)":"✉ Enviar todos")
      )
    ),

    /* UPLOAD VIEW */
    view==="upload"&&h("main",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:24,padding:32},className:"fade-up"},
      h("div",{style:{textAlign:"center"}},
        h("h1",{style:{fontSize:20,fontWeight:700,letterSpacing:"-0.4px",marginBottom:6}},"Subir archivos del mes"),
        h("p",{style:{fontSize:12,color:"var(--txm)"}},
          "Todo se procesa localmente en tu navegador — ningún archivo se sube a servidores externos.")
      ),
      h("div",{style:{width:"100%",maxWidth:480}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
          h("span",{style:{fontSize:12,fontWeight:600}},"Período"),
          h("select",{value:periodo,onChange:e=>setPeriodo(e.target.value),style:{fontSize:12,padding:"5px 10px"}},
            PERIODOS.map(p=>h("option",{key:p,value:p},p)))
        ),
        h("div",{style:{display:"flex",flexDirection:"column",gap:10}},
          h(FileUpload,{label:"Planilla_Facturacion_"+periodo.replace(" ","_")+".xlsx",
            desc:"Hoja Flujo · columnas GS (Arriendo) y GT (Serv.Adm.)",
            accept:".xlsx,.xls",file:files.planilla,done:!!files.planilla,
            onFile:f=>setFiles(p=>({...p,planilla:f}))}),
          h(FileUpload,{label:"Detalle_envío_facturas_Inpasa_y_Pisa.xlsx",
            desc:"Columna E (cliente) · F (correo)",
            accept:".xlsx,.xls",file:files.envio,done:!!files.envio,
            onFile:f=>setFiles(p=>({...p,envio:f}))}),
          h(FileUpload,{label:"Carpeta PDFs (ZIP)",
            desc:"Comprime la carpeta con las subcarpetas 5A · 4A · A2 · A1 · B · D2",
            accept:".zip",file:files.zip,done:!!files.zip,
            onFile:f=>setFiles(p=>({...p,zip:f}))})
        ),
        h("div",{style:{marginTop:20,display:"flex",justifyContent:"center"}},
          h("button",{onClick:procesar,disabled:!todosSubidos||!apiKey,className:"btn-primary",
            style:{opacity:todosSubidos?1:0.5}},
            todosSubidos?"▶ Procesar archivos":"Sube los 3 archivos para continuar")
        )
      )
    ),

    /* TABLE VIEW */
    view==="table"&&h("main",{style:{flex:1,display:"flex",flexDirection:"column",overflowX:"hidden"},className:"fade-up"},
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",borderBottom:"1px solid var(--bdr)"}},
        [{label:"Total",val:stats.total,col:"var(--tx)",sub:""},{label:"Arriendo",val:stats.arr,col:"var(--blue)",sub:"col. GS"},{label:"Serv. Adm.",val:stats.srv,col:"var(--amber)",sub:"col. GT"},{label:"Coinciden",val:stats.ok,col:"var(--green)",sub:"listos"},{label:"Enviados",val:stats.sent,col:"var(--accl)",sub:"esta sesión"}]
        .map((m,i)=>h("div",{key:i,style:{background:"var(--surf)",padding:"13px 16px",borderRight:i<4?"1px solid var(--bdr)":"none"}},
          h("div",{style:{fontSize:10,fontWeight:600,color:"var(--txm)",marginBottom:4,letterSpacing:"0.06em"}},m.label.toUpperCase()),
          h("div",{style:{fontSize:24,fontWeight:700,color:m.col,lineHeight:1,fontFamily:"'DM Mono',monospace"}},m.val),
          m.sub&&h("div",{style:{fontSize:10,color:"var(--txd)",marginTop:3}},m.sub)
        ))
      ),
      h("div",{style:{background:"var(--surf)",borderBottom:"1px solid var(--bdr)",padding:"8px 18px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
        [{k:"all",l:`Todos (${stats.total})`},{k:"ok",l:`Coinciden (${stats.ok})`},{k:"diff",l:`Revisar (${stats.total-stats.ok})`},{k:"sent",l:`Enviados (${stats.sent})`}]
        .map(f=>h("button",{key:f.k,className:`pill${filter===f.k?" active":""}`,onClick:()=>setFilter(f.k)},f.l)),
        h("span",{style:{color:"var(--txd)",fontSize:11,marginLeft:3}},"·"),
        [{k:"all",l:"Ambos"},{k:"arr",l:"Arriendo"},{k:"srv",l:"Serv.Adm."}]
        .map(f=>h("button",{key:f.k,className:`pill${concFilter===f.k?" active":""}`,onClick:()=>setConcFilter(f.k),style:{fontSize:10}},f.l)),
        h("input",{value:search,onChange:e=>setSearch(e.target.value),placeholder:"Buscar...",style:{marginLeft:"auto",width:160,fontFamily:"'DM Sans',sans-serif"}})

                  h("span",{style:{fontSize:11,fontFamily:"'DM Mono',monospace",color:row.correo?"var(--accl)":"var(--txd)"}},row.correo||"— sin correo")),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{className:esArr?"tag-arr":"tag-srv"},row.concepto)),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{className:esArr?"col-gs":"col-gt"},row.colRef)),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:11,fontFamily:"'DM Mono',monospace",color:"var(--txm)"}},row.factura||"—")),
                h("td",{style:{padding:"8px 11px",background:bg}},h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace"}},row.ufPlan.toFixed(4))),
                h("td",{style:{padding:"8px 11px",background:bg}},
                  h("span",{style:{fontSize:12,fontFamily:"'DM Mono',monospace",color:diff?"var(--amber)":"var(--tx)"}},
                    row.ufPdf!==null&&row.ufPdf!==undefined?row.ufPdf.toFixed(4):"—")),
                h("td",{style:{padding:"8px 11px",background:bg}},
                  sent?h("span",{style:{color:"var(--green)",fontSize:11,fontWeight:600}},"✓ Enviado"):
                  sending?h("span",{style:{color:"var(--blue)",fontSize:11,display:"inline-flex",alignItems:"center",gap:4}},h("span",{className:"spin"},"⟳")," Enviando..."):
                  row.estado==="ok"&&!noEmail?h("button",{className:"btn-send",onClick:()=>setPreview({row,idx:i})},"✉ Enviar"):
                  h(Badge,{e:row.estado})
                )
              );
            })
          )
        )
      ),
      h("footer",{style:{background:"var(--surf)",borderTop:"1px solid var(--bdr)",padding:"9px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h("span",{style:{fontSize:11,color:"var(--txd)",fontFamily:"'DM Mono',monospace"}},
          `${filtered.length}/${stats.total} · ${stats.sent} enviados · ${periodo}`),
        h("button",{onClick:sendAll,style:{
          background:MODO_PRUEBA?"var(--abg)":"var(--gbg)",
          border:`1px solid ${MODO_PRUEBA?"var(--adim)":"var(--gdim)"}`,
          color:MODO_PRUEBA?"var(--amber)":"var(--green)",
          borderRadius:8,padding:"7px 16px",fontSize:12,fontWeight:700,
          display:"flex",alignItems:"center",gap:6}},
          MODO_PRUEBA?`⚠ Enviar todos (PRUEBA → ${TEST_DEST})`:`✉ Enviar todos (${Math.max(0,stats.ok-stats.sent)})`)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
