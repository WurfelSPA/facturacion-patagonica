name: Separar PDF Facturas
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sistema
        run: sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa
      - name: Python deps
        run: pip install pypdf pdf2image pytesseract google-auth google-auth-httplib2 google-api-python-client
      - name: Run
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/split_pdf.py
      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facturas-zip
          path: output/*.zip
          retention-days: 7
