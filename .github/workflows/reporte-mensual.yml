name: Reporte Mensual Ventas

on:
  # Corre el día 30 y 31 de cada mes a las 08:00 AM Chile (11:00 UTC)
  schedule:
    - cron: '0 11 30 * *'
    - cron: '0 11 31 * *'
  # También se puede ejecutar manualmente desde GitHub
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mes a reportar (YYYY-MM, ej: 2026-05)'
        required: false
        default: ''
      empresa:
        description: 'Empresa (dko | multi | ambas)'
        required: false
        default: 'ambas'

jobs:
  reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install node-forge nodemailer

      - name: Generar y enviar reporte
        env:
          # Odoo
          ODOO_DKO_URL:   ${{ secrets.ODOO_DKO_URL }}
          ODOO_DKO_DB:    ${{ secrets.ODOO_DKO_DB }}
          ODOO_DKO_USER:  ${{ secrets.ODOO_DKO_USER }}
          ODOO_DKO_PASS:  ${{ secrets.ODOO_DKO_PASS }}
          ODOO_MULTI_DB:  ${{ secrets.ODOO_MULTI_DB }}
          ODOO_MULTI_USER: ${{ secrets.ODOO_MULTI_USER }}
          ODOO_MULTI_PASS: ${{ secrets.ODOO_MULTI_PASS }}
          # Email
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_PASS:     ${{ secrets.GMAIL_PASS }}
          # Parámetros opcionales del dispatch manual
          MES_MANUAL:     ${{ github.event.inputs.mes }}
          EMPRESA_INPUT:  ${{ github.event.inputs.empresa }}
        run: node scripts/reporte-ventas.js
